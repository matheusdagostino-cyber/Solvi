# Consolidacao dos parciais E4a (ETP 1a metade), E4b (ETP 2a metade/anexos de precos),
# E4c (anexos ambientais e tecnicos), E4d (CCT + Anexos IV-VI), E4e (respostas as impugnacoes x edital reaberto).
# Renumeracao sequencial E4-NNN; id original do parcial preservado em id_origem_parcial.
