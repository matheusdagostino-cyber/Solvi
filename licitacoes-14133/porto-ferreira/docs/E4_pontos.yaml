- id: E4-001
  id_origem_parcial: E4a-001
  dispositivo_editalicio: "Item 7 do ETP (Estimativa das quantidades)"
  transcricao: "Os quantitativos relacionados abaixo foram estimados conforme últimos contratos realizados pela Administração, de coleta e destinação final de resíduos sólidos."
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: "Estimativa de quantidades sem memória de cálculo: ausência de dados de população atendida, geração per capita, composição gravimétrica e série histórica de pesagens que suportem as 1.300 t/mês declaradas como praticadas"
  dispositivo_legal: "art. 18, § 1.º, inciso IV, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4a-002", "E4a-003"]
  flag_tecnico: true
  flag_reserva: false

- id: E4-002
  id_origem_parcial: E4a-002
  dispositivo_editalicio: "Item 7 c/c Item 15 (Anexos) do ETP"
  transcricao: "Os quantitativos relacionados abaixo foram estimados conforme últimos contratos realizados pela Administração [...] 15- ANEXOS: Planilha de Cotação; Contrato n° 001/2026 – Prefeitura Municipal de Fernandópolis, SP; [...]"
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: "Os 'últimos contratos realizados pela Administração', declarados como base da estimativa de quantidades, não são identificados nem anexados — os anexos são exclusivamente contratos de outros municípios, usados só para preços"
  dispositivo_legal: "art. 18, § 1.º, inciso IV, da Lei n.º 14.133/2021 (documentos que lhe dão suporte)"
