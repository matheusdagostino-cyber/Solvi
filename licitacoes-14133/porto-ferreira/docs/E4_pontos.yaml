- id: E4-091
  id_origem_parcial: E4d-013
  dispositivo_editalicio: "Cláusula Vigésima da CCT 2025/2026 (Seguro de Vida)"
  transcricao: "As empresas concederão seguro de vida, gratuitamente, a todos os seus empregados (...) a cobertura será de 06 (seis) vezes o menor salário funcional."
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: "Seguro de vida obrigatório e gratuito (cobertura de 6 vezes o menor salário funcional) para todos os empregados — custo obrigatório de precificação"
  dispositivo_legal: "cláusula 20ª da CCT 2025/2026 c/c art. 63, § 1.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-004"]
