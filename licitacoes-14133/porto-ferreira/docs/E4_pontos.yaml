  dispositivo_editalicio: "Cláusula 5.2, alínea 'a', da minuta de contrato c/c cláusula 1ª da CCT (data-base 1º de março)"
  transcricao: "O interregno mínimo de 1 (um) ano para a primeira repactuação será contado: a) Para os custos relativos à mão de obra (...) a partir da data de início dos efeitos financeiros do acordo, convenção ou dissídio coletivo de trabalho ao qual a proposta estiver vinculada."
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: "Edital não define a qual instrumento coletivo a proposta estará vinculada (CCT 2025/2026 anexada, com efeitos desde 01/03/2025, ou CCT 2026/2027, com efeitos desde 01/03/2026), gerando incerteza sobre o marco da primeira repactuação e sobre a precificação do período entre a data-base e o início da execução"
  dispositivo_legal: "art. 135, caput e inciso II, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-003", "E4d-004"]
  flag_tecnico: false
  flag_reserva: false

- id: E4-084
  id_origem_parcial: E4d-006
  dispositivo_editalicio: "Cláusula Sexta da CCT 2025/2026 (Isonomia Salarial)"
  transcricao: "na ocorrência de novos contratos de limpeza urbana, oriundos de processos licitatórios ou concessão, as empresas se obrigarão a considerar para a formação de seus preços, o mesmo salário base mensal previsto aos empregados varredores (...) àquelas funções operacionais com salários inferiores a este, e, implantá-lo nos locais onde ocorrerem tais fatos."
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: "Cláusula de isonomia salarial obriga a adoção do salário-base do varredor como piso mínimo de formação de preços para funções operacionais com salário inferior em novos contratos licitados — parâmetro obrigatório de precificação a verificar no orçamento estimado"
  dispositivo_legal: "art. 611 da CLT c/c art. 63, § 1.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-004"]
  flag_tecnico: false
  flag_reserva: false

- id: E4-085
  id_origem_parcial: E4d-007
  dispositivo_editalicio: "Cláusula Sétima da CCT 2025/2026 (Salários Funcionais) c/c item 5.4.29 do TR"
  transcricao: "A) Salários funcionais para empresas que concederam reajuste salarial de 9,5% (...) em 2015 [coletores R$1.724,40; varredores/serventes R$1.662,36; operador de máquina de aterro R$2.691,38]. B) Salários funcionais para empresas que concederam reajuste salarial de 8,5% (...) em 2015 [coletores R$1.708,65; operador de máquina de aterro R$2.666,81]."
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: "CCT prevê duas tabelas de pisos (empresas que reajustaram 9,5% ou 8,5% em 2015) e o edital exige atendimento 'integral' sem definir a tabela aplicável a licitante sem histórico na base territorial — ambiguidade de precificação entre concorrentes"
  dispositivo_legal: "art. 63, § 1.º, da Lei n.º 14.133/2021; art. 5.º da Lei n.º 14.133/2021 (isonomia e julgamento objetivo)"
  referencias_cruzadas: ["E4d-004"]
  flag_tecnico: false
  flag_reserva: true

- id: E4-086
  id_origem_parcial: E4d-008
  dispositivo_editalicio: "Cláusula Sétima da CCT 2025/2026 c/c item 5.4.28 do TR (quadro mínimo)"
  transcricao: "TR 5.4.28: 'quadro mínimo de: 03 coletores e 01 motorista por caminhão, e mais 01 coletor reserva, totalizando 13 (treze) coletores e 4 (quatro) motoristas'. A tabela de salários funcionais da CCT contempla apenas coletores/bueristas, varredores/serventes, operador de máquina de aterro e operador de roçadeira/motosserra/capinador."
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: "CCT anexada não fixa piso salarial para a função de motorista, essencial ao dimensionamento exigido no TR; possível enquadramento dos motoristas como categoria diferenciada (outro instrumento coletivo), com impacto de custo não parametrizado"
  dispositivo_legal: "art. 511, § 3.º, da CLT (categoria diferenciada); art. 63, § 1.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-002", "E4d-007"]
  flag_tecnico: false
  flag_reserva: false

- id: E4-087
  id_origem_parcial: E4d-009
  dispositivo_editalicio: "Cláusula Décima Segunda da CCT 2025/2026 (Adicional de Insalubridade)"
  transcricao: "a) varrição (...), usinas de tratamento de lixo e transbordo municipal, operador de máquina de aterro (...): grau médio, que corresponde a 20% (...) do salário-mínimo federal. b) coletores e bueristas: grau máximo, que corresponde a 40% (...) do salário-mínimo federal."
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: "Adicional de insalubridade convencional (40% do salário-mínimo para coletores/bueristas e 20% para operador de aterro e demais) é custo obrigatório relevante — verificar contemplação no orçamento estimado e nas propostas"
  dispositivo_legal: "art. 192 da CLT c/c cláusula 12ª da CCT; art. 63, § 1.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-004"]
  flag_tecnico: false
  flag_reserva: false

- id: E4-088
  id_origem_parcial: E4d-010
  dispositivo_editalicio: "Cláusulas Décima Quinta e Décima Sexta da CCT 2025/2026 (Tíquete Refeição e Vale Alimentação)"
  transcricao: "Tíquete-refeição mensal R$483,68; Vale Alimentação mensal R$241,85 (tabela A, mar/25); concedidos também nas faltas por doença e acidente de trabalho e licença-maternidade (limitado a 150 dias) e no período de gozo de férias."
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: "Benefícios de alimentação somam R$725,53/mês por empregado (valores mar/2025), devidos inclusive em férias e afastamentos de até 150 dias — custo relevante de precificação, a reajustar na CCT 2026/2027"
  dispositivo_legal: "cláusulas 15ª e 16ª da CCT 2025/2026 c/c art. 63, § 1.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-004"]
  flag_tecnico: false
  flag_reserva: false

- id: E4-089
  id_origem_parcial: E4d-011
  dispositivo_editalicio: "Cláusula Décima Oitava da CCT 2025/2026 (Convênio Médico Hospitalar)"
  transcricao: "As empresas deverão implantar um plano de Convênio Médico (...) no valor de R$203,00 (duzentos e três reais) por vida (...). O saldo resultante da despesa total mensal do convênio após deduzida a importância oriunda do desconto salarial dos empregados será custeado pela empresa."
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: "Plano de saúde obrigatório de R$203,00/vida com custeio residual patronal (descontos do empregado limitados a 8,9% do salário) — custo obrigatório a verificar no orçamento estimado"
  dispositivo_legal: "cláusula 18ª da CCT 2025/2026 c/c art. 63, § 1.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-004"]
  flag_tecnico: false
  flag_reserva: false

- id: E4-090
  id_origem_parcial: E4d-012
  dispositivo_editalicio: "Cláusula Décima Nona da CCT 2025/2026 (Auxílio Creche)"
  transcricao: "As empresas pagarão, a título de Auxílio Creche, para as empregadas mães de filhos, com até 05 (cinco) anos de idade, o valor correspondente a 30% (trinta por cento) do valor do salário base do varredor."
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: "Auxílio creche de 30% do salário-base do varredor por empregada mãe de filho de até 5 anos — custo variável conforme perfil do efetivo, a considerar na precificação"
  dispositivo_legal: "cláusula 19ª da CCT 2025/2026 c/c art. 63, § 1.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-004"]
