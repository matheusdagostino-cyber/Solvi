- id: E4-003
  id_origem_parcial: E4a-003
  dispositivo_editalicio: "Item 7 do ETP (Estimativa das quantidades)"
  transcricao: "Com a implementação da cobrança dos grandes geradores, estima-se uma redução de, no mínimo, 20% do total praticado atualmente, reduzindo a quantidade de 1.300 toneladas mensais para 1.040 toneladas mensais."
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: "Premissa de redução de 20% da tonelagem condicionada a evento futuro e incerto (implementação da cobrança de grandes geradores), sem demonstração técnica do percentual, sem cronograma de implementação e sem tratamento do risco de a redução não se concretizar em contrato de 60 meses"
  dispositivo_legal: "art. 18, § 1.º, incisos IV e VI, da Lei n.º 14.133/2021; art. 6.º, inciso XXIII, alínea 'd', da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4a-004", "E4a-019"]
  flag_tecnico: true
  flag_reserva: true

- id: E4-004
  id_origem_parcial: E4a-004
  dispositivo_editalicio: "Item 7 do ETP (Estimativa das quantidades)"
  transcricao: "Com a implementação da cobrança dos grandes geradores, estima-se uma redução de, no mínimo, 20% do total praticado atualmente"
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: "ETP não indica o instrumento normativo municipal que institui a cobrança dos grandes geradores (lei/decreto/regulamento), nem define o conceito de grande gerador adotado, premissa que condiciona todo o dimensionamento"
  dispositivo_legal: "art. 18, § 1.º, inciso I, da Lei n.º 14.133/2021; art. 27, § 1.º, e art. 20 da Lei n.º 12.305/2010"
  referencias_cruzadas: ["E4a-003"]
  flag_tecnico: false
  flag_reserva: false

- id: E4-005
  id_origem_parcial: E4a-005
  dispositivo_editalicio: "Itens 7 e 8 do ETP (tabelas de quantidades e valores) c/c Quadro Comparativo de Preços"
  transcricao: "Item 2 [...] aterro sanitário devidamente licenciado no Município: 12.480 TON/ANO [...] R$2.106.249,60. Item 3 [...] aterro sanitário devidamente licenciado em outro Município: 12.480 TON/ANO [...] R$3.111.014,40. [...] VALOR TOTAL ESTIMADO R$ 9.193.852,80"
  tipo_achado: IRREGULAR
  categoria: erro_material
  descricao_breve: "Duplicidade de estimativa: os itens 2 e 3 preveem, cada um, a destinação das mesmas 12.480 t/ano (soluções mutuamente excludentes — aterro municipal OU aterro externo), mas ambos são somados integralmente no valor total estimado, inflando a estimativa em mais de R$ 2 milhões/ano"
  dispositivo_legal: "art. 18, § 1.º, incisos IV e VI, da Lei n.º 14.133/2021; art. 23, caput, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4a-006", "E4a-007", "E4a-015"]
  flag_tecnico: false
  flag_reserva: true

- id: E4-006
  id_origem_parcial: E4a-006
  dispositivo_editalicio: "Item 4 do ETP (Descrição dos requisitos da contratação)"
  transcricao: "- Destinação final ambientalmente adequada de resíduos sólidos urbanos em aterro sanitário devidamente licenciado no Município. - Destinação final ambientalmente adequada de resíduos sólidos urbanos em aterro sanitário devidamente licenciado em outro Município."
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: "Requisitos mínimos da contratação listam simultaneamente, como exigências cumulativas, a destinação em aterro no Município E em aterro de outro Município, sem indicar o regime de alternatividade, condição de acionamento de cada hipótese ou critério de escolha"
  dispositivo_legal: "art. 18, § 1.º, inciso III, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4a-005", "E4a-007"]
  flag_tecnico: false
  flag_reserva: false

- id: E4-007
  id_origem_parcial: E4a-007
  dispositivo_editalicio: "Item 6 do ETP (Descrição da solução como um todo)"
  transcricao: "A solução adotada consiste na contratação de empresa especializada para execução completa dos serviços de manejo de resíduos sólidos urbanos, incluindo: - Coleta e transporte; - Destinação final; - Fornecimento, manutenção e higienização de contêineres com capacidade de 1000 litros."
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: "Descrição da solução não define a solução: não decide nem parametriza a escolha entre operação do aterro sanitário municipal e destinação em aterro de outro município, elemento central do objeto licitado"
  dispositivo_legal: "art. 18, § 1.º, inciso VII, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4a-005", "E4a-006", "E4a-008"]
  flag_tecnico: true
  flag_reserva: false

- id: E4-008
  id_origem_parcial: E4a-008
  dispositivo_editalicio: "Item 1 do ETP (Objeto) c/c Itens 6, 7 e 8 do ETP"
  transcricao: "incluindo a operação do aterro sanitário municipal ou destinação final de resíduos urbanos em aterro sanitário de outro município"
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: "Objeto declara incluir a 'operação do aterro sanitário municipal', mas o ETP não contém item de serviço, estimativa de custo nem qualquer análise da operação do aterro (capacidade remanescente, vida útil, licença de operação, investimentos, encerramento) — as tabelas de quantidades/valores tratam apenas de 'destinação final' por tonelada"
  dispositivo_legal: "art. 18, § 1.º, incisos IV, VI e VII, da Lei n.º 14.133/2021; Resolução CONAMA n.º 499/2020"
  referencias_cruzadas: ["E4a-007", "E4a-026"]
  flag_tecnico: true
  flag_reserva: false

- id: E4-009
  id_origem_parcial: E4a-009
  dispositivo_editalicio: "Itens 7 e 8 do ETP c/c nota do Quadro Comparativo de Preços"
  transcricao: "As cotações para o item 3 (Destinação Externa) prevê cenários onde a destinação ocorre fora do limite municipal, refletindo o custo logístico adicional de transbordo e transporte."
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: "Nenhuma premissa sobre transbordo: o ETP não indica se haverá estação de transbordo, quem a implanta/licencia/opera, qual a distância estimada até o aterro externo, e adota preços de item 3 que refletem logísticas de outros municípios com distâncias desconhecidas e distintas da realidade local"
  dispositivo_legal: "art. 18, § 1.º, incisos IV, VI e VII, da Lei n.º 14.133/2021; art. 23, § 1.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4a-020"]
  flag_tecnico: true
  flag_reserva: false

- id: E4-010
  id_origem_parcial: E4a-010
  dispositivo_editalicio: "Item 5 do ETP (Levantamento do mercado)"
  transcricao: "Foram identificadas as seguintes soluções no mercado: - Execução direta pelo município (estrutura própria); - Contratação parcial (apenas coleta ou apenas destinação); - Contratação integrada de empresa especializada (solução adotada). A solução integrada mostra-se mais eficiente, garantindo padronização, controle e economicidade."
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: "Levantamento de mercado sem análise: alternativas apenas listadas, sem comparativo de custos, prós e contras ou demonstração objetiva da maior eficiência/economicidade da solução integrada afirmada"
  dispositivo_legal: "art. 18, § 1.º, inciso V, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4a-027"]
  flag_tecnico: false
  flag_reserva: false

- id: E4-011
  id_origem_parcial: E4a-011
  dispositivo_editalicio: "Item 6 do ETP (Descrição da solução como um todo)"
  transcricao: "Não há situação restritiva de mercado em relação à quantidade de fornecedores aptos a participar da licitação."
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: "Afirmação de inexistência de restrição de mercado sem qualquer demonstração (número de potenciais fornecedores, histórico de certames), em certame que já teve 6 impugnações e suspensão"
  dispositivo_legal: "art. 18, § 1.º, inciso V, da Lei n.º 14.133/2021"
  referencias_cruzadas: []
  flag_tecnico: false
  flag_reserva: false

- id: E4-012
  id_origem_parcial: E4a-012
  dispositivo_editalicio: "Item 9 do ETP (Justificativa para o parcelamento ou não da contratação)"
  transcricao: "Sugere-se o parcelamento (agrupamento de itens em lote do objeto), em razão da necessidade de integração operacional, ganho de eficiência logística e responsabilização única da contratada."
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: "Justificativa do parcelamento contraditória e genérica: denomina 'parcelamento' o que descreve como agrupamento de itens em lote único, e se resume a uma frase, sem análise dos fatores de divisibilidade técnica e econômica do objeto (coleta, destinação e contêineres)"
  dispositivo_legal: "art. 18, § 1.º, inciso VIII, e art. 47, inciso II e § 1.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: []
  flag_tecnico: false
  flag_reserva: false

- id: E4-013
  id_origem_parcial: E4a-013
  dispositivo_editalicio: "Item 12 do ETP (Providências prévias) c/c Item 10 do ETP (Contratações correlatas)"
  transcricao: "Não serão necessárias providências previamente à celebração do contrato. [Item 10:] Há contratos vigentes relacionados à coleta e operação do aterro, que deverão ser considerados para transição operacional."
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: "Contradição interna: o item 12 declara desnecessária qualquer providência prévia, enquanto o item 10 reconhece a necessidade de transição operacional de contratos vigentes de coleta e de operação do aterro"
  dispositivo_legal: "art. 18, § 1.º, incisos X e XI, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4a-014"]
  flag_tecnico: false
  flag_reserva: false

- id: E4-014
  id_origem_parcial: E4a-014
  dispositivo_editalicio: "Item 10 do ETP (Contratações correlatas e/ou interdependentes)"
  transcricao: "Há contratos vigentes relacionados à coleta e operação do aterro, que deverão ser considerados para transição operacional."
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: "Contratações correlatas não identificadas: ETP não indica números, contratadas, vigências, valores nem escopo dos contratos vigentes de coleta e de operação do aterro, impedindo aferir sobreposição de objeto e planejamento da transição"
  dispositivo_legal: "art. 18, § 1.º, inciso XI, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4a-013"]
  flag_tecnico: false
  flag_reserva: false

