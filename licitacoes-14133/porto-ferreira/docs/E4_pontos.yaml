- id: E4-017
  id_origem_parcial: E4a-017
  dispositivo_editalicio: "Itens 7 e 8 do ETP (item 4 das tabelas) c/c Quadro Comparativo de Preços (item 4)"
  transcricao: "Fornecimento, manutenção e higienização de contêineres com capacidade de 1000 litros: 80 UNIDADE [...] Valor Unitário R$207,83, Valor Mensal R$16.626,40, Valor Total para 12 meses R$199.516,80 [Quadro Comparativo: UNIDADE DE MEDIDA UN, QUANTIDADE 960]"
  tipo_achado: IRREGULAR
  categoria: erro_material
  descricao_breve: "Unidade de medida inconsistente para os contêineres: as tabelas do ETP indicam quantidade de 80 'UNIDADE' com valor unitário tratado como mensalidade por contêiner, enquanto o quadro comparativo adota quantidade 960 (unidade×mês), sem explicitar em nenhum documento que a remuneração é por unidade/mês"
  dispositivo_legal: "art. 18, § 1.º, incisos IV e VI, da Lei n.º 14.133/2021"
  referencias_cruzadas: []
  flag_tecnico: false
  flag_reserva: true

- id: E4-018
  id_origem_parcial: E4a-018
  dispositivo_editalicio: "Item 7 do ETP (Estimativa das quantidades — contêineres)"
  transcricao: "Atualmente o município possui 17 pontos de descarte irregular de resíduos, e em cada um dos pontos serão colocados 2 contêineres, totalizando 34. Os 46 restantes serão distribuídos em praças, parques, rodoviária e demais pontos estratégicos."
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: "Dimensionamento parcial dos contêineres: apenas 34 das 80 unidades têm critério objetivo (17 pontos × 2); os 46 restantes são atribuídos genericamente a 'pontos estratégicos' não identificados, sem memória de cálculo"
  dispositivo_legal: "art. 18, § 1.º, inciso IV, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4a-017"]
  flag_tecnico: false
  flag_reserva: false

- id: E4-019
  id_origem_parcial: E4a-019
  dispositivo_editalicio: "Item 7 do ETP (premissas combinadas de tonelagem e contêineres)"
  transcricao: "estima-se uma redução de, no mínimo, 20% do total praticado atualmente [...] necessidade urgente de mitigar os impactos ambientais e sanitários causados pelos pontos de descarte irregular de resíduos"
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: "Premissas potencialmente antagônicas não conciliadas: a conteinerização de 17 pontos de descarte irregular e de pontos estratégicos tende a incorporar à coleta regular volumes hoje descartados irregularmente, na contramão da premissa de redução de 20% da tonelagem"
  dispositivo_legal: "art. 18, § 1.º, inciso IV, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4a-003", "E4a-018"]
  flag_tecnico: true
  flag_reserva: true

- id: E4-020
  id_origem_parcial: E4a-020
  dispositivo_editalicio: "Item 8 do ETP c/c Quadro Comparativo de Preços e contratos anexos"
  transcricao: "A escolha dos fornecedores foi baseada em municípios que contrataram os itens relacionados ao objeto da contratação, através do Portal Nacional de Compras Públicas (PNCP) [...] Buscou-se principalmente municípios do São Paulo, porém, na ausência destes, buscou-se municípios de estados próximos."
  tipo_achado: IRREGULAR
  categoria: risco_economico
  descricao_breve: "Pesquisa de preços sem demonstração de comparabilidade: cotações de contratos com escalas muito díspares (Altinópolis 4.500 t/ano; Fernandópolis 21.600 t/ano; Porto Ferreira 12.480 t/ano), escopos distintos (coleta rural, varrição, triagem, tecnologia embarcada) e município de outro estado (Xanxerê/SC), sem qualquer ajuste ou uniformização de condições"
  dispositivo_legal: "art. 23, caput e § 1.º, inciso II, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4a-021", "E4a-022", "E4a-023", "E4a-024"]
  flag_tecnico: false
  flag_reserva: false

