  dispositivo_editalicio: "ETP (ausência de item específico sobre vigência)"
  transcricao: "[o ETP não contém seção tratando da vigência contratual de 60 meses nem de sua vantajosidade]"
  tipo_achado: DEPENDE_DE_FATO
