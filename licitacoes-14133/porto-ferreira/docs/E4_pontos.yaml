- id: E4-023
  id_origem_parcial: E4a-023
  dispositivo_editalicio: "Quadro Comparativo de Preços (item 1) c/c Contratos n.º 109/2025 de Itapira e n.º 136/2025 de Artur Nogueira (anexos ao ETP)"
  transcricao: "[Quadro, item 1, colunas Mirandópolis, Juquiá, Artur Nogueira, Itapira e Xanxerê:] R$ - [Contrato Itapira, item 01:] Serviços de coleta e remoção de resíduos sólidos domiciliares (rsu) [...] R$225,02 [Contrato Artur Nogueira, item 2:] COLETA, TRANSPORTE E DESTINAÇÃO FINAL DOS RESÍDUOS SÓLIDOS DOMICILIARES [...] R$ 342,30"
  tipo_achado: IRREGULAR
  categoria: omissao
