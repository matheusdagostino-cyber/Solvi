  descricao_breve: "Ausência, no ETP, de demonstração/atestado de maior vantagem econômica para a celebração de contrato de serviço contínuo com prazo de 5 anos (verificar se consta de outro documento do processo)"
  dispositivo_legal: "art. 106, inciso I, da Lei n.º 14.133/2021"
