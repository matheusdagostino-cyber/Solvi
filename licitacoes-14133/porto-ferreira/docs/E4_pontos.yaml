  id_origem_parcial: E4a-021
  dispositivo_editalicio: "Quadro Comparativo de Preços (item 4) c/c Contrato n.º 136/2025 de Artur Nogueira (anexo ao ETP)"
  transcricao: "CONTRATAÇÃO COM DISPENSA DE LICITAÇÃO – LEI Nº 14.133/21, ART. 75, VIII. [...] Contratação, em caráter emergencial [...] FORNECIMENTO, MANUTENÇÃO E HIGIENIZAÇÃO DE CONTÊINER PEAD DE 1.000 LITROS [...] R$ 230,00 [...] O prazo de vigência do presente contrato é de 03 (três) meses"
  tipo_achado: IRREGULAR
  categoria: risco_economico
  descricao_breve: "Uso de contrato emergencial firmado por dispensa de licitação (art. 75, VIII), com vigência de 3 meses, como referência de preço de contêiner (R$ 230,00), sem ponderação de que contratações emergenciais e de curtíssimo prazo tendem a embutir sobrepreço"
  dispositivo_legal: "art. 23, § 1.º, inciso II, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4a-020"]
  flag_tecnico: false
  flag_reserva: false

