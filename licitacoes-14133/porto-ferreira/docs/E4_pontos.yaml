- id: E4-092
  id_origem_parcial: E4d-014
  dispositivo_editalicio: "Cláusula Vigésima Segunda, §§ 2.º e 4.º, da CCT 2025/2026 (Benefício Social Sindical)"
  transcricao: "as empresas (...) compulsoriamente, a título de contribuição social, recolherão até o dia 10 (dez) de cada mês o valor total de R$ 14,08 (...) por trabalhador (...). Parágrafo Quarto: Em todas as planilhas de custos e editais de licitações deverão constar previsão financeira para cumprimento desta assistência social."
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: "Contribuição patronal compulsória de R$14,08/trabalhador/mês (BSS), com exigência convencional de previsão financeira expressa em planilhas de custos e editais — verificar se o orçamento estimado da Administração a contempla"
  dispositivo_legal: "cláusula 22ª, §§ 2.º e 4.º, da CCT 2025/2026; art. 63, § 1.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-004", "E4d-016"]
  flag_tecnico: false
  flag_reserva: false

- id: E4-093
  id_origem_parcial: E4d-015
  dispositivo_editalicio: "Cláusula Sexagésima Sexta da CCT 2025/2026 (Taxa Assistencial Patronal)"
  transcricao: "As empresas contribuirão em favor do SELUR com a importância equivalente a 0,5% (cinco décimos por cento) mensalmente, sobre o total bruto de salários pagos aos empregados (...), incluindo o 13º (décimo terceiro) salário."
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: "Taxa assistencial patronal de 0,5% sobre a folha bruta mensal (inclusive 13º) em favor do sindicato patronal — custo recorrente a considerar na precificação; repasse em repactuação potencialmente excluído pela cláusula 5.7 da minuta"
  dispositivo_legal: "cláusula 66ª da CCT 2025/2026; art. 135, §§ 1.º e 2.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-014", "E4d-016"]
  flag_tecnico: false
  flag_reserva: false

- id: E4-094
  id_origem_parcial: E4d-016
  dispositivo_editalicio: "Item 5.4.29 do TR c/c cláusula 5.7 da minuta de contrato"
  transcricao: "TR 5.4.29: 'atender integralmente à Convenção Coletiva de Trabalho 2025/2026'; minuta 5.7: 'o contratante não se vinculará às disposições contidas em acordos, convenções ou dissídios coletivos de trabalho que tratem (...) de matéria não trabalhista, de pagamento de participação dos trabalhadores nos lucros ou resultados (...), ou que estabeleçam direitos não previstos em lei'."
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: "Contradição interna: o TR exige cumprimento integral da CCT (incluindo BSS, taxa patronal, PPR e demais obrigações convencionais), mas a minuta veda a consideração dessas mesmas parcelas na repactuação — custos exigidos na execução sem correspondente recomposição"
  dispositivo_legal: "art. 135, §§ 1.º e 2.º, da Lei n.º 14.133/2021; art. 92, inciso V, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-014", "E4d-015", "E4d-017"]
  flag_tecnico: false
  flag_reserva: false

- id: E4-095
  id_origem_parcial: E4d-017
  dispositivo_editalicio: "Cláusula Décima Quarta da CCT 2025/2026 (Plano de Participação nos Resultados)"
  transcricao: "Se ainda assim persistir frustrada a negociação, fica avençada a multa de caráter indenizatório de 70% (setenta por cento) do salário do empregado abrangido por essa Convenção, a ser paga em 2 parcelas de 35% (...) em cada semestre."
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: "Obrigação convencional de implantar PPR sob pena de multa indenizatória anual de 70% do salário por empregado — custo potencial relevante, expressamente excluído da repactuação pela cláusula 5.7 da minuta (PLR)"
  dispositivo_legal: "cláusula 14ª da CCT 2025/2026; art. 135, § 1.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-016"]
  flag_tecnico: false
  flag_reserva: false

- id: E4-096
  id_origem_parcial: E4d-018
  dispositivo_editalicio: "Cláusula Trigésima Nona, § 4.º, da CCT 2025/2026 (jornada 12x36)"
  transcricao: "a jornada de trabalho de 12x36h em aterros sanitários demandará prévia anuência do Sindicato Laboral caso haja necessidade de adotá-la nas suas 'frentes de descarga'."
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: "Adoção de escala 12x36 nas frentes de descarga do aterro condicionada a anuência sindical prévia — restrição de dimensionamento de equipe da operação do aterro municipal, com impacto no custo de mão de obra do item 2"
  dispositivo_legal: "art. 59-A da CLT c/c cláusula 39ª, § 4.º, da CCT 2025/2026"
  referencias_cruzadas: ["E4d-027"]
  flag_tecnico: true
  flag_reserva: false

- id: E4-097
  id_origem_parcial: E4d-019
  dispositivo_editalicio: "Cláusula Septagésima Primeira da CCT 2025/2026 (Ultratividade)"
  transcricao: "As partes acordam que será mantida a vigência das cláusulas durante o período de negociação da Convenção Coletiva de Trabalho."
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: "Cláusula de ultratividade convencionada colide com a vedação legal de ultratividade (art. 614, § 3.º, da CLT), agravando a incerteza sobre quais pisos e benefícios vigoram na data de entrega das propostas caso a CCT 2026/2027 não esteja registrada"
  dispositivo_legal: "art. 614, § 3.º, da CLT; art. 63, § 1.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-003", "E4d-004"]
  flag_tecnico: false
  flag_reserva: false

# ============ ANEXO IV — MODELO DE DECLARAÇÃO (FASE DE HABILITAÇÃO) ============

- id: E4-098
  id_origem_parcial: E4d-020
  dispositivo_editalicio: "Anexo IV, alíneas 'a', 'c', 'd', 'f', 'g', 'h', 'k', 'l' e 'm', c/c item 1.5.1 do Anexo II"
  transcricao: "a) cumpre as exigências de reserva de cargos para pessoa com deficiência e para reabilitado da Previdência Social (...); g) nos termos do inciso VI do artigo 68 da Lei Federal nº 14.133 (...) situação regular (...) inciso XXXIII do artigo 7º da Constituição Federal; k) nos 5 (cinco) anos anteriores à divulgação deste edital, não fui condenada (...) por exploração de trabalho infantil (...)."
  tipo_achado: CONFORME
  categoria: omissao
  descricao_breve: "Declarações-padrão de habilitação (reserva de cargos PCD/reabilitado, requisitos de habilitação, fato impeditivo, idoneidade, menor aprendiz, trabalho escravo/infantil, disponibilidade de máquinas e pessoal, normas de SST) têm amparo legal"
  dispositivo_legal: "art. 63, incisos I e IV, art. 14, inciso VI, e art. 68, inciso VI, da Lei n.º 14.133/2021; art. 7.º, inciso XXXIII, da CF/1988"
  referencias_cruzadas: []
  flag_tecnico: false
  flag_reserva: false

- id: E4-099
  id_origem_parcial: E4d-021
  dispositivo_editalicio: "Anexo IV, alínea 'e'"
  transcricao: "não haverá prestação de serviço, na execução do futuro contrato, de cônjuge, companheiro(a) ou parente em linha reta ou colateral, por consanguinidade ou afinidade, até o terceiro grau, de agente público que exerce cargo em comissão ou função de confiança no âmbito do Município."
  tipo_achado: DEPENDE_DE_FATO
  categoria: restricao_competitividade
  descricao_breve: "Vedação de contratação, pela futura contratada, de parentes até 3.º grau de qualquer comissionado do Município extrapola o rol legal de impedimentos da Lei 14.133 (restrito a agente público do órgão contratante com atuação na licitação) — verificar existência de norma municipal antinepotismo que a fundamente"
  dispositivo_legal: "art. 14, inciso IV, e art. 9.º, § 1.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: []
  flag_tecnico: false
  flag_reserva: false

- id: E4-100
  id_origem_parcial: E4d-022
  dispositivo_editalicio: "Anexo IV, alínea 'i', c/c itens 1.4 e 1.5.1 do Anexo II"
  transcricao: "possui os seguintes contratos firmados vigentes com a iniciativa privada e Administração Pública: (...) Valor Total dos Contratos R$__________ — Transferir para cálculo do PL."
  tipo_achado: CONFORME
  categoria: omissao
  descricao_breve: "Exigência de relação de compromissos/contratos vigentes para cotejo com o patrimônio líquido tem amparo na disciplina da habilitação econômico-financeira; o critério de cálculo do 'PL' referido deve estar objetivamente definido no Anexo II"
  dispositivo_legal: "art. 69 da Lei n.º 14.133/2021"
  referencias_cruzadas: []
  flag_tecnico: false
  flag_reserva: false

- id: E4-101
  id_origem_parcial: E4d-023
  dispositivo_editalicio: "Anexo IV, alínea 'j', c/c itens 7.11 e 7.12 do TR"
  transcricao: "j) autoriza a criação de Conta Vinculada para a Quitação de Obrigações Trabalhistas (...). TR 7.11: 'depositados pelo Município em conta vinculada específica, conforme o disposto na Instrução Normativa SLTI/MP nº 02, de 30 de abril de 2008'."
  tipo_achado: IRREGULAR
  categoria: erro_material
  descricao_breve: "Disciplina da conta vinculada remete à IN SLTI/MP 02/2008, norma federal revogada e não autoaplicável ao Município, sem fixação no edital dos percentuais de provisionamento e da operacionalização — insegurança sobre a retenção que impacta o fluxo de caixa da contratada"
  dispositivo_legal: "art. 121, § 3.º, da Lei n.º 14.133/2021; art. 92 da Lei n.º 14.133/2021 (cláusulas necessárias)"
  referencias_cruzadas: []
  flag_tecnico: false
  flag_reserva: false

- id: E4-102
  id_origem_parcial: E4d-024
  dispositivo_editalicio: "Anexo IV, alínea 'n', c/c item 1.5.1, parte final, do Anexo II"
  transcricao: "apresentará por ocasião da assinatura do contrato, caso sagre-se vencedora, comprovação de que os responsáveis técnicos indicados no(s) atestado(s) ou certidão(ões) apresentados na fase de habilitação pertencem ao quadro permanente da Licitante, conforme SÚMULA N° 25 (TCE)."
  tipo_achado: IRREGULAR
  categoria: restricao_competitividade
