- id: E4a-003
  dispositivo_editalicio: "Item 7 do ETP (Estimativa das quantidades)"
  transcricao: "Com a implementação da cobrança dos grandes geradores, estima-se uma redução de, no mínimo, 20% do total praticado atualmente, reduzindo a quantidade de 1.300 toneladas mensais para 1.040 toneladas mensais."
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: "Premissa de redução de 20% da tonelagem condicionada a evento futuro e incerto (implementação da cobrança de grandes geradores), sem demonstração técnica do percentual, sem cronograma de implementação e sem tratamento do risco de a redução não se concretizar em contrato de 60 meses"
  dispositivo_legal: "art. 18, § 1.º, incisos IV e VI, da Lei n.º 14.133/2021; art. 6.º, inciso XXIII, alínea 'd', da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4a-004", "E4a-019"]
  flag_tecnico: true
  flag_reserva: true

