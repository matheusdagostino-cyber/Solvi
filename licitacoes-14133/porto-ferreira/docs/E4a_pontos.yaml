- id: E4a-025
  dispositivo_editalicio: "Item 11 do ETP (Resultados pretendidos)"
  transcricao: "Garantir o cumprimento da Política Nacional de Resíduos Sólidos (Lei nº 12.305/2010) assegurando as metas de redução, reutilização, coleta seletiva e reciclagem, entre outras, com vistas a reduzir a quantidade de rejeitos encaminhados para o aterro sanitário."
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: "Resultados pretendidos incluem metas de redução, reutilização, coleta seletiva e reciclagem sem nenhum componente correspondente na solução contratada (que destina 100% da tonelagem coletada a aterro, sem triagem ou recuperação), em descompasso com a ordem de prioridade da PNRS"
  dispositivo_legal: "art. 9.º, caput, da Lei n.º 12.305/2010; art. 18, § 1.º, inciso IX, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4a-007"]
