- id: E4a-017
  dispositivo_editalicio: "Itens 7 e 8 do ETP (item 4 das tabelas) c/c Quadro Comparativo de Preços (item 4)"
  transcricao: "Fornecimento, manutenção e higienização de contêineres com capacidade de 1000 litros: 80 UNIDADE [...] Valor Unitário R$207,83, Valor Mensal R$16.626,40, Valor Total para 12 meses R$199.516,80 [Quadro Comparativo: UNIDADE DE MEDIDA UN, QUANTIDADE 960]"
