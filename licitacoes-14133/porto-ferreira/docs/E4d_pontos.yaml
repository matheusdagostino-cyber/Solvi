# ============ CCT 2025/2026 SIEMACO ARARAQUARA ============

- id: E4d-001
  dispositivo_editalicio: "Item 5.4.29 do TR c/c cláusula 9.4.29 da minuta de contrato"
  transcricao: "A CONTRATADA deverá atender integralmente à Convenção Coletiva de Trabalho 2025/2026 (em anexo) do SIEMACO Araraquara (...), sindicato este que atende os trabalhadores da categoria em Porto Ferreira."
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: "Imposição editalícia de CCT específica (SIEMACO Araraquara) como obrigação contratual, quando o enquadramento sindical decorre da atividade preponderante e da base territorial definidas em lei, não de escolha do edital"
  dispositivo_legal: "art. 511, § 2.º, e art. 611 da CLT (Decreto-Lei n.º 5.452/1943); art. 135, inciso II, da Lei n.º 14.133/2021 (proposta vinculada ao instrumento coletivo da categoria do próprio licitante)"
  referencias_cruzadas: ["E4d-002", "E4d-003"]
  flag_tecnico: false
  flag_reserva: false

- id: E4d-002
  dispositivo_editalicio: "Item 5.4.29 do TR c/c Cláusula Segunda (Abrangência) da CCT 2025/2026"
  transcricao: "CCT, cláusula 2ª: 'abrangência territorial em Américo Brasiliense/SP, Araraquara/SP, Boa Esperança do Sul/SP, Bocaina/SP, Dourado/SP, Ibaté/SP, Ibitinga/SP, Jaboticabal/SP, Jaú/SP, Matão/SP, Ribeirão Bonito/SP e Taquaritinga/SP' — Porto Ferreira não consta do rol; TR afirma que o SIEMACO Araraquara 'atende os trabalhadores da categoria em Porto Ferreira'."
  tipo_achado: DEPENDE_DE_FATO
  categoria: contradicao
  descricao_breve: "A CCT anexada não inclui Porto Ferreira em sua abrangência territorial (cláusula 2ª), contradizendo a afirmação do TR de que o sindicato atende a categoria no Município; necessário apurar o real enquadramento sindical territorial da categoria em Porto Ferreira"
  dispositivo_legal: "arts. 570, 611 e 612 da CLT (representação e âmbito de aplicação da convenção coletiva)"
  referencias_cruzadas: ["E4d-001", "E4d-004"]
  flag_tecnico: false
  flag_reserva: false

- id: E4d-003
  dispositivo_editalicio: "Cláusula Primeira da CCT 2025/2026 c/c item 5.4.29 do TR e alínea 'b' do Anexo IV"
  transcricao: "CCT, cláusula 1ª: 'vigência (...) no período de 01º de março de 2025 a 28 de fevereiro de 2026 e a data-base da categoria em 01º de março'; Anexo IV, 'b': custos das 'convenções coletivas de trabalho (...) vigentes na data de entrega das propostas'."
  tipo_achado: IRREGULAR
