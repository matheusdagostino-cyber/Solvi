# ============ ANEXO VI — VISITA TÉCNICA / DECLARAÇÕES ============

- id: E4d-035
  dispositivo_editalicio: "Anexo VI (fls. 1/3 a 3/3) c/c item 4.12 do TR e item 1.3.1 do Anexo II"
  transcricao: "TR 4.12: 'A avaliação prévia do local de execução dos serviços é imprescindível (...) sendo assegurado ao interessado o direito de realização de vistoria prévia'; 4.12.1.1: opção pela não realização mediante folha 3/3 do Anexo VI; 4.12.1.2: agendamento 'de modo que seu agendamento não coincida com o agendamento de outros licitantes'."
  tipo_achado: CONFORME
  categoria: omissao
  descricao_breve: "Regime de vistoria facultativa, com declaração substitutiva de conhecimento das condições (fls. 3/3) e agendamento individualizado por licitante, observa o modelo legal e o entendimento sumulado (Súmula 272 do TCU)"
  dispositivo_legal: "art. 63, §§ 2.º, 3.º e 4.º, da Lei n.º 14.133/2021; Súmula 272 do TCU"
  referencias_cruzadas: ["E4d-036", "E4d-037"]
  flag_tecnico: false
  flag_reserva: false

- id: E4d-036
  dispositivo_editalicio: "Anexo VI, folha 3/3 (Declaração de Conhecimento das Condições de Execução)"
  transcricao: "que somos detentores de todas as informações relativas a execução do objeto deste certame e que não alegaremos posteriormente o desconhecimento de fatos para solicitar qualquer alteração do valor do contrato que viermos a celebrar."
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: "Declaração substitutiva impõe renúncia genérica a 'qualquer alteração do valor do contrato' por desconhecimento de 'fatos', sem restrição a fatos verificáveis à época — redação apta a ser oposta a pleitos de reequilíbrio por fatos supervenientes ou álea extraordinária, em conflito com o regime legal de manutenção do equilíbrio econômico-financeiro"
  dispositivo_legal: "art. 124, inciso II, alínea 'd', e art. 103, § 5.º, da Lei n.º 14.133/2021; art. 37, inciso XXI, da CF/1988"
  referencias_cruzadas: ["E4d-035", "E4d-037"]
  flag_tecnico: false
  flag_reserva: false

- id: E4d-037
  dispositivo_editalicio: "Anexo VI, folhas 2/3 e 3/3 (comparação das redações)"
  transcricao: "Fls. 2/3: 'não alegaremos posteriormente o desconhecimento de fatos evidentes à época da visita'; fls. 3/3: 'não alegaremos posteriormente o desconhecimento de fatos' (sem o qualificador 'evidentes à época')."
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: "Assimetria entre as declarações: quem realiza a vistoria renuncia apenas quanto a fatos 'evidentes à época da visita', enquanto quem opta pela declaração substitutiva assume renúncia mais ampla (qualquer fato) — tratamento desigual que onera a opção legal de não vistoriar"
  dispositivo_legal: "art. 5.º e art. 63, § 3.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-035", "E4d-036"]
  flag_tecnico: false
  flag_reserva: false

- id: E4d-038
  dispositivo_editalicio: "Anexo VI, folha 3/3 (campo de assinatura)"
  transcricao: "por intermédio do(a) Sr(a) (...), devidamente credenciado(a) por nossa empresa (...) — Assinatura do profissional."
  tipo_achado: IRREGULAR
  categoria: erro_material
  descricao_breve: "Modelo da declaração substitutiva de vistoria prevê assinatura de 'profissional credenciado' genérico, sem exigir que seja o responsável técnico do licitante, como prevê a lei para a declaração formal substitutiva"
  dispositivo_legal: "art. 63, § 3.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-035"]
  flag_tecnico: false
  flag_reserva: false
