- id: E4d-016
  dispositivo_editalicio: "Item 5.4.29 do TR c/c cláusula 5.7 da minuta de contrato"
  transcricao: "TR 5.4.29: 'atender integralmente à Convenção Coletiva de Trabalho 2025/2026'; minuta 5.7: 'o contratante não se vinculará às disposições contidas em acordos, convenções ou dissídios coletivos de trabalho que tratem (...) de matéria não trabalhista, de pagamento de participação dos trabalhadores nos lucros ou resultados (...), ou que estabeleçam direitos não previstos em lei'."
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: "Contradição interna: o TR exige cumprimento integral da CCT (incluindo BSS, taxa patronal, PPR e demais obrigações convencionais), mas a minuta veda a consideração dessas mesmas parcelas na repactuação — custos exigidos na execução sem correspondente recomposição"
  dispositivo_legal: "art. 135, §§ 1.º e 2.º, da Lei n.º 14.133/2021; art. 92, inciso V, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-014", "E4d-015", "E4d-017"]
