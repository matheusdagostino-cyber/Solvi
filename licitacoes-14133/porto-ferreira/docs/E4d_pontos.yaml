  transcricao: "j) autoriza a criação de Conta Vinculada para a Quitação de Obrigações Trabalhistas (...). TR 7.11: 'depositados pelo Município em conta vinculada específica, conforme o disposto na Instrução Normativa SLTI/MP nº 02, de 30 de abril de 2008'."
  tipo_achado: IRREGULAR
  categoria: erro_material
  descricao_breve: "Disciplina da conta vinculada remete à IN SLTI/MP 02/2008, norma federal revogada e não autoaplicável ao Município, sem fixação no edital dos percentuais de provisionamento e da operacionalização — insegurança sobre a retenção que impacta o fluxo de caixa da contratada"
  dispositivo_legal: "art. 121, § 3.º, da Lei n.º 14.133/2021; art. 92 da Lei n.º 14.133/2021 (cláusulas necessárias)"
  referencias_cruzadas: []
  flag_tecnico: false
  flag_reserva: false

- id: E4d-024
  dispositivo_editalicio: "Anexo IV, alínea 'n', c/c item 1.5.1, parte final, do Anexo II"
  transcricao: "apresentará por ocasião da assinatura do contrato, caso sagre-se vencedora, comprovação de que os responsáveis técnicos indicados no(s) atestado(s) ou certidão(ões) apresentados na fase de habilitação pertencem ao quadro permanente da Licitante, conforme SÚMULA N° 25 (TCE)."
  tipo_achado: IRREGULAR
  categoria: restricao_competitividade
  descricao_breve: "Exigência de que os responsáveis técnicos pertençam ao 'quadro permanente' da licitante restringe as formas admitidas de comprovação de vínculo profissional (a lei exige apenas a apresentação de profissional detentor de atestado/CAT); confrontar com o teor da própria Súmula 25 do TCE-SP invocada pelo edital"
  dispositivo_legal: "art. 67, inciso I, da Lei n.º 14.133/2021"
  referencias_cruzadas: []
  flag_tecnico: false
  flag_reserva: false

# ============ ANEXO V — MINUTA DA PROPOSTA COMERCIAL ============

- id: E4d-025
  dispositivo_editalicio: "Anexo V, itens 4 e 4.1, c/c item 9.1 do TR (Nota Informativa) e critério de julgamento menor preço por lote"
  transcricao: "Anexo V, item 4: Lote 1 — Item 2 'Destinação final (...) em aterro sanitário devidamente licenciado no Município' 12.480 TON/ANO; Item 3 'Destinação final (...) em aterro sanitário devidamente licenciado em outro Município' 12.480 TON/ANO; '4.1 Valor Total da Proposta R$'. TR 9.1, Nota: 'Os itens 2 e 3 são mutuamente excludentes e sucessivos'."
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: "Julgamento pelo menor valor global do lote somando itens 2 e 3, mutuamente excludentes e ambos com a tonelagem anual integral (12.480 t), faz o critério de julgamento não refletir o dispêndio real e permite desbalanceamento dos preços unitários entre os itens conforme a expectativa de vida útil do aterro municipal (jogo de planilha)"
  dispositivo_legal: "art. 5.º, art. 33, inciso I, e art. 34, caput e § 1.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-026", "E4d-027"]
  flag_tecnico: true
  flag_reserva: true

- id: E4d-026
  dispositivo_editalicio: "Anexo V, item 4, c/c item 9.1 do TR (Nota Informativa)"
  transcricao: "TR 9.1, Nota Informativa: 'a Contratada não fará jus ao recebimento da soma integral de todos os itens simultaneamente. Os itens 2 e 3 são mutuamente excludentes e sucessivos (...) sendo vedada a cumulatividade de faturamento entre ambos' — regra não reproduzida no modelo de proposta do Anexo V."
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: "O Anexo V não reproduz a regra de exclusão mútua e sucessividade dos itens 2 e 3 constante do TR 9.1, induzindo o proponente que se guiar pelo modelo a precificar execução simultânea das duas destinações"
  dispositivo_legal: "art. 25, caput, e art. 92 da Lei n.º 14.133/2021; art. 5.º da Lei n.º 14.133/2021 (julgamento objetivo)"
  referencias_cruzadas: ["E4d-025"]
  flag_tecnico: false
  flag_reserva: false

- id: E4d-027
  dispositivo_editalicio: "Anexo V, itens 1.1 e 4 (Item 2 da planilha)"
  transcricao: "1.1 (...) incluindo a operação do aterro sanitário municipal ou destinação final de resíduos urbanos em aterro sanitário de outro município (...). Item 2: 'Destinação final ambientalmente adequada (...) em aterro sanitário devidamente licenciado no Município' — 12.480 TON/ANO."
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: "Objeto inclui a operação do aterro sanitário municipal, mas a planilha remunera o item 2 exclusivamente por tonelada destinada, sem parcela fixa para custos de operação do aterro (recobrimento, drenagem, tratamento de chorume, monitoramento), transferindo à contratada risco de demanda sobre custos fixos"
  dispositivo_legal: "art. 6.º, inciso XXIII, alínea 'e', e art. 23 da Lei n.º 14.133/2021; art. 92, inciso V, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-025", "E4d-018"]
  flag_tecnico: true
  flag_reserva: false

- id: E4d-028
  dispositivo_editalicio: "Anexo V, item 4 (colunas da tabela de preços)"
  transcricao: "Quantidade 12.480 — Unidade TON/ANO — Valor Unitário — Valor Mensal — Valor Total para 12 (doze) meses."
  tipo_achado: IRREGULAR
  categoria: erro_material
  descricao_breve: "Inconsistência de unidades no modelo de proposta: quantidade anual em TON/ANO combinada com coluna de 'Valor Mensal', enquanto a remuneração contratual é por tonelada efetivamente medida (R$/TON) — o 'valor mensal' uniforme não corresponde ao regime real de medição"
  dispositivo_legal: "art. 25, caput, da Lei n.º 14.133/2021 (edital com regras claras e objetivas)"
  referencias_cruzadas: ["E4d-025"]
  flag_tecnico: false
  flag_reserva: false

- id: E4d-029
  dispositivo_editalicio: "Anexo V, item 4 (Item 4 da planilha), c/c itens 5.1.4 e 9.1 do TR"
  transcricao: "Anexo V/TR 9.1: 'Fornecimento, manutenção e higienização de contêineres com capacidade de 1000 litros'; TR 5.1.4: 'Locação Manutenção e higienização de contêineres com capacidade de 1000 litros'."
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: "Divergência entre 'fornecimento' (Anexo V e TR 9.1) e 'locação' (TR 5.1.4) dos contêineres — indefinição sobre a propriedade/reversão dos bens ao final do contrato, com impacto direto na precificação (CAPEX vs. aluguel)"
  dispositivo_legal: "art. 6.º, inciso XXIII, e art. 40, § 1.º, inciso I, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-030"]
  flag_tecnico: false
  flag_reserva: false

- id: E4d-030
  dispositivo_editalicio: "Anexo V, item 4 (Item 4 da planilha)"
  transcricao: "Item 4 — Fornecimento, manutenção e higienização de contêineres com capacidade de 1000 litros — 80 — UNIDADE."
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: "Modelo de proposta não indica a periodicidade do preço unitário do item 4 ('UNIDADE' — por mês ou preço único), embora a estimativa do TR 9.1 (R$207,83 unitário x 80 = R$16.626,40 mensal) pressuponha valor mensal por contêiner"
  dispositivo_legal: "art. 25, caput, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-029"]
  flag_tecnico: false
  flag_reserva: false

- id: E4d-031
  dispositivo_editalicio: "Anexo V, item 3.2, c/c item 5.1.5 do TR"
  transcricao: "O serviço será iniciado mediante emissão de Ordem de Serviço, devendo ter início das atividades em 30 (trinta) dias, ficando a critério do poder público escolher a data conveniente para emissão de tal ordem."
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: "Ausência de prazo máximo para emissão da Ordem de Serviço após a assinatura ('a critério do poder público escolher a data conveniente'), deixando indefinido o termo inicial da execução e da fluência dos preços propostos, com risco de defasagem entre proposta e mobilização"
  dispositivo_legal: "art. 92, caput, da Lei n.º 14.133/2021 (cláusulas necessárias: prazos e condições de execução); art. 115 da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-005"]
  flag_tecnico: false
  flag_reserva: false

- id: E4d-032
  dispositivo_editalicio: "Anexo V, item 5.1, c/c itens 7.10 do TR"
  transcricao: "5.1. Em até 10 (dez) dias, após a entrega do objeto e emissão da nota fiscal devidamente atestada pelo solicitante."
  tipo_achado: IRREGULAR
  categoria: erro_material
  descricao_breve: "Condição de pagamento do modelo de proposta redigida para fornecimento de bens ('entrega do objeto'), incompatível com o regime de serviço contínuo com medição mensal por tonelada previsto no TR — resquício de modelo-padrão de compras"
  dispositivo_legal: "art. 92, incisos V e VI, e art. 141 da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4d-028"]
  flag_tecnico: false
  flag_reserva: false

- id: E4d-033
  dispositivo_editalicio: "Anexo V, item 4.5, c/c item 10.1 do TR (dotação orçamentária)"
  transcricao: "os quantitativos indicados no item 4 consideram um horizonte de 12 (doze) meses. Tal referência não altera a vigência contratual, que será de 60 (sessenta) meses (...). TR 10.1: dotações indicadas apenas para 2026 (R$3.041.419,20) e 2027 (R$6.152.433,60)."
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: "Edital não explicita o valor estimado total para os 60 meses de vigência (aprox. 5x o valor anual) nem demonstra a previsão orçamentário-financeira plurianual além de 2027 — base de cálculo de garantias, capital mínimo e limites fica referida apenas ao valor de 12 meses"
  dispositivo_legal: "art. 23 e art. 105 da Lei n.º 14.133/2021; art. 16, §§ 1.º e 2.º, da LC n.º 101/2000"
  referencias_cruzadas: ["E4d-025"]
  flag_tecnico: false
  flag_reserva: false

- id: E4d-034
  dispositivo_editalicio: "Anexo V, item 6.1"
  transcricao: "A validade da proposta comercial será de .... (.......) dias, contados a partir da data da sessão pública. — Prazo não inferior a 60 (sessenta) dias."
  tipo_achado: CONFORME
  categoria: omissao
