  descricao_breve: "Edital reaberto após 28/02/2026 exige atendimento integral a CCT 2025/2026 já expirada, ao mesmo tempo em que a declaração do Anexo IV vincula a proposta às CCTs vigentes na data de entrega — o instrumento anexado não estará vigente na data da sessão"
  dispositivo_legal: "art. 63, § 1.º, da Lei n.º 14.133/2021; art. 614, § 3.º, da CLT (vigência máxima de dois anos e vedação de ultratividade)"
