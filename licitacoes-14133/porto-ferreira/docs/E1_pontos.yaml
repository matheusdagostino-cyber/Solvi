  transcricao: "e Patrimônio Líquido (PL) superior a 1/12 (um doze avos) do valor total dos contratos firmados com a Administração Pública e com a iniciativa privada [...] PL = VALOR DO PATRIMÔNIO LÍQUIDO x 12 > 1 / VALOR TOTAL DOS CONTRATOS (transferir Valor Total apurado no Anexo IV)"
