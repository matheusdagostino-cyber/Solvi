  transcricao: "a boa situação financeira será avaliada pelos Índices de Liquidez Geral (LG), Solvência Geral (SG) e Liquidez Corrente (LC), que deverão apresentar o valor mínimo igual a 1 (um) [...] A adoção das fórmulas supra, justifica-se na busca dos resultados, consistentes na apuração da situação econômico-financeira das empresas..."
