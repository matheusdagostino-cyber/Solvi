  dispositivo_legal: "art. 67, § 2.º, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E1-056"]
  flag_tecnico: false
  flag_reserva: true

- id: E1-059
  dispositivo_editalicio: "Item 1.3.4 do Anexo II"
  transcricao: "Atestado(s) ou Certidão(ões) de Capacitação técnica em nome do profissional [...] acompanhando(s) da(s) Certidão(ões) de Acervo(s) Técnico(s) (CAT) [...] que façam explícita referência às parcelas de maior relevância, abaixo explicitadas (Súmula 23 do TCESP): Itens de maior relevância: a) Coleta e transporte [...] – 520 toneladas/mês; b) Operação de aterro sanitário [...] – 520 toneladas/mês"
