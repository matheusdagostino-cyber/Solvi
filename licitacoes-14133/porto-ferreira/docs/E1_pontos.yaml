  transcricao: "de que autoriza a criação da Conta Vinculada para Quitações de Obrigações Trabalhistas, nos 5 (cinco) anos anteriores à divulgação deste edital, não fui condenada judicialmente, com trânsito em julgado, por exploração de trabalho infantil..."
