- id: E1-056
  dispositivo_editalicio: "Item 1.3.3, alíneas 'a' e 'b', e item 1.3.3.1 do Anexo II"
  transcricao: "Itens de maior relevância: a) Coleta e transporte de resíduos sólidos urbanos (Classe IIA) – 520 toneladas/mês; b) Operação de aterro sanitário de resíduos sólidos urbanos (Classe IIA) – 520 toneladas/mês; [...] poderá ser efetuada pelo somatório das quantidades realizadas em tantos atestados ou certidões quanto dispuser o licitante, desde que executados dentro de um mesmo período de tempo"
  tipo_achado: CONFORME
  categoria: restricao_competitividade
  descricao_breve: "Quantitativos mínimos de 520 t/mês equivalem a exatos 50% da demanda estimada (12.480 t/ano = 1.040 t/mês) — calibrados no teto máximo admitido em lei e na faixa da Súmula 24; admitido somatório de atestados concomitantes"
  dispositivo_legal: "art. 67, §§ 1.º e 2.º, da Lei n.º 14.133/2021; Súmula n.º 24 do TCE-SP"
  referencias_cruzadas: ["E1-055", "E1-057", "E2:TR-tonelagem", "E4:planilha-itens"]
  flag_tecnico: true
  flag_reserva: true

- id: E1-057
  dispositivo_editalicio: "Item 1.3.3, alínea 'b', do Anexo II c/c itens 2 e 3 do quadro do TR 9.1"
  transcricao: "b) Operação de aterro sanitário de resíduos sólidos urbanos (Classe IIA) – 520 toneladas/mês [TR: item 2 = destinação em aterro licenciado no Município, encerrado o qual inicia-se o item 3 em outro município]"
  tipo_achado: DEPENDE_DE_FATO
  categoria: restricao_competitividade
  descricao_breve: "Exigência de experiência em OPERAÇÃO DE ATERRO como segunda parcela de maior relevância, quando a operação do aterro municipal (item 2) é fase transitória, excluída do 'valor máximo anual efetivamente executável' — a pertinência e o peso da parcela dependem da vida útil remanescente do aterro municipal e do valor relativo do item 2 (R$ 2.106.249,60/ano ≈ 23% do estimado global); exigência cumulada (coleta + aterro) restringe o certame a operadores verticalizados"
  dispositivo_legal: "art. 67, § 1.º, da Lei n.º 14.133/2021 (parcela de maior relevância e valor significativo ≥ 4%)"
  referencias_cruzadas: ["E1-002", "E1-056", "E1-064", "E2:TR-9.1", "E4:planilha-itens"]
  flag_tecnico: true
  flag_reserva: true

- id: E1-058
