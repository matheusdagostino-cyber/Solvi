- id: E1-073
  dispositivo_editalicio: "Anexo II, item 1.3 (ausência de exigência) c/c objeto (item 3 do lote — destinação em aterro de outro município)"
  transcricao: "[Omissão — o Anexo II não exige, na habilitação, comprovação de disponibilidade/regularidade ambiental de aterro sanitário licenciado para a destinação final em outro município, nem licenças de operação da licitante]"
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
