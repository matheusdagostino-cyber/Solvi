  transcricao: "Os documentos necessários à habilitação deverão ser apresentados: a) em original; b) por cópia; ou c) documentos apresentados com autenticação digital desde que acompanhadas da respectiva Certidão de Autenticação Digital certificada por empresa devidamente licenciada pelo ICP-BRASIL"
