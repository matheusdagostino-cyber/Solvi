  transcricao: 'Resposta à 5ª: ''Serão exigidas da licitante melhor classificada a planilha de composição de custos e a formação de preços... conforme modelo disponibilizado no edital (Anexo V)''. Resposta à 6ª: ''Será disponibilizada planilha-modelo de composição de custos''. Edital reaberto: Anexo V é mera ''MINUTA DA PROPOSTA COMERCIAL'' com tabela de preços unitários, sem estrutura de composição de custos (encargos, BDI, insumos); item 10.8 mantém convocação condicional (''Caso o custo global estimado... tenha sido decomposto...'').'
