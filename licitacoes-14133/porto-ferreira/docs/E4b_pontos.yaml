- id: E4b-011
  dispositivo_editalicio: "Anexos do ETP (pesquisa de precos) — contratos de Itapolis, Mirandopolis e Juquia (referenciais do item 3), quanto à logística de transporte"
  transcricao: "Itapolis: transporte 'até o aterro sanitário devidamente licenciado' (local não indicado); Mirandopolis: 'da Estação de Transbordo do Município [...] para Aterro Sanitário de responsabilidade da contratada' (distância não indicada); Juquia: 'transbordo (transferência), transporte e destinação final' (distância não indicada)."
