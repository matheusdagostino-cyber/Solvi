- id: E4b-014
  dispositivo_editalicio: "Segunda metade do ETP — ausência de tratamento das contratações correlatas/interdependentes, em especial a obra da Estação de Transbordo municipal referida no TR reaberto"
  transcricao: "TR reaberto: 'A CONTRATADA fica ciente de que a Estação de Transbordo está sendo construída' e 'no primeiro semestre de 2027, a operação migrará para o sistema de transbordo', quando 'será faturado exclusivamente o Item 3'. Na parte final do ETP não há qualquer análise dessa obra como contratação interdependente (cronograma, risco de atraso, licenciamento), embora ela condicione a alternância entre os itens 2 (média R$ 168,77/t) e 3 (média R$ 249,28/t) do valor estimado."
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: "Obra da Estação de Transbordo (contratação interdependente que condiciona a migração do faturamento do item 2 para o item 3, com diferença de ~R$ 80/t) não tratada no ETP como contratação correlata/interdependente — atraso ou antecipação da obra altera materialmente o valor total da contratação"
  dispositivo_legal: "art. 18, § 1.º, inciso XI, da Lei n.º 14.133/2021"
  referencias_cruzadas: ["E4b-012", "E4b-010"]
  flag_tecnico: true
  flag_reserva: false

