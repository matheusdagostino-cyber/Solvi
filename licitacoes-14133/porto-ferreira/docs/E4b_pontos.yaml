  descricao_breve: "Nenhum dos referenciais do item 3 informa a distância de transporte até o aterro de destino, e o ETP não normaliza os preços por quilometragem, embora o custo de transporte a aterro de outro município seja função direta da distância — comparação com a logística real de Porto Ferreira impossibilitada"
