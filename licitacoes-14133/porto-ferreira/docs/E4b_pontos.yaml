  transcricao: "Cadastro do Responsável (SCP): campo Endereço com a nota '(*) Não deve ser o endereço do Órgão e/ou Poder. Deve ser o endereço onde poderá ser encontrado(a), caso não esteja mais exercendo o mandato ou cargo' — preenchido com endereço residencial, celular e e-mail pessoais do prefeito; termos de Itapira contêm CPF, RG, e-mail pessoal e celular de agentes públicos e do representante da contratada."
