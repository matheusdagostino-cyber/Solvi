  transcricao: "Nenhuma seção sobre impactos ambientais consta das linhas 4300-8408 do ETP (apenas cópias de contratos de terceiros), embora o objeto inclua operação de aterro sanitário municipal e, alternativamente, transporte interurbano e disposição em aterro de outro município."
