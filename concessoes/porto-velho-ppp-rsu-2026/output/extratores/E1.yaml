pontos:
  # ===================== CONDIÇÕES PRÉVIAS (art. 10 da Lei 11.079/2004) E QUESTÕES FORMAIS =====================
  - id: E1-001
    documento: "EDITAL"
    dispositivo_editalicio: "Preâmbulo (PDF p. 4-5); itens 1.1.4, 1.1.23, 1.1.29, 1.1.39 (p. 6-9); 9.5 (p. 21); 11.13, a (p. 28); 23.1 (p. 52-53); fecho (p. 54)"
    transcricao: "CONCORRÊNCIA [ • ] / [ • ]/202[ • ] — PROCESSO ADMINISTRATIVO: [ • ] — ... na PLATAFORMA ELETRÔNICA, no endereço [ • ], até o dia [ • ] de 202[ • ], às [ • ] h"
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Placeholders em elementos essenciais do certame"
    comentario: "Estão em aberto o número da concorrência e do processo administrativo, a plataforma eletrônica e seu endereço, data e hora de entrega dos envelopes, datas de publicação do aviso, período de visitas técnicas, todo o cronograma (itens 1 a 11), dados do DAM da caução (secretaria, código de receita, processo) e a secretaria signatária. Sem esses dados não é possível aferir os prazos legais nem o canal de participação."
    dispositivo_legal: "art. 25, caput, da Lei n.º 14.133/2021; art. 18, inciso III, da Lei n.º 8.987/1995, c/c art. 11, caput, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-B cl. 2.1 (p. 11): processo administrativo nº [ • ]", "ANEXO-C (p. 2): Concorrência nº [*]/2026"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Pode tratar-se de minuta pré-publicação. Verificar se a versão publicada preencheu os campos."

  - id: E1-002
    documento: "EDITAL"
    dispositivo_editalicio: "Preâmbulo, 2.º parágrafo (PDF p. 4)"
    transcricao: "A justificativa para a realização da presente contratação ... foram publicadas no Diário Oficial dos Municípios do Estado de Rondônia – DOM em [ • ] de 202[ • ]"
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Autorização da autoridade competente fundamentada em estudo técnico (art. 10, I) não identificada"
    comentario: "O Edital não identifica o ato de autorização da autoridade competente nem o estudo técnico que demonstre conveniência e oportunidade, ausência de impacto nas metas fiscais (alínea b) e observância dos limites da LRF (alínea c). Só menciona uma publicação da justificativa com data em branco."
    dispositivo_legal: "art. 10, inciso I, alíneas a, b e c, e § 1.º, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["P7 X.2.2 (p. 66): art. 10, I, e art. 16 da LRF tratados como pendentes", "P6 p. 58-59"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Falta o processo administrativo: ato de autorização e a demonstração exigida pelo § 1.º (premissas e metodologia)."

  - id: E1-003
    documento: "EDITAL"
    dispositivo_editalicio: "Itens 5.1-5.3 (PDF p. 15)"
    transcricao: "5.3. Os recursos para o pagamento da Contraprestação ... advirão de dotações orçamentárias específicas, a serem incluídas nos orçamentos municipais dos exercícios seguintes"
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "Estimativa de impacto orçamentário-financeiro e de fluxo de recursos por exercício não referida"
    comentario: "O Edital não menciona a estimativa de impacto orçamentário-financeiro nos exercícios de vigência nem a estimativa do fluxo de recursos públicos por exercício. O P6 apresenta só a RCL de 2025 mantida constante até 2030 e um único ano de regime pleno. Não há projeção para os 30 anos com reajuste da contraprestação."
    dispositivo_legal: "art. 10, incisos II e IV, da Lei n.º 11.079/2004; art. 16, inciso I, da Lei Complementar n.º 101/2000"
    referencias_cruzadas: ["P6 p. 58-59 (Tabelas 17 e 18)"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Verificar se o processo administrativo contém documento específico; se não contiver, o vício passa a ser IRREGULAR."

  - id: E1-004
    documento: "EDITAL"
    dispositivo_editalicio: "Item 5.2 (PDF p. 15)"
    transcricao: "dotação orçamentária prevista na Lei de Diretrizes Orçamentárias e no Plano Plurianual do Município de Porto Velho: AÇÃO PROGRAMÁTICA [ • ]; ELEMENTO DE DESPESA [ • ]; FONTE [ • ]"
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "Dotação orçamentária em branco; dotação atribuída à LDO/PPA, e não à LOA; sem declaração do ordenador"
    comentario: "A dotação está toda em branco. O texto atribui a dotação à LDO e ao PPA, mas a lei exige compatibilidade com a LDO e previsão na LOA, com declaração do ordenador de despesa. Essa declaração não é mencionada. O próprio P7 trata a dotação como 'elemento essencial à publicação do Edital' ainda pendente."
    dispositivo_legal: "art. 10, inciso III, da Lei n.º 11.079/2004; art. 167, incisos I e II, da Constituição Federal; art. 16, inciso II, da Lei Complementar n.º 101/2000"
    referencias_cruzadas: ["P7 X.2.2 (p. 66) e XII.4 (p. 72)"]
    flag_tecnico: false
    flag_reserva: false
    nota: ""

  - id: E1-005
    documento: "EDITAL"
    dispositivo_editalicio: "Item 5.2 (PDF p. 15)"
    transcricao: "prevista na Lei de Diretrizes Orçamentárias e no Plano Plurianual"
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "Previsão do objeto no PPA em vigor não comprovada"
    comentario: "O Edital afirma a previsão no PPA, mas não indica programa ou ação, e o P7 (p. 66 e p. 72) registra a 'formalização da dotação orçamentária na LDO e no PPA' como providência pendente. Não há comprovação documental no pacote."
    dispositivo_legal: "art. 10, inciso V, da Lei n.º 11.079/2004; art. 165, § 1.º, e art. 167, § 1.º, da Constituição Federal"
    referencias_cruzadas: ["P7 X.2.2 (p. 66)", "P7 XII.4 (p. 72)"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Necessário obter a lei do PPA vigente (2026-2029) e a LDO 2027 do Município."

  - id: E1-006
    documento: "EDITAL"
    dispositivo_editalicio: "Preâmbulo, 5.º parágrafo (PDF p. 5)"
    transcricao: "Foi realizada também Consulta Pública referente às minutas do Edital e do Contrato, em observância ao estabelecido pelo art. 10, inciso VI ... teve início em, [datas a inserir]"
    tipo_achado: DEPENDE_DE_FATO
    categoria: contradicao
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Consulta pública afirmada como realizada, sem datas, e tratada como pendente no P7"
    comentario: "O Edital declara, no passado, que a consulta pública foi realizada, mas deixa as datas em branco. O P7, de mesma época, diz que as datas 'devem ser definidas pelo Município'. A lei exige prazo mínimo de 30 dias para sugestões, término pelo menos 7 dias antes da publicação do edital e publicação na imprensa oficial, em jornais de grande circulação e por meio eletrônico, com justificativa, objeto, prazo e valor estimado."
    dispositivo_legal: "art. 10, inciso VI, da Lei n.º 11.079/2004; art. 11, inciso IV, da Lei n.º 11.445/2007"
    referencias_cruzadas: ["P7 X.2.1 (p. 66)", "P7 XII.4 (p. 72)"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Necessário obter os avisos da consulta pública e o relatório de contribuições."

  - id: E1-007
    documento: "EDITAL"
    dispositivo_editalicio: "Preâmbulo, 4.º parágrafo (PDF p. 5)"
    transcricao: "A Prefeitura de Porto Velho, em atendimento ao disposto no artigo 173 da Lei Federal nº 14.133/2021, realizou Audiência Pública em, [data a inserir]"
    tipo_achado: IRREGULAR
    categoria: erro_material
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Audiência pública fundada em dispositivo errado (art. 173 da Lei 14.133) e sem data"
    comentario: "O art. 173 da Lei 14.133/2021 trata da capacitação promovida pelos tribunais de contas, não de audiência pública. A audiência pública está no art. 21 da mesma lei e, em saneamento, é condição de validade do contrato (art. 11, IV, da Lei 11.445/2007). A data está em branco."
    dispositivo_legal: "art. 21 da Lei n.º 14.133/2021; art. 11, inciso IV, da Lei n.º 11.445/2007"
    referencias_cruzadas: ["P7 X.2.1 (p. 66): cita 'art. 14, inciso VI, da Lei 14.133' como fundamento, outro erro de remissão"]
    flag_tecnico: false
    flag_reserva: false
    nota: ""

  - id: E1-008
    documento: "EDITAL"
    dispositivo_editalicio: "Item 3.1, viii (PDF p. 13); ausência de item sobre licença prévia/diretrizes"
    transcricao: "Projeto, construção, licenciamento e operação da Central de Tratamento de Resíduos (CTR Porto Velho)"
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    tema_sugerido: LICENCIAMENTO_AMBIENTAL
    descricao_breve: "Licença prévia ou diretrizes para o licenciamento da CTR/aterro não indicadas no Edital"
    comentario: "O objeto exige implantar CTR com aterro de rejeitos, UVR, CDR e autoclave. O Edital não informa se há licença prévia ou diretrizes expedidas para o licenciamento 'na forma do regulamento'. Não está claro se o Anexo III (Diretrizes Ambientais), elaborado pela consultoria, equivale a diretrizes expedidas pelo órgão licenciador."
    dispositivo_legal: "art. 10, inciso VII, da Lei n.º 11.079/2004; art. 8.º, inciso I, da Resolução CONAMA n.º 237/1997"
    referencias_cruzadas: ["ANEXO-B cl. 10.12 (p. 31): todas as licenças, inclusive LP, a cargo da concessionária", "ANEXO-III Diretrizes Ambientais"]
    flag_tecnico: true
    flag_reserva: false
    nota: "Depende de saber se houve manifestação do órgão ambiental (SEDAM/RO ou órgão municipal) sobre diretrizes e se a área da CTR está definida (ver E1-048)."

  - id: E1-009
    documento: "EDITAL"
    dispositivo_editalicio: "Item 6.3, iv (PDF p. 16)"
    transcricao: "a designação da respectiva área e a obtenção e transferência das Licenças Prévias cuja responsabilidade tenha sido expressamente atribuída ao PODER CONCEDENTE nos ANEXOS"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: LICENCIAMENTO_AMBIENTAL
    descricao_breve: "Responsabilidade pela Licença Prévia é contraditória entre Edital e Contrato"
    comentario: "O Edital condiciona a Ordem de Início à obtenção e transferência de LPs atribuídas ao Poder Concedente. O Contrato atribui à concessionária, às suas expensas, todas as licenças, 'incluindo a Licença Prévia' (cl. 10.12). Ao mesmo tempo, a cl. 8.1, II, do Contrato menciona estudos 'para obtenção de Licença Prévia pelo Poder Concedente'. Não há anexo que indique quais LPs cabem ao Poder Concedente."
    dispositivo_legal: "art. 5.º da Lei n.º 14.133/2021 (vinculação ao edital e segurança jurídica); art. 10, inciso VII, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-B cl. 8.1, II (p. 17)", "ANEXO-B cl. 10.12 (p. 31)", "ANEXO-B cl. 6.2, IV (p. 16): não menciona LP"]
