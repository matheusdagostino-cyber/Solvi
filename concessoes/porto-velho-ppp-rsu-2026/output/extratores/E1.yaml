  - id: E1-108
    documento: "EDITAL"
    dispositivo_editalicio: "Item 13.18.1 (PDF p. 35)"
    transcricao: "é permitido que o cálculo dos indicadores seja realizado a partir do somatório dos valores constantes das contas contábeis de cada consorciado, mas não é permitido o somatório de índices"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: HABILITACAO
    descricao_breve: "Regra de cálculo de 'indicadores' para consórcio sem índices definidos no Edital"
    comentario: "O Edital não exige índices contábeis (liquidez, endividamento, solvência), mas o 13.18.1 regula seu cálculo para consórcios. A regra pode servir de base para exigências não previstas, ou indica índices suprimidos de versão anterior."
    dispositivo_legal: "art. 69, caput, inciso I, e § 5.º, da Lei n.º 14.133/2021"
    referencias_cruzadas: []
    flag_tecnico: false
    flag_reserva: false
    nota: "A ausência de índices, em si, não é irregular (art. 69, I, 'índices previstos no edital'). Sem índices, o parâmetro de endividamento ≤ 1,00 do checklist não se aplica."

  - id: E1-109
    documento: "EDITAL"
    dispositivo_editalicio: "Item 13.10 (PDF p. 33) x item 13.13 (p. 34) e 8.2, g (p. 18)"
