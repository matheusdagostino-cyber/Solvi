    comentario: "Pela definição, o VE seria 360 x R$ 6.505.697,97 = R$ 2.342.051.269,20, R$ 30.123.641,67 acima do valor informado. O VE informado reproduz o fluxo do P6: 3 meses sem pagamento e Parcela A em 60% e 80% nos anos 1 e 2. O recálculo dá R$ 2.311.927.637,19, com resíduo de R$ 9,66 porque a Parcela A do ano 1 no P6 (R$ 1.060.655,71) difere de 60% da plena (R$ 1.060.654,71). O Contrato, por sua vez, diz que a contraprestação é devida desde o 1.º mês e reduz a Parcela B no 1.º ano, premissas diferentes do P6. O VE é base da garantia de proposta, do capital mínimo, do capital da SPE e das multas."
    dispositivo_legal: "art. 5.º da Lei n.º 14.133/2021; art. 10, inciso IV, da Lei n.º 11.079/2004; art. 18, inciso IX, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004"
