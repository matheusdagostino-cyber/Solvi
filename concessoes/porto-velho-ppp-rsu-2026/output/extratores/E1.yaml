    comentario: "O item 3.1 diz que o EVTEA integra o Contrato e define o escopo integral dos investimentos. Mas o EVTEA não está nas listas de anexos (2.8, 2.9 e cl. 2.1 do Contrato), não é definido no item 1.1 e fica subordinado aos anexos em caso de divergência (2.11.2). O item 2.11.1 enumera três estudos (técnico, econômico-financeiro, jurídico-institucional), e o Contrato fala em técnico, econômico-financeiro, jurídico e socioambiental. O 'Caderno 5 – Avaliação Econômica da Indenização', previsto no P0, não está no pacote."
    dispositivo_legal: "art. 18, inciso IV, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021"
    referencias_cruzadas: ["ANEXO-B considerando iv (p. 5)", "ANEXO-B cl. 5.1.1 e 7.1 (p. 14, 17)", "P0 (Caderno 5 - Indenização)"]
