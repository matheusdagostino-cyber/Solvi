    transcricao: "Multa de, no mínimo, 0,5% (meio por cento) e, no máximo, 30% (trinta por cento) do VALOR ESTIMADO DO CONTRATO, assim entendido o somatório das Contraprestações Mensais Máximas ao longo de todo o prazo da Concessão"
    tipo_achado: IRREGULAR
    categoria: risco_economico
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Multa pré-contratual calculada sobre o VE nominal de 30 anos (até R$ 693,6 mi)"
    comentario: "Os percentuais respeitam a faixa legal de 0,5% a 30% do 'valor do contrato licitado'. A base, porém, é a soma nominal de 30 anos de contraprestações, o que dá multas de R$ 11,56 mi a R$ 693,58 mi para condutas da fase licitatória. A garantia que as cobre é de só R$ 23,1 mi. A gradação depende de critérios abertos."
    dispositivo_legal: "art. 156, §§ 1.º e 3.º, da Lei n.º 14.133/2021"
    referencias_cruzadas: []
    flag_tecnico: false
    flag_reserva: false
    nota: "Contra-argumento: a lei autoriza expressamente a base 'valor do contrato licitado'."

