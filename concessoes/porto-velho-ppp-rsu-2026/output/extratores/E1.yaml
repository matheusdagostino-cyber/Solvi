    transcricao: "têm caráter igualmente vinculante ... não poderá, em hipótese alguma, alegar desconhecimento a respeito das condições de execução do CONTRATO, especialmente para pleitear modificações nos preços"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Estudos 'vinculantes' x responsabilidade integral do licitante pelos dados e renúncia a pleitos"
    comentario: "O item 2.11 dá caráter vinculante aos estudos e informações fornecidos pelo Poder Concedente. Os itens 9.9.1 e 7.5 e a Declaração 7 do Anexo C impõem ao licitante responsabilidade integral pela exatidão dos dados e renúncia a qualquer pleito por 'insuficiência de dados ou informações'. A alocação do risco de erro nos estudos públicos fica indefinida."
    dispositivo_legal: "art. 5.º da Lei n.º 14.133/2021; art. 5.º, inciso III, da Lei n.º 11.079/2004 (repartição objetiva de riscos)"
