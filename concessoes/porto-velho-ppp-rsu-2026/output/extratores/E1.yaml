    comentario: "O Edital tem os anexos A-D, e o Contrato (Anexo B) tem os anexos I-VII. O Anexo I do Contrato é o próprio Edital, o que torna a remissão circular. Caderno de Encargos e Indicadores (A e D) só integram o Contrato por meio do Anexo I. Os anexos III-VII só integram o Edital dentro de 'Contrato e anexos'. O texto alterna numerações, como 'ANEXO V – Matriz de riscos' e 'Anexo de Diretrizes Ambientais'."
    dispositivo_legal: "art. 18, inciso XIV, da Lei n.º 8.987/1995, c/c art. 11 da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021"
