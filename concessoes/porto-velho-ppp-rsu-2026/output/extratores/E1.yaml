  - id: E1-115
    documento: "EDITAL"
    dispositivo_editalicio: "Def. 1.1.2 (PDF p. 6) x def. 1.1.28 (p. 8)"
    transcricao: "responsável pela fiscalização e regulação do Contrato e pela análise e mensuração dos Indicadores de Qualidade e Desempenho (IQD) / a serem apurados pelo Verificador Independente e homologados pela Agência Reguladora"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: REGULACAO_FISCALIZACAO
