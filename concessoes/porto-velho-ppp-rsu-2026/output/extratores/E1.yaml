    tema_sugerido: HABILITACAO
    descricao_breve: "Exige certidão negativa de recuperação judicial, embora admita empresas em recuperação"
    comentario: "A lei exige só certidão negativa de falência. O 13.10 pede também certidão negativa de recuperação judicial, enquanto o 13.13 e o 8.2, g, admitem empresas em recuperação com plano aprovado ou homologado. Uma empresa em recuperação não consegue apresentar a certidão negativa exigida."
    dispositivo_legal: "art. 69, inciso II, da Lei n.º 14.133/2021"
    referencias_cruzadas: []
