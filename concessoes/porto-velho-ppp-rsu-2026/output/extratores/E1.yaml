    flag_tecnico: false
    flag_reserva: false
    nota: "Contra-argumento provável: art. 14, I e II, da Lei 14.133 e a moralidade justificariam a vedação. Verificar se o grupo mantém ou manteve vínculo com PEZCO, PSP Hub, Masterpro ou Apparecido & Carvalho Pinto Advogados, pois a alínea m pode alcançá-lo."

