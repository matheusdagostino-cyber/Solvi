    categoria: ilegalidade
    tema_sugerido: HABILITACAO
    descricao_breve: "Exigência de 12 meses 'ininterruptos' contraria 'períodos sucessivos ou não'"
    comentario: "Para serviços contínuos, a lei admite prazo mínimo de experiência 'em períodos sucessivos ou não'. A exigência de execução 'contínua e ininterrupta' afasta a soma de períodos. Além disso, a regra se aplica a todas as atividades, inclusive obras, que não são serviço contínuo."
    dispositivo_legal: "art. 67, § 5.º, da Lei n.º 14.133/2021"
    referencias_cruzadas: []
    flag_tecnico: false
    flag_reserva: false
    nota: ""

  - id: E1-102
    documento: "EDITAL"
    dispositivo_editalicio: "Item 13.23.2 (PDF p. 37)"
    transcricao: "É permitido o somatório de até 02 (dois) atestados da LICITANTE ou das CONSORCIADAS para fins de comprovação do quantitativo mínimo"
    tipo_achado: IRREGULAR
    categoria: restricao_competitividade
    tema_sugerido: HABILITACAO
    descricao_breve: "Somatório limitado a 2 atestados, contra a orientação do TCE-RO relatada no P7"
    comentario: "O P7 (III.4.6) afirma que, 'em atenção à orientação do TCE-RO externada no curso do processo de anulação do certame anterior, o Edital admite expressamente o somatório de atestados, inclusive os relativos a contratos executados de forma concomitante'. O Edital limita a dois atestados, sem justificativa, e não menciona contratos concomitantes."
    dispositivo_legal: "art. 9.º, inciso I, alínea a, e art. 15, inciso III, da Lei n.º 14.133/2021; art. 37, inciso XXI, da Constituição Federal"
    referencias_cruzadas: ["P7 III.4.6 (p. 31)"]
    flag_tecnico: false
    flag_reserva: true
    nota: "A orientação do TCE-RO é citada como fato documental (P7 p. 31). Reserva / decisão comercial: o limite favorece quem tem poucos atestados de grande porte."

  - id: E1-103
    documento: "EDITAL"
    dispositivo_editalicio: "Item 13.23.2.1 (PDF p. 37)"
    transcricao: "o CONSORCIADO responsável pela apresentação dos atestados deverá possuir, no mínimo, 25% (vinte e cinco por cento) de participação no CONSÓRCIO"
    tipo_achado: IRREGULAR
    categoria: restricao_competitividade
    tema_sugerido: HABILITACAO
    descricao_breve: "Participação mínima de 25% para o consorciado que apresenta atestados"
    comentario: "A lei admite o somatório dos quantitativos de cada consorciado para a habilitação técnica, sem participação mínima. O Edital não justifica o piso de 25%, que impede o operador técnico de entrar com participação minoritária e afeta a estruturação de consórcios com investidores financeiros."
    dispositivo_legal: "art. 15, inciso III, da Lei n.º 14.133/2021; não localizei fundamento normativo específico para o piso"
    referencias_cruzadas: []
    flag_tecnico: false
    flag_reserva: true
    nota: "Reserva / decisão comercial: o efeito depende de o grupo pretender liderar o consórcio ou entrar como operador minoritário."

  - id: E1-104
    documento: "EDITAL"
    dispositivo_editalicio: "Item 13.25.2 (PDF p. 37)"
    transcricao: "será observada a proporção de participação da LICITANTE, CONSORCIADA ou CONTROLADORA dessas na entidade titular do atestado, aplicando-se essa proporção ao quantitativo total"
    tipo_achado: IRREGULAR
    categoria: restricao_competitividade
    tema_sugerido: HABILITACAO
    descricao_breve: "Atestado de empresa do grupo reduzido pela participação societária"
    comentario: "O item admite atestados de controladas e controladoras, mas reduz o quantitativo pela proporção societária. A controladora com 51% de uma controlada aproveitaria só 51% da experiência dela. A lei prevê proporcionalidade apenas para consórcio homogêneo sem identificação de atividades."
    dispositivo_legal: "art. 67, § 10, da Lei n.º 14.133/2021 (por contraste); não localizei fundamento normativo específico"
    referencias_cruzadas: []
    flag_tecnico: false
    flag_reserva: false
    nota: "O efeito para o grupo depende da estrutura societária das empresas titulares dos atestados."

  - id: E1-105
    documento: "EDITAL"
    dispositivo_editalicio: "Item 13.30 (PDF p. 39)"
    transcricao: "Alternativamente à comprovação aludida no item 13.23, a LICITANTE individual ou ao menos uma das CONSORCIADAS poderão demonstrar ... que possuem em seu quadro permanente profissional(is) com expertise"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: HABILITACAO
    descricao_breve: "Capacidade técnico-profissional substitui integralmente a técnico-operacional"
    comentario: "O 13.30 permite trocar toda a comprovação técnico-operacional (13.23) por atestados de profissionais, sem quantitativos, sem registro em conselho e com remissão errada às 'alíneas (a) a (h) do item 13.27'. Uma empresa sem experiência operacional se habilita indicando um profissional, inclusive contratado só em caso de êxito (alínea d). Isso esvazia as exigências de 12 meses, somatório e 25% dos itens 13.23.1-13.23.2.1."
    dispositivo_legal: "art. 67, incisos I e II, e §§ 1.º e 3.º, da Lei n.º 14.133/2021; art. 5.º da Lei n.º 14.133/2021"
    referencias_cruzadas: ["EDITAL 20.1.9-20.1.10 (p. 49)"]
    flag_tecnico: false
    flag_reserva: true
    nota: "Reserva / decisão comercial: a alternativa amplia a competição. Impugná-la pode eliminar concorrentes, mas também expõe o grupo ao argumento de restrição."

  - id: E1-106
    documento: "EDITAL"
    dispositivo_editalicio: "Itens 13.25 e 13.26 (PDF p. 37-38), 13.27 (p. 38)"
    transcricao: "Serão admitidos ... atestados emitidos em nome de CONTROLADA, CONTROLADORA ou de entidade(s) sujeita(s) ao mesmo CONTROLE comum"
    tipo_achado: CONFORME
    categoria: omissao
    tema_sugerido: HABILITACAO
    descricao_breve: "Atestados de grupo econômico, consórcio e acervo transferido"
    comentario: "O Edital admite atestados de empresas do grupo, critérios para atestados de consórcio homogêneo ou heterogêneo, transferência de acervo por reorganização societária e complementação por outros documentos (13.27.2). Ressalvas nos pontos E1-028 e E1-104."
    dispositivo_legal: "art. 67, §§ 10 e 11, da Lei n.º 14.133/2021"
    referencias_cruzadas: []
    flag_tecnico: false
    flag_reserva: false
    nota: ""

  # ===================== QUALIFICAÇÃO ECONÔMICO-FINANCEIRA E FISCAL =====================
  - id: E1-107
    documento: "EDITAL"
    dispositivo_editalicio: "Itens 13.17.2 e 13.18 (PDF p. 35)"
    transcricao: "capital social mínimo correspondente a R$ 23.119.276,28 ... equivalente a 1% do valor estimado do contrato ... acréscimo de 10% (dez por cento)"
    tipo_achado: CONFORME
    categoria: omissao
    tema_sugerido: HABILITACAO
    descricao_breve: "Capital mínimo de 1% do VE e acréscimo de 10% para consórcio"
    comentario: "O capital mínimo de 1% está bem abaixo do teto legal de 10%, e o acréscimo de 10% para consórcios está dentro da faixa de 10% a 30%. O Edital omite a dispensa do acréscimo para consórcios formados só por ME/EPP (§ 2.º), irrelevante na prática neste certame."
    dispositivo_legal: "art. 69, § 4.º, e art. 15, §§ 1.º e 2.º, da Lei n.º 14.133/2021"
    referencias_cruzadas: []
