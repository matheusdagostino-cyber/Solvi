    comentario: "A def. 1.1.2 atribui à ARDPV a 'análise e mensuração' dos IQD. A 1.1.28 atribui a apuração ao Verificador Independente e a homologação à ARDPV. A divisão de competências entre regulador e VI, que define a contraprestação efetiva, fica ambígua no próprio Edital."
    dispositivo_legal: "arts. 21, 22 e 23 da Lei n.º 11.445/2007; art. 5.º da Lei n.º 14.133/2021"
