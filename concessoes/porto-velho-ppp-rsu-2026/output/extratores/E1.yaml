    comentario: "O Edital cita o artigo correto (art. 28 da Lei 11.079), mas não apresenta memória de cálculo. O P6 usa a RCL de 2025 (R$ 2,45 bi), mantida constante, e o resultado aritmético é 3,19%. O art. 28 exige somar todas as PPPs do ente e projetar os 10 anos seguintes contra a RCL projetada. O Edital também não menciona o envio prévio de informações ao Senado Federal e à STN (§ 1.º)."
    dispositivo_legal: "art. 28, caput e § 1.º, da Lei n.º 11.079/2004"
