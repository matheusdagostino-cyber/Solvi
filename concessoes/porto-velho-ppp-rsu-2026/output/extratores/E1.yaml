    transcricao: "l) Que tenham elaborado os estudos que serviram de base para a estruturação da presente PPP; ou m) Que possuam, com a pessoa jurídica a que se refere a alínea (l), acima, vínculo de natureza técnica, comercial, econômica, financeira ou trabalhista"
    tipo_achado: IRREGULAR
    categoria: ilegalidade
    tema_sugerido: HABILITACAO
    descricao_breve: "Vedação aos autores dos estudos contraria art. 3.º da Lei 11.079 c/c art. 31 da Lei 9.074"
    comentario: "O art. 3.º da Lei 11.079 manda aplicar às concessões administrativas o art. 31 da Lei 9.074/1995. Esse dispositivo admite que os autores ou responsáveis economicamente pelos projetos participem da licitação. O Edital lista a Lei 9.074 em sua base normativa (2.1, e), e o P7 invoca o mesmo art. 31 para justificar o ressarcimento. A alínea m amplia a vedação a qualquer vínculo 'técnico, comercial, econômico, financeiro ou trabalhista' com os autores, em formulação aberta."
