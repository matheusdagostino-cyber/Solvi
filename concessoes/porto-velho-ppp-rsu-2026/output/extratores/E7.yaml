  - id: E7-051
    documento: "P7"
    dispositivo_editalicio: "P7, III.3 (PDF p. 28-29); ANEXO-B 6.1, 6.2 e 6.4"
    transcricao: "evitando-se a fluência do prazo contratual em momento no qual a Concessionária não tenha as condições objetivas para iniciar a operação"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Prazo contado da assinatura, mas eficácia dependente da Ordem de Início sem prazo máximo"
    comentario: "O P7 afirma que o desenho evita a fluência do prazo antes das condições de início, mas a Cl. 6.1 conta os 30 anos da assinatura e a Ordem de Início (6.2) depende de seis condições, quase todas a cargo do Poder Concedente (Agente de Garantia, depósito de 2 CME, áreas, manuais), sem prazo máximo. A única saída prevista é a rescisão consensual (6.4). Atraso na Ordem de Início reduz o período de amortização."
    dispositivo_legal: "art. 5.º, inciso I, da Lei n.º 11.079/2004 (prazo compatível com a amortização dos investimentos)"
    referencias_cruzadas: ["ANEXO-B 6.1-6.4 (p. 14-15)"]
    flag_tecnico: false
    flag_reserva: false

  - id: E7-052
    documento: "P7"
    dispositivo_editalicio: "P7, III.3 (PDF p. 28)"
    transcricao: "A definição do prazo de 30 anos é tecnicamente justificada no Produto 6"
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "Justificativa do prazo de 30 anos remetida ao P6 sem localização da análise"
    comentario: "O P0 previa 'determinação do prazo de concessão mais adequado' no Caderno 6. Na busca pontual no P6 não se localizou estudo comparativo de prazos (apenas o tenor da dívida de 25 anos e menção aos 30 anos). O CAPEX tem ciclos quinquenais de frota, o que relativiza o argumento de amortização."
    dispositivo_legal: "art. 5.º, inciso I, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["P0 p. 16", "P6 p. 15 (tenor 25 anos) e p. 35-36"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Confirmar com o extrator do P6."

  - id: E7-053
    documento: "P7"
    dispositivo_editalicio: "P7, III.7 (PDF p. 34); ANEXO-B 18.2 e 18.3-18.3.3 (p. 42-43)"
    transcricao: "O silêncio do Poder Concedente é interpretado como autorização tácita, em consonância com a moldura de eficiência administrativa adotada."
    tipo_achado: IRREGULAR
    categoria: ilegalidade
    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "Receitas acessórias em rol aberto, com anuência tácita por silêncio e objeção restrita"
    comentario: "As fontes de receitas alternativas devem constar expressamente do contrato de saneamento. O rol da Cl. 18.2 já é amplo (inclui 'energia térmica por incineração', Classe I, efluentes industriais) e a Cl. 18.3 admite qualquer outra atividade por comunicação, com objeção limitada a impacto comprovado no serviço e silêncio de 20 dias úteis valendo como autorização. Não se localizou base legal para anuência tácita do Poder Concedente nesse caso."
    dispositivo_legal: "art. 10-A, inciso II, da Lei n.º 11.445/2007; art. 9.º, § 1.º, da Lei n.º 12.305/2010 (recuperação energética condicionada); não localizei fundamento normativo específico que autorize anuência tácita"
    referencias_cruzadas: ["ANEXO-B 18.2, 18.3.1-18.3.3, 18.7", "ANEXO-B 10.13.2.1 (silêncio da ARDPV)"]
    flag_tecnico: false
    flag_reserva: true
    nota: "Reserva: oportunidades de receita acessória não evidentes com baixo compartilhamento (5%)."

  - id: E7-054
    documento: "P7"
    dispositivo_editalicio: "P7, XI.3.4 (PDF p. 69); ANEXO-B 18.10"
    transcricao: "a usina, seus equipamentos e sistemas não integram os Bens Reversíveis"
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "Usina de biogás do aterro (custeado pela CP) explorada como receita acessória não reversível"
    comentario: "O biogás é gerado no aterro implantado e amortizado com recursos da CP; a usina fica fora dos bens reversíveis e o Município só tem opção de compra. A receita entra na base de 5%. O P7 não examina se o desenho gera apropriação privada de valor de ativo público nem a coerência com o 'aproveitamento energético' citado como parte do objeto no P0."
    dispositivo_legal: "art. 10-A, incisos II e III, da Lei n.º 11.445/2007; art. 3.º, inciso VII, da LC Municipal n.º 592/2015 (apropriação recíproca de ganhos, conforme P7, p. 16)"
    referencias_cruzadas: ["ANEXO-B 18.10-18.10.10", "P0 p. 3 (objeto inclui aproveitamento energético)"]
    flag_tecnico: true
    flag_reserva: true
    nota: "Reserva: receita acessória não evidente (biogás). [VALIDAÇÃO TÉCNICA] sobre potencial de geração."

  - id: E7-055
    documento: "P7"
    dispositivo_editalicio: "P7, IV.4 (PDF p. 38); ANEXO-B 20.9 e 10.2.8; ANEXO-V RJ-03"
    transcricao: "As atualizações regulatórias destinadas exclusivamente a assegurar a prestação de serviço adequado [...] não configuram álea extraordinária e não ensejam reequilíbrio"
    tipo_achado: IRREGULAR
    categoria: risco_economico
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Exclusão de reequilíbrio para alterações regulatórias ('serviço adequado') e cláusula de atualidade dinâmica"
    comentario: "Normas regulatórias supervenientes que aumentem encargos configuram fato do príncipe e alteração unilateral, que exigem recomposição. O P7 exclui o reequilíbrio quando a atualização visar o 'serviço adequado', critério aberto, e combina isso com a obrigação dinâmica de atualidade tecnológica (10.2.8). Apoia-se no art. 6.º da Lei 8.987, que não está entre os dispositivos aplicáveis à concessão administrativa pelo art. 3.º da Lei 11.079. Isso contrasta com a alocação de RJ-03 ao Poder Concedente (p. 19 e 37)."
    dispositivo_legal: "art. 5.º, inciso III, e art. 3.º da Lei n.º 11.079/2004; arts. 124, inciso II, alínea 'd', e 130 da Lei n.º 14.133/2021; art. 10-A, inciso IV, da Lei n.º 11.445/2007"
    referencias_cruzadas: ["P7 II.7 (p. 19) e IV.4 (p. 37)", "ANEXO-B 20.9", "ANEXO-V RJ-03"]
    flag_tecnico: false
    flag_reserva: false

  - id: E7-056
    documento: "P7"
    dispositivo_editalicio: "P7, II.14 (PDF p. 22-23); ANEXO-B 20.10"
    transcricao: "propõe um regime básico de transição sem antecipar cenários ainda em consolidação normativa nem criar direito a reequilíbrio automático"
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "Reforma tributária: regime contratual de transição sem confronto com as regras de reequilíbrio da LC 214/2025"
    comentario: "O P7 remete os impactos do IBS/CBS à fase de execução e ao reequilíbrio mediante prova de impacto relevante, sem examinar se a LC 214/2025 traz regras próprias de reequilíbrio de contratos administrativos que se sobreponham ou conflitem com a Cl. 20.10 e com a exigência de 'impacto relevante'. Para 30 anos com início da transição em 2026, o ponto afeta a precificação (EF-05 é crítico)."
    dispositivo_legal: "EC n.º 132/2023; LC n.º 214/2025 (disposições sobre reequilíbrio de contratos administrativos); art. 124, inciso II, alínea 'd', da Lei n.º 14.133/2021"
    referencias_cruzadas: ["ANEXO-B 20.10", "ANEXO-V EF-05"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Verificar na Fase 2 (Jus IA — legislação) o teor da LC 214/2025 sobre reequilíbrio."

  - id: E7-057
    documento: "P7"
    dispositivo_editalicio: "P7, VII.6 (PDF p. 51) x III.6.2 (p. 32) e II.5 (p. 18)"
    transcricao: "a apuração do IQD observa ciclo anual, iniciando-se a partir do início da execução contratual"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "Início de incidência do IQD: 'execução contratual' (p. 51) x 'Etapa de Operação Definitiva' (p. 18 e 32)"
    comentario: "O P7 atribui à mesma Cl. 15.4 dois termos iniciais distintos para a apuração do IQD. Em III.6.2 diz também que o teto de 10% de desconto é apenas 'parâmetro de referência' (15.5.1), o que torna indefinido o desconto máximo. Ambos afetam a previsibilidade da receita."
    dispositivo_legal: "art. 5.º, inciso VII, e art. 6.º, § 1.º, da Lei n.º 11.079/2004"
