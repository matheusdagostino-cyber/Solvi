    comentario: "O P7 é o único documento do pacote que descreve o que o TCE-RO teria apontado: (1) critério combinado técnica+preço; (2) ordem de fases; (3) proposta técnica pontuada subjetiva; (4) uso da Lei 8.666; além de duas 'orientações' (utilidades às expensas da concessionária, p. 27; somatório de atestados inclusive concomitantes, p. 31). Não transcreve dispositivos dos acórdãos nem lista as irregularidades julgadas, embora o P0 tenha pedido cópia integral do processo. Sem isso não se verifica a afirmação do Edital de que a PPP foi estruturada 'para sanar aquelas irregularidades'. O P7 menciona 'expectativa de manifestação prévia do Tribunal', sem registro de que tenha ocorrido."
    dispositivo_legal: "art. 71, inciso IX, e art. 75 da CF/1988 (controle externo — determinações vinculantes); Acórdãos APL-TC 00068/24 e APL-TC 00105/24, Processo 00421/2022 (fato documental: P7, p. 9, 11, 22)"
