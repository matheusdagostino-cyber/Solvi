    documento: "P7"
    dispositivo_editalicio: "P7, II.5 (PDF p. 17-18)"
    transcricao: "supre a necessidade institucional de uma instância reguladora dedicada e independente, separada do órgão gestor da política pública"
    tipo_achado: DEPENDE_DE_FATO
