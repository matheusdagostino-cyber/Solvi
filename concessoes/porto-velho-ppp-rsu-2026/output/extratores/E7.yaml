    comentario: "O P7 reconhece que a ARDPV, criada em 2025, pode não estar instalada e que o CGP/PVH exercerá a regulação. A Cl. 4.7.1 vai além: CGP/PVH 'ou a SEINFRA', isto é, o próprio Poder Concedente, sem prazo final para a transição. A Lei 11.445 exige que o titular defina entidade reguladora autárquica com independência decisória e autonomia, e a designação da entidade é condição de validade do contrato. O CGP/PVH também aprovou o MIP e os estudos, o que acumula funções."
