    tema_sugerido: OBJETO_ESCOPO
    descricao_breve: "Delimitação de quais RSS são públicos (remunerados pela CP) e quais são de geradores privados não feita"
    comentario: "O P7 inclui no objeto a coleta, o tratamento e a disposição de RSS e, ao mesmo tempo, registra que o gerador é responsável (LC 136/2001, art. 3.º). Não define quais geradores são abrangidos pela coleta pública. O Edital 3.1.2 obriga a Concessionária a receber RSS de geradores não abrangidos 'por monopólio' — sem dizer quem paga —, enquanto o P1 informa que há incinerador particular em uso."
    dispositivo_legal: "art. 3.º da LC Municipal n.º 136/2001; arts. 20, inciso I, e 27 da Lei n.º 12.305/2010"
    referencias_cruzadas: ["EDITAL 3.1.2", "P1 p. 88", "ANEXO-B 18.2 (RSS de grandes geradores como receita acessória)"]
    flag_tecnico: false
    flag_reserva: true
    nota: "Reserva: possível receita acessória de RSS privados com exclusividade de fato."

