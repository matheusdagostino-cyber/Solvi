  - id: E7-018
    documento: "P7"
    dispositivo_editalicio: "P7, Sumário (PDF p. 9), III.6.3 (p. 33), IV.4 (p. 37), V.1 e V.3 (p. 39-40); ANEXO-B 23.2 III (p. 53)"
    transcricao: "a utilização de numerário do Fundo de Participação dos Municípios (FPM) vinculadas como garantia dos pagamentos (Cláusula 23.2, III)"
    tipo_achado: IRREGULAR
    categoria: ilegalidade
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Vinculação de receita do FPM em garantia de PPP a parceiro privado"
    comentario: "O FPM é repartição de receita de impostos (art. 159, I, 'b', CF). O art. 167, IV, veda vincular receita de impostos a órgão, fundo ou despesa, e o § 4.º só permite vincular as receitas dos arts. 158 e 159 para garantia ou contragarantia à União e pagamento de débitos com ela. O art. 8.º, I, da Lei 11.079 admite vinculação de receitas 'observado o disposto no inciso IV do art. 167'. O P7 não enfrenta essa restrição; não examina alternativa sem a mesma limitação (ex.: receita da taxa de RSU, tributo vinculado — LC 878/2021)."
    dispositivo_legal: "art. 167, inciso IV e § 4.º, da CF/1988; art. 8.º, inciso I, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-B 23.2 III, 23.3, 23.5.1 (p. 53-54)", "ANEXO-VI p. 3 (l. 104-105), 5.4 (p. 6) e 7.7 (FPM)", "P6 p. 6 e VI.10"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Há controvérsia doutrinária sobre o alcance do art. 167, IV, em garantias de PPP; desenvolver as duas correntes na Fase 2 com busca jurisprudencial."

