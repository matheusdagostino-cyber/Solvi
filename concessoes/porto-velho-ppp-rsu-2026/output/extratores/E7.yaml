    comentario: "A Ordem de Início exige depósito de 2 CME, mas antes do início da operação não há CME apurada e, nos primeiros anos, a CME está em ramp-up (Parcela A 60/80/100%). O Contrato alterna '2 contraprestações mensais devidas' (23.2 II) e '2 CME' (23.4.3); o P6 estima ~R$ 13,0 mi, o que corresponde à CP plena. A indefinição afeta o impacto orçamentário inicial e o nível de proteção."
