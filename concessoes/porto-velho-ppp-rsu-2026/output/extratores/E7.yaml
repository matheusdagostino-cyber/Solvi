pontos:
  # ================================================================
  # BLOCO A — CONDIÇÕES PRÉVIAS (art. 10 da Lei 11.079/2004)
  # ================================================================
  - id: E7-001
    documento: "P7"
    dispositivo_editalicio: "P7, Cap. I.3 e II.4 (PDF p. 12 e 17); EDITAL, preâmbulo (PDF p. 2)"
    transcricao: "foram publicadas no Diário Oficial dos Municípios do Estado de Rondônia – DOM em [ • ] de 202[ • ]"
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Ato de autorização da autoridade competente para abrir a licitação da PPP não identificado"
    comentario: "O art. 10, I, condiciona a abertura da licitação à autorização da autoridade competente, fundamentada em estudo técnico. O P7 descreve apenas o Termo de Autorização do MIP (que autoriza a elaboração dos estudos, não a licitação). A publicação da justificativa no DOM aparece com placeholder no preâmbulo do Edital. Não há no pacote a deliberação do CGP/PVH que aprove os estudos e a modelagem nem o ato do Prefeito/Secretário que autorize o certame."
    dispositivo_legal: "art. 10, inciso I, alínea 'a', da Lei n.º 11.079/2004; arts. 22 a 27 da LC Municipal n.º 592/2015 (competência do CGP/PVH para aprovar os estudos, conforme P7, p. 17)"
    referencias_cruzadas: ["EDITAL preâmbulo (p. 2)", "P0 IV.2 (p. 29) — validação formal de cada produto pelo Comitê Estratégico", "E7-079"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Falta: ato de autorização da licitação e resolução do CGP/PVH aprovando o EVTEA e as minutas."

  - id: E7-002
    documento: "P7"
    dispositivo_editalicio: "P7, Cap. III.1.4 (PDF p. 25-26) e III.1.1-III.1.3 (p. 24-25)"
    transcricao: "A Concessão Administrativa é a modalidade adequada ao presente projeto por seis razões articuladas a seguir."
    tipo_achado: CONFORME
    categoria: omissao
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "Estudo de conveniência e oportunidade da opção pela PPP — existente (análise comparativa de 4 alternativas)"
    comentario: "O P7 compara contratação tradicional, concessão comum, patrocinada e administrativa e remete o VfM ao P6. Há, portanto, estudo que identifica as razões da opção pela PPP. A suficiência quantitativa do VfM é tratada em E7-005."
    dispositivo_legal: "art. 10, inciso I, alínea 'a', da Lei n.º 11.079/2004"
    referencias_cruzadas: ["P6 p. 6 e Tabela 16", "E7-005"]
    flag_tecnico: false
    flag_reserva: false

  - id: E7-003
    documento: "P7"
    dispositivo_editalicio: "P7, Cap. V.10 (PDF p. 44)"
    transcricao: "Esses requisitos devem ser atendidos pelo Município antes da publicação do Edital [...] Recomenda-se que a documentação de instrução processual do certame consolide essa estimativa."
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "Ausência de demonstração de que a despesa não afeta as metas fiscais da LDO e de sua compensação"
    comentario: "O art. 10, I, 'b', e § 1.º exigem demonstração, com premissas e metodologia, de que as despesas criadas não afetarão as metas de resultado fiscal do Anexo de Metas Fiscais, com compensação por aumento permanente de receita ou redução permanente de despesa. O P7 (2.ª versão, posterior ao Edital) reconhece que a estimativa ainda deve ser consolidada; o P6 apenas afirma que a extinção do Contrato 019/PGM/2024 'libera espaço fiscal'. Não há demonstração formal no pacote."
    dispositivo_legal: "art. 10, inciso I, alínea 'b', e § 1.º, da Lei n.º 11.079/2004; arts. 16, incisos I e II, e 17, §§ 1.º e 2.º, da LC n.º 101/2000; art. 18, inciso I, da LC Municipal n.º 592/2015 (conforme P7, p. 44)"
    referencias_cruzadas: ["P6 p. 59 (Tabela 18)", "ANEXO-B considerando vi (p. 6)", "E7-012"]
    flag_tecnico: false
    flag_reserva: false

  - id: E7-004
    documento: "P7"
    dispositivo_editalicio: "P7, Cap. V.10 (PDF p. 44) e III.5 (p. 31)"
    transcricao: "A modelagem dimensiona a contraprestação anual em 3,18% da RCL (P6), abaixo do limite"
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "Estimativa de impacto orçamentário-financeiro limitada a um único exercício"
    comentario: "O art. 10, II, exige estimativa do impacto orçamentário-financeiro em todos os exercícios em que o contrato vigorar. O P7 e o P6 apresentam apenas a relação CP em regime pleno / RCL de 2025 (mantida constante até 2030), sem série anual que considere ramp-up, reajuste por IPCA, Conta Garantia (2 CME) e eventual aporte. Também não há a estimativa do fluxo de recursos por exercício (art. 10, IV — ver E7-006)."
    dispositivo_legal: "art. 10, inciso II, da Lei n.º 11.079/2004; art. 16, inciso I, da LC n.º 101/2000"
    referencias_cruzadas: ["P6 p. 58-59", "EDITAL 5.1.1", "E7-006"]
    flag_tecnico: false
    flag_reserva: false

  - id: E7-005
    documento: "P7"
    dispositivo_editalicio: "P7, Sumário Executivo (PDF p. 8) e III.1.4, quinta razão (p. 26)"
    transcricao: "demonstrou superioridade econômica significativa do modelo de PPP frente ao modelo tradicional, com economia em favor do erário municipal"
    tipo_achado: DEPENDE_DE_FATO
    categoria: contradicao
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "Fundamentação da opção pela PPP no VfM sem números no P7; bases divergentes no P6"
    comentario: "O P7 apoia a quinta razão da escolha da modalidade no VfM do P6, sem indicar valores, taxa de desconto ou memória. O P6 apresenta no texto PPP R$ 524 mi x PSC R$ 647 mi e, na Tabela 16, PPP R$ 620 mi x PSC R$ 743 mi (com ajuste de neutralidade), ambos com economia de R$ 123 mi. A coerência das bases precisa ser verificada pelo extrator do P6."
    dispositivo_legal: "art. 10, inciso I, alínea 'a', da Lei n.º 11.079/2004; art. 3.º, inciso II, da LC Municipal n.º 592/2015 (vantagem econômica, conforme P7, p. 16)"
    referencias_cruzadas: ["P6 p. 6", "P6 Tabela 16 (p. 54-55)"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Validar com E4/E6 (modelagem). Não é necessária validação de engenharia."

  - id: E7-006
    documento: "P7"
    dispositivo_editalicio: "P7, II.6 (PDF p. 19) e III.1.4 (p. 26); EDITAL 5.3 (p. 15)"
    transcricao: "As fontes de custeio da Contraprestação, no plano do Município, podem incluir a receita de taxa específica de RSU, as dotações orçamentárias gerais e os recursos vinculados"
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Fontes de recursos da contraprestação e fluxo por exercício não identificados"
    comentario: "O art. 10, IV, exige estimativa do fluxo de recursos públicos suficientes para cumprir as obrigações em cada exercício. O P7 usa linguagem hipotética ('podem incluir') e o Edital 5.3 remete a dotações 'a serem incluídas nos orçamentos dos exercícios seguintes, recursos vinculados e outras receitas'. Não se identifica qual receita (taxa de RSU, FPM, recursos ordinários) custeia a CP, nem o volume anual disponível."
    dispositivo_legal: "art. 10, inciso IV, e art. 11, parágrafo único, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["EDITAL 5.3 (p. 15)", "ANEXO-B 6.2 III", "P6 p. 6 (FPM ~R$ 410,4 mi/ano)", "E7-020", "E7-024"]
    flag_tecnico: false
    flag_reserva: false

  - id: E7-007
    documento: "P7"
    dispositivo_editalicio: "P7, X.2.2 (PDF p. 66) e XI.2.1 (p. 66); EDITAL 5.2 (p. 15)"
    transcricao: "AÇÃO PROGRAMÁTICA [ • ]; ELEMENTO DE DESPESA [ • ]; FONTE [ • ]."
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Dotação orçamentária e inclusão no PPA em aberto (placeholders) — reconhecido pelo próprio P7 como pendência"
    comentario: "O P7 (11/09/2026) lista a definição da ação programática, do elemento de despesa e da fonte como 'ponto a validar antes da abertura da licitação'; o Edital (08/09/2026) mantém placeholders. Sem a previsão do objeto no PPA e a compatibilidade com LDO/LOA, não se cumprem as condições prévias. O P7 ainda situa o elemento de despesa na LDO e no PPA, quando ele é próprio da LOA."
    dispositivo_legal: "art. 10, incisos III e V, da Lei n.º 11.079/2004; art. 16, inciso II, da LC n.º 101/2000; art. 165, § 1.º, da CF/1988"
    referencias_cruzadas: ["EDITAL 5.2 (p. 15)", "P7 XII.4 (p. 72)"]
    flag_tecnico: false
    flag_reserva: false

