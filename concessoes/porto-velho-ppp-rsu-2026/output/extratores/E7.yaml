    comentario: "Pela Cl. 13.1.1, descrita no P7, a TRCF (1,5% da receita bruta) seria descontada 'na Conta Garantia'. A Cl. 23.4.5 e o P7 (V.4) afirmam que o saldo mínimo não pode ser usado para nenhuma outra finalidade. A dedução mensal reduz o saldo abaixo de 2 CME e mistura a garantia pública com o recolhimento de tributo devido pela Concessionária."
    dispositivo_legal: "art. 8.º da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021"
    referencias_cruzadas: ["ANEXO-B 13.1.1 e 23.4.5", "ANEXO-VI"]
    flag_tecnico: false
    flag_reserva: false

  - id: E7-026
