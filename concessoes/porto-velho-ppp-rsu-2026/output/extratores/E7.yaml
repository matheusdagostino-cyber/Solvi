    descricao_breve: "Independência da ARDPV afirmada sem exame de natureza jurídica, mandatos, autonomia financeira e funções acumuladas"
    comentario: "O P7 não transcreve nem analisa a LC 1.013/2025 quanto à natureza autárquica, mandato fixo e estabilidade dos dirigentes, autonomia orçamentária e financeira e transparência. A denominação 'Agência Reguladora dos Serviços Públicos Delegados e de Desenvolvimento' sugere acumulação de funções de fomento com funções regulatórias, o que exige exame à luz da independência decisória."
