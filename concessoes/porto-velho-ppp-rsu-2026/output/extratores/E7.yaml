    transcricao: "tendo base de cálculo, contribuinte e alíquota regularmente definidos por lei complementar"
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
    tema_sugerido: REGULACAO_FISCALIZACAO
