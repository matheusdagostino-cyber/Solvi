    descricao_breve: "Verificação do limite de 5% da RCL feita só para um ano, sem projeção decenal"
    comentario: "O art. 28 considera tanto o ano anterior quanto as despesas anuais dos contratos vigentes nos 10 anos subsequentes em relação à RCL projetada. O P7 adota um percentual único (3,18%) e o P6 mantém a RCL de 2025 (R$ 2,45 bi) constante até 2030, sem projeção para 10 anos e sem efeito do reajuste da CP. O P7 descreve o art. 28 como 'limite máximo/vedação', sem examinar a consequência legal da extrapolação (vedação de garantia e transferências voluntárias da União), relevante porque o próprio P7 indica BNDES/Caixa como financiadores."
    dispositivo_legal: "art. 28, caput, da Lei n.º 11.079/2004"
