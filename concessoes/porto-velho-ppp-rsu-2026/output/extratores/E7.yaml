    descricao_breve: "Garantia de execução de 10% do valor anual dentro do limite legal"
    comentario: "O percentual está dentro do limite de 10% (art. 98 da Lei 14.133, com justificativa de complexidade, e art. 5.º, VIII, da Lei 11.079). O P7 apresenta justificativa sucinta ligada à magnitude e ao risco."
