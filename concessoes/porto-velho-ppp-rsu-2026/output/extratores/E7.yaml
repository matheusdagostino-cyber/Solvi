  - id: E7-043
    documento: "P7"
    dispositivo_editalicio: "P7, II.8 e III.2.4 (PDF p. 20 e 28) x III.2 (p. 26) e XII.1/Encerramento (p. 71-72); ANEXO-B considerando i, 1.3.49 e 4.1"
    transcricao: "A delimitação do objeto ao manejo de RSU, com exclusão da limpeza urbana, é, portanto, integral."
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: OBJETO_ESCOPO
    descricao_breve: "Exclusão da limpeza urbana afirmada no P7, mas Contrato (4.1, 1.3.49, considerando i) e P6 incluem 'limpeza urbana'/varrição"
    comentario: "O P7 afirma exclusão integral da limpeza pública. A Cl. 4.1 do Contrato inclui 'limpeza urbana' no objeto (a transcrição feita pelo P7 em III.2 omite essa expressão), a definição de Serviços (1.3.49) fala em 'limpeza urbana e manejo' e o próprio P7 encerra como 'Concessão Administrativa para limpeza urbana e manejo'. O P6 (p. 11-12) afirma que 'a varrição é integralmente remunerada pela Contraprestação Pública'. Se a CP inclui custo de varrição fora do escopo, há sobrepreço; se o objeto inclui limpeza urbana, a premissa do P7 cai."
    dispositivo_legal: "art. 3.º, inciso I, alínea 'c', e art. 7.º da Lei n.º 11.445/2007; art. 5.º da Lei n.º 14.133/2021; art. 2.º, § 2.º, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-B p. 5, 10 e 12 (cons. i, 1.3.49, 4.1)", "P6 p. 11-12 (II.2)", "P0 p. 14 (varrição no plano de negócios)"]
    flag_tecnico: true
    flag_reserva: true
    nota: "Reserva: se a CP precifica varrição não exigida pelo Caderno de Encargos, há erro que beneficia a concessionária. [VALIDAÇÃO TÉCNICA]/E4: verificar se o OPEX do P6 inclui varrição."

  - id: E7-044
    documento: "P7"
    dispositivo_editalicio: "P7, III.2.4 (PDF p. 28)"
    transcricao: "que veda a concessão das atividades de limpeza pública [...] as quais devem ser executadas por servidores públicos municipais"
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    tema_sugerido: OBJETO_ESCOPO
    descricao_breve: "Suposta vedação legal à concessão da limpeza pública sem indicação da fonte normativa"
    comentario: "O P7 afirma existir vedação à concessão da limpeza pública e dever de execução por servidores, sem citar a norma. A legislação federal não veda (o art. 2.º da Lei 9.074/1995 menciona limpeza urbana entre os serviços concedíveis). Se a vedação vier de norma municipal, deve ser identificada; se não existir, a premissa que justifica o recorte do objeto não tem base."
    dispositivo_legal: "não localizei fundamento normativo específico para a vedação afirmada; art. 2.º da Lei n.º 9.074/1995"
    referencias_cruzadas: ["E7-043"]
    flag_tecnico: false
    flag_reserva: false

  - id: E7-045
    documento: "P7"
    dispositivo_editalicio: "P7, II.4 (PDF p. 17) x III.1.4 (p. 26)"
    transcricao: "na qual o Poder Concedente é a usuária direta do serviço público de manejo de resíduos sólidos"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: OBJETO_ESCOPO
    descricao_breve: "Enquadramento como concessão administrativa: Município 'usuário direto' (p. 17) x 'usuário indireto' (p. 26)"
    comentario: "Na p. 17 o P7 afirma que o Poder Concedente é usuário direto; na p. 26, que o usuário direto é a coletividade e o Município é usuário indireto. A qualificação sustenta o enquadramento no art. 2.º, § 2.º, e deve ser unívoca, sobretudo porque a coleta domiciliar é fruída individualmente pelos munícipes (o que se relaciona com a existência de taxa de RSU)."
    dispositivo_legal: "art. 2.º, § 2.º, da Lei n.º 11.079/2004; art. 7.º, § 2.º, da LC Municipal n.º 592/2015"
    referencias_cruzadas: ["E7-024"]
    flag_tecnico: false
    flag_reserva: false

  - id: E7-046
    documento: "P7"
    dispositivo_editalicio: "P7, III.2 e III.2.1-III.2.3 (PDF p. 26-28) — ausência de exame do parcelamento"
    transcricao: "O objeto inclui, igualmente, o projeto, a construção, o licenciamento e a operação da Central de Tratamento de Resíduos"
    tipo_achado: IRREGULAR
    categoria: restricao_competitividade
    tema_sugerido: OBJETO_ESCOPO
    descricao_breve: "Lote único (coleta + logística fluvial + remediação GAC + CTR/aterro + RSS) sem justificativa de não parcelamento"
    comentario: "O P7 descreve o objeto agregado, mas não examina a viabilidade técnica e econômica do parcelamento (ex.: coleta/transporte x tratamento/destinação x remediação de passivos x RSS) nem os efeitos sobre a competição. A Lei 14.133, aplicável subsidiariamente às PPPs, exige considerar o parcelamento e justificar a opção."
    dispositivo_legal: "art. 18, § 1.º, inciso VIII, art. 40, inciso V, alínea 'b', e art. 47, inciso II e § 1.º, da Lei n.º 14.133/2021, c/c art. 186 da mesma Lei"
    referencias_cruzadas: ["EDITAL 3.1", "EDITAL 13.23 (atestados em todas as parcelas)"]
    flag_tecnico: false
    flag_reserva: true
    nota: "Reserva: objeto integrado favorece grupo de grande porte com atuação em coleta, aterro e RSS; decisão estratégica do advogado."

  - id: E7-047
    documento: "P7"
    dispositivo_editalicio: "P7, XI.3.3 (PDF p. 68-69) x ANEXO-B 10.13.1 (p. 31)"
    transcricao: "A obrigação pode ser cumprida por qualquer forma jurídica lícita — implantação própria, aquisição, arrendamento ou contratação de terceiro"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: OBJETO_ESCOPO
    descricao_breve: "Aterro próprio da Concessionária: P7 admite arrendamento/contratação de terceiro; Contrato exige propriedade plena"
    comentario: "A Cl. 10.13.1 só admite formas que transfiram 'a propriedade plena do bem' (construção, compra, aquisição societária, permuta etc.) e 10.13.3 o inclui nos bens reversíveis. O P7 descreve a obrigação como cumprível por arrendamento ou contratação de terceiro, hipóteses incompatíveis com a reversão. A divergência afeta a formação de preço. O pacote mostra a existência de aterro privado licenciado na Sede (Ecoparque; LAO em nome de CTR Porto Velho S/A até 09/10/2028)."
    dispositivo_legal: "art. 5.º da Lei n.º 14.133/2021; art. 10-A, inciso III, da Lei n.º 11.445/2007"
    referencias_cruzadas: ["ANEXO-B 10.13-10.13.8 (p. 31-33)", "P1 p. 84-85 (Ecoparque, contrato 042/PGM/2023, LAI/LAO)"]
    flag_tecnico: false
    flag_reserva: true
    nota: "Reserva: assimetria em favor de quem detém ou pode adquirir aterro licenciado na Sede (titular do Ecoparque). Decisão comercial/estratégica."

  - id: E7-048
    documento: "P7"
    dispositivo_editalicio: "P7, XI.3.3 (PDF p. 69) x IV.4 (p. 37) e IV.6 (p. 38); ANEXO-B 10.13.5"
    transcricao: "capacidade e vida útil remanescentes não inferiores a 30 (trinta) anos, aferidas pela Entidade Reguladora"
    tipo_achado: IRREGULAR
    categoria: risco_economico
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Exigência de 30 anos de vida útil remanescente do aterro na reversão, sem indenização, incompatível com a alocação do Jirau ao Poder Concedente"
    comentario: "O P7 aloca ao Poder Concedente o risco de reativação do Aterro do Jirau (TO-02) e trata a vida útil do Ecoparque como risco compartilhado (TO-20). Mas descreve, sem análise, a obrigação da Concessionária de prover aterro próprio por sua conta e risco e entregá-lo com 30 anos de vida útil remanescente, amortizado integralmente e sem indenização (10.13.4). Isso implica precificar na CP de 30 anos capacidade para cerca de 60 anos. O P7 não examina se esse custo está no P6 nem a coerência com a matriz."
    dispositivo_legal: "art. 5.º, incisos I e III, da Lei n.º 11.079/2004 (prazo compatível com a amortização; repartição de riscos); art. 10-A, incisos III e IV, da Lei n.º 11.445/2007"
    referencias_cruzadas: ["ANEXO-B 10.13.4, 10.13.5-10.13.5.4", "ANEXO-V TO-02, TO-20", "P6 Tabela 7"]
    flag_tecnico: true
    flag_reserva: true
    nota: "[VALIDAÇÃO TÉCNICA] dimensionamento volumétrico. Reserva: titular de aterro com grande capacidade remanescente tem vantagem."

  - id: E7-049
    documento: "P7"
    dispositivo_editalicio: "P7, III.8 (PDF p. 35); ANEXO-B 5.1.2 (p. 14)"
    transcricao: "O atraso ou a entrega em desconformidade isenta a Concessionária quanto ao cumprimento dos prazos correspondentes e não obsta o início da fluência e do pagamento dos valores devidos de Contraprestação"
    tipo_achado: IRREGULAR
    categoria: ilegalidade
    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "Pagamento da contraprestação pelo cronograma original mesmo sem disponibilização do serviço (atraso na entrega de bens pelo Poder Concedente)"
    comentario: "A Cl. 5.1.2, descrita pelo P7 sem ressalvas, garante o pagamento da CP 'em atenção ao cronograma originalmente proposto' mesmo quando o serviço não puder ser prestado por atraso na entrega de bens públicos. O art. 7.º exige que a contraprestação seja precedida da disponibilização do serviço; o tratamento adequado seria reequilíbrio ou indenização, e não CP por serviço não prestado."
    dispositivo_legal: "art. 7.º, caput e § 1.º, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-B 5.1.1-5.1.2", "ANEXO-V RJ-05"]
    flag_tecnico: false
    flag_reserva: true
    nota: "Reserva: cláusula favorável à concessionária que a impugnação poderia eliminar."

  - id: E7-050
    documento: "P7"
    dispositivo_editalicio: "P7, III.3 (PDF p. 28); ANEXO-B 6.1"
    transcricao: "observa o limite máximo de 35 anos previsto no art. 5º, inciso V, da Lei Federal nº 11.079/2004"
    tipo_achado: IRREGULAR
    categoria: erro_material
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Citação errada do dispositivo do prazo máximo (inciso V em vez de inciso I do art. 5.º)"
    comentario: "O limite de 5 a 35 anos está no art. 5.º, I. O inciso V trata dos mecanismos de preservação da atualidade. O erro está no P7 (p. 28) e na Cl. 6.1 do Contrato; o próprio P7 cita corretamente o inciso I em XI.2.1 (p. 66)."
    dispositivo_legal: "art. 5.º, inciso I, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-B 6.1 (p. 14)", "P7 XI.2.1 (p. 66)"]
