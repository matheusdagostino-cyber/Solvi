    transcricao: "enquanto esta não estiver instalada ou não dispuser de estrutura técnica para determinada competência, pelo Conselho Gestor do Programa de Parcerias Público-Privadas de Porto Velho (CGP/PVH)"
    tipo_achado: IRREGULAR
