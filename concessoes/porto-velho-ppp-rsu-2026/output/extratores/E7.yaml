  - id: E7-029
    documento: "P7"
    dispositivo_editalicio: "P7, V.6 (PDF p. 41-42) x IX.4 (p. 63); ANEXO-B 25.3 (p. 54-55)"
    transcricao: "autoriza os financiadores a assumir a Concessão, mediante comunicação formal ao Poder Concedente com antecedência de 15 (quinze) dias"
    tipo_achado: IRREGULAR
    categoria: ilegalidade
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Step-in por mera comunicação, sem autorização do Poder Concedente; P7 descreve o rito de duas formas"
    comentario: "O art. 27-A da Lei 8.987 (aplicável por força do art. 3.º da Lei 11.079) e o art. 5.º, § 2.º, I, da Lei 11.079 exigem que o Poder Concedente autorize a assunção do controle pelos financiadores. A Cl. 25.3, descrita em IX.4, permite a assunção por comunicação com 15 dias de antecedência. Em V.6 o P7 descreve uma etapa de análise do enquadramento pelo Poder Concedente, que não está no Contrato."
    dispositivo_legal: "art. 27-A, caput e § 1.º, da Lei n.º 8.987/1995; art. 3.º e art. 5.º, § 2.º, inciso I, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-B 25.1-25.6"]
    flag_tecnico: false
    flag_reserva: true
    nota: "Reserva: cláusula favorável à bancabilidade e aos financiadores da concessionária; a impugnação poderia eliminá-la."

  - id: E7-030
    documento: "P7"
    dispositivo_editalicio: "P7, V.6 (PDF p. 41); ANEXO-B 18.5 (único compartilhamento previsto)"
    transcricao: "A previsão observa o art. 5º, inciso IX, da Lei Federal nº 11.079/2004"
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "Cláusula obrigatória de compartilhamento dos ganhos da redução do risco de crédito ausente; P7 cita o inciso IX para outro fim"
    comentario: "O art. 5.º, IX, torna obrigatória a cláusula de compartilhamento com a Administração dos ganhos econômicos decorrentes da redução do risco de crédito dos financiamentos (refinanciamento). O P7 cita esse inciso como fundamento dos step-in rights, o que está incorreto, e o Contrato só prevê compartilhamento de receitas acessórias (18.5). Não se localizou cláusula sobre ganhos de refinanciamento."
    dispositivo_legal: "art. 5.º, inciso IX, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-B 18.5 (p. 43)", "E7-029"]
    flag_tecnico: false
    flag_reserva: true
    nota: "Reserva: a omissão permite à concessionária reter integralmente ganhos de refinanciamento."

  - id: E7-031
    documento: "P7"
    dispositivo_editalicio: "P7, IX.3 (PDF p. 63) e XI.3.6 (p. 69); ANEXO-B 24.2 (p. 54)"
    transcricao: "considera-se previamente autorizada a transferência de controle da Concessionária para terceira sociedade que integre o grupo econômico de sócia original da SPE"
    tipo_achado: IRREGULAR
    categoria: ilegalidade
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Autorização prévia genérica de transferência de controle intragrupo"
    comentario: "O art. 9.º, § 1.º, da Lei 11.079 condiciona a transferência do controle da SPE à autorização expressa da Administração, observado o art. 27 da Lei 8.987, que exige verificação de capacidade técnica, idoneidade financeira e regularidade jurídica e fiscal do pretendente. A pré-autorização contratual dispensa essa verificação caso a caso; o P7 a qualifica como 'exceção relevante' sem examinar sua compatibilidade legal."
    dispositivo_legal: "art. 9.º, § 1.º, da Lei n.º 11.079/2004; art. 27, caput e § 1.º, da Lei n.º 8.987/1995"
    referencias_cruzadas: ["ANEXO-B 24.1.1 e 24.2"]
    flag_tecnico: false
    flag_reserva: true
    nota: "Reserva: flexibilidade societária que favorece grupos econômicos com várias sociedades; a impugnação poderia eliminá-la."

  - id: E7-032
    documento: "P7"
    dispositivo_editalicio: "P7, IV.4 (PDF p. 37) x V.7 (p. 43); ANEXO-B 8.6.1.2 e 22.8"
    transcricao: "vedada a sua utilização para a cobertura de passivos ambientais históricos pré-existentes, cuja responsabilidade financeira é exclusiva do Poder Concedente"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Passivos históricos: 'exclusivos do Poder Concedente' (V.7) x custo da Concessionária até o limite (IV.4)"
    comentario: "Em IV.4 o P7 diz que o custo dos passivos da Vila Princesa e do Jirau corre pela Concessionária até o limite de dispêndio e que o excedente é do Poder Concedente (SA-01 e SA-13 compartilhados). Em V.7 afirma que a responsabilidade financeira pelos passivos históricos é exclusiva do Poder Concedente, sem a ressalva dos incisos (i) e (ii) da Cl. 8.8 e do limite da 8.6.1.2. O limite não é quantificado no P7 (o Contrato remete ao investimento do EVTEA; o P6 indica R$ 4,2 mi para o encerramento da Vila Princesa no Ano 2)."
    dispositivo_legal: "art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 10-A, inciso IV, da Lei n.º 11.445/2007"
    referencias_cruzadas: ["ANEXO-B 8.6.1-8.6.1.2.4 e 22.8", "P6 p. 35", "ANEXO-V SA-01, SA-02, SA-13"]
    flag_tecnico: true
    flag_reserva: false
    nota: "[VALIDAÇÃO TÉCNICA] quanto à suficiência do limite de dispêndio frente ao rito GAC."

  - id: E7-033
    documento: "P7"
    dispositivo_editalicio: "P7, III.6.1 (PDF p. 32) x ANEXO-B 15.6.1-15.6.4 (p. 38)"
    transcricao: "ambas as parcelas são apuradas e liquidadas por medição, dispensando cláusula contratual de escalonamento inicial"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "P7 afirma desnecessário o escalonamento inicial, mas o Contrato o prevê expressamente"
    comentario: "O Contrato prevê escalonamento (Parcela A reduzida nos anos 1 e 2 e integral a partir do ano 3; Parcela B reduzida no ano 1) e declara que isso 'não configura carência' (15.6.4). O P7 descreve o oposto. Além disso, a Parcela A remunera investimentos 'certificados', mas é devida desde o 1.º mês de operação e integral a partir do 3.º ano por cronograma, o que precisa ser compatibilizado com a regra de que a contraprestação depende da disponibilização do serviço."
    dispositivo_legal: "art. 7.º, caput e § 1.º, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021"
    referencias_cruzadas: ["ANEXO-B 15.5.2.1, 15.6.1-15.6.4", "P6 p. 46-47"]
    flag_tecnico: false
    flag_reserva: false

  - id: E7-034
    documento: "P7"
    dispositivo_editalicio: "P7, III.6.3 (PDF p. 33) x V.5 (p. 41) e XI.3.4 (p. 69); ANEXO-B 15.8.8 e 32.10.2"
    transcricao: "mantida a Conta Garantia em volume inferior a duas Contraprestações Mensais Efetivas, a Concessionária está autorizada a suspender integralmente a prestação dos Serviços (Cláusula 15.8.8)"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Suspensão integral dos serviços por inadimplência descrita de forma incompatível com o Contrato e com a vedação legal de interrupção"
    comentario: "Em III.6.3 o P7 diz que a Concessionária pode suspender integralmente os serviços após 180 dias com a Conta Garantia abaixo de 2 CME. A Cl. 15.8.8 (e o próprio P7 em V.5) prevê apenas a faculdade de 'pleitear cautelarmente em juízo' a suspensão, com a Conta Garantia abaixo de 1 parcela. A versão de III.6.3 contraria o art. 39, parágrafo único, da Lei 8.987 (serviços não podem ser interrompidos até decisão judicial transitada em julgado), aplicável às concessões administrativas."
    dispositivo_legal: "art. 39, parágrafo único, da Lei n.º 8.987/1995; art. 3.º da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-B 15.8.8 (p. 40) e 32.10.2"]
    flag_tecnico: false
