    descricao_breve: "Ressarcimento dos estudos: valor fixo (P7, Edital 21.1.1) x 'valor máximo' (Contrato 10.7.1) x corrigido por IPCA (Edital 20.1.8); devedor Adjudicatária x Concessionária; sem especificação dos dispêndios"
    comentario: "O art. 21 da Lei 8.987 exige que os dispêndios a ressarcir sejam especificados no edital. O P7 e o Edital 21.1.1 fixam R$ 3.142.250,00; o Edital 20.1.8 manda corrigir pelo IPCA desde a data-base; o Contrato 10.7.1 trata o valor como teto. O Edital atribui o pagamento à Adjudicatária e o Contrato 10.7 à Concessionária (SPE). Nenhum documento discrimina os custos efetivos dos estudos."
    dispositivo_legal: "art. 21 da Lei n.º 8.987/1995 (aplicável por força do art. 3.º da Lei n.º 11.079/2004); art. 28, § 2.º, da LC Municipal n.º 592/2015"
    referencias_cruzadas: ["EDITAL 20.1.8 e 21.1.1", "ANEXO-B 10.7-10.7.1"]
