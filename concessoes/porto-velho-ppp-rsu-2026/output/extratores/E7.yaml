  - id: E7-058
    documento: "P7"
    dispositivo_editalicio: "P7, III.4.5 (PDF p. 31); EDITAL 15.15.1-15.15.5 (p. 42-43)"
    transcricao: "Trata-se de rotina automática do ambiente eletrônico, que se aplicaria ainda que o Edital silenciasse"
    tipo_achado: IRREGULAR
    categoria: ilegalidade
    tema_sugerido: JULGAMENTO_PROPOSTA
