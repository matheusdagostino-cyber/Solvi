    comentario: "O P7 não identifica normas de regulação editadas pela ARDPV para RSU e não confronta o Edital e o Contrato com as normas de referência da ANA aplicáveis ao manejo de RSU. A observância dessas normas condiciona o acesso a recursos federais e a financiamentos com recursos da União — relevante porque o P7 aponta BNDES e Caixa como financiadores. A existência de normas de regulação é ainda condição de validade do contrato."
