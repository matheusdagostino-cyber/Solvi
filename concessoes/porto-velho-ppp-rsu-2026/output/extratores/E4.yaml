  - id: E4-084
    documento: "ANEXO-V"
    dispositivo_editalicio: "Matriz (conjunto TO-01 a EF-07)"
    transcricao: "ANEXO V – MATRIZ DE RISCOS"
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Riscos relevantes sem alocação na Matriz"
    comentario: "Não há alocação para: (i) disponibilidade e custo de financiamento e taxa de juros; (ii) câmbio de equipamentos importados (separadores ópticos, autoclave); (iii) mercado e preço de CDR, biogás e carbono; (iv) atraso na Ordem de Início por condições precedentes do Poder Concedente (Conta Garantia, áreas, LPs); (v) instalação e funcionamento efetivo da ARDPV; (vi) sucessão trabalhista do operador cessante; (vii) extinção antecipada e indenização; (viii) interferências e achados arqueológicos; (ix) obsolescência tecnológica; (x) erro ou omissão nos estudos referenciais (ver E4-085)."
    dispositivo_legal: "art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 10-A, inciso IV, da Lei n.º 11.445/2007 (incluído pela Lei n.º 14.026/2020 — redação a verificar)"
    referencias_cruzadas: ["ANEXO-B 18.7 (receitas acessórias aleatórias)", "P7 (l. 347: ARDPV 'a partir de sua efetiva instalação')"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Parte desses riscos pode estar tratada em cláusulas do Contrato (extinção e indenização) — conferir com E3."
