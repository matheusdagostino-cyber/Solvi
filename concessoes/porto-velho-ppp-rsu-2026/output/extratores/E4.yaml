    transcricao: "Liberação de área, licenciamento e regularização institucional do CTR-PV são do Poder Concedente."
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Responsabilidade pela área e pelo licenciamento da CTR: Poder Concedente (Matriz TO-05) × concessionária (Edital 6.3.1; Contrato 8.1)"
    comentario: "A TO-05 atribui ao Poder Concedente a liberação de área e o licenciamento da CTR. A RJ-05 limita o reequilíbrio às áreas 'de titularidade do Poder Concedente na data da publicação do Edital'. O Edital (6.3.1) atribui à concessionária as áreas das 'demais estruturas', sem reequilíbrio, e o Caderno (XI.4) não lista área da CTR entre os bens municipais. O Contrato (8.1) atribui à concessionária todas as licenças (LP, LI e LO)."
    dispositivo_legal: "art. 5.º, inciso III, e art. 10, inciso VII, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021"
    referencias_cruzadas: ["EDITAL 6.3, iv e 6.3.1", "ANEXO-B 8.1 (PDF p. 17)", "ANEXO-A XI.4", "E4-025", "E4-080"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Distinto de E4-025 (falta de custo de terreno no P6): aqui a contradição é de alocação de risco."
