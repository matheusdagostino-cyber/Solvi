    comentario: "A TO-14 atribui à concessionária, sem reequilíbrio, o risco de inoperância do incinerador municipal, inoperante desde a anulação do contrato anterior e sem laudo de condição nos documentos, com CAPEX de só R$ 1,8 mi no P6. O Caderno (XI.4) afasta a responsabilidade da concessionária por 'defeitos ocultos ou inadequações preexistentes' registrados no termo de entrega. O objeto prevê autoclave (ver E4-020)."
    dispositivo_legal: "art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021"
