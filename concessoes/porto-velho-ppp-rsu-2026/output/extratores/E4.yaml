    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Risco 'compartilhado' de metas de reciclagem exclui reequilíbrio mesmo por fato do príncipe, contra a regra geral da própria Matriz"
    comentario: "Nas metas de recicláveis e de coleta seletiva (TO-10), a alocação é 'Compartilhado', mas a única proteção da concessionária é a isenção de sanção ou desconto, sem reequilíbrio nem mesmo por fato do príncipe. A RJ-03 e a SA-10 alocam o fato do príncipe ao Poder Concedente, com reequilíbrio."
