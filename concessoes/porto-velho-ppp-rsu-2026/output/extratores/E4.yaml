    transcricao: "Se a baixa segregação na fonte decorrer de fato de terceiro, força maior ou fato do príncipe, não há direito ao reequilíbrio, mas a Concessionária pode ficar isenta de sanção ou desconto do IQD."
    tipo_achado: IRREGULAR
