    comentario: "O risco de não reativação do Jirau até o Mês 24 é alocado ao Poder Concedente, mas a consequência fala em 'reembolso ao Poder Concedente dos custos adicionais', apurado o líquido com investimentos não realizados. Fica ambíguo quem reembolsa quem."
