  - id: E4-069
    documento: "ANEXO-V"
    dispositivo_editalicio: "Matriz TO-04 (p. 6)"
    transcricao: "Cota do Rio Madeira inferior a 2,0 metros por mais de 45 dias consecutivos, acompanhada de decreto de calamidade pública, pode ensejar REEQUILÍBRIO [art. 124, II, 'd', Lei 14.133/2021]."
    tipo_achado: IRREGULAR
    categoria: risco_economico
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Estiagem extrema no Baixo Madeira: reequilíbrio condicionado a decreto de calamidade e justificado como álea extraordinária que a própria Matriz nega"
    comentario: "A Matriz reconhece estiagens severas em 3 dos últimos 5 anos (cotas de 0,25 m em 2024) e classifica o risco como 'Muito provável (5)'. Exige, cumulativamente, cota < 2 m por mais de 45 dias e decreto de calamidade, ato discricionário do poder público. A justificativa afirma que a sazonalidade 'não é caso fortuito', mas a consequência invoca o art. 124, II, 'd' (álea extraordinária). O custo das contingências (PCOS de 4 níveis, 'tirolesas logísticas') não tem rubrica no P6."
    dispositivo_legal: "art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 124, inciso II, alínea 'd', da Lei n.º 14.133/2021"
    referencias_cruzadas: ["ANEXO-III PA-10 (PCOS)", "P6 III.5 (p. 20)", "E4-070"]
    flag_tecnico: true
    flag_reserva: false
    nota: "[VALIDAÇÃO TÉCNICA] custo operacional do PCOS por nível."
  - id: E4-070
    documento: "ANEXO-V"
    dispositivo_editalicio: "Matriz TO-04 (p. 6), TO-16 (p. 14–15) e RJ-04 (p. 28)"
    transcricao: "Se o evento for segurável, o risco é integralmente da contratada. Se for não segurável, é do Poder Concedente."
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Gatilhos diferentes e conceito 'segurável' indefinido para eventos hidroclimáticos e de força maior"
    comentario: "Para eventos que se sobrepõem, a TO-04 exige cota < 2 m por mais de 45 dias e decreto; a TO-16 exige superar os 4 níveis do PCOS, decreto e ao menos 1 dia de paralisação; a RJ-04 exige decreto e evento não segurável. 'Segurável' não é definido (em tese, a qualquer custo ou em condições de mercado razoáveis?). A TO-16 usa 'contratada' em vez de 'concessionária'."
    dispositivo_legal: "art. 5.º, inciso III, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["E4-069"]
    flag_tecnico: false
    flag_reserva: false
