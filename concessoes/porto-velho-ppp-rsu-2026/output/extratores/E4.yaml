  - id: E4-073
    documento: "ANEXO-V × EDITAL"
    dispositivo_editalicio: "Matriz TO-12 (p. 11–12) × EDITAL 3.1.1.1 e 3.1.2.1"
    transcricao: "O não recebimento de resíduos, em discordância de ordem escrita da ARDPV, pode ensejar SANÇÃO por descumprimento contratual."
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
    tema_sugerido: REGULACAO_FISCALIZACAO
    descricao_breve: "Concessionária obrigada, sob sanção, a receber resíduos fora do escopo (perigosos, RCC, industriais) por ordem da ARDPV"
    comentario: "A TO-12 e o Edital 3.1.2.1 permitem à ARDPV ordenar o recebimento de resíduos fora do escopo por falha de fiscalização pública, com 'tarifa especial' ou reequilíbrio a definir, e sancionam a recusa. O Edital 3.1.1.1 autoriza a recusa de cargas que comprometam licenciamento ou vida útil dos bens. Não há critério para conciliar as regras nem para tratar unidades não licenciadas para resíduos Classe I."
    dispositivo_legal: "arts. 20 e 27 da Lei n.º 12.305/2010 (responsabilidade dos geradores sujeitos a plano de gerenciamento); art. 5.º, inciso III, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["EDITAL 3.1.1, 3.1.1.1, 3.1.2.1 (PDF p. 13–14)", "ANEXO-V TO-13"]
    flag_tecnico: true
    flag_reserva: false
    nota: "[VALIDAÇÃO TÉCNICA] compatibilidade das licenças da CTR com resíduos Classe I."
