    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Risco de ultrapassagem do limite de 5% da RCL alocado ao Poder Concedente sem consequência contratual"
