  - id: E4-075
    documento: "ANEXO-V"
    dispositivo_editalicio: "Matriz SA-01 e SA-02 (p. 17–19) × SA-05 (p. 20–21)"
    transcricao: "É de responsabilidade pública a remediação de passivos históricos anteriores à emissão da Ordem de Início"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Alocações contraditórias da remediação do passivo histórico da Lixeira de Vila Princesa"
    comentario: "A SA-01 e a SA-02 atribuem à concessionária a execução do rito GAC e da intervenção sobre a contaminação preexistente, remuneradas na CP até o limite do EVTEA, com excedente ao Poder Concedente. A SA-05 diz que a remediação de passivos anteriores à Ordem de Início é de responsabilidade pública e que sua eventual cessão enseja 'Reequilíbrio integral dos custos de remediação'. O Contrato (8.6.1) segue o modelo da SA-01."
