    transcricao: "Atualizações regulatórias destinadas exclusivamente a manter serviço adequado nos termos da Lei 8987/95 não ensejam reequilíbrio, por não constituir álea contratual extraordinária."
    tipo_achado: IRREGULAR
    categoria: risco_economico
    tema_sugerido: REGULACAO_FISCALIZACAO
    descricao_breve: "Exclusão ampla de reequilíbrio para novas exigências regulatórias da ARDPV ligadas a 'serviço adequado'"
    comentario: "A RJ-03 e o Contrato (20.9) excluem do reequilíbrio a 'exigência razoável' da agência reguladora para manter serviço adequado, conceito aberto (art. 6.º, § 1.º, da Lei 8.987/1995) que abrange regularidade, eficiência, segurança e atualidade. Normas novas da ARDPV com custo relevante podem ser enquadradas nessa exceção, o que esvazia a alocação do fato do príncipe ao Poder Concedente."
    dispositivo_legal: "art. 5.º, incisos III e V, da Lei n.º 11.079/2004; art. 6.º, § 1.º, da Lei n.º 8.987/1995 (citado no Contrato; não listado no art. 3.º da Lei n.º 11.079/2004)"
    referencias_cruzadas: ["ANEXO-B 20.9", "ANEXO-B 10.2.33.5 (fixação da CS-01 pela ARDPV sem reequilíbrio)"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Padrão recorrente do checklist interno (risco regulatório excluído do reequilíbrio)."
