    documento: "ANEXO-V × ANEXO-B × P6"
    dispositivo_editalicio: "Matriz SA-01 (p. 17–18) × Contrato 8.6.1.2 × P6 Tabela 7 (7.1.1) e p. 35"
    transcricao: "O encargo da Concessionária relativo às medidas de intervenção do rito GAC da antiga Lixeira de Vila Princesa (...) é limitado ao investimento previsto para o encerramento da antiga Lixeira de Vila Princesa na modelagem econômico-financeira"
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Limite de dispêndio do rito GAC indeterminado (R$ 10,5 mi × R$ 4,2 mi; inclusão do Centro de Triagem; atualização) e sem base técnica (etapas E2–E6 pendentes)"
    comentario: "O limite remete ao 'investimento previsto para o encerramento' no EVTEA. O P6 tem a linha 'Lixão Vila Princesa — Eliminação do Passivo' de R$ 10,5 mi (Anos 1–3), o texto fala em 'encerramento... (R$ 4,2 milhões)', há linha separada de R$ 0,8 mi para o Centro de Triagem e o P2 desloca os valores para os Anos 2–4. Não se define se o limite é nominal ou atualizado. Só a avaliação preliminar (E1) foi concluída, e o custo da intervenção depende de investigação detalhada e avaliação de risco ainda não feitas. A Lixeira foi encerrada em 2023 (Portaria 109/SEMUSB/2023), mas o P6 ainda trata de 'encerramento técnico do Lixão'."
    dispositivo_legal: "art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 10, § 4.º, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-B 8.6.1.2 a 8.6.1.2.4 (PDF p. 18–19)", "ANEXO-III PA-01", "EDITAL 3.1, vi"]
    flag_tecnico: true
    flag_reserva: true
    nota: "Reserva: o teto com excedente ao Poder Concedente e sua indefinição favorecem operador com experiência em remediação (o valor do limite pode ser disputado a favor da concessionária). [VALIDAÇÃO TÉCNICA] custo do rito GAC."
  - id: E4-077
    documento: "ANEXO-V × ANEXO-B"
    dispositivo_editalicio: "Matriz SA-01, SA-02, SA-05, SA-13 (frase final) × Contrato 8.6.1.1 e 8.6.3"
    transcricao: "Eventos posteriores à emissão da Ordem de Início são risco da Concessionária."
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
    tema_sugerido: LICENCIAMENTO_AMBIENTAL
    descricao_breve: "Corte temporal pela Ordem de Início aplicado a contaminação contínua de passivo preexistente"
    comentario: "Pluma de contaminação, geração de biogás e incêndios em massa de resíduos antiga continuam a ocorrer após a Ordem de Início. A regra de que 'eventos posteriores' são da concessionária (e o 'fato gerador' do Contrato 8.6.3) não distingue a manifestação tardia de passivo antigo de um dano novo causado pela operação."
    dispositivo_legal: "art. 5.º, inciso III, da Lei n.º 11.079/2004"
