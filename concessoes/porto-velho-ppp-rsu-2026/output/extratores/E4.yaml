    comentario: "A própria RJ-02 indica licenciamento 'sob jurisdição SEMA/RO' (estadual), mas o gatilho só cobre atraso de órgãos federais e só dá prorrogação de prazos, sem custos. O Contrato (8.7) afasta penalidades e descontos de IQD, mas não prevê reequilíbrio. A alocação diverge da TO-05 (licenciamento da CTR a cargo do Poder Concedente) e do P6 (Poder Concedente responsável pelo 'licenciamento ambiental inicial')."
