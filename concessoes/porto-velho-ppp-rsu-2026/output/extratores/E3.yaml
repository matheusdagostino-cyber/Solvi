  - id: E3-016
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 6.1, 6.5 e 6.6 (PDF p. 16-17)"
    transcricao: "30 (trinta) anos ... permitida a prorrogação contratual em até 5 (cinco) anos, observado o limite máximo de 35"
    tipo_achado: CONFORME
    categoria: omissao
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Prazo e prorrogação dentro do limite legal"
    comentario: "Prazo de 30 anos com prorrogação limitada a 35 anos e condições de prorrogação previstas (6.5-6.6). (Registro de cobertura; ver E3-011 quanto ao erro de inciso.)"
    dispositivo_legal: "art. 5.º, inciso I, da Lei n.º 11.079/2004; art. 23, inciso XII, da Lei n.º 8.987/1995"
    referencias_cruzadas: []
