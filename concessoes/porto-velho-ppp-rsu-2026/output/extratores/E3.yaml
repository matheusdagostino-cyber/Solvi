    dispositivo_editalicio: "Cl. 3.4 e 11.1 a 11.3 (PDF p. 5, 8)"
    transcricao: "A CONCESSIONÁRIA não está autorizada a realizar cópias dos DADOS ... devendo restituí-los no prazo máximo de 30 (trinta) dias, contados a partir: (i) do recebimento da solicitação formalizada pelo PODER CONCEDENTE"
