  - id: E3-017
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 7.1 a 7.3 (PDF p. 17)"
    transcricao: "mediante a observância do cronograma físico-financeiro constante dos Anexos do Edital e do Contrato, inclusive o EVTEA ... detalhadas no Cronograma de Execução (Anexo)"
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: OBJETO_ESCOPO
    descricao_breve: "Contrato remete a 'Cronograma de Execução (Anexo)' inexistente; sem marcos de implantação"
    comentario: "Não há, no Contrato nem nos anexos, cronograma vinculante com prazos de implantação da CTR, do aterro, da recuperação do incinerador, do Jirau e dos transbordos; o Caderno (XI.5) transfere à Concessionária a elaboração do cronograma. Sem marcos, ficam indeterminados o ramp-up da Parcela A, as penalidades por atraso e a aferição de inadimplemento."
    dispositivo_legal: "art. 23, parágrafo único, inciso I, da Lei n.º 8.987/1995; art. 92, inciso VII, da Lei n.º 14.133/2021"
    referencias_cruzadas: ["ANEXO-A XI.5 e XI.6 (p. 62-63)", "P6 p. 47 (marcos da CTR e Jirau 'parâmetro crítico')"]
    flag_tecnico: true
    flag_reserva: false
  - id: E3-018
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 7.4 e 26.3, inciso vii (PDF p. 17, 57)"
    transcricao: "período de sobreposição operacional com o operador cessante previsto nos Anexos do Edital ou do Contrato"
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
    tema_sugerido: OBJETO_ESCOPO
    descricao_breve: "Sobreposição com operador cessante sem duração e sem obrigação correlata do terceiro"
    comentario: "O Contrato não fixa a duração (o P7 menciona 30 dias) e a sobreposição depende da cooperação de contratados emergenciais que não são parte; ainda assim, a cl. 26.3 vii pune a Concessionária por descontinuidade na transição com multa de até 30% do valor anual."
    dispositivo_legal: "art. 5.º, inciso III, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["P7 p. 11 (sobreposição de 30 dias)", "P1 p. 61 (ECOPVH, MB Limpeza, Ecoparque)"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Falta: contratos emergenciais vigentes e cláusula de transição neles prevista."
  # ===================== REGULAÇÃO =====================
  - id: E3-019
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 4.7, 4.7.1 a 4.7.3 (PDF p. 13-14)"
    transcricao: "Enquanto não instalada a ARDPV, ou enquanto esta não dispuser de estrutura técnica ... esta será exercida pelo Conselho Gestor do Programa de Parcerias Público-Privadas de Porto Velho (CGP/PVH) ou pela SEINFRA"
    tipo_achado: IRREGULAR
    categoria: ilegalidade
    tema_sugerido: REGULACAO_FISCALIZACAO
    descricao_breve: "Funções regulatórias exercidas pelo próprio Poder Concedente enquanto a ARDPV não estiver instalada"
    comentario: "A cláusula admite que SEINFRA ou CGP (órgãos do PC) exerçam regulação, homologação de IQD e aprovação de manuais por prazo indeterminado, o que sugere que a ARDPV, criada em maio/2025, ainda não está operacional. A designação de entidade reguladora com independência decisória é condição de validade do contrato de saneamento."
    dispositivo_legal: "art. 11, inciso III, art. 21, inciso I, e art. 23 da Lei n.º 11.445/2007"
    referencias_cruzadas: ["Contrato 6.2 VI e 6.3 (manuais aprovados pela ARDPV)", "Contrato 13.2 (servidores da ARDPV)"]
    flag_tecnico: false
    flag_reserva: false
    nota: "DEPENDE de prova do estágio de instalação da ARDPV (quadro, diretoria, orçamento)."
  - id: E3-020
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 4.5 (PDF p. 13)"
    transcricao: "A Entidade Reguladora poderá se valer, preferencialmente, das normas de referência editadas pela Agência Nacional de Águas e Saneamento Básico - ANA"
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
    tema_sugerido: REGULACAO_FISCALIZACAO
    descricao_breve: "Adesão facultativa às normas de referência da ANA"
    comentario: "A redação facultativa não assegura aderência às NRs da ANA (inclusive NR 7/2024 para RSU), cuja observância condiciona o acesso a recursos federais. Não há previsão de como a superveniência de NRs afetará o equilíbrio além da cl. 4.6."
    dispositivo_legal: "art. 50 da Lei n.º 11.445/2007; art. 4.º-A da Lei n.º 9.984/2000"
    referencias_cruzadas: ["Contrato 4.6"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Falta verificar se a ARDPV aderiu formalmente às NRs da ANA."
  - id: E3-021
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 4.6, 10.2.8.4-10.2.8.6 e 13.3 (PDF p. 13, 24, 35) × Matriz RJ-03"
    transcricao: "que alterem de forma significativa os encargos ... poderá gerar a avaliação de pleito ... / 10.2.8.6 ... caso o investimento seja totalmente imprevisto ... exigindo investimento impassível de amortização no período remanescente"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Risco regulatório: limiares restritivos no Contrato divergem da Matriz"
    comentario: "A Matriz (RJ-03) aloca ao PC qualquer ato normativo dos três entes que cause impacto; o Contrato exige alteração 'significativa' (4.6), investimento 'impassível de amortização' (10.2.8.6) e dá à Concessionária 10 dias úteis para cumprir novas determinações da ARDPV sem menção a reequilíbrio (13.3). O padrão é o mesmo do Rio Claro ponto 14 (risco regulatório da entidade reguladora)."
    dispositivo_legal: "art. 9.º, § 4.º, da Lei n.º 8.987/1995; art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 124, inciso II, alínea 'd', da Lei n.º 14.133/2021"
    referencias_cruzadas: ["ANEXO-V RJ-03 (p. 27)", "Contrato 20.1.2 ii e iii"]
    flag_tecnico: false
    flag_reserva: false
  - id: E3-022
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 4.6 e 10.2.37.1 (PDF p. 13, 27-28)"
    transcricao: "fato do príncipe, nos termos da Cláusula 19ª ... / ressalvada a suspensão temporária da medição do IQD e da aplicação de penalidades nas hipóteses e nos limites previstos na Cláusula 19ª"
    tipo_achado: IRREGULAR
    categoria: erro_material
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Remissões à Cláusula 19ª para matérias que ela não regula"
    comentario: "A Cláusula 19ª só remete à Matriz; o procedimento de fato do príncipe está na 20ª e não há, na 19ª, hipóteses ou limites de suspensão do IQD por greve. A remissão vazia deixa sem regra a suspensão do IQD em greves."
    dispositivo_legal: "art. 92, inciso XIV, da Lei n.º 14.133/2021"
    referencias_cruzadas: ["Contrato 19.1-19.6, 20.1.2"]
    flag_tecnico: false
    flag_reserva: false
  # ===================== ESCOPO DE INVESTIMENTO / EVTEA =====================
  - id: E3-023
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 4.2 item 2, 4.2.1, 4.2.1.1 e 2.1 (PDF p. 11, 13)"
    transcricao: "As obras e os investimentos ... são exclusivamente aqueles relacionados ... nos Anexos do Edital ou do Contrato, inclusive o EVTEA, que definem o escopo integral das obrigações de investimento da Concessionária"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: OBJETO_ESCOPO
    descricao_breve: "EVTEA tratado como anexo que delimita o escopo de investimento, mas não integra o rol de anexos"
    comentario: "O Contrato cita 'inclusive o EVTEA' dezenas de vezes como anexo vinculante e teto das obrigações de investimento, mas o EVTEA não consta do rol da cl. 2.1 nem do Edital 2.8/2.9, e o Edital 2.11.2 o subordina aos Anexos. A tabela de CAPEX do P2 passa a funcionar como limite, em tensão com a lógica de desempenho da PPP (o que não estiver listado gera reequilíbrio)."
    dispositivo_legal: "art. 5.º e art. 92, incisos I e II, da Lei n.º 14.133/2021; art. 23, inciso I, da Lei n.º 8.987/1995"
    referencias_cruzadas: ["EDITAL 2.8, 2.9, 2.11, 2.11.2 (p. 11-12)", "P2 Tabela 15 (CAPEX)"]
    flag_tecnico: false
    flag_reserva: true
    nota: "Reserva: limitação do escopo ao CAPEX do EVTEA favorece a Concessionária (todo investimento não listado gera pleito)."
  - id: E3-024
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 10.5 e 10.5.1 (PDF p. 29-30)"
    transcricao: "A Concessionária não será obrigada a prestar serviços que não constem neste Contrato ... nem de executá-los de modo diverso ... Qualquer exigência do Poder Concedente neste sentido autoriza a abertura do procedimento de reequilíbrio ... e assinatura de termo aditivo"
    tipo_achado: IRREGULAR
    categoria: ilegalidade
    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "Cláusula afasta a prerrogativa de alteração unilateral"
    comentario: "Ao dispor que a Concessionária não é obrigada a executar serviços de modo diverso e condicionar qualquer exigência a aditivo, a cláusula esvazia a prerrogativa de alteração unilateral do PC (com reequilíbrio concomitante). Também não prevê a concomitância do reequilíbrio exigida em lei."
    dispositivo_legal: "art. 104, inciso I, e art. 124, inciso I, da Lei n.º 14.133/2021; art. 9.º, § 4.º, da Lei n.º 8.987/1995"
    referencias_cruzadas: ["Contrato 4.2.1.1, 20.1.2 i"]
    flag_tecnico: false
    flag_reserva: true
    nota: "Reserva: cláusula pró-concessionária."
  # ===================== BENS DA CONCESSÃO =====================
  - id: E3-025
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 5.1.2 (PDF p. 14)"
    transcricao: "O atraso ou a entrega de bens que sejam de responsabilidade do Poder Concedente em desconformidade ... não obstará o início da fluência e pagamento dos valores devidos de Contraprestação Pública Mensal em atenção ao cronograma originalmente proposto"
    tipo_achado: IRREGULAR
    categoria: ilegalidade
    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "Pagamento de contraprestação mesmo sem disponibilização do serviço por atraso do PC"
    comentario: "A cláusula garante o fluxo da contraprestação segundo o cronograma original mesmo que os serviços não estejam disponíveis por atraso na entrega de bens pelo PC. A contraprestação deve ser precedida da disponibilização do serviço (ou da parcela fruível); a compensação do atraso imputável ao PC caberia ao reequilíbrio, não ao pagamento por serviço não prestado."
    dispositivo_legal: "art. 7.º, caput e § 1.º, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["Contrato 10.1.6", "Contrato 15.6.1"]
    flag_tecnico: false
    flag_reserva: true
    nota: "Reserva: assimetria favorável à Concessionária."
  - id: E3-026
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 5.1.1 (PDF p. 14)"
    transcricao: "serão cedidos à Sociedade de Propósito Específico constituída pela Concessionária"
    tipo_achado: IRREGULAR
    categoria: erro_material
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Contrato trata a SPE como algo distinto da Concessionária"
    comentario: "Pela cl. 1.3.13, a Concessionária é a própria SPE (constituída pela Adjudicatária). A redação inverte os papéis."
    dispositivo_legal: "art. 9.º da Lei n.º 11.079/2004"
    referencias_cruzadas: ["Contrato 1.3.1, 1.3.13, 1.3.51"]
    flag_tecnico: false
    flag_reserva: false
  - id: E3-027
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 5.1.1.1 (PDF p. 14) × EDITAL 6.3.1"
    transcricao: "A obtenção dos demais bens, áreas e imóveis necessários ... não expressamente previstos para desapropriação nem previamente de titularidade do Município, constitui responsabilidade exclusiva da Concessionária ... sem que daí decorra ... direito a recomposição"
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Risco de áreas integralmente privado, embora a CTR tenha local já definido nos estudos e nenhuma área esteja listada para desapropriação"
    comentario: "Nenhum anexo lista áreas para desapropriação (grep: o termo só aparece no Contrato e no Edital). O P2 (V.5) localiza a CTR em frente à Central de Triagem da Vila Princesa, com coordenadas, e o Anexo III lista 'CTR-PV — Municipal — em implantação'. Se a área é municipal, deveria estar listada como bem do PC (5.1.1); se é privada, o risco fundiário recai inteiramente sobre a licitante sem informação de titularidade."
    dispositivo_legal: "art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 18, inciso XII, e art. 29, inciso VIII, da Lei n.º 8.987/1995; art. 25, § 5.º, inciso II, da Lei n.º 14.133/2021"
    referencias_cruzadas: ["EDITAL 6.3.1 (p. 16)", "P2 V.5 (p. 36)", "ANEXO-III Tabela 3 (CTR-PV Municipal)", "Contrato 10.13.1.1"]
    flag_tecnico: false
    flag_reserva: true
    nota: "Falta: matrícula/titularidade da área da CTR. Reserva: licitante com área própria ou aterro licenciado em Porto Velho tem vantagem."
  - id: E3-028
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 1.3.5, 5.1.5, 5.1.8 e 28.3 (PDF p. 7, 15, 63)"
    transcricao: "1.3.5 ... demais ativos ... necessários à continuidade operacional ... / 5.1.5 ... bem como os que venham a ser incorporados ... mediante prévia inclusão no Inventário de Bens Reversíveis / 28.3 ... (de reversão obrigatória e facultativa)"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Definição de bens reversíveis inconsistente (todos os necessários × só os inventariados × reversão facultativa)"
    comentario: "A definição ampla (1.3.5) convive com regra que condiciona a reversibilidade à prévia inclusão no Inventário (5.1.5) e com categoria de 'reversão facultativa' não definida (28.3-28.4). A cl. 5.1.8 admite bens de terceiros, mas exige que estejam livres para transferência (5.1.3), o que é inviável para bens locados. O resultado é risco de não reversão de ativos essenciais."
    dispositivo_legal: "art. 18, inciso X, e art. 23, inciso X, da Lei n.º 8.987/1995; art. 10-A, inciso III, da Lei n.º 11.445/2007"
    referencias_cruzadas: ["Contrato 10.13.3 (aterro reversível)", "Contrato 18.10.2 (usina de biogás não reversível)"]
