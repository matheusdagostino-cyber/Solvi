    comentario: "O Contrato define a ARDPV duas vezes com conteúdos diferentes (mensurar vs. homologar), atribui a apuração ao VI (1.3.33, 15.4) e a decisão final de contestação à ARDPV (15.7.5), enquanto o Anexo D (p. 21) atribui a homologação do RAA ao Poder Concedente e a cl. 41.20 permite ao PC determinar auditoria/perícia. A indefinição recai sobre o mecanismo que determina a Parcela Variável."
