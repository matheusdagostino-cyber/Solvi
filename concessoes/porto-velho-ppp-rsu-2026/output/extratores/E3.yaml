    transcricao: "5.1 A INSTITUIÇÃO FINANCEIRA somente estará obrigada a cumprir qualquer instrução ... (iii) decorrente de solicitação escrita emanada, consensual e conjuntamente ... / 5.3 a) não estará obrigada a aceitar quaisquer instruções, exceto conforme previsto na Cláusula 5.2"
