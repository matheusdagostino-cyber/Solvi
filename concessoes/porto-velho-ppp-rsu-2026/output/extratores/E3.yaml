  - id: E3-012
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 6.1 c/c 6.2, 15.6.1 e 41.1 (PDF p. 16, 38, 78)"
    transcricao: "O prazo da Concessão será de 30 (trinta) anos, contados a partir da assinatura do contrato ... A emissão da Ordem de Início é condição de eficácia do Contrato"
    tipo_achado: IRREGULAR
    categoria: risco_economico
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "Prazo corre da assinatura, mas eficácia e pagamentos dependem da Ordem de Início sem prazo"
    comentario: "O prazo de 30 anos flui desde a assinatura, enquanto obrigações e remuneração só começam após a OI (condicionada a atos do PC sem prazo) e na 'Etapa de Operação'. O Valor Estimado (P6) pressupõe 357 meses de pagamento dentro dos 30 anos; todo atraso entre assinatura e OI reduz o período de amortização sem regra de compensação."
    dispositivo_legal: "art. 5.º, incisos I e III, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["EDITAL 6.1", "P6 Tabela 14 (deslocamento de 3 meses)"]
    flag_tecnico: false
    flag_reserva: false
  - id: E3-013
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 6.2, incisos I a VI, e 6.4 (PDF p. 16)"
    transcricao: "III - Demonstração do fluxo de receitas dadas em garantia e transferência de recursos para a Conta Garantia ... 6.4. Na impossibilidade de cumprimento ... sem culpa de quaisquer das Partes, estas poderão, de comum acordo, rescindir o contrato"
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Condições da Ordem de Início sem prazo para o PC e sem regime indenizatório"
    comentario: "As condições precedentes dependem quase todas do PC (garantia, áreas, autorização de ingresso), mas não há prazo para seu cumprimento, consequência pelo atraso imputável ao PC nem critério de indenização dos custos pré-OI da SPE (garantia de execução, seguros, ressarcimento de R$ 3,14 mi dos estudos). A cl. 6.4 só prevê distrato consensual 'sem culpa', e o inciso III não identifica quais receitas são 'dadas em garantia'."
    dispositivo_legal: "art. 5.º, inciso III, e art. 8.º da Lei n.º 11.079/2004; art. 23, inciso V, da Lei n.º 8.987/1995"
    referencias_cruzadas: ["EDITAL 6.3", "Contrato 10.7 (ressarcimento prévio à assinatura)"]
    flag_tecnico: false
    flag_reserva: false
  - id: E3-014
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 6.2 (PDF p. 16) × EDITAL 6.3 (p. 16)"
    transcricao: "Contrato: IV - Designação das áreas ... caso sejam de propriedade pública / Edital: iv ... a designação da respectiva área e a obtenção e transferência das Licenças Prévias cuja responsabilidade tenha sido expressamente atribuída ao PODER CONCEDENTE"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Condições da Ordem de Início divergem entre Contrato e Edital"
    comentario: "O Edital inclui como condição a obtenção/transferência de Licenças Prévias a cargo do PC; o Contrato não. O inciso II difere ('contrato de prestação de serviços e nomeação' vs. 'contrato de nomeação de agente de garantia'), o inciso III usa bases diferentes (2 CME vs. 2 Contraprestações Públicas Mensais) e o Edital v remete a uma 'alínea (d)' inexistente."
    dispositivo_legal: "art. 5.º da Lei n.º 14.133/2021; art. 10, inciso VII, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["EDITAL 6.3 i-vi (p. 16)", "Contrato 8.1 II"]
    flag_tecnico: false
    flag_reserva: false
  - id: E3-015
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 6.2, inciso I (PDF p. 16)"
    transcricao: "Publicação do extrato do Contrato na Imprensa Oficial do Município de Porto Velho e no Portal Nacional de Contratações Públicas"
    tipo_achado: CONFORME
    categoria: omissao
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Publicação no PNCP como condição de eficácia"
    comentario: "A exigência de divulgação no PNCP como condição de eficácia está alinhada à Lei 14.133. (Registro de cobertura.)"
    dispositivo_legal: "art. 94 da Lei n.º 14.133/2021"
