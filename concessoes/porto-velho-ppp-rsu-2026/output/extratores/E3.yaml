    dispositivo_editalicio: "Cl. 32.1, 32.2, 32.7 × 15.8.6 (PDF p. 40, 68-69)"
    transcricao: "32.1 A rescisão ... por iniciativa da Concessionária mediante procedimento arbitral ... / 15.8.6 ... sem prejuízo do direito à rescisão judicial do Contrato / 32.7 ... mediante procedimento arbitral ou ação judicial"
