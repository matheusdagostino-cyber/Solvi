    descricao_breve: "Via da rescisão por iniciativa da Concessionária: arbitral × judicial × administrativa"
    comentario: "O Contrato define a arbitragem como via da rescisão (32.1), mas menciona rescisão judicial (15.8.6), ação judicial ou processo administrativo (32.2, 32.7). A indefinição afeta a regra legal de continuidade até decisão final."
