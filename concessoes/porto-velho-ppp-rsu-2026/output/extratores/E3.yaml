    comentario: "A cláusula fala em 'prazos manuais' (provável 'máximos'), não abrange o licenciador municipal e só concede dilação de prazos (sem reequilíbrio de custos). A cl. 10.13.1.1 retira do mesmo risco o aterro sanitário ('demora no licenciamento' sem reequilíbrio)."
