pontos:
  # ===================== QUESTÕES FORMAIS / PREÂMBULO / DEFINIÇÕES =====================
  - id: E3-001
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Capa (PDF p. 2), Preâmbulo (p. 5), cl. 1.3.4, 1.3.26, 1.3.34, 2.1 (p. 7-11)"
    transcricao: "CONCORRÊNCIA Nº [*]/2026 ... Concorrência Pública nº [ • ] ... neste ato legalmente representada pelo Sr. XXX ... o processo administrativo nº [ • ]"
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Placeholders no número da concorrência e do processo administrativo"
    comentario: "A minuta publicada não identifica o número da concorrência nem do processo administrativo, e usa três padrões distintos de lacuna ([*], [ • ], XXX/XXXX/20XX). O número do processo é elemento obrigatório do contrato e condiciona a rastreabilidade dos documentos integrantes (cl. 2.1)."
    dispositivo_legal: "art. 89, § 1.º, da Lei n.º 14.133/2021"
    referencias_cruzadas: ["EDITAL capa e 1.1 (mesmos placeholders)", "ANEXO-VI preâmbulo [*]", "ANEXO-IV preâmbulo Contrato n.º [*]"]
    flag_tecnico: false
    flag_reserva: false
  - id: E3-002
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 15.1.1 (PDF p. 37)"
    transcricao: "Os recursos orçamentários encontram-se previstos na Lei de diretrizes orçamentarias para o ano [ • ] e no plano Plurianual [ • ] ... AÇÃO PROGRAMÁTICA: [ • ] ELEMENTO DESPESA [ • ]; FONTE: [ • ]"
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Dotação orçamentária, LDO e PPA não identificados"
    comentario: "A cláusula de crédito orçamentário está integralmente em branco (LDO, PPA, ação, elemento e fonte), repetindo a lacuna do Edital 5.2. O P7 (p. 72) registra que a formalização da dotação na LDO e no PPA ainda é providência pendente. A ausência impede verificar a compatibilidade da despesa continuada com os instrumentos orçamentários exigidos para PPP."
    dispositivo_legal: "art. 92, inciso VIII, da Lei n.º 14.133/2021; art. 10, incisos III e V, da Lei n.º 11.079/2004; art. 167, inciso II, da CF/1988"
    referencias_cruzadas: ["EDITAL 5.2 (p. 15)", "P7 XII.4 (p. 72)"]
    flag_tecnico: false
    flag_reserva: false
  - id: E3-003
    documento: "ANEXO-B_Contrato / ANEXO-IV_LGPD"
    dispositivo_editalicio: "Capas (PDF p. 1) e rodapés"
    transcricao: "P7: CONTRATO ... 2ª VERSÃO: SÃO PAULO, 08 DE SETEMBRO DE 2026 / P6: ANEXO IV (CONTRATO) ... 2ª VERSÃO: São Paulo, 21 de agosto de 2026"
    tipo_achado: IRREGULAR
    categoria: erro_material
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Minutas com identidade visual do consultor, codificação P6/P7 divergente e datas distintas"
    comentario: "Os anexos contratuais são publicados como produtos do consultor (logo, endereço e contato da PEZCO), com codificação inconsistente (Contrato e Anexo VI como 'P7', Anexo IV como 'P6') e datas diferentes. Como o Edital 2.13.1 resolve divergência entre anexos pelo critério da 'data mais recente', a diferença de datas tem efeito interpretativo (o Anexo IV de 21/08/2026 cederia diante do Contrato de 08/09/2026)."
    dispositivo_legal: "art. 5.º da Lei n.º 14.133/2021 (vinculação ao edital, segurança jurídica)"
    referencias_cruzadas: ["EDITAL 2.13.1 (p. 12)", "ANEXO-VI capa (P7, 08/09/2026)"]
    flag_tecnico: false
    flag_reserva: false
  - id: E3-004
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Preâmbulo, considerandos ii e iii (PDF p. 5)"
    transcricao: "O Tribunal de Contas do Estado julgou irregular a licitação anterior que concedeu a concessão à ECORONDÔNIA AMBIENTAL S/A ... constituída pela empresa Marquise Serviços Ambientais SI A"
    tipo_achado: IRREGULAR
    categoria: erro_material
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Considerandos nomeiam terceiros e não descrevem as determinações do TCE-RO"
    comentario: "O preâmbulo nomeia a antiga concessionária e sua controladora (com erro de grafia 'SI A') e afirma o 'estrito cumprimento' dos Acórdãos APL-TC 00068/24 e 00105/24 (fato documental), mas nenhum dos documentos-alvo descreve quais irregularidades/determinações foram apontadas, impedindo verificar, no plano contratual, se foram sanadas. O P7 (p. 9 e 71-72) indica apenas mudanças de critério de julgamento e supressão de proposta técnica."
    dispositivo_legal: "não localizei fundamento normativo específico"
    referencias_cruzadas: ["EDITAL p. 4 (preâmbulo)", "P7 p. 9, 12, 71-72"]
    flag_tecnico: false
    flag_reserva: false
    nota: "DEPENDE do inteiro teor dos Acórdãos APL-TC 00068/24 e 00105/24 (não anexados) para o cotejo cláusula a cláusula."
