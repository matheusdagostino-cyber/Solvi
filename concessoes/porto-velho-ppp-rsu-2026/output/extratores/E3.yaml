    comentario: "A lei veda interromper ou paralisar os serviços até decisão final na rescisão por iniciativa da concessionária. O Contrato admite suspensão total por medida cautelar (15.8.8) e, na cl. 32.12, interrupção diante de 'qualquer evento que resulte em restrição de caixa ou frustração de receita', o que alcança coleta de RSS e de RSU em áreas sem alternativa."
    dispositivo_legal: "art. 39, parágrafo único, e art. 6.º, §§ 1.º e 3.º, da Lei n.º 8.987/1995; art. 10, inciso VI, da Lei n.º 7.783/1989"
