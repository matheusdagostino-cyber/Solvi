  - id: E3-006
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 1.2 (PDF p. 6)"
    transcricao: "Nos casos de divergência entre as disposições do Contrato e as disposições dos Editais e seus Anexos, prevalecerão as disposições do Contrato e seus Anexos"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Regra de prevalência do Contrato colide com a do Edital"
    comentario: "O Contrato manda prevalecer o Contrato sobre o Edital; o Edital 2.13.1 manda prevalecer o Edital sobre os Anexos (o Contrato é o Anexo B) e, entre anexos, o de data mais recente. Há, portanto, duas regras de desempate incompatíveis, relevantes diante das inúmeras divergências Edital × Contrato (ex.: condições da Ordem de Início)."
    dispositivo_legal: "art. 5.º e art. 92, inciso II, da Lei n.º 14.133/2021"
    referencias_cruzadas: ["EDITAL 2.13.1 (p. 12)", "EDITAL 2.11.2 (EVTEA cede aos Anexos)"]
    flag_tecnico: false
