    comentario: "O Contrato prevê dedução unilateral pelo PC (13.5.7), dedução automática da TRCF (13.1.1), pagamento só da parcela incontroversa (15.7.7) e cálculo pelo VI (23.4.1); nada disso está entre as instruções que o agente aceita. A cl. 5.3 a) remete à cl. 5.2 (obrigações do agente) em vez da 5.1."
    dispositivo_legal: "art. 5.º da Lei n.º 14.133/2021; art. 8.º da Lei n.º 11.079/2004"
    referencias_cruzadas: ["Contrato 13.1.1, 13.5.7, 15.7.7, 23.4.1-23.4.2"]
    flag_tecnico: false
    flag_reserva: false
  - id: E3-147
    documento: "ANEXO-VI_ContaVinculada"
    dispositivo_editalicio: "Cl. 5 (título), 5.5 e 11.1 (PDF p. 5-9)"
    transcricao: "5. OS DIREITOS E OBRIGAÇÕES DA INSTITUIÇÃO FINANCEIRA; RENÚNCIA E DESTITUIÇÃO ... 5.5 O PODER CONCEDENTE e a CONCESSIONÁRIA poderão, conjuntamente ... destituir a INSTITUIÇÃO FINANCEIRA"
    tipo_achado: IRREGULAR
    categoria: omissao
