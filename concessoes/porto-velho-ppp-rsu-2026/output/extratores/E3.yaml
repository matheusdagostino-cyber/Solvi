    comentario: "O objeto contratual e a definição de Serviços mencionam limpeza urbana, mas o rol da cl. 4.2, o Edital e o Caderno de Encargos não contêm varrição, capina, roçada ou congêneres (grep: zero ocorrências de 'varri'/'capina'). A divergência pode gerar exigências fora do escopo precificado ou, inversamente, alegação de exclusão."
    dispositivo_legal: "art. 23, inciso I, da Lei n.º 8.987/1995; art. 92, inciso I, da Lei n.º 14.133/2021"
    referencias_cruzadas: ["EDITAL objeto (p. 1-3)", "ANEXO-A (sem varrição)", "P1 p. 61 (MB Limpeza Urbana executa hoje varrição e poda)"]
    flag_tecnico: false
    flag_reserva: false
  # ===================== ORDEM DE INÍCIO / PRAZO =====================
  - id: E3-011
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 6.1 (PDF p. 16)"
    transcricao: "observado o limite máximo de 35 (trinta e cinco) anos previsto no art. 5º, inciso V, da Lei Federal nº 11.079/2004"
    tipo_achado: IRREGULAR
    categoria: erro_material
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Citação errada do inciso que fixa o prazo da PPP"
    comentario: "O prazo de 5 a 35 anos está no inciso I do art. 5.º da Lei 11.079; o inciso V trata de mecanismos de atualidade. O mesmo erro consta do Edital 6.1."
    dispositivo_legal: "art. 5.º, inciso I, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["EDITAL 6.1 (p. 15)"]
