    comentario: "O Contrato exige que a Concessionária dê ao VI (contratado por ela) acesso a todas as bases, e que dados de medição circulem entre ARDPV, agente e mesa de conflitos; o acordo veda repasse a terceiros sem ressalvar esses fluxos. Usa ainda o termo 'CONTRATADA', não definido."
