    comentario: "A base de indenização exclui juros capitalizados, margem de construção e despesas anteriores à SPE e adota amortização linear pelo menor prazo entre termo e vida útil. Isso pode reduzir a indenização abaixo do saldo contábil do ativo financeiro (ICPC 01) que o P6 projeta, com impacto na bancabilidade."
    dispositivo_legal: "art. 36 da Lei n.º 8.987/1995; art. 10-A, inciso III, da Lei n.º 11.445/2007"
    referencias_cruzadas: ["P6 p. 47 (ativo financeiro ICPC 01)"]
