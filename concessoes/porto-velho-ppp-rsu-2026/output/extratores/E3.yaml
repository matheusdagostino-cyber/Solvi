    tema_sugerido: REGULACAO_FISCALIZACAO
    descricao_breve: "Restituição/eliminação de dados a qualquer tempo, em conflito com deveres legais de guarda"
    comentario: "A devolução a pedido, a qualquer tempo, e a vedação de cópias conflitam com a guarda obrigatória de registros trabalhistas, MTR e bases de IQD auditáveis (Contrato 41.16, 10.2.36), e com a exceção de cumprimento de obrigação legal do próprio acordo (4.1)."
    dispositivo_legal: "art. 16, inciso I, da Lei n.º 13.709/2018"
