    transcricao: "3.1 ... conta corrente vinculada ... em nome do PODER CONCEDENTE / 4.3 ... os recursos depositados na CONTA GARANTIA serão de propriedade da CONCESSIONÁRIA ... considerados como patrimônio de afetação / 5.3 d) ... detendo apenas a posse"
