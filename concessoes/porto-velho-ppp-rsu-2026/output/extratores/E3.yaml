  # ===================== ANEXO IV — LGPD =====================
  - id: E3-148
    documento: "ANEXO-IV_LGPD"
    dispositivo_editalicio: "Cl. 2.1, 3.6 e 10.1 (PDF p. 4-5, 8)"
    transcricao: "figurando a CONCESSIONÁRIA como parte OPERADORA e o PODER CONCEDENTE como parte CONTROLADORA ... 3.6 ... Nessa situação, a CONCESSIONÁRIA será a única responsável pelo tratamento dos DADOS ... 10.1 ... sendo-lhe vedada a adoção de qualquer providência para o seu atendimento"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: REGULACAO_FISCALIZACAO
    descricao_breve: "Concessionária qualificada só como operadora, embora decida finalidades e meios em vários tratamentos"
    comentario: "A Concessionária decide sobre dados de empregados, cooperados, SAC, telemetria, câmeras e MTR em sua operação própria, atuando como controladora nesses casos; o acordo a qualifica só como operadora e a proíbe de atender titulares. A cl. 3.6 a torna 'única responsável' por dados anonimizados, que não são dados pessoais."
    dispositivo_legal: "art. 5.º, incisos VI, VII e IX, art. 12, art. 18 e art. 39 da Lei n.º 13.709/2018"
    referencias_cruzadas: ["Contrato 10.2.36 (dados em tempo real)", "Contrato 14.1.5 (canais de atendimento)"]
    flag_tecnico: false
    flag_reserva: false
  - id: E3-149
    documento: "ANEXO-IV_LGPD"
    dispositivo_editalicio: "Cl. 4.1 a 4.3 (PDF p. 5)"
    transcricao: "A CONCESSIONÁRIA está autorizada a realizar o tratamento dos DADOS tão somente em consonância com o previsto no presente instrumento, no CONTRATO e seus anexos"
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: REGULACAO_FISCALIZACAO
    descricao_breve: "Acordo não descreve dados, titulares, finalidades, bases legais e prazos de retenção"
    comentario: "O 'escopo do tratamento' é genérico: não há inventário de categorias de dados (incluindo dados sensíveis, ex.: saúde em RSS e dados socioeconômicos de catadores), titulares, finalidades, hipóteses legais do tratamento pelo poder público nem prazos de retenção. Faltam as instruções que delimitam a atuação do operador."
    dispositivo_legal: "arts. 7.º, 11, 23, 37 e 39 da Lei n.º 13.709/2018"
    referencias_cruzadas: ["Contrato 10.2.33 (cadastro de cooperativas)", "Contrato 8.8 iii (MTR)"]
    flag_tecnico: false
    flag_reserva: false
