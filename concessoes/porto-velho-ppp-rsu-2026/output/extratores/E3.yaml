  - id: E3-036
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 8.6.1.1 e 8.6.3 (PDF p. 18-19)"
    transcricao: "Entendem-se por passivos ambientais preexistentes aqueles cujo fato gerador seja anterior à emissão da Ordem de Início"
