    descricao_breve: "Jirau: sem prazo para disponibilização pelo PC e sem teto para o encargo da Concessionária"
    comentario: "O Contrato não fixa prazo para o PC disponibilizar o Jirau (a Matriz TO-02 fala em Mês 24 da OI; o P6 espera operação no ano 3), nem regra de efeitos do atraso no ramp-up da Parcela A e no OPEX logístico (DMT 255–378 km até o Ecoparque). Ao contrário da Vila Princesa, os custos de recuperação do Jirau atribuídos à Concessionária (8.8 ii) não têm teto, embora o laudo indique 5 áreas suspeitas."
