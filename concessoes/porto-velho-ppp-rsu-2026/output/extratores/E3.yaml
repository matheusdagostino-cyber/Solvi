  # ===================== TRANSFERÊNCIA DE CONTROLE / FINANCIADORES =====================
  - id: E3-116
    documento: "ANEXO-B_Contrato"
    dispositivo_editalicio: "Cl. 24.1.1 e 24.2 (PDF p. 54)"
    transcricao: "Considera-se previamente autorizada pelo Poder Concedente a eventual transferência de controle da Concessionária para terceira sociedade que integre o grupo econômico de sócia original da SPE"
    tipo_achado: IRREGULAR
    categoria: ilegalidade
    tema_sugerido: HABILITACAO
    descricao_breve: "Transferência de controle intragrupo pré-autorizada, sem verificação de requisitos; só 'controle direto'"
    comentario: "A lei exige anuência prévia e verificação de capacidade técnica, idoneidade financeira e regularidade jurídica e fiscal do pretendente. A pré-autorização genérica dispensa essa verificação, e a cl. 24.1.1 alcança apenas o controle direto, deixando sem controle as mudanças de controle indireto."
    dispositivo_legal: "art. 27, caput e § 1.º, incisos I e II, da Lei n.º 8.987/1995"
    referencias_cruzadas: ["Contrato 1.3.22 (definição de Controle)"]
    flag_tecnico: false
    flag_reserva: true
    nota: "Reserva: flexibilidade favorece grupos com várias sociedades."
