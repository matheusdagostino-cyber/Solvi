    transcricao: "a sustentabilidade fiscal ... foi atestada em conformidade com o art. 28 da Lei Federal nº 11.079/2004 ... estando devidamente abrigado na margem fiscal liberada pela extinção do Contrato nº 019/PGM/2024"
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "Limite de 5% da RCL afirmado sem indicação do percentual nem das demais PPPs do Município"
    comentario: "O considerando atesta conformidade com o art. 28 da Lei 11.079 sem indicar o percentual (Edital: 3,18%) nem o somatório das despesas de todas as PPPs municipais vigentes e projetadas nos 10 anos seguintes. A referência à 'margem liberada' pelo contrato anulado (P6: 4,46% da RCL) não substitui o cômputo global."
    dispositivo_legal: "art. 28 da Lei n.º 11.079/2004; art. 10, inciso I, alínea 'b', da Lei n.º 11.079/2004"
    referencias_cruzadas: ["EDITAL 5.1.1 (3,18% RCL)", "P6 p. 6 (CAPAG C; 4,46% RCL do contrato anulado)"]
