  # ===================== ANEXO VI — CONTA VINCULADA / GARANTIA =====================
  - id: E3-141
    documento: "ANEXO-VI_ContaVinculada"
    dispositivo_editalicio: "Nota preliminar (PDF p. 3)"
    transcricao: "esta 'minuta de contrato de nomeação de agente de pagamento e administração de conta vinculada' é meramente exemplificativa e poderá ser livre e inteiramente alterada pelo PODER CONCEDENTE, pela CONCESSIONÁRIA e/ou pela INSTITUIÇÃO FINANCEIRA"
    tipo_achado: IRREGULAR
    categoria: ilegalidade
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Mecanismo de garantia pública declarado não vinculante e livremente alterável"
    comentario: "A garantia da contraprestação, que deve estar especificada no edital, pode ser 'livre e inteiramente' alterada depois da licitação, inclusive por só uma das partes ('e/ou'). Isso contradiz o Contrato, que manda o Anexo VI reger a garantia (23.3) e integrar o Contrato (10.2.31), e impede a precificação do risco de crédito público pelos licitantes."
    dispositivo_legal: "art. 11, parágrafo único, e art. 8.º da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021"
    referencias_cruzadas: ["Contrato 10.2.31, 23.3", "P6 Tabela 19 ('a definir na estruturação contratual')"]
    flag_tecnico: false
    flag_reserva: false
  - id: E3-142
    documento: "ANEXO-VI_ContaVinculada"
    dispositivo_editalicio: "Considerandos (PDF p. 3), cl. 4.5 e 5.4 (p. 5-6)"
    transcricao: "promover, em favor da CONCESSIONÁRIA, a cessão fiduciária dos direitos presentes e futuros relativos às receitas ... de repasses do Fundo de Participação do Município (FPM), com fundamento na autorização outorgada pelo artigo 159, I, 'b', da Constituição Federal ... nos termos do artigo 54, I, da Lei municipal nº 592/2015"
    tipo_achado: IRREGULAR
    categoria: ilegalidade
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Cessão fiduciária de FPM com fundamento constitucional inadequado"
    comentario: "O art. 159, I, 'b', apenas reparte o produto do IR e do IPI para o FPM; não autoriza cessão a particulares. A vinculação de recursos do art. 159 só é admitida para garantia à União. Lei municipal (LC 592/2015) não supera a vedação constitucional. Também há contradição interna: o FPM é usado 'exclusivamente quando configurado o inadimplemento' (4.1), mas também no depósito inicial (3.2) e na recomposição automática (4.5)."
    dispositivo_legal: "art. 167, inciso IV e § 4.º, e art. 159, inciso I, alínea 'b', da CF/1988; art. 8.º, inciso I, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["Contrato 23.2 III", "P6 p. 59-61"]
    flag_tecnico: false
    flag_reserva: false
  - id: E3-143
    documento: "ANEXO-VI_ContaVinculada"
    dispositivo_editalicio: "Preâmbulo, cl. 2.1, 4.1, 5.6, 6.1, 15.1 (PDF p. 3-9)"
    transcricao: "[*], neste ato representado ... doravante denominada simplesmente 'INSTITUIÇÃO FINANCEIRA' ... Contrato de Gerenciamento da Conta Vinculada estabelecido com o [*] ... remuneração mensal de R$ [*] ... até [*] de cada mês"
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Agente, remuneração, data de pagamento e endereços em branco; captura do FPM sem viabilidade operacional demonstrada"
    comentario: "O agente não é identificado; a captura do FPM depende de o repasse ser creditado na mesma instituição (domicílio bancário do FPM) ou de ordem irrevogável de transferência, o que não está estruturado. A remuneração do agente (paga pelo PC, reajustada pelo INPC) e a data de pagamento ficam em aberto, esta divergente do dia 15 do Contrato (15.6)."
    dispositivo_legal: "art. 8.º e art. 11, parágrafo único, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["Contrato 15.6", "P6 Tabela 19 ('instituição financeira a definir')"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Falta: banco do domicílio do FPM de Porto Velho e minuta do Contrato de Gerenciamento da Conta Vinculada."
