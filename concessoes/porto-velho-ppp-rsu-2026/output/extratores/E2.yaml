    comentario: "O denominador comum é 'horas de operação do aterro', sem dizer qual. Nos Anos 1 a 4 o aterro é o Ecoparque, privado e fora da gestão da concessionária. O IO3 (funcionamento da triagem da CTR) tem meta de 100% desde o Ano 2, quando a CTR e a UVR estão só 50% implantadas (Tabela 3). Balanças de transbordos e unidades distritais não entram no IO2."
