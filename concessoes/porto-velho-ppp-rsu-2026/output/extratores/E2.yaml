  # ======================= ANEXO D — INDICADORES DE DESEMPENHO =======================
  - id: E2-050
    documento: "ANEXO-D"
    dispositivo_editalicio: "Seção VI — IQS e Remuneração (p. 21)"
    transcricao: "IQS = [IC1 + IC2] + [IO1 + IO2 + IO3 + IO4 + IO5] + [IQ1 + IQ2 + IQ3 + IQ4] + [IE1 + IE2 + IE3 + IE4 + IE5 + IE6]"
    tipo_achado: IRREGULAR
    categoria: erro_material
    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "Fórmula do IQS soma percentuais brutos, sem pesos e sem normalizar pela meta"
    comentario: "A fórmula soma os 17 indicadores em pontos percentuais e não aplica os pesos da Tabela 5 (que somam 100%) nem compara cada resultado com a meta do ano. O resultado é um número sem escala (até ~1.700) que não se converte em fator de remuneração. O próprio texto diz que cada indicador 'deverá ser comparado com a respectiva meta', mas a regra de comparação e de pontuação não existe."
    dispositivo_legal: "art. 5.º, inciso VII, e art. 6.º, § 1.º, da Lei n.º 11.079/2004; art. 23, inciso III, da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-D Tabela 5 (p. 14)", "ANEXO-B cl. 15.5 e 15.5.1 (p. 37-38)"]
    flag_tecnico: false
    flag_reserva: false
    nota: ""
