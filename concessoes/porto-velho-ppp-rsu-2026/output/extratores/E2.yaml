    transcricao: "Ecoparque — CTR Porto Velho S/A | Disposição final de RSU | Ativo/licenciado | LAO nº 016.00130.006/2024-SUL válida até outubro/2028"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: OBJETO_ESCOPO
