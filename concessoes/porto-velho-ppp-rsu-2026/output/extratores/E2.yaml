  - id: E2-059
    documento: "ANEXO-D"
    dispositivo_editalicio: "IE3 Jirau e IE4 Incinerador (p. 14, 19)"
    transcricao: "IE3 – ATIVAÇÃO ATERRO DO JIRAU | Recuperação e Reativação do Aterro do Jirau - CAPEX"
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
