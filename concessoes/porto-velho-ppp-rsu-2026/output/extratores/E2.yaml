    comentario: "O Contrato faz do parecer do VI requisito de decisões da Entidade Reguladora (8.10, 10.9, 10.13.2) e exige aprovação conjunta do órgão ambiental e do VI para apurar o excedente do GAC (8.6.1.2.2), o que dá ao VI papel decisório. O Anexo VII qualifica a ARDPV como meio de atuação do Poder Concedente. Ambos tensionam a independência e as funções próprias do regulador. O Contrato (41.2) afirma que o VI não substitui o regulador."
