    comentario: "O Caderno exige quatro transbordos distritais com piso impermeável, drenagem, cobertura, balança, cercamento, iluminação e controle de acesso, além do transbordo principal. O P6 orça 'Estação de Transbordo Distrital — construção' em R$ 50 mil (Ano 1) e R$ 50 mil (Ano 2), e o principal em R$ 450 mil. O Anexo D (Tabela 3 e IE2) mede uma única 'Estação de Transbordo' em 100% no Ano 1. O Anexo III (Tabela 6) aponta falta de ETRs também no Alto e no Médio Madeira, o que o Caderno não trata."
