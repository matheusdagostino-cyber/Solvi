    comentario: "Para 2028: (0,568 x 0,60 + 0,10) x 2,29% ≈ 1,01%, e não os 2,29% da Tabela 5. O texto anterior diz que a triagem mecanizada sozinha recupera '10% de todo resíduo', valor acima da própria meta de 2040 (7,84%). O P6 adota outra regra (Meta 6 x 70%). Não há fórmula de cálculo do indicador observado (massa recuperada sobre massa coletada), só da meta."
    dispositivo_legal: "art. 5.º, inciso VII, da Lei n.º 11.079/2004"
