    documento: "ANEXO-D"
    dispositivo_editalicio: "Tabela 5 (p. 14) x item V.1.4 (p. 19-20); Tabela 2 (p. 9)"
    transcricao: "Tabela 5: 'IE4 2,20% INCINERADOR – REC. E ATIVAÇÃO' / 'IE5 2,60% VILA PRINCESA' x V.1.4: 'IE4 – IMPLANTAÇÃO DO GAC' / 'IE6 – DESATIVAÇÃO DO CENTRO DE TRIAGEM'"
