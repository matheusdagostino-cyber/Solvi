    comentario: "O relatório anual deve ser entregue no mesmo dia em que termina o período avaliado (31/out). O Anexo D concentra em novembro e dezembro a auditoria do VI, a defesa e a homologação, para aplicar descontos de janeiro a dezembro. O Anexo VII fixa o relatório do VI até o 15º dia útil após o fim do ano civil (janeiro), e o Contrato (15.7.5) prevê 10 + 10 dias de contestação. As datas não fecham."
    dispositivo_legal: "art. 5.º, inciso VII, e art. 6.º, § 1.º, da Lei n.º 11.079/2004"
