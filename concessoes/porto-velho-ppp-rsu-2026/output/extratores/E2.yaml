    comentario: "O primeiro parágrafo diz que o Anexo 'estabelece as diretrizes ... que deverão orientar'. O segundo, que apresenta orientações que 'poderão auxiliar', e o objeto (II.1) é 'auxiliar a compreensão de obrigações'. Ao mesmo tempo, fala em 'obrigações editalícias verificáveis', o Edital (2.11.2) o faz prevalecer sobre o EVTEA e o Edital (3.1.3) incorpora suas Cláusulas Sociais e Programas ao objeto. Não está claro quais itens (compostagem de 80-120 t/dia, PA-09, PCS 0,5%) são vinculantes."
    dispositivo_legal: "art. 5.º da Lei n.º 14.133/2021 (vinculação ao edital e segurança jurídica); art. 18, inciso II, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004"
    referencias_cruzadas: ["EDITAL itens 2.11.2 (p. 12) e 3.1.3 (p. 14)", "ANEXO-B cl. 8.8 (p. 19-20)"]
    flag_tecnico: false
