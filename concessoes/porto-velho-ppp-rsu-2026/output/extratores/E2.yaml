    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "Não há regra de conversão do IQS em desconto, nem definição da parcela sujeita; Anexo D e Contrato remetem um ao outro"
    comentario: "O Anexo D remete os limites e a parcela sujeita ao Contrato. O Contrato (15.5 e 15.5.1) fixa desconto máximo de 10% como 'parâmetro de referência' e diz que 'o valor definitivo' observará o Anexo D, que não traz curva, faixas nem percentual. Também não se define se o desconto incide sobre a contraprestação total ou só sobre a Parcela A ou a B. O mecanismo de pagamento por desempenho fica inoperável."
    dispositivo_legal: "art. 5.º, inciso VII, e art. 6.º, § 1.º, da Lei n.º 11.079/2004; art. 18, inciso VIII, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-B cl. 15.5, 15.5.1 e 15.5.2 (p. 37-38)"]
    flag_tecnico: false
    flag_reserva: true
    nota: "RESERVA: sem regra de conversão, a aplicação de qualquer desconto é contestável, o que favorece a concessionária. A impugnação levaria à definição da regra."
  - id: E2-052
    documento: "ANEXO-D"
    dispositivo_editalicio: "Item V.1.2 — IO4 RSS Destinação Adequada (p. 17)"
    transcricao: "IO4 = TO14 = RSSC / RSSI x 100 ... RSSC = Quantidade de Resíduos de Serviços de Saúde coletados; RSSI = Quantidade de Resíduos de Serviços de Saúde incinerados"
    tipo_achado: IRREGULAR
    categoria: erro_material
    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "IO4 com fórmula invertida e dependente de incineração"
    comentario: "A fórmula divide o coletado pelo incinerado. Se parte do RSS não for tratada, o índice passa de 100%, premiando a falha. Se o RSS for tratado por autoclave, como prevê o objeto (Edital 3.1, viii), o denominador é zero. O correto seria tratado sobre coletado, com qualquer tecnologia licenciada."
    dispositivo_legal: "art. 5.º, inciso VII, da Lei n.º 11.079/2004; Resolução CONAMA n.º 358/2005"
    referencias_cruzadas: ["EDITAL item 3.1, viii", "ANEXO-B cl. 10.2.26.1 (p. 25)", "E2-010"]
    flag_tecnico: false
    flag_reserva: false
    nota: ""
  - id: E2-053
    documento: "ANEXO-D"
    dispositivo_editalicio: "Item V.1.2 — IO5 Derramamento de chorume (p. 17)"
    transcricao: "IO5 = SA04 = 1 - [QODC / QRRM x 100]"
    tipo_achado: IRREGULAR
    categoria: erro_material
    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "Fórmula do IO5 dá resultados negativos (erro de parênteses)"
    comentario: "Com zero ocorrências o IO5 vale 1, e não 100 como exige a meta da Tabela 5. Com 1 ocorrência em 100 rotas vale 0, e com 2 vale -1. A forma coerente com a meta seria (1 - QODC/QRRM) x 100. Também não se define a unidade de 'rota em rodovia ou rio'."
    dispositivo_legal: "art. 5.º, inciso VII, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-D Tabela 5, IO5 (p. 14)"]
