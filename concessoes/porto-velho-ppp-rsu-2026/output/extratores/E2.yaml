    descricao_breve: "Jirau: disponibilização sem prazo nem conteúdo, mas medida e remunerada como concluída no Ano 2"
    comentario: "O Contrato (8.6.2) põe a cargo do Poder Concedente a 'reativação e a regularização fundiária, ambiental e administrativa' do Jirau, sem prazo. O Anexo D mede a reativação (IE3) em 100% a partir do Ano 2, o P6 aloca R$ 5,0 mi no Ano 2 e baseia nele o ramp-up da Parcela A, e o Caderno manda a coleta do Alto Madeira ao Jirau (Figura 8). O Caderno não tem seção sobre o Jirau: faltam capacidade, vida útil, projeto e escopo da 'recuperação'. Não está definido o que significa 'disponibilização', nem o regime de destinação e de remuneração enquanto ela não ocorre."
    dispositivo_legal: "art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 18, incisos I e XI, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-B cl. 8.6.2 (p. 19)", "P6 p. 40 (item 4.2.1) e p. 48", "ANEXO-D Tabelas 3 e 5", "ANEXO-V risco 'Jirau' (p. 3)"]
    flag_tecnico: true
    flag_reserva: false
    nota: "Esclarecimento dirigido sugerido: conteúdo da 'disponibilização', prazo e efeito sobre IE3 e Parcela A."
