    comentario: "O Caderno não diz quem fornece a área da CTR. O P2 (p. 36) localiza a CTR em ponto certo, 'em frente ao atual Central de Triagem na Vila Princesa, BR-364 km 10', com coordenadas. O Anexo III (Tabela 3) a chama de 'CTR-PV Municipal (futuro) — Em implantação', com layout de fonte 'PMPV', e o P1 registra visita ao 'Local do Futuro Aterro Municipal'. Já o Edital (6.3.1) e o Contrato (5.1.1.1 e 10.13.1.1) atribuem à concessionária a obtenção da área por sua conta e risco, sem reequilíbrio. Não há indicação de quem arca com eventual desapropriação."
