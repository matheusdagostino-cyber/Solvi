    comentario: "O Caderno usa 'CTR Porto Velho' como destino (Tabela 19; Figura 9: 'Aterro Sanitário CTR Porto Velho'), e a mesma denominação é a razão social do aterro privado em operação. O Contrato 10.13.1 permite cumprir a obrigação de aterro adquirindo aterro existente ou participação societária, e o Contrato 10.9 obriga a concessionária a manter as condicionantes da LAO do Ecoparque por todo o prazo. A ambiguidade deixa indefinido se o objeto exige construir o aterro de rejeitos ou permite usar ou adquirir o aterro privado."
    dispositivo_legal: "art. 18, incisos I e XV, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021 (isonomia e competitividade)"
