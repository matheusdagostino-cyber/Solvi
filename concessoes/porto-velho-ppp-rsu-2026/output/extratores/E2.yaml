  - id: E2-002
    documento: "ANEXO-A / ANEXO-III / ANEXO-D / ANEXO-VII"
    dispositivo_editalicio: "Capas: Caderno (p. 1), Diretrizes Ambientais (p. 1), Indicadores (p. 1), TR do VI (p. 1)"
    transcricao: "1º REVISÃO, SÃO PAULO, 11 DE SETEMBRO DE 2026 (Caderno); 1ª REVISÃO, SÃO PAULO, 10 DE SETEMBRO DE 2026 (Anexo III)"
    tipo_achado: DEPENDE_DE_FATO
    categoria: contradicao
    tema_sugerido: QUESTOES_FORMAIS
    descricao_breve: "Anexos com revisão posterior à data do Edital (2ª versão, 08/09/2026)"
    comentario: "O Caderno (revisão de 11/09/2026) e o Anexo III (revisão de 10/09/2026) são posteriores ao Edital (2ª versão de 08/09/2026). Anexo D (1ª versão, 01/09/2026) e Anexo VII (2ª versão, 21/08/2026) têm datas próprias. É preciso confirmar qual versão de cada anexo foi efetivamente publicada e submetida à consulta pública, e se a republicação de anexos alterados observou a reabertura de prazo."
    dispositivo_legal: "art. 55, § 1.º, da Lei n.º 14.133/2021 (modificação do edital exige divulgação e reabertura de prazo quando afetar a formulação das propostas); art. 10, inciso VI, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["EDITAL capa (p. 1): '2ª VERSÃO: SÃO PAULO, 08 DE SETEMBRO DE 2026'"]
    flag_tecnico: false
    flag_reserva: false
    nota: "Falta o histórico de publicação (DOM/PNCP) de cada anexo para decidir."
  - id: E2-003
    documento: "ANEXO-A"
    dispositivo_editalicio: "Item I — Disposições Gerais (p. 7); Seções V.2 e V.3 (p. 25-27)"
    transcricao: "O Caderno não tem por objetivo substituir estudos de viabilidade, plano de negócios, matriz de riscos, anexos de indicadores, mapas executivos completos ou projeto executivo das obras."
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: OBJETO_ESCOPO
    descricao_breve: "Caderno não especifica, quantifica, localiza nem cronograma as obras que o Edital diz estarem nele definidas"
    comentario: "O Edital (item 3.1) e o Contrato (cl. 4.2) dizem que os investimentos são 'exclusivamente aqueles relacionados, especificados, quantificados, localizados e cronogramados no Caderno de Encargos'. O Caderno, porém, só traz encargos qualitativos para a CTR, a UVR com triagem mecanizada, o pátio de compostagem, o CDR, a autoclave e o aterro de rejeitos: não há capacidades, áreas, prazos nem especificações mínimas. Em concessão precedida de obra pública, o edital deve conter elementos do projeto básico que permitam caracterizar a obra."
    dispositivo_legal: "art. 18, inciso XV, da Lei n.º 8.987/1995 c/c art. 11, caput, da Lei n.º 11.079/2004; art. 23, parágrafo único, inciso I, da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004; art. 6.º, inciso XXV, da Lei n.º 14.133/2021"
    referencias_cruzadas: ["EDITAL item 3.1 'Investimentos em Infraestrutura' (p. 13)", "EDITAL item 3.1.4 (p. 14)", "ANEXO-B cl. 4.2.1 e 4.2.1.1 (p. 13)", "EDITAL item 2.11.2 (p. 12) — Caderno prevalece sobre o EVTEA"]
    flag_tecnico: true
    flag_reserva: true
    nota: "RESERVA: pela combinação do Edital 3.1.4 com o Contrato 4.2.1.1, investimento não especificado nos Anexos só seria exigível mediante reequilíbrio. A indefinição do Caderno abre espaço para a concessionária pleitear recomposição sobre componentes (UVR mecanizada, CDR, autoclave, compostagem) que não estão quantificados. Impugnar este ponto pode eliminar essa margem."
  - id: E2-004
    documento: "ANEXO-A"
    dispositivo_editalicio: "Item XI.5 — Cronograma Físico-Financeiro (p. 62-63)"
    transcricao: "A concessionária deverá elaborar e manter atualizado o cronograma físico-financeiro da concessão"
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: OBJETO_ESCOPO
    descricao_breve: "Não há cronograma físico-financeiro de obras no edital; sua elaboração é transferida à concessionária"
    comentario: "O Contrato (cl. 7.1 e 7.3) remete a um 'cronograma físico-financeiro constante dos Anexos' e a um 'Cronograma de Execução (Anexo)', que não constam da relação de anexos do Edital (itens 2.8 e 2.9). O Caderno apenas lista as fases e atribui à concessionária a elaboração do cronograma. Os únicos marcos estão espalhados no Anexo D (Tabela 3), no Anexo III (Tabelas 10 e 11) e no P6, e divergem entre si (E2-073)."
    dispositivo_legal: "art. 23, parágrafo único, inciso I, da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004; art. 18, inciso I, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-B cl. 7.1 e 7.3 (p. 17)", "EDITAL itens 2.8 e 2.9 (p. 11)", "ANEXO-D Tabela 3 (p. 10)"]
    flag_tecnico: true
    flag_reserva: false
    nota: ""
  - id: E2-005
    documento: "ANEXO-A"
    dispositivo_editalicio: "Item XI.6 — Ramp-up da Parcela A (p. 63-64)"
    transcricao: "Na ausência de definição específica, os percentuais deverão ser apresentados pela concessionária em proposta de cronograma físico-financeiro e submetidos à aprovação do Poder Concedente antes do início da operação."
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "Ramp-up da Parcela A: marcos do Caderno não coincidem com o Contrato nem com o P6"
    comentario: "O Caderno condiciona a Parcela A a oito marcos físicos (frota, transbordo principal, quatro transbordos distritais, sistemas, operação plena, reposição do Ano 25). Esses marcos não incluem a CTR, o Jirau, a Vila Princesa nem o incinerador, e os percentuais ficam para definição posterior, inclusive por proposta da própria concessionária. O Contrato (cl. 15.6.2) fixa a Parcela A reduzida nos Anos 1-2 e integral a partir do Ano 3. O P6 (p. 47-48) fixa 60%/80%/100% por ano, com base na CTR e no Jirau, sem vínculo com aceite. São três regras incompatíveis para o mesmo pagamento."
    dispositivo_legal: "art. 7.º, caput e § 1.º, da Lei n.º 11.079/2004 (contraprestação precedida da disponibilização do serviço); art. 5.º, inciso IV, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["ANEXO-B cl. 15.5.2.1, 15.6.2 e 15.6.4 (p. 38)", "P6 p. 47-48 (ramp-up 60/80/100)"]
    flag_tecnico: false
    flag_reserva: true
    nota: "RESERVA: no Contrato, a Parcela A cresce por decurso de tempo e não por aceite de ativos, o que favorece a concessionária. O Caderno vincula a Parcela A a aceite. A decisão de suscitar a contradição cabe ao advogado."
  - id: E2-006
    documento: "ANEXO-A"
    dispositivo_editalicio: "Item XI.3 — Reposição da frota e dos ativos no Ano 25 (p. 61); item XI.6, marco 8 (p. 63)"
