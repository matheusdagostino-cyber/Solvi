    referencias_cruzadas: ["ANEXO-B cl. 41.2 (p. 78), 8.6.1.2.2 (p. 18), 8.10 (p. 20), 10.9 e 10.13.2 (p. 30-31)"]
    flag_tecnico: false
    flag_reserva: false
    nota: "A classificação depende do rol de funções indelegáveis da NR ANA 7/2024 (conferir na Fase 2)."
