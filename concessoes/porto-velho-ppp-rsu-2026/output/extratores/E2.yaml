    dispositivo_editalicio: "Tabela 5, dimensão Estrutural (IE1-IE6, peso 20%) (p. 14); item V.1.4 (p. 19-20)"
    transcricao: "IE1 = EI / EPI x 100 ... EI = Etapas Implantadas; EPI = Etapas Previstas de Implantação no Período"
    tipo_achado: IRREGULAR
    categoria: risco_economico
    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "Indicadores estruturais (20% do IQS) ficam em 100% depois de concluídas as obras e medem etapas de projetos ainda a aprovar"
    comentario: "Depois do Ano 8 (CTR) e dos Anos 1 a 4 (demais obras), os seis indicadores estruturais ficam fixos em 100% até o Ano 30, sem medir desempenho. Em vários casos o denominador são 'etapas previstas no projeto ... aprovado', ainda inexistente e elaborado pela própria concessionária. O monitoramento E6 da Vila Princesa (10 anos) não é medido."
