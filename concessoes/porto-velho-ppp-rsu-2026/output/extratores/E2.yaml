    comentario: "Se o Ano 1 é 2027, o Ano 13 é 2039, não 2040. Os Anos 9, 11 e 12 não têm meta. No Ano 1, IC1, IC2, IO2, IO3, IO4, IQ1, IQ2 e todos os IE (exceto IE2) estão em branco, sem regra de redistribuição dos pesos. O cálculo anual do IQS fica indeterminado em vários exercícios."
