  - id: E2-041
    documento: "ANEXO-A"
    dispositivo_editalicio: "Item I, § 3.º (p. 7); item X.6.1 (p. 42); item X.6.12 (p. 50)"
    transcricao: "A ausência de detalhamento específico sobre uma situação operacional não dispensa a concessionária de adotar solução compatível com a boa técnica, com a legislação aplicável, com o contrato e com as determinações da fiscalização e da agência reguladora competente."
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Obrigações 'mínimas' abertas a exigências adicionais da fiscalização, em conflito com a regra de investimentos fechados do Edital"
    comentario: "O Caderno qualifica todas as obrigações como mínimas, sujeitas a 'exigências adicionais' e 'atos da fiscalização', e trata como 'falha de gestão' a omissão em propor revisões. O Edital (3.1.4) e o Contrato (4.2.1.1) dizem que investimento não previsto nos anexos não é exigível sem reequilíbrio. As duas lógicas conflitam na alocação do risco de escopo."
    dispositivo_legal: "art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 10-A, inciso IV, da Lei n.º 11.445/2007"
    referencias_cruzadas: ["EDITAL item 3.1.4 (p. 14)", "ANEXO-B cl. 4.2.1.1 (p. 13)"]
    flag_tecnico: false
    flag_reserva: true
    nota: "RESERVA: prevalecendo a regra do Edital 3.1.4, toda exigência adicional da fiscalização gera direito a reequilíbrio."
