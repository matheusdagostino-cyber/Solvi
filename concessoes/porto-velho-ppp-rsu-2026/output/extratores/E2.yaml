    comentario: "A meta de 100% no Ano 2 para Jirau e incinerador depende da 'disponibilização' do Jirau (Contrato 8.6.2) e da entrega do incinerador por termo (Caderno XI.4). O Anexo D não prevê neutralização do indicador em caso de atraso do Poder Concedente. Há excludentes genéricas no Contrato (5.1.2 e 26.30), cuja aplicação ao IQS não é explícita."
