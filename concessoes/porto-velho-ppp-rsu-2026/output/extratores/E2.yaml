    comentario: "O Anexo D exige CTR 50% implantada e Jirau reativado no Ano 2. Aterro sanitário costuma exigir EIA/RIMA, com prazo de análise de até 12 meses por licença. Não há cronograma de licenciamento nem regra que suspenda os indicadores estruturais durante a tramitação; o Contrato (26.30) só isenta atrasos que excedam os prazos legais por mora exclusiva do órgão."
