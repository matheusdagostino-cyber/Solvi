    flag_tecnico: false
    flag_reserva: true
    nota: "RESERVA: licitante ligado ao único aterro licenciado da Sede (Ecoparque) ou com acordo de aquisição tem vantagem de custo e de prazo, porque evita licenciar aterro novo. A decisão de suscitar é do advogado."
  - id: E2-015
