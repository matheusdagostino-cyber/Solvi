    dispositivo_editalicio: "Item VI.1.1, §§ 3.º e 4.º, e VI.1.2 (p. 21)"
    transcricao: "Caso o período de operação no primeiro ano seja inferior a 3 (três) meses, o Poder Concedente poderá optar por aglutinar esta fração inicial ao ciclo anual subsequente"
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: REMUNERACAO_REAJUSTE
    descricao_breve: "Sem regra para o último Ano de Desempenho e com opção discricionária no primeiro"
    comentario: "Os efeitos do IQS são aplicados só no ano civil seguinte. Não há regra para o desempenho do último ano, cujo efeito cairia depois do término (compensação na garantia ou na indenização?). No primeiro ano, a aglutinação fica a critério do Poder Concedente, sem parâmetro."
