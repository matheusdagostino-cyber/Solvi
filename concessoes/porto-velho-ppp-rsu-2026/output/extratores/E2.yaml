    transcricao: "Anexo D: 'a data de entrega final será o último dia do mês de outubro de cada ano' / 'Ano de Desempenho — compreenderá o intervalo entre 1º de novembro e 31 de outubro' x Anexo VII: 'até o 15º (décimo quinto) dia útil após o encerramento de cada calendário'"
