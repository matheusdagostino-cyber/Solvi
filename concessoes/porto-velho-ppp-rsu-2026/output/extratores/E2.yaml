    comentario: "O Anexo III, que prevalece sobre o EVTEA (Edital 2.11.2), recomenda unidade central de 30 t/dia evoluindo para 80-120 t/dia em M60, além de unidades comunitárias. O P6 prevê só 'pátio de compostagem para resíduos de feiras e mercados', compatível com a Meta 7 (3% em 2028 ≈ 12,6 t/dia; 7,5% em 2040 ≈ 34,5 t/dia), e não há linha de CAPEX de compostagem. O termo 'recomenda-se' deixa incerto se a capacidade é obrigatória."
