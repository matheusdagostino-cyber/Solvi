    comentario: "O Jirau é tratado ao mesmo tempo como aterro a reativar (destino do Alto Madeira) e como área em pós-encerramento com monitoramento mínimo de 20 anos. O PA-08, porém, fixa prazo M1-M12. O laudo de 2024 aponta cinco áreas suspeitas (AS1-AS5), sem investigação confirmatória. O teto de encargo do Contrato (8.6.1.2) cobre só a Vila Princesa, de modo que as intervenções de recuperação do Jirau (Contrato 8.8, ii) ficam sem limite para a concessionária."
