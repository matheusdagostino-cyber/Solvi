    comentario: "O mínimo absoluto é “100% do volume atual coletado” (P4), “100% do volume atual da CATANORTE” (ANEXO-III) e “100% do volume médio mensal triado pelas cooperativas cadastradas nos 12 meses anteriores” (Contrato). P4 usa como baseline 14 cooperados (Tab. 8) e 53 cooperados (Tab. 12), e o único dado de volume é ~45 t em ago/2025."
