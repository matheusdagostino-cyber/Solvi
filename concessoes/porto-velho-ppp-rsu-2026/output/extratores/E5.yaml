  # ---------------------------------------------------------------- GERAÇÃO / DEMANDA
  - id: E5-003
    documento: "P1_Diagnostico"
    dispositivo_editalicio: "Sumário Executivo (p. 7) x item III.6 e Tabela 3 (p. 26) x item VII.1 (p. 65)"
    transcricao: "geração per capita estimada em aproximadamente 1,2 kg/hab. dia, patamar superior à média nacional"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "Três valores de geração per capita no mesmo diagnóstico (1,2 / 0,75 / 0,97 kg/hab.dia)"
    comentario: "O sumário afirma 1,2 kg/hab.dia “superior à média nacional”; a Tabela 3 (SINISA 2024) indica 0,75 e o texto da p. 26 diz que a geração é “próxima da média nacional”; a p. 65 calcula 0,97 com dados municipais. Os demais cadernos e o Caderno de Encargos adotam 0,75 kg/hab.dia como premissa de dimensionamento, sem enfrentar os valores maiores do P1."
    dispositivo_legal: "art. 10, I, “a”, da Lei n.º 11.079/2004; art. 18, § 1.º, IV, da Lei n.º 14.133/2021"
    referencias_cruzadas: ["P6 p. 33 Tab. 3", "P2 p. 37 Tab. 14", "P3 Tab. 3", "ANEXO-A (premissa 0,75 kg/hab.dia)"]
    flag_tecnico: true
    flag_reserva: false
    nota: ""

  - id: E5-004
    documento: "P1_Diagnostico"
    dispositivo_editalicio: "Tabela 3 — Indicadores de resíduos sólidos (p. 26)"
    transcricao: "Massa média de RSU (kg/hab. dia) 0,75 ... Massa média de RDO (kg/hab. dia) 0,84"
    tipo_achado: IRREGULAR
    categoria: erro_material
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "RDO (0,84) maior que RSU (0,75), embora RDO seja subconjunto do RSU"
    comentario: "Resíduo domiciliar é fração do RSU; o valor de RDO superior ao de RSU é internamente impossível. P6 e P2 adotam RDO = 0,67 kg/hab.dia (RSU − RLU), divergindo do P1."
    dispositivo_legal: "art. 18, § 1.º, IV, da Lei n.º 14.133/2021"
    referencias_cruzadas: ["P6 p. 33 Tab. 3", "P2 p. 37 Tab. 14"]
    flag_tecnico: true
    flag_reserva: false
    nota: ""

  - id: E5-005
    documento: "P1_Diagnostico"
    dispositivo_editalicio: "Tabela 11 — Volume coletado de RSU e texto (p. 65)"
    transcricao: "Para uma análise mais aprofundada seria adequado obter registro dos últimos doze meses."
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "Série de massa coletada lacunosa e com duas linhas divergentes (TOTAL x “RSU”)"
    comentario: "Faltam mai–jul/2024 e jan–set/2025; a linha “RSU” traz zero em mar/2024 e valores muito superiores à linha TOTAL (ex.: dez/2025 15.630 t x 12.445 t), sem explicação; o texto cita teto de 10.413 t em 2024 quando a tabela mostra 10.423 t. A média da linha “RSU” em out–dez/2025 (~442 t/dia) supera a geração projetada por P6 para 2027 (~413 t/dia), enquanto a linha TOTAL (~364 t/dia) fica abaixo, o que torna incerta a base de demanda."
    dispositivo_legal: "art. 18, § 1.º, IV, da Lei n.º 14.133/2021; art. 10, I, “a”, da Lei n.º 11.079/2004"
    referencias_cruzadas: ["P6 p. 34 Tab. 5 (150.809 t/ano em 2027)", "P2 p. 37 (421,6 t/dia)", "ANEXO-V (risco de demanda — ver E4)"]
    flag_tecnico: true
    flag_reserva: false
    nota: "Depende de esclarecimento sobre o que compõe a linha “RSU” (p.ex., grandes geradores pesados no Ecoparque) e da série completa de pesagens."

  - id: E5-006
    documento: "P1_Diagnostico"
    dispositivo_editalicio: "Item VII.1, p. 65 (cálculo de 0,97 kg/hab.dia)"
    transcricao: "Utilizando a média dos três últimos meses de 2025 de RSU informado pelo município, tem-se uma massa média de RSU (kg/hab. dia) de 0,97"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "Per capita do P1 calculado com população censitária não corrigida, ao passo que P6 corrige o Censo em +14%"
    comentario: "O valor de 0,97 kg/hab.dia resulta da divisão da massa pela população do Censo 2022 (460.434), enquanto P6 adota o “Cenário 3 FESPSP (IBGE/2022 Corrigido)”, com acréscimo de 14% por omissão censitária. A premissa populacional usada no diagnóstico e na modelagem não é a mesma, o que impede reconciliar geração observada e projetada."
    dispositivo_legal: "art. 18, § 1.º, IV, da Lei n.º 14.133/2021"
    referencias_cruzadas: ["P6 p. 33 (ajuste de 14%)", "P2 p. 10–11 Tabs. 2 e 3"]
    flag_tecnico: true
    flag_reserva: false
    nota: ""

  - id: E5-007
    documento: "P1_Diagnostico"
    dispositivo_editalicio: "Tabelas 7, 8, 9 e 10 (p. 63–64) — renderizadas"
    transcricao: "TABELA 9 – VOLUME COLETADO DE RSS — ANO 2025 / PERÍODO Dezembro / LOCALIDADE ... / OPERADORAS ECOPVH"
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "Tabelas de RSS, frequências e contêineres sem nenhum valor quantitativo"
    comentario: "As Tabelas 7 a 10 listam apenas campos e operadoras recebidos da SEMUSB, sem toneladas, frequências, quantidades ou capacidades; a “Tabela 9 – Volume coletado de RSS” não contém volume. Não há base quantitativa de RSS em P1 (nem localizada nos demais cadernos) para dimensionar a coleta de RSS, a autoclave/incinerador e a remuneração correspondente."
    dispositivo_legal: "art. 18, § 1.º, IV, da Lei n.º 14.133/2021; art. 18, I, da Lei n.º 8.987/1995"
    referencias_cruzadas: ["EDITAL objeto iii e viii (PDF p. 13)", "ANEXO-B 10.3.10 (PDF p. 29)"]
    flag_tecnico: true
    flag_reserva: false
    nota: ""

