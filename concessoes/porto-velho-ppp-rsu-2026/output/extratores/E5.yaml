  - id: E5-063
    documento: "P1_Diagnostico; P4_Socioambiental"
    dispositivo_editalicio: "P1 VII.2.4 (p. 87–88), VII.2.1 (p. 71); P4 Tab. 1 (p. 10)"
    transcricao: "Entretanto, em 2025, uma disputa administrativa envolvendo a Prefeitura, a antiga operadora e a concessionária atual, resultou na paralização da operação do aterro"
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Jirau: titularidade, licença, disputa e passivo indefinidos, mas a modelagem conta com sua operação a partir do Ano 3"
    comentario: "O Jirau foi implantado pela ESBR como compensação da UHE e entregue à Prefeitura “para operar, adequar e licenciar”; está paralisado desde 2025 por disputa cujas partes e objeto não são identificados, e só há avaliação preliminar recomendando cinco novos poços. P6 prevê R$ 5,0 mi no Ano 2 e operação no Ano 3; o Contrato (8.6.2) torna a reativação e a regularização fundiária, ambiental e administrativa condição a cargo do Poder Concedente, sem prazo."
    dispositivo_legal: "art. 5º, III, da Lei n.º 11.079/2004; art. 18, XII, da Lei n.º 8.987/1995"
    referencias_cruzadas: ["ANEXO-B 8.6.2 (PDF p. 19)", "P6 p. 48", "ANEXO-V risco 02 Jirau (PDF p. 3)"]
    flag_tecnico: true
    flag_reserva: true
    nota: "Reserva: a indisponibilidade do Jirau é risco do Poder Concedente com efeitos de exoneração e reequilíbrio favoráveis à concessionária (ANEXO-B 5.1.2 e 8.6.2)."

  - id: E5-064
    documento: "P4_Socioambiental (cotejo com Edital, P2, P6 e Caderno)"
    dispositivo_editalicio: "P4 Tab. 6 (p. 19–20) e IX (p. 36) x EDITAL objeto vii"
    transcricao: "Recuperação, operação e monitoramento pós-encerramento do Aterro do Jirau, após a sua disponibilização pelo Poder Concedente"
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: OBJETO_ESCOPO
    descricao_breve: "Jirau tratado como aterro em pós-encerramento (objeto) e como destino ativo do Alto Madeira (P4, P6, Caderno)"
    comentario: "O objetivo do Edital fala em “monitoramento pós-encerramento” e o Contrato fixa monitoramento mínimo de 20 anos; P4 recomenda “reativação ... como prioridade”, P6 o trata como destino final do Alto Madeira e o Caderno denomina o destino “CTR Jirau”. P1 diz ainda que o Jirau atendia Jaci-Paraná, classificado como Médio Madeira na Tabela 1."
    dispositivo_legal: "art. 18, I, da Lei n.º 8.987/1995; art. 5º da Lei n.º 14.133/2021"
    referencias_cruzadas: ["EDITAL objeto vii (PDF p. 13)", "ANEXO-B 8.8, ii (PDF p. 19–20)", "ANEXO-A Tab. 19 (PDF p. 23)", "P6 p. 48"]
