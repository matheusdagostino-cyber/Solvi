    comentario: "O dispositivo é o art. 75, IV, “j”, que autoriza contratar associações ou cooperativas de catadores de baixa renda para coleta, processamento e comercialização de recicláveis. P4 o invoca para acelerar cadastramento e capacitação via Pró-Catadores/SEBRAE, atividade não abrangida pela hipótese."
    dispositivo_legal: "art. 75, IV, “j”, da Lei n.º 14.133/2021"
