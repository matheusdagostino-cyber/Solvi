    comentario: "O objeto do Edital prevê autoclave para RSS na CTR e o Contrato 8.8, iii, exige destinação “exclusiva à unidade de tratamento térmico ou autoclave da CTR”, enquanto o 10.3.10 determina tratamento “mediante a reativação e modernização do incinerador municipal”, recomendada por P1. A rota tecnológica obrigatória e o investimento correspondente ficam indefinidos."
    dispositivo_legal: "art. 18, I, da Lei n.º 8.987/1995; art. 5º da Lei n.º 14.133/2021"
    referencias_cruzadas: ["EDITAL objeto viii (PDF p. 13)", "ANEXO-B 8.8, iii (PDF p. 20) e 10.3.10 (PDF p. 29)"]
