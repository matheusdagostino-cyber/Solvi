    dispositivo_editalicio: "V.1.1 (p. 21–22), V.2 (p. 23), VII.4 (p. 32) x ANEXO-B 10.2.33.3 a 10.2.33.5"
    transcricao: "Sem o cadastro concluído antes do edital, o contrato será publicado com uma obrigação social que não pode ser mensurada nem verificada."
    tipo_achado: IRREGULAR
    categoria: omissao
    tema_sugerido: OBJETO_ESCOPO
    descricao_breve: "Cadastro de catadores não realizado; o próprio estudo aponta obrigação social não mensurável, e o Contrato adia a calibração da CS-01"
    comentario: "P4 estima 350–600 catadores informais sem memória de cálculo e qualifica a falta de cadastro como “a lacuna mais crítica”. O Contrato aplica provisoriamente 100% do volume médio triado nos 12 meses anteriores e delega à Entidade Reguladora o percentual definitivo da CS-01 após o Nível 1, sem reequilíbrio dentro de limites cujo “patamar máximo integra a Proposta Econômica”."
    dispositivo_legal: "art. 36, § 1.º, da Lei n.º 12.305/2010; art. 18, I, da Lei n.º 8.987/1995"
    referencias_cruzadas: ["ANEXO-B 10.2.33.3–10.2.33.5 (PDF p. 26–27)", "ANEXO-III Tab. 16 e cláusulas CS (PDF p. 27–28)"]
