  # ---------------------------------------------------------------- RSS / INCINERADOR
  - id: E5-065
    documento: "P1_Diagnostico"
    dispositivo_editalicio: "VII.2.5 (p. 88–89); VII.2.7 (p. 94)"
    transcricao: "Para que o incinerador volte a operar é necessário que se faça um levantamento completo de todos os componentes faltantes ou inativos, e das melhorias necessárias na infraestrutura do local."
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
    tema_sugerido: OBJETO_ESCOPO
    descricao_breve: "Estado do incinerador municipal (componentes removidos, teto avariado, software inativo) sem levantamento nem custo de recuperação"
    comentario: "P1 constata a retirada da balança e do elevador, software inativo e teto avariado, e a avaliação preliminar da Lixeira recomenda avaliar a viabilidade do incinerador, situado na área do passivo. O Contrato (10.3.10.2) impõe à concessionária a recuperação e modernização do incinerador como investimento obrigatório, sem que os estudos quantifiquem o custo ou a conformidade com a norma de tratamento térmico."
    dispositivo_legal: "art. 18, § 1.º, VI, da Lei n.º 14.133/2021; Resolução CONAMA n.º 316/2002"
    referencias_cruzadas: ["ANEXO-B 10.3.10 a 10.3.10.4 (PDF p. 29)", "ANEXO-A p. 61 (cessão do incinerador)"]
