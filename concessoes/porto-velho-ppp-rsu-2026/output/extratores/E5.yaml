  - id: E5-067
    documento: "P1_Diagnostico; P4_Socioambiental"
    dispositivo_editalicio: "P1 p. 88; P4 Tab. 1 (p. 10) e Tab. 4 (p. 14)"
    transcricao: "RSS destinado a operador particular — custo elevado e sem controle municipal. Risco sanitário caso o contrato particular seja descontinuado."
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
    tema_sugerido: RISCOS_GARANTIAS
    descricao_breve: "Destino transitório de RSS dependente de incinerador particular não identificado"
    comentario: "Até a CTR/incinerador entrar em operação, a concessionária deve garantir a destinação via terceiros (Contrato 10.3.10.1), mas os estudos não identificam as unidades licenciadas disponíveis na região, sua capacidade ou preço. A LAI do Ecoparque inclui autoclave, o que reforça a dependência do operador incumbente (ver E5-051)."
    dispositivo_legal: "art. 5º, III, da Lei n.º 11.079/2004; Resolução CONAMA n.º 358/2005"
