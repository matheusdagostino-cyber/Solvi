  - id: E5-071
    documento: "P4_Socioambiental"
    dispositivo_editalicio: "V.4 (p. 24), VII.1 (p. 30), IX (p. 36)"
    transcricao: "CS-02 deve garantir remuneração por tonelada triada, independentemente dos preços de mercado"
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
    tema_sugerido: MODELAGEM_ECONOMICA
    descricao_breve: "Pagamento às cooperativas por tonelada triada sem valor de referência e sem reflexo na modelagem"
    comentario: "P4 considera o pagamento pela triagem condição de sustentabilidade, mas não indica R$/t; o ANEXO-III deixa a penalidade “a ser definida pela ARDPV”; P6 supõe que a cooperativa retém a receita dos recicláveis, sem custo de remuneração da triagem. O custo dessa obrigação não é precificável com os elementos do Edital."
    dispositivo_legal: "art. 36, §§ 1.º e 2.º, da Lei n.º 12.305/2010; art. 18, § 1.º, VI, da Lei n.º 14.133/2021"
    referencias_cruzadas: ["ANEXO-III CS-02 (PDF p. 27)", "P6 p. 48 (parceria com CATANORTE)"]
    flag_tecnico: false
    flag_reserva: false
    nota: "P6 e P2 fundamentam a parceria no “Art. 44 da PNRS” — dispositivo de incentivos; a base seria o art. 36, § 1.º (referência para E4)."

  - id: E5-072
    documento: "P4_Socioambiental"
    dispositivo_editalicio: "V.4 (p. 25)"
    transcricao: "O Pró-Catadores oferece, ainda, a possibilidade de contratação por dispensa de licitação (art. 75, j, da Lei nº 14.133/2021)"
    tipo_achado: IRREGULAR
    categoria: erro_material
    tema_sugerido: QUESTOES_FORMAIS
