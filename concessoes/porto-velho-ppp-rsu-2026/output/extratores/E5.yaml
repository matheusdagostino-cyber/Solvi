  - id: E5-066
    documento: "P1_Diagnostico (cotejo com Edital e Contrato)"
    dispositivo_editalicio: "P1 VIII.6.1 (p. 101) x EDITAL objeto viii x ANEXO-B 8.8, iii, e 10.3.10"
    transcricao: "A recuperação e reativação do incinerador municipal também se faz necessária."
    tipo_achado: IRREGULAR
    categoria: contradicao
    tema_sugerido: OBJETO_ESCOPO
