# [USO INTERNO] PPP RSU Porto Velho/RO — Fase 1 — Big numbers
# Fonte: documentos do pacote "RSUPVHRO_P0_PlanodeTrabalho_20260911.zip" (Edital 2.ª versão 08/09/2026).
# "calc." = cálculo próprio a partir das tabelas dos documentos. "[FONTE EXTERNA]" = fora do pacote, verificar.
big_numbers:
  - grupo: "Contrato e contraprestação"
    itens:
      - item: "Modalidade / critério"
        valor: "Concessão administrativa; menor contraprestação mensal"
        fonte: "Edital, preâmbulo, 4.1–4.2 e 12.2.2"
        obs: "Lances sobre a Contraprestação Mensal; disputa aberta e fechada (art. 56 da Lei 14.133)."
      - item: "Prazo"
        valor: "30 anos (prorrogável até 35)"
        fonte: "Edital 6.1–6.2; Contrato 6.1"
        obs: "Contado da assinatura; não há prazo máximo para a Ordem de Início."
      - item: "Valor Estimado do Contrato"
        valor: "R$ 2.311.927.627,53"
        fonte: "Edital 5.1 (data-base maio/2026, nominal)"
        obs: "calc.: 360 × CMM = R$ 2.342.051.269,20. O valor publicado só fecha com a rampa da Parcela A e 3 meses sem pagamento do P6 (357 parcelas)."
      - item: "Contraprestação Mensal Máxima (teto do lance)"
        valor: "R$ 6.505.697,97"
        fonte: "Edital 12.2.1; P6 Tab. 14"
        obs: "Parcela A (CAPEX) R$ 1.767.757,85 + Parcela B (OPEX) R$ 4.737.940,12."
      - item: "Rampa da Parcela A"
        valor: "60% (ano 1) / 80% (ano 2) / 100%"
        fonte: "P6 Tab. 14 (R$ 1.060.655,71 / R$ 1.414.206,28)"
        obs: "Contrato 15.6 adota outra regra; Caderno XI.6 vincula a marcos. O Edital não menciona rampa."
      - item: "Contraprestação anual em regime pleno"
        valor: "R$ 78.068.375,62"
        fonte: "Edital 5.1.1"
        obs: "calc. ano 1 ≈ R$ 52,2 mi (9 parcelas); ano 2 ≈ R$ 73,8 mi."
      - item: "Preço implícito por tonelada"
        valor: "≈ R$ 518/t (2027) → ≈ R$ 452/t (2056)"
        fonte: "calc. CP plena ÷ RSU bruto (P6 Tab. 5)"
        obs: "Cobre coleta, transporte, tratamento, destinação e passivos. Não há custo atual de referência nos estudos."
