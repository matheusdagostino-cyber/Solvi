        valor: "< R$ 4.879.273,48/mês (75% da CMM)"
        fonte: "Edital 15.8.3.1"
        obs: "Presunção relativa, com diligência."
      - item: "Desconto máximo por desempenho (IQD)"
        valor: "10% da contraprestação"
        fonte: "Contrato 15.5"
        obs: "Declarado 'referencial'; o Anexo D não traz a regra de conversão nota → desconto."
      - item: "Receitas acessórias"
        valor: "Zero no fluxo; compartilhamento de 5%"
        fonte: "P6 p. 48–50; Contrato 18.5.1"
        obs: "RSS de geradores privados com 'tarifa especial' (Edital 3.1.2) fora da contraprestação."
