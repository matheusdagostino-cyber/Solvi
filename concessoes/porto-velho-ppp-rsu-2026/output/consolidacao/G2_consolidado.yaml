  - E7-033
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Ramp-up da Parcela A com quatro regras: P6 (60/80/100%), Contrato (temporal), Caderno (8 marcos de aceite), P7 (sem escalonamento)'
  dispositivo_editalicio: P6 V.4 (PDF p. 46–48) × Contrato cl. 15.6.2 e 15.6.4 (p. 38) × Caderno XI.6 (p. 63–64) × P7 III.6.1 (p. 32)
  transcricao: 'Caderno XI.6: ''O início de seu pagamento ou sua evolução deverá estar condicionado à comprovação de que os investimentos e as estruturas correspondentes foram entregues, aceitos e colocados em condições de operação'' e ''Na ausência de definição específica, os percentuais deverão ser apresentados pela concessionária em proposta de cronograma físico-financeiro''; Contrato 15.6.2: ''em razão do prazo necessário à avaliação da condição real dos ativos''; P7 p. 32: ''ambas as parcelas são apuradas e liquidadas por medição, dispensando cláusula contratual de escalonamento inicial'''
  comentario: O P6 fixa 60%/80%/100% por ano, justificado pela operação da CTR e do Jirau. O Contrato adota escalonamento cronológico (reduzido nos Anos 1–2, integral a partir do 3.º) justificado pela "avaliação da condição real dos ativos", sem percentuais nem marcos. O Caderno condiciona a Parcela A a oito marcos de entrega e aceite (frota, transbordos, sistemas, operação plena, reposição do Ano 25), sem CTR, Jirau, Vila Princesa ou incinerador, remete os percentuais ao Contrato e, na falta, à proposta da concessionária. O P7 afirma que o desenho dispensa escalonamento inicial. São regras incompatíveis para o mesmo pagamento.
  dispositivo_legal: art. 7.º, caput e § 1.º, e art. 5.º, inciso IV, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: No Contrato, a Parcela A cresce por decurso de tempo e não por aceite de ativos, o que favorece a concessionária; suscitar a contradição tende a prevalecer a regra de marcos do Caderno.
- id_tmp: G2-075
  tema: REMUNERACAO_REAJUSTE
  ids_origem:
