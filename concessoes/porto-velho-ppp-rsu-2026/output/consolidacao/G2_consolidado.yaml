  tipo_achado: IRREGULAR
  categoria: erro_material
  descricao_breve: Fórmula do IQS soma os 17 indicadores em pontos percentuais, sem pesos e sem comparação com a meta
  dispositivo_editalicio: Anexo D seção VI (PDF p. 21) × Tabela 5 (p. 14)
  transcricao: 'Anexo D VI: ''IQS = [IC1 + IC2] + [IO1 + IO2 + IO3 + IO4 + IO5] + [IQ1 + IQ2 + IQ3 + IQ4] + [IE1 + IE2 + IE3 + IE4 + IE5 + IE6]'''
  comentario: A fórmula soma os indicadores sem aplicar os pesos da Tabela 5 (que somam 100%) e sem comparar cada resultado com a meta do ano. O resultado é um número sem escala (até ~1.700) que não se converte em fator de remuneração. O próprio texto diz que cada indicador "deverá ser comparado com a respectiva meta", mas a regra de comparação e pontuação não existe.
  dispositivo_legal: art. 5.º, inciso VII, e art. 6.º, § 1.º, da Lei n.º 11.079/2004; art. 23, inciso III, da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004
