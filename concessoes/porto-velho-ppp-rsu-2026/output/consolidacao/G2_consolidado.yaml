  descricao_breve: Kd (IPCA + 11,42%) com "taxa do agente" arbitrada e spread regional distinto das fontes citadas no P6
  dispositivo_editalicio: P6 II.5 (PDF p. 15), III.13–III.16 (p. 24–27), IV.6 (p. 31) e Figura 1 (p. 32)
  transcricao: 'P6 p. 31: ''8,21% como Fator de Custo Financeiro determinado pela TLP em agosto de 2026, 0,95% como Fator Taxa do BNDES para região Norte e 2,00% como a Fator Taxa do Agente Fiduciário'''
  comentario: O Kd compõe TLP 8,21%, taxa BNDES 0,95% e 2,00% de "taxa do agente". O P6 diz que a remuneração do agente foi tratada por faixa de sensibilidade, mas adota 2,00%, e usa 0,95% como taxa para a região Norte, embora o texto indique 0,75% (bens de capital no Norte) ou 1,25% (caminhões para grande empresa). O mesmo P6 descreve fontes mais longas e de menor custo (FINEM com spread de 0,9%, debêntures incentivadas, fundos constitucionais com 34 anos e 8 de carência) que não entram no modelo. O rótulo "nominal" para taxa descrita como real é erro material.
  dispositivo_legal: art. 10, inciso I, alínea "a", da Lei n.º 11.079/2004
  depende_de: Justificativa e sensibilidade da taxa do agente e do spread regional; condições vigentes das linhas citadas na data-base.
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Kd acima das condições de mercado eleva WACC e CMM, criando margem para licitante com funding mais barato; impugnar tende a reduzir o teto.
- id_tmp: G2-037
  tema: MODELAGEM_ECONOMICA
  ids_origem:
  - E4-041
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: Ke real de 17,76% com janelas heterogêneas e dado proprietário (Bloomberg) não replicável
  dispositivo_editalicio: P6 IV.1–IV.5 (PDF p. 28–30), nota 41 e Figura 1 (p. 32); Tabela 15 (p. 50)
  transcricao: 'P6: ''o risco-país foi extraído da série BRAZIL CDS USD SR 10Y D14 Corp, da Bloomberg, com histórico a partir de 2014, resultando em CRP=2,98%'''
  comentario: Taxa livre de risco e prêmio de mercado usam médias de 2002–2025, o risco-país vem de série Bloomberg desde 2014 e o beta é setorial dos EUA. O P6 cita a metodologia de cálculo do WACC do Tesouro (2018), mas não demonstra aderência às janelas e fontes dessa metodologia. O resultado (Ke real 17,76%; WACC real 11,63%) define diretamente a CMM, porque o modelo calibra TIR = WACC.
  dispositivo_legal: art. 10, inciso I, alínea "a", e § 1.º, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
  depende_de: Parâmetros da metodologia do Tesouro na data-base e acesso aos dados utilizados (série CDS).
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Premissas de Ke elevadas aumentam o teto em benefício de licitantes com custo de capital menor.
