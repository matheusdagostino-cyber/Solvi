  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Menções a "tarifa" (diferenciada, especial, tabela de referência) em concessão administrativa sem estrutura tarifária
  dispositivo_editalicio: Contrato cl. 10.3.10.4 e 10.6 (PDF p. 29–30) e 18.2.2 (p. 42)
  transcricao: 'Contrato 10.3.10.4: ''sem prejuízo da recomposição dos custos adicionais de destinação e da aplicação de tarifa diferenciada''; 10.6: ''incluindo a tabela de tarifas de referência'''
  comentario: Na concessão administrativa a Administração é a usuária direta ou indireta e não há tarifa ao usuário. O Contrato fala em "tarifa diferenciada" associada à falha de segregação de RSS (redação que mistura sanção e recomposição), em "tabela de tarifas de referência" e em "tarifa especial" (18.2.2), sem defini-las nem indicar quem as fixa e quem as paga.
  dispositivo_legal: art. 2.º, § 2.º, da Lei n.º 11.079/2004
