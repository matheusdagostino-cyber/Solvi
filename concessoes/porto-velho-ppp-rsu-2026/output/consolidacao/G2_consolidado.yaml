  dispositivo_editalicio: Contrato cl. 15.4 e 15.4.1 (PDF p. 37) e 41.3 (p. 78); Anexo D VI.1.1, §§ 3.º e 4.º, e VI.1.2 (p. 21); P7 VII.6 (p. 51) × III.6.2 (p. 32) e II.5 (p. 18)
  transcricao: 'Contrato 15.4.1: ''O resultado apurado em cada ciclo anual produzirá efeitos sobre a Contraprestação Mensal Efetiva devida no exercício seguinte''; Anexo D VI.1.1: ''Caso o período de operação no primeiro ano seja inferior a 3 (três) meses, o Poder Concedente poderá optar por aglutinar esta fração inicial ao ciclo anual subsequente'''
  comentario: Como o efeito é sempre no exercício seguinte, o desempenho do último Ano de Desempenho não tem como repercutir na remuneração, e não há regra de compensação (garantia, indenização). No início, há até ~14 meses sem desconto, e a aglutinação do primeiro período fica a critério do Poder Concedente, sem parâmetro; sem VI contratado, o primeiro ciclo pode ficar sem efeito (41.3). O Contrato (15.4) inicia a apuração "a partir do início da execução contratual"; o P7 descreve o mesmo termo inicial ora assim (p. 51), ora como "Etapa de Operação Definitiva" (p. 18 e 32).
  dispositivo_legal: art. 6.º, § 1.º, e art. 5.º, inciso VII, da Lei n.º 11.079/2004; art. 23, inciso XI, da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004
  flag_tecnico: false
