  descricao_breve: '"Avaliação Comercial" (P3) sem sondagem de mercado, atratividade, bancabilidade, benchmarks ou valores'
  dispositivo_editalicio: P3 integral (PDF p. 1–56) e I.2 (p. 6); P0 p. 10–11
  transcricao: 'P3 I.2: ''Estruturar o estudo de demanda e a modelagem comercial do sistema [...] assegurar a viabilidade fiscal e a atratividade do projeto frente ao mercado'''
  comentario: O P3 não contém consulta a potenciais interessados, análise de atratividade, de condições de financiamento e garantias, benchmarks de R$/t ou qualquer valor monetário. O VfM consta apenas do P6.
  dispositivo_legal: art. 10, inciso I, alínea "a", da Lei n.º 11.079/2004; art. 18, § 1.º, inciso V, da Lei n.º 14.133/2021 (aplicação subsidiária)
