  dispositivo_editalicio: Contrato cl. 15.6.3 (PDF p. 38) × P6 Tabela 14 e Figura 3 (p. 46)
  transcricao: 'Contrato 15.6.3: ''A Parcela B será devida em valor reduzido no 1º (primeiro) ano da Etapa de Operação e em valor integral a partir do 2º (segundo) ano, na proporção da assunção progressiva dos Serviços'''
