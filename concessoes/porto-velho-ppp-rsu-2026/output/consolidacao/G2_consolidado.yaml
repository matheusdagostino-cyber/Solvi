  - E3-050
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: '"Etapa de Operação" — marco inicial dos pagamentos e do ramp-up — não definida'
  dispositivo_editalicio: Contrato cl. 15.6.1 (PDF p. 38) e definições (cl. 1.3); Anexo D VI.1.1 (p. 21)
  transcricao: 'Contrato 15.6.1: ''A Contraprestação Mensal Efetiva é devida desde o 1º (primeiro) mês da Etapa de Operação'''
  comentario: O termo não consta das definições do Contrato, do Edital nem do Caderno; o Anexo D usa "Assunção dos Serviços" e "Início da Operação Comercial". Não se sabe se a Etapa de Operação começa com a Ordem de Início, com a assunção dos serviços ou com a operação de alguma unidade. É o marco inicial de todo o fluxo de pagamentos, do ramp-up e da redução da Parcela B.
  dispositivo_legal: art. 92, inciso V, da Lei n.º 14.133/2021; art. 5.º, inciso IV, da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: false
