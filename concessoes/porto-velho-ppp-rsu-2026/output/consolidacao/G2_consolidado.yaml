  descricao_breve: 'IO4 (RSS): fórmula invertida (coletado ÷ incinerado) e dependente de incineração'
  dispositivo_editalicio: Anexo D V.1.2, IO4 (PDF p. 17) e Tabela 5 (p. 14); Edital 3.1, viii (p. 13)
  transcricao: 'Anexo D: ''IO4 = TO14 = RSSC / RSSI x 100 ... RSSI = Quantidade de Resíduos de Serviços de Saúde incinerados'''
  comentario: 'A fórmula divide o RSS coletado pelo incinerado: se parte do RSS não for tratada, o índice passa de 100%; se o tratamento for por autoclave, como prevê o objeto (Edital 3.1, viii), o denominador é zero. A forma coerente seria tratado sobre coletado, por qualquer tecnologia licenciada.'
