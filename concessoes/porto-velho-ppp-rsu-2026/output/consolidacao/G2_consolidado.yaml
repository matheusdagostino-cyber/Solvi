  - E2-018
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'CAPEX divergente: R$ 298,3 mi (P6 Tab. 7) × R$ 313,8 mi (P6 Tab. 2/P2); CTR R$ 39,6 mi × R$ 55,03 mi'
  dispositivo_editalicio: P6 Tabela 7 (PDF p. 37–41), texto p. 19–20, p. 35–36 e p. 47, Tabela 2 (p. 16) × P2 Tabela 15, item 4.1.1 (p. 44) e total (p. 45)
  transcricao: 'P6 p. 19–20: ''CAPEX projetado de R$ 298,3 milhões ao longo de 30 anos''; P6 p. 47: ''CAPEX total de construção civil de R$ 39,6 milhões''; P6 Tab. 2: ''Equity + Dívida inicial R$ 313,8 milhões''; P2 Tab. 15: ''4.1.1 CONSTRUÇÃO 55.031.413 / 27.515.707 13.757.853 13.757.853'' e ''TOTAL DE INVESTIMENTOS NO SISTEMA 313.812.212'''
