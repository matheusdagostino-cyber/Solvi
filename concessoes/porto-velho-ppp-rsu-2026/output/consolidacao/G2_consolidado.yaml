- id_tmp: G2-055
  tema: MODELAGEM_ECONOMICA
  ids_origem:
  - E5-003
  - E6-010
  - E5-004
  - E5-031
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Geração per capita incoerente: 1,2 / 0,75 / 0,97 kg/hab.dia e RDO (0,84) > RSU (0,75); 0,75 adotado sem reconciliação'
  dispositivo_editalicio: P1 Sumário (PDF p. 7), III.6 e Tabela 3 (p. 25–26) e VII.1 (p. 65); P2 Tabela 14 (p. 37); P3 Tabela 3 (p. 13) e IV.1 (p. 15); P6 Tabela 3 (p. 33); Matriz TO-01 (p. 3)
  transcricao: 'P1 p. 7: ''geração per capita estimada em aproximadamente 1,2 kg/hab. dia, patamar superior à média nacional''; P1 Tab. 3: ''Massa média de RSU (kg/hab. dia) 0,75 ... Massa média de RDO (kg/hab. dia) 0,84''; P1 p. 65: ''massa média de RSU (kg/hab. dia) de 0,97'''
  comentario: 'O P1 traz três valores de geração per capita: 1,2 (sumário, "superior à média nacional"), 0,75 (SINISA, "próxima da média nacional") e 0,97 (dados municipais de out–dez/2025). Na mesma tabela, o RDO (0,84) supera o RSU (0,75), embora seja subconjunto dele; P2 e P6 adotam RDO de 0,67. P2, P3, P6 e o Caderno usam 0,75 sem série histórica de pesagens nem reconciliação. Os dados SINISA são autodeclarados e o próprio P1 registra situações de campo (queima, descarte em várzeas) incompatíveis com indicadores de 0% de disposição inadequada e 0% de coleta rural. A projeção do P3 é a referência da banda de demanda de ±10% da Matriz (TO-01).'
  dispositivo_legal: art. 10, inciso I, alínea "a", e art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 18, § 1.º, inciso IV, da Lei n.º 14.133/2021 (aplicação subsidiária)
  flag_tecnico: true
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: 'Se a geração real superar a projeção do P3 em mais de 10% por 6 meses, a Matriz (TO-01) prevê reequilíbrio: subestimar a base de demanda pode favorecer a concessionária. Observação do extrator E6: 11.060 t/mês (P1) × 12 ≈ 132,7 mil t/ano, próximo da projeção da Sede para 2027 (131,2 mil t) com população corrigida.'
  obs_consolidacao: 'Relacionados (G3): E3-053 e E4-067 (banda de demanda ±10%).'
- id_tmp: G2-056
  tema: MODELAGEM_ECONOMICA
  ids_origem:
  - E2-026
  - E5-006
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Bases populacionais divergentes: 562.145 hab. (Censo +14%) × 474.681 hab.; per capita do P1 sem a correção'
  dispositivo_editalicio: Caderno Tabelas 5 e 6 (PDF p. 11–12); Anexo III Tabelas 4 e 5 (p. 10–12); P2 p. 22 (Tabela 13); P6 p. 33; P1 VII.1 (p. 65)
  transcricao: 'Caderno: ''População total de referência inicial | 562.145 habitantes em 2027''; Anexo III: ''Sede Administrativa (412.804 hab.)'''
  comentario: O Caderno e o P6 dimensionam com 562.145 hab. em 2027, após acréscimo de 14% sobre o Censo 2022 por omissão censitária (Cenário 3 FESPSP). O Anexo III e a Tabela 13 do P2 trabalham com 474.681 hab. (Sede 412.804; AM 24.499; MM 32.438; BM 4.940). O per capita de 0,97 do P1 resulta da divisão da massa pela população do Censo não corrigida (460.434). A diferença de cerca de 18% afeta frota, massa, capacidade das unidades, denominador do IC1 e a Parcela B liquidada por volume.
