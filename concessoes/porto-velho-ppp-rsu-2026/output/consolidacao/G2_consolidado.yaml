  transcricao: 'P2 p. 37: ''das 421,6 ton/dia que entram no aterro, 167,4 ton poderão ser recuperadas pela triagem, 108,4 ton serão encaminhados à compostagem e 145,9 ton irão efetivamente para o aterro''; P2: ''O Balanço de Massa apresentado é um exemplo'''
