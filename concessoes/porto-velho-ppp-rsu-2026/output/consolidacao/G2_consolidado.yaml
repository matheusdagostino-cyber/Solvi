  dispositivo_editalicio: Caderno Tabela 19 (PDF p. 23); Anexo III Tabela 13 (p. 22); P3 Tabela 18 (p. 33–35); P1 Tabelas 4 e 5 (p. 27–28); Edital 2.11.2 (p. 12)
