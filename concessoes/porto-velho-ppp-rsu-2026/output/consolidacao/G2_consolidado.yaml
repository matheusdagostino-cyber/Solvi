  - E4-005
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Valor Estimado não corresponde à própria definição (360 × CMM = R$ 2.342.051.269,20)
  dispositivo_editalicio: Edital def. 1.1.50 (PDF p. 9) e item 5.1 (p. 15) × item 12.2.1 (p. 31); P6 Tabela 14 e item V.4 (p. 46)
  transcricao: 'Edital 1.1.50: ''corresponde ao somatório das Contraprestações Mensais Máximas durante todo o prazo da Concessão, em valores nominais, na data-base do orçamento estimado''; Edital 5.1: ''R$ 2.311.927.627,53''; Edital 12.2.1: ''CONTRAPRESTAÇÃO MENSAL MÁXIMA de R$ 6.505.697,97''; P6 p. 46: ''com um deslocamento inicial de 3 meses para o início do pagamento de ambas as parcelas'''
  comentario: 'Pela definição do Edital, o Valor Estimado seria 360 × R$ 6.505.697,97 = R$ 2.342.051.269,20, R$ 30.123.641,67 acima do valor publicado. O valor publicado só é reproduzido pelo fluxo do P6: 3 meses sem pagamento (357 parcelas) e Parcela A a 60% e 80% nos Anos 1 e 2 (recalculado: R$ 2.311.927.637,19; resíduo de R$ 9,66 porque a Parcela A do Ano 1 no P6, R$ 1.060.655,71, difere de 60% da plena, R$ 1.060.654,71). Nem o deslocamento nem o ramp-up constam do Edital. O Valor Estimado é base da garantia de proposta, do capital mínimo, do capital da SPE e das multas (Edital 19.5, b, e 22.2.2).'
  dispositivo_legal: art. 10, incisos IV e VI, da Lei n.º 11.079/2004; art. 18, inciso IX, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
  obs_consolidacao: 'Cálculo: 9 × (1.060.655,71 + 4.737.940,12) + 12 × (1.414.206,28 + 4.737.940,12) + 336 × 6.505.697,97. E4-005 absorvido do G4 (QUESTOES_FORMAIS).'
- id_tmp: G2-002
  tema: MODELAGEM_ECONOMICA
  ids_origem:
  - E1-079
  tipo_achado: IRREGULAR
  categoria: erro_material
  descricao_breve: Contraprestação anual (R$ 78.068.375,62) ≠ 12 × CMM (R$ 78.068.375,64)
  dispositivo_editalicio: Edital item 5.1.1 (PDF p. 15) × itens 12.2.1 e 12.2.3 (p. 31)
  transcricao: 'Edital 5.1.1: ''A contraprestação pública anual, em regime pleno de operação, é estimada em R$ 78.068.375,62''; 12.2.3: duodécuplo da CONTRAPRESTAÇÃO MENSAL ofertada'
  comentario: O item 12.2.3 define a contraprestação anual como o duodécuplo da mensal. 12 × R$ 6.505.697,97 = R$ 78.068.375,64, R$ 0,02 acima do valor do item 5.1.1. A diferença decorre de arredondamento e indica que a CMM foi obtida pela divisão do valor anual por 12.
  dispositivo_legal: não localizei fundamento normativo específico (erro material)
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G2-003
  tema: MODELAGEM_ECONOMICA
  ids_origem:
  - E3-051
  - E4-006
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Fluxo de pagamentos do Contrato não reproduz o fluxo do P6 que gerou o Valor Estimado
  dispositivo_editalicio: Contrato cl. 15.6.1, 15.6.3 e 15.6.4 (PDF p. 38) × P6 item V.4 e Tabela 14 (p. 46) × Edital 5.1 (p. 15) e 6.1 (p. 15)
  transcricao: 'Contrato 15.6.1: ''A Contraprestação Mensal Efetiva é devida desde o 1º (primeiro) mês da Etapa de Operação''; 15.6.4: ''não configura carência, diferimento, suspensão ou postergação do pagamento''; P6 p. 46: ''deslocamento inicial de 3 meses para o início do pagamento de ambas as parcelas'''
  comentario: O P6 modela 357 pagamentos (3 meses sem pagamento) e Parcela B integral desde o primeiro pagamento; o Valor Estimado reproduz esse fluxo. O Contrato prevê pagamento desde o 1.º mês da Etapa de Operação, nega a existência de carência ou diferimento e reduz a Parcela B no 1.º ano. Sem o deslocamento, o mesmo cálculo dá ≈ R$ 2.329.323.425 (calculado). Não está definido se os 3 meses do P6 correspondem ao período entre a assinatura e a Ordem de Início (o prazo de 30 anos conta da assinatura, Edital 6.1) ou a meses de operação sem pagamento.
  dispositivo_legal: art. 7.º, caput e § 1.º, e art. 10, inciso II, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Se o Contrato pagar desde o 1.º mês de operação valores superiores aos do fluxo modelado, o teto teria folga em favor da concessionária; suscitar a contradição tende a alinhar o pagamento ao fluxo do P6.
  obs_consolidacao: 'Relacionado: G2 "Etapa de Operação não definida" e G2 "Parcela B reduzida no 1.º ano". O risco de atraso da Ordem de Início (E3-012) foi remetido ao G3 (duplica E3-013 e E7-051).'
- id_tmp: G2-004
  tema: MODELAGEM_ECONOMICA
  ids_origem:
  - E4-014
  - E7-015
  - E1-012
  - E3-005
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Limite do art. 28 verificado só para um exercício, com RCL de 2025 constante e sem projeção decenal
  dispositivo_editalicio: P6 item VI.9 e Tabela 18 (p. 58–59); P7 Sumário (PDF p. 8), III.5 (p. 31), IV.4 (p. 37–38) e V.10 (p. 44); Edital 5.1.1 (p. 15); Contrato considerando vi (p. 6)
  transcricao: 'P6 p. 58: ''A Receita Corrente Líquida (RCL) do Município de Porto Velho foi apurada em R$ 2,45 bilhões em 2025, valor mantido como referência para o horizonte projetado até 2030''; Edital 5.1.1: ''equivalente a 3,18 % da Receita Corrente Líquida do Município, observado o limite de que trata o art. 28'''
  comentario: O P6 compara um único ano de contraprestação em regime pleno (R$ 78,1 mi) com a RCL de 2025 (R$ 2,45 bi), mantida constante até 2030. Não há série das despesas anuais da PPP nos 10 exercícios subsequentes (com reajuste e Conta Garantia) contra a RCL projetada de cada exercício, como prevê o art. 28. O P7 adota o percentual único de 3,18% e o Contrato (considerando vi) atesta a conformidade ao art. 28 sem indicar percentual nem memória de cálculo. O Edital não menciona o envio prévio de informações ao Senado Federal e à STN (art. 28, § 1.º).
  dispositivo_legal: art. 28, caput e § 1.º, da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
  obs_consolidacao: 'Relacionado (G3): E4-083 — risco de ultrapassagem do limite alocado ao PC sem consequência contratual (Matriz EF-04).'
- id_tmp: G2-005
  tema: MODELAGEM_ECONOMICA
  ids_origem:
