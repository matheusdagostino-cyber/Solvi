  transcricao: 'Caderno XI.4: ''Os quatro transbordos distritais necessários à execução da logística regional dos serviços deverão ser adquiridos pela concessionária''; P2 Tab. 15: ''3.1.8 ESTAÇÃO DE TRANSBORDO DISTRITAL 50.000 50.000 100.000'' e ''3.3.1 CONSTRUÇÃO 450.000'''
