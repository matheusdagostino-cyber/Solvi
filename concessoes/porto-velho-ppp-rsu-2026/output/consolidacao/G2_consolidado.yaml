  descricao_breve: Destinação transitória no Ecoparque a ≈ R$ 12/t, sem preço do contrato vigente, até o Ano 4 (LAO até 10/2028)
  dispositivo_editalicio: P6 Tabela 9 (PDF p. 43) e Tabela 5 (p. 34); P2 Tabela 16, item 4.5 (p. 46) e III.2.3.1 (p. 13); P1 VII.2.4 (p. 84–88); Matriz TO-20 (p. 17)
  transcricao: 'P6 Tab. 9: ''Aterro Ecoparque (Anos 1–4 — transição até CTR) 1.760 / 1.760 / 704 / 704'''
  comentario: O modelo lança R$ 1,76 mi/ano nos Anos 1–2 e R$ 704 mil nos Anos 3–4; sobre o residual de 142.379 t de 2027 (P6 Tab. 5), isso equivale a ≈ R$ 12/t (cálculo). O P1 não informa o preço unitário do Contrato 042/PGM/2023 (empreitada por preço unitário), e não há memória que indique se o valor cobre toda a massa ou só parte. O uso até o Ano 4 ultrapassa a LAO do Ecoparque (válida até 09/10/2028), risco que a Matriz (TO-20) trata como compartilhado com reequilíbrio "parcial". Até a CTR operar, a concessionária depende de aterro privado de terceiro (LAO em nome de CTR PORTO VELHO S/A; P1 p. 85).
  dispositivo_legal: art. 10, inciso I, alínea "a", e § 4.º, da Lei n.º 11.079/2004
  depende_de: Preço unitário vigente do Contrato 042/PGM/2023, massa a destinar por ano ao Ecoparque e capacidade remanescente do aterro.
  flag_tecnico: true
  flag_reserva: true
  reserva_tipo: DECISAO_COMERCIAL
  nota_reserva: O custo e a dependência do Ecoparque afetam licitantes de modo distinto conforme controlem ou não aterro licenciado na região; levantar ou não o ponto depende da posição comercial do grupo em relação ao Ecoparque e a alternativas de destinação.
  obs_consolidacao: 'Relacionados (G3): E2-015, E5-010, E5-050, E5-052, E4-078 (risco e licenças do Ecoparque).'
