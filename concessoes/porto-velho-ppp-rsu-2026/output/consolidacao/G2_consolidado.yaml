  - E4-009
  - E6-033
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Parcela A integral a partir do Ano 3 sem vínculo à disponibilização dos ativos (CTR plena no Ano 4; 3.ª fase no Ano 8)
  dispositivo_editalicio: Contrato cl. 15.5.2.1, 15.6.1 e 15.6.2 (PDF p. 38); P6 V.4 (p. 46–48), V.5 (p. 50) e Tabela 7, item 4.1.1 (p. 39); P2 Tabela 15, item 4.1.1 (p. 44); Anexo D Tabelas 3 e 5, IE1 (p. 10 e 14)
  transcricao: 'Contrato 15.6.2: ''sendo devida em valor reduzido no 1º (primeiro) e no 2º (segundo) anos da Etapa de Operação e em valor integral a partir do 3º (terceiro) ano''; P6 p. 50: ''A CTR Porto Velho, uma vez implantada em sua configuração plena a partir do Ano 4 do contrato'''
  comentario: 'A Parcela A remunera investimentos (CTR, Jirau, incinerador, transbordos) e é devida desde o 1.º mês de operação e integralmente a partir do Ano 3, por critério temporal. O P6 justifica os 100% no Ano 3 pela operação da CTR e do Jirau, mas afirma que a CTR só terá configuração plena no Ano 4, e P2/P6 lançam 25% da obra da CTR no Ano 4 e 25% no Ano 8 (o IE1 do Anexo D mede a CTR a 75% até o Ano 7). Há divergência interna no P6: a p. 47 baseia o ramp-up no CAPEX dos 5 primeiros anos; a p. 48, nos investimentos do Ano 2. A contraprestação deve ser precedida da disponibilização do serviço ou limitada à parcela fruível.'
  dispositivo_legal: art. 7.º, caput e § 1.º, da Lei n.º 11.079/2004
  flag_tecnico: true
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Antecipa recebíveis de CAPEX em relação à entrega dos ativos, em favor da concessionária.
- id_tmp: G2-076
  tema: REMUNERACAO_REAJUSTE
