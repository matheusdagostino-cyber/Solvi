  descricao_breve: 'Premissas contábeis incoerentes: depreciação linear (inclusive de "provisões") e modelo de ativo financeiro (ICPC 01)'
  dispositivo_editalicio: P6 II.4 (PDF p. 14) × V.4 (p. 47) e notas 54–56
  transcricao: 'P6 p. 14: ''Agrupa os ativos de caráter intermediário e as provisões associadas às obrigações de remediação e monitoramento''; nota 56: ''IFRS 12: Disclosure of Interests in Other Entities'''
  comentario: A p. 14 deprecia linearmente bens reversíveis (CTR em 15 anos) e "provisões" de remediação; a p. 47 adota o modelo de ativo financeiro, com receita de construção e amortização do recebível. Os dois tratamentos geram bases de IRPJ/CSLL e escudos fiscais diferentes, e não se sabe qual alimentou o fluxo. Há ainda 15 anos de depreciação para a CTR contra amortização do aterro até o fim do contrato (Contrato 10.13.4), e a nota 56 cita a IFRS 12 no lugar da norma de contratos de concessão.
  dispositivo_legal: não localizei fundamento normativo específico para a escolha do método; tratamento tributário de contratos de concessão na Lei n.º 12.973/2014 (dispositivo a verificar)
