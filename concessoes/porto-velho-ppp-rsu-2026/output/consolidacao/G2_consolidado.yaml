  descricao_breve: Sumário do P3 anuncia econometria, elasticidade, capacidade contributiva e inadimplência inexistentes no corpo
  dispositivo_editalicio: P3 Sumário Executivo (PDF p. 5) e II (p. 8); P0 p. 10–11
  transcricao: 'P3 p. 5: ''A metodologia aplicada integra projeções econométricas baseadas em séries históricas da SEMUSB e análises de elasticidade da demanda [...] O estudo avalia a capacidade contributiva da população e o impacto da taxa de inadimplência'''
  comentario: O corpo do P3 apenas multiplica a população projetada pela geração per capita do SINISA; não há série histórica de pesagens, econometria, elasticidade, capacidade contributiva nem inadimplência. Em concessão administrativa não há tarifa ao usuário, e a referência a faturamento e inadimplência não tem correspondência no modelo. O P0 previa essa metodologia para o Caderno 3.
