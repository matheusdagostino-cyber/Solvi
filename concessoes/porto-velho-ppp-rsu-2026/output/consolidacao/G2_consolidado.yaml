  - E7-016
  - E3-005
  - E1-012
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: Demais PPPs e concessões com contraprestação do Município não identificadas no cômputo do art. 28
  dispositivo_editalicio: P6 item VI.9 (p. 59); P7 V.10 (PDF p. 44); Contrato considerando vi (p. 6)
  transcricao: 'P6 p. 59: ''patamar que, somado a eventuais outros contratos de PPP vigentes, permanece dentro do limite legal de 5%'''
  comentario: O limite de 5% incide sobre o conjunto das parcerias contratadas pelo ente (inclusive por entidades controladas). P6 e P7 afirmam a conformidade sem listar os contratos vigentes nem suas despesas anuais; o P6 menciona consulta ao Anexo 13 do RREO, que não integra o pacote.
  dispositivo_legal: art. 28, caput, da Lei n.º 11.079/2004
  depende_de: Relação das PPPs e concessões administrativas/patrocinadas do Município e respectivas despesas anuais (RREO, Anexo 13).
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G2-006
  tema: MODELAGEM_ECONOMICA
  ids_origem:
  - E4-013
  - E1-012
  tipo_achado: IRREGULAR
  categoria: erro_material
  descricao_breve: 'Comprometimento da RCL: 3,186% (≈ 3,19%) informado como 3,18%, sem memória de cálculo'
  dispositivo_editalicio: Edital 5.1.1 (PDF p. 15) × P6 Tabela 18 (p. 59); Contrato considerando vi (p. 6)
  transcricao: 'Edital 5.1.1: ''equivalente a 3,18 % da Receita Corrente Líquida do Município''; P6 Tabela 18: ''Comprometimento da CP sobre a RCL ~3,18 %'''
  comentario: R$ 78.068.375,62 ÷ R$ 2,45 bi = 3,186%, que arredonda para 3,19%. O Edital não apresenta memória de cálculo e o P6 não informa a RCL com mais casas decimais; se a RCL efetiva for maior que R$ 2,45 bi, o percentual de 3,18% pode estar correto. O percentual consta do Edital e serve de atestação fiscal no preâmbulo do Contrato.
  dispositivo_legal: art. 28 da Lei n.º 11.079/2004; art. 10, inciso I, alínea "b", da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G2-007
  tema: MODELAGEM_ECONOMICA
  ids_origem:
