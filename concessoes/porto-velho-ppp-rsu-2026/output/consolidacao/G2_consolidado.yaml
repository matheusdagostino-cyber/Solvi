  descricao_breve: PSC e PPP descontados ao WACC privado (11,63% real), sem justificativa nem sensibilidade da taxa
  dispositivo_editalicio: P6 VI.5 e VI.6 (PDF p. 54); Figuras 4 e 5
  transcricao: 'P6 p. 54: ''descontando-os pelo Custo Médio Ponderado de Capital (WACC) do projeto'''
  comentario: A taxa de desconto altera o resultado do VfM quando os perfis temporais dos fluxos diferem (o PSC concentra CAPEX no início). O P6 não justifica o uso da taxa privada para o fluxo público nem apresenta sensibilidade.
  dispositivo_legal: art. 10, inciso I, alínea "a", e § 1.º, da Lei n.º 11.079/2004
  depende_de: Sensibilidade do VfM à taxa de desconto (planilha do modelo).
