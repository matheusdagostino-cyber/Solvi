  comentario: O P0 previa a determinação do prazo de concessão mais adequado no Caderno 6. A busca no P6 localizou só o tenor da dívida (25 anos) e menções ao horizonte de 30 anos, sem estudo de prazos. O CAPEX tem ciclos quinquenais de frota, o que relativiza o argumento de amortização.
