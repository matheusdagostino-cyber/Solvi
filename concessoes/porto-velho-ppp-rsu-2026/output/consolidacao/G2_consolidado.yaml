  comentario: O Contrato remete o reajuste anual a uma fórmula de indexação "prevista nos Anexos", que não consta de nenhum anexo nem do P6 (busca textual por "reajust" e "indexa"); a Matriz (EF-03) diz que a fórmula é definida no contrato. O P7 fala ora em reajuste vinculado ao IPCA, ora em reajuste paramétrico, e a Matriz cita IPCA, INCC e a diferença entre o custo da sociedade e o "índice de indexação do contrato". O Contrato também não data o "Orçamento Estimado" (o Edital indica maio/2026). Sem índice e fórmula, o reajuste automático é inaplicável.
