  descricao_breve: Modelo aplica PIS/COFINS/ISS por 30 anos a partir de 2027, sem a transição CBS/IBS
  dispositivo_editalicio: P6 II.3 e Tabela 1 (PDF p. 13–14) × Contrato cl. 20.10.4 (p. 48–49) × Matriz EF-05 (p. 31)
  transcricao: 'P6 Tab. 1: ''PIS 1,65% | COFINS 7,60% | ISS 5,00%'''
  comentario: A partir de 2027 passa a ser cobrada a CBS e extinguem-se PIS e COFINS (art. 126, incisos I, "a", e II, do ADCT); de 2029 a 2032 as alíquotas do ISS são reduzidas gradualmente (art. 128 do ADCT), com substituição pelo IBS (LC 214/2025). O P6 modela o regime atual para todo o horizonte. O Contrato (20.10.4) adota essa modelagem como linha de base do evento de reforma tributária, e a Matriz (EF-05) classifica a mudança como "Muito provável (5)".
  dispositivo_legal: art. 126, incisos I, alínea "a", e II, e art. 128 do ADCT (incluídos pela EC n.º 132/2023); Lei Complementar n.º 214/2025 (alíquotas e cronograma aplicáveis a manejo de resíduos — dispositivos a verificar); art. 10, inciso I, alínea "a", da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
  obs_consolidacao: Arts. 126 e 128 do ADCT conferidos no Jus IA (vigentes). As regras contratuais de reequilíbrio tributário (E3-069, E4-037, E7-056) foram remetidas ao G3.
