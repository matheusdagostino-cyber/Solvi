  transcricao: 'P6 p. 23: ''Sua responsabilidade na disponibilização das áreas para ETRs e CTR, no licenciamento ambiental inicial e na oferta de mecanismos de garantia da CP''; Caderno XI.4: ''Os quatro transbordos distritais ... deverão ser adquiridos pela concessionária'''
  comentario: O P6 parte de áreas disponibilizadas pelo Poder Concedente e não orça terrenos. O Edital (6.3.1) e o Contrato (5.1.1 e 10.13.1.1) atribuem à concessionária, por sua conta e risco e sem reequilíbrio, a obtenção das áreas não públicas e do aterro; o Caderno só prevê cessão do incinerador e da área da ETR do Baixo Madeira e manda adquirir os quatro transbordos distritais. O CAPEX não tem aquisição de terrenos para CTR, aterro de rejeitos e ETRs distritais.
