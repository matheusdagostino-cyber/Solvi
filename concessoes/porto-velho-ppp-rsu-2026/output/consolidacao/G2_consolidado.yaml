  comentario: O modelo financia 60% do CAPEX "total elegível" com emissão única no Ano 2, em 25 anos pela Tabela PRICE, embora cerca de 70% do CAPEX sejam reposições quinquenais até o Ano 29. O custo da dívida usa parâmetros do BNDES FINAME, que o próprio P6 descreve com prazo de até dez anos e carência de até dois. A PRICE é descrita com prestações constantes em termos nominais sobre custo indexado ao IPCA, e nenhuma carência é informada.
