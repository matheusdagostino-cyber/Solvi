  descricao_breve: Aterro deve chegar à reversão com 30 anos de vida útil remanescente; capacidade não dimensionada nem orçada
  dispositivo_editalicio: Contrato cl. 10.13.4 a 10.13.5.3 (PDF p. 32); P2 V.5 (p. 36); P3 III.1 (p. 11–12), Tabela 15 (p. 26) e V (p. 38); P6 Tabelas 5 e 7
  transcricao: 'Contrato 10.13.5: ''capacidade e vida útil remanescentes não inferiores a 30 (trinta) anos, contados da referida data, considerada a projeção de geração e de aporte de rejeitos constante dos Anexos do Contrato''; P2 p. 36: ''área já definida, com cerca de 200 mil m², localizada em frente à Vila Princesa'''
  comentario: O Contrato exige que o aterro da CTR tenha, na reversão, capacidade para mais 30 anos, sem indenização (10.13.4), com ampliação a cargo da concessionária sob retenção de pagamentos (10.13.5.3); a prorrogação não reduz essa exigência. Isso implica capacidade para cerca de 60 anos de rejeitos (≈ 4,3–4,5 Mt operados em 30 anos pelos residuais do P6/P3, calculado, mais igual volume remanescente). Os estudos não calculam volume, células, vida útil nem área necessária (os ~20 ha incluem UVR, compostagem e apoio), e a projeção de geração termina em 2056, sem horizonte pós-reversão a que a cláusula remete. A CTR inteira soma R$ 39,6 mi (P6) ou R$ 55,0 mi (P2).
  dispositivo_legal: art. 10, inciso I, alínea "a", e § 4.º, e art. 5.º, inciso I, da Lei n.º 11.079/2004; art. 18, inciso XV, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004
