  transcricao: 'Anexo III p. 31: ''Os itens PCS-07 e PCS-08 constituem obrigações contratuais autônomas da concessionária, distintas e complementares ao Programa de Educação Ambiental escolar, com orçamento mínimo não inferior a 0,5% da contraprestação mensal''; P6 Tab. 9: ''Educação ambiental 120'''
