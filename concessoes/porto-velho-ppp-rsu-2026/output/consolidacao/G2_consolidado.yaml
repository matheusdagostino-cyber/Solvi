  dispositivo_editalicio: P6 Sumário (PDF p. 6), VI.6 (p. 54), Tabela 16 (p. 55) e VII (p. 61); P7 Sumário (p. 8) e III.1.4 (p. 26)
  transcricao: 'P6 Tab. 16: ''VPL (Milhares de Reais) ... Desembolsos da PPP 620 ... Aj. Neut. Comp. (+) 96 ... Value for Money 123 ... 16,5%''; P6 p. 6: ''o VPL dos desembolsos líquidos da PPP totaliza R$ 524 milhões, contra R$ 647 milhões do Public Sector Comparator'''
  comentario: A Tabela 16 indica "Milhares de Reais", mas os valores (620, 458, 123) estão em milhões. O texto compara PPP de R$ 524 mi com PSC de R$ 647 mi; a tabela, PPP de R$ 620 mi com PSC de R$ 743 mi (com o ajuste de neutralidade deslocado para o PSC). Os 16,5% correspondem a 123/743; sobre o PSC de R$ 647 mi descrito no texto, seriam 19,0%. O P7 apoia a escolha da modalidade nesse VfM sem indicar valores, taxa ou memória.
  dispositivo_legal: art. 10, inciso I, alínea "a", da Lei n.º 11.079/2004
