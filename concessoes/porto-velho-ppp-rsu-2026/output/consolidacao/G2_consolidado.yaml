  dispositivo_editalicio: P6 II.2 (PDF p. 13) e V.5 (p. 48–50); P3 VII e VII.1 (p. 49–51); P4 IX (p. 36); Edital 3.1.2 (p. 13–14) e 3.1, viii; Contrato cl. 18.1–18.8 (p. 41–43)
  transcricao: 'P6 V.5: ''em proporção a ser definida no Caderno 6''; P3 p. 52: estudos adicionais ''antes de qualquer vinculação contratual'''
  comentario: O P6 remete a partilha ao próprio Caderno 6, que não a define, e o Contrato fixa 5% da receita bruta (18.5.1). P3, P4 e P6 listam RSS de geradores privados, gate fee de grandes geradores, biogás (4.851 kWh/dia), créditos de carbono e venda de CDR, sem volumes comercializáveis, preços, compradores ou mercados, e o P3 recomenda estudos adicionais antes de vinculação contratual, embora o Edital torne o CDR obrigatório. Fica sem quantificação o potencial de modicidade e sem base o percentual de 5%.
  dispositivo_legal: art. 11 da Lei n.º 8.987/1995 e art. 18, inciso VI, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 10-A, inciso II, da Lei n.º 11.445/2007 (incluído pela Lei n.º 14.026/2020 — redação vigente não confirmada no Jus IA, verificar); art. 10, inciso I, alínea "a", da Lei n.º 11.079/2004
  flag_tecnico: true
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Receita acessória não precificada no teto, com exclusividade de fato em RSS e partilha de 5%, é vantagem para quem a dimensionar melhor.
- id_tmp: G2-102
  tema: REMUNERACAO_REAJUSTE
  ids_origem:
  - E1-038
  - E3-075
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: 'RSS e resíduos de geradores privados: receita cativa ("monopólio", tarifa especial) e, na falta, reequilíbrio pelo PC'
  dispositivo_editalicio: Edital 3.1.2, parte final (PDF p. 13–14); Contrato cl. 18.2.2 e 18.2.2.1 (p. 42) e 18.2, i
  transcricao: 'Edital 3.1.2: ''considerando que a Concessionária operará o monopólio dos serviços públicos de tratamento térmico de RSS na região ... a Concessionária não poderá recusar o recebimento e o tratamento desses RSS''; Contrato 18.2.2: ''assegurada a percepção de tarifa especial ou, na impossibilidade desta, de recomposição do equilíbrio econômico-financeiro'''
  comentario: O Edital exclui do objeto o RSS de geradores privados, mas obriga a concessionária a recebê-lo, mediante preço específico como receita acessória, invocando "monopólio" regional. O Contrato estende o regime a grandes geradores e a resíduos fora do escopo determinados pela ARDPV e assegura "tarifa especial" ou, se inviável, reequilíbrio a cargo do Poder Concedente. Geradores de RSS e grandes geradores respondem pelo gerenciamento de seus resíduos, e serviços prestados pelo titular devem ser remunerados por eles. Não está claro se essa receita foi considerada no P6 e no teto.
  dispositivo_legal: art. 20, incisos I e II, art. 13, inciso I, alínea "g", e art. 27, § 2.º, da Lei n.º 12.305/2010; art. 2.º, § 2.º, da Lei n.º 11.079/2004; art. 11 da Lei n.º 8.987/1995
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Fonte de receita cativa sem concorrência local declarada e garantia de remuneração (tarifa especial ou reequilíbrio) favoráveis à concessionária.
  obs_consolidacao: 'Relacionados (G1): E1-037 e E2-012 (universo de RSS do objeto).'
- id_tmp: G2-103
  tema: REMUNERACAO_REAJUSTE
  ids_origem:
  - E7-040
  - E6-062
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Preço público de grandes geradores (LC 908/2022, art. 27) convertido em receita da concessionária, com 5% de partilha
  dispositivo_editalicio: P7 II.6 (PDF p. 19) × II.10 (p. 21); P3 VII (p. 50); P6 p. 50; Contrato cl. 18.2, f, g, i, 18.5.1 (p. 42–43) e 10.13.5.4 (p. 32)
  transcricao: 'P7 p. 19: ''O preço público pago por grandes geradores opera, no nosso modelo, como Receita Acessória autorizada pela Cláusula 18 do Contrato'''
  comentario: A LC 908/2022 (art. 27) autoriza o Município a cobrar preço público de grandes geradores. O P7 transforma essa cobrança em receita acessória da concessionária, em regime negocial direto, com 5% compartilhados, usando a capacidade da CTR/aterro remunerada pela Parcela A (o P6 qualifica a CTR como "ativo subutilizado" nos anos iniciais). Os estudos não estimam volumes ou preços nem o efeito no consumo de vida útil do aterro (10.13.5.4), e não explicam como se evita dupla remuneração da mesma capacidade.
  dispositivo_legal: art. 27 da Lei Complementar Municipal n.º 908/2022; art. 20 e art. 27 da Lei n.º 12.305/2010; art. 11 da Lei n.º 8.987/1995; art. 4.º, inciso VII, da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Receita acessória não evidente para operador com estrutura comercial na região; compartilhamento reduzido.
- id_tmp: G2-104
  tema: REMUNERACAO_REAJUSTE
  ids_origem:
