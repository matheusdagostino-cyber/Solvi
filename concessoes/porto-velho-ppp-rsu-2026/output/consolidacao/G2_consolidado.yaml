  dispositivo_editalicio: Contrato cl. 16.1 (PDF p. 40); P7 III.6.4 (p. 33); Edital 12.3 (p. 31) e 5.1 (p. 15)
  transcricao: 'Contrato 16.1: ''reajustados de forma automática, a cada interregno mínimo de 12 (doze) meses contados da data de apresentação do Orçamento Estimado ... dispensada a necessidade de prévia homologação administrativa'''
  comentario: Automaticidade, anualidade e vínculo à data do orçamento estimado (maio/2026, igual à data-base da proposta) estão previstos. A cláusula não reproduz a faculdade legal de rejeição motivada pela Administração, que se aplica por força de lei. O índice e a fórmula, porém, inexistem (ver ponto de reajuste).
  dispositivo_legal: art. 5.º, inciso IV e § 1.º, da Lei n.º 11.079/2004; art. 25, § 7.º, e art. 92, § 3.º, da Lei n.º 14.133/2021
