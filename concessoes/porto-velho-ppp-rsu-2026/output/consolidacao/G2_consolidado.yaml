  descricao_breve: 'Fonte regional de financiamento incoerente: texto refere o FNO e indica o FNE Proinfra (BNB) como principal linha'
  dispositivo_editalicio: P6 III.16 (PDF p. 26–27), notas 38–40, e VI.10 (p. 61)
  transcricao: 'P6 p. 26: ''o BNB tem competência para financiar projetos em toda a região Norte do Brasil por meio do Fundo Constitucional de Financiamento do Norte (FNO)''; P6 p. 27: ''A principal linha aplicável à concessão de RSU de Porto Velho é o FNE Proinfra'''
  comentario: Na mesma seção, o P6 afirma que o BNB financia a região Norte pelo FNO e, em seguida, indica como principal linha para o projeto em Rondônia o FNE Proinfra, programa do Banco do Nordeste referenciado nas notas 38–39. A análise de bancabilidade e as considerações sobre garantias ("junto ao BNDES, ao BNB") apoiam-se nessa indicação.
  dispositivo_legal: Lei n.º 7.827/1989 (fundos constitucionais FNO, FNE e FCO e respectivos administradores — dispositivo e redação vigente a verificar; consulta ao Jus IA sem retorno); art. 159, inciso I, alínea "c", da Constituição Federal
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
  obs_consolidacao: A afirmação de que o FNO é administrado pelo Banco da Amazônia depende de conferência da Lei 7.827/1989; o ponto foi mantido como incoerência interna do P6.
