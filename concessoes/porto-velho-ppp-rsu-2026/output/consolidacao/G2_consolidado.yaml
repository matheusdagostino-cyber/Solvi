  dispositivo_editalicio: P6 VI.4 e Equação PPPt = CPt + Apt − It (PDF p. 53); Anexo VI item 5.6 (p. 6); P6 Figura 7 (p. 56)
  transcricao: 'P6 p. 53: ''foram considerados os valores previamente estimados para a Contraprestação Pública, bem como o aporte público previsto''; Anexo VI 5.6: ''remuneração mensal de R$ [*], reajustada anualmente pelo INPC, a ser paga pelo PODER CONCEDENTE'''
  comentario: O fluxo da PPP no VfM considera só contraprestação, aporte e tributos. Ficam de fora a remuneração da instituição financeira da Conta Garantia (paga pelo Poder Concedente, valor em branco), o custo de imobilizar ≈ R$ 13 mi na Conta Garantia e os custos de regulação e estruturação. O texto menciona "aporte público previsto", mas o caso-base é 0% e o Edital não autoriza aporte.
  dispositivo_legal: art. 10, inciso I, alínea "a", e art. 6.º, § 2.º, da Lei n.º 11.079/2004
