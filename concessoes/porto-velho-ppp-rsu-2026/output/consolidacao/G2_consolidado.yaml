  comentario: O modelo calibra a contraprestação para que a TIR desalavancada iguale o WACC (11,63%), o que resulta em VPL nulo, como mostra a Tabela 15 e o próprio texto da p. 50. O Sumário Executivo afirma VPL positivo, e o ICSD mínimo de 1,30x, premissa de covenant, é apresentado como resultado.
  dispositivo_legal: art. 10, inciso I, alínea "a", da Lei n.º 11.079/2004
