  dispositivo_editalicio: P6 VI.3 (PDF p. 51–52), Equação 2 e notas 60–62
  transcricao: 'P6 p. 52: ''identificou um sobrecusto médio de 28%. Esse percentual foi, portanto, adotado como premissa para o sobrecusto de CAPEX''; ''O percentual acrescido será de 4,19% sobre os valores de CAPEX e OPEX, com o objetivo de incorporar os custos licitatórios'''
  comentario: O PSC é o CAPEX/OPEX da PPP acrescido de 28% (sobrecusto médio de obras públicas de infraestrutura, 1930–2000, estudo internacional), 17% (estudo IBPT 2015, citado por notícia) e 4,19% (custo do pregão eletrônico). A vantagem resulta desses acréscimos, sem dados de custo do setor público municipal de RSU e sem valoração dos riscos retidos e transferidos; a TRCF (1,5%) fica embutida no OPEX do PSC.
