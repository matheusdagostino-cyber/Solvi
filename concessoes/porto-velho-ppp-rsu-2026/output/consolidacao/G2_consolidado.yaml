  - E4-014
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Estimativa de impacto orçamentário-financeiro limitada a um exercício, sem série para a vigência
  dispositivo_editalicio: P7 V.10 (PDF p. 44) e III.5 (p. 31); P6 VI.9 e Tabelas 17–18 (p. 58–59); Edital 5.1–5.3 (p. 15)
  transcricao: 'P7 p. 44: ''Recomenda-se que a documentação de instrução processual do certame consolide essa estimativa''; Edital 5.3: ''dotações orçamentárias específicas, a serem incluídas nos orçamentos municipais dos exercícios seguintes'''
  comentario: O art. 10, II, exige estimativa do impacto orçamentário-financeiro nos exercícios em que o contrato vigorar. P6 e P7 apresentam só a relação entre a contraprestação em regime pleno e a RCL de 2025, sem série anual que considere ramp-up, reajuste, recomposição da Conta Garantia e eventual aporte. O próprio P7 (posterior ao Edital) registra que a estimativa ainda deve ser consolidada. O Edital também não refere a estimativa do fluxo de recursos por exercício (art. 10, IV).
  dispositivo_legal: art. 10, incisos II e IV, da Lei n.º 11.079/2004; art. 16, inciso I, da Lei Complementar n.º 101/2000
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
  obs_consolidacao: 'Relacionado (G3): E7-006 — fontes de recursos da contraprestação e fluxo por exercício não identificados (art. 10, IV). Dotação orçamentária em branco (E1-004/E1-005) remetida ao G4 (duplica E3-002, E7-007, E7-008).'
- id_tmp: G2-008
  tema: MODELAGEM_ECONOMICA
  ids_origem:
  - E7-003
  - E7-012
  - E4-016
  - E3-005
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Não afetação das metas fiscais e compensação não demonstradas; "margem fiscal liberada" sem a despesa atual
  dispositivo_editalicio: P7 V.10 (PDF p. 44); P6 VI.9 e VII (p. 59 e 61); Contrato considerando vi (p. 6)
  transcricao: 'Contrato considerando vi: ''estando devidamente abrigado na margem fiscal liberada pela extinção do Contrato nº 019/PGM/2024''; P7 p. 44: ''Esses requisitos devem ser atendidos pelo Município antes da publicação do Edital'''
  comentario: O art. 10, I, "b", e § 1.º exigem demonstração, com premissas e metodologia, de que a despesa não afetará as metas de resultados fiscais, com compensação por aumento permanente de receita ou redução permanente de despesa. O pacote não contém essa demonstração; o P7 a trata como pendente. O P6 e o Contrato apoiam a compensação na extinção do Contrato 019/PGM/2024 (R$ 109,35 mi/ano, anulado), mas os serviços seguem pagos por contrato emergencial (028/PGM/2025) e pelo contrato de destinação no Ecoparque (042/PGM/2023), cujos valores não constam dos estudos.
  dispositivo_legal: art. 10, inciso I, alínea "b", e § 1.º, da Lei n.º 11.079/2004; arts. 16, incisos I e II, e 17, §§ 1.º e 2.º, da Lei Complementar n.º 101/2000
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
  obs_consolidacao: A parte relativa à despesa atual efetiva depende dos valores pagos nos contratos 028/PGM/2025 e 042/PGM/2023 (não constam do pacote).
- id_tmp: G2-009
  tema: MODELAGEM_ECONOMICA
  ids_origem:
  - E5-008
  - E6-059
  - E4-052
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Custo atual do serviço (status quo) não levantado; sem linha de base para comparar com a contraprestação
  dispositivo_editalicio: P1 item VII (PDF p. 65) e VII.2.4 (p. 84); P2 e P3 (integral); P6 VI.2–VI.6 (p. 51–55)
  transcricao: 'P1 p. 65: ''Apesar de não ter sido disponibilizado, até o momento, dados sobre a frota utilizada, o mapeamento das rotas, e custos envolvidos''; P1 p. 84: ''regime de empreitada por preço unitário'' (Contrato 042/PGM/2023, sem preço)'
  comentario: O diagnóstico declara não ter recebido custos, frota e rotas, embora o P0 os tenha solicitado (custos de disposição por tonelada). Nenhum estudo informa a despesa atual do Município com coleta emergencial, disposição no Ecoparque e RSS, em R$/ano ou R$/t. O VfM compara a PPP com um PSC hipotético, e a análise fiscal compara com o contrato anulado. Sem a linha de base, não se verifica a economicidade da contraprestação máxima (R$ 78,07 mi/ano; ≈ R$ 500–520/t, calculado).
  dispositivo_legal: art. 4.º, inciso VII, e art. 10, inciso I, alíneas "a" e "b", da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G2-010
  tema: MODELAGEM_ECONOMICA
  ids_origem:
  - E5-017
  - E7-024
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: 'Taxa de RSU (LC 878/2021) e preço público: base, arrecadação e inadimplência não informadas'
  dispositivo_editalicio: P1 item V.3 (PDF p. 56–58); P7 II.1 (p. 14), II.6 (p. 19), III.1.2 (p. 25) e III.1.4 (p. 26); P6 p. 11; P0 data request (p. 23–24)
  transcricao: 'P7 p. 19: ''são custeados por taxa, na forma da Lei Complementar Municipal nº 878, de 17 de dezembro de 2021''; P1 p. 57: ''mas o município ainda depende fortemente do Tesouro''; P0: ''Taxa de limpeza urbana - base de cálculo e arrecadação histórica'''
  comentario: O P7 reconhece que o manejo de RSU é custeado por taxa (LC 878/2021) e que o Município pode cobrar preço público de grandes geradores (LC 908/2022, art. 27), mas mantém toda a remuneração a cargo do Tesouro. Nenhum estudo informa base de cálculo, arrecadação histórica, inadimplência ou grau de cobertura da contraprestação (R$ 78,1 mi/ano), dados pedidos no P0. P1 e P4 não mencionam a taxa; o P6 trata a cobrança como "preço público" e o P7 como "taxa". Não se demonstra a sustentabilidade econômico-financeira por cobrança nem se afasta a hipótese do art. 35, § 2.º, da Lei 11.445.
  dispositivo_legal: art. 29, inciso II, e art. 35, caput e § 2.º, da Lei n.º 11.445/2007; art. 10, inciso I, alínea "b", da Lei n.º 11.079/2004; art. 14 da Lei Complementar n.º 101/2000
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G2-011
  tema: MODELAGEM_ECONOMICA
  ids_origem:
  - E4-001
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: P6 (1.ª versão, 26/05/2026) não atualizado após as revisões de P1–P4, Caderno, Anexo III e Edital
  dispositivo_editalicio: P6 capa (PDF p. 1) × Edital item 3.1 (p. 13–14); capas de P1, P2, P3, P4, Anexo A e Anexo III
  transcricao: 'P6 capa: ''1ª VERSÃO: SÃO PAULO, 26 DE MAIO DE 2026'''
  comentario: O P6 consome CAPEX/OPEX do P2 e demanda do P3, mas permanece na 1.ª versão de 26/05/2026, enquanto P1 (rev. 01/09/2026), P2, P3 e P4 (3.ª rev. 01/09/2026), Anexo III (rev. 10/09/2026), Caderno de Encargos (rev. 11/09/2026) e Edital/Contrato/Matriz (2.ª versão, 08/09/2026) foram revistos. O Edital (3.1) declara que o EVTEA define o escopo das obrigações de investimento. As divergências de CAPEX da CTR entre P2 e P6 (ver G2 CAPEX) são consistentes com a defasagem de versões.
  dispositivo_legal: art. 10, inciso I, alínea "a", e § 4.º, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
  obs_consolidacao: Verificar se existe versão posterior do P6 não juntada (a Matriz cita páginas do P6 que não coincidem — E4-066).
- id_tmp: G2-012
  tema: MODELAGEM_ECONOMICA
  ids_origem:
  - E4-002
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Kd calculado com TLP de agosto/2026 em documento datado de 26/05/2026 e data-base maio/2026
  dispositivo_editalicio: P6 item IV.6 (PDF p. 31) × capa (p. 1) × Edital 12.2.1 e 12.3 (p. 31)
  transcricao: 'P6 p. 31: ''8,21% como Fator de Custo Financeiro determinado pela TLP em agosto de 2026''; Edital 12.3: ''data-base maio/2026, data do orçamento estimado'''
  comentario: O documento datado de 26/05/2026 utiliza a TLP de agosto/2026 para o custo da dívida (IPCA + 11,42%), que entra no WACC e, portanto, na CMM. O Edital fixa a data-base do orçamento estimado e da CMM em maio/2026. Ou o P6 foi alterado sem controle de versão, ou a data-base declarada não corresponde aos parâmetros efetivamente usados no teto.
  dispositivo_legal: art. 25, § 7.º, da Lei n.º 14.133/2021; art. 5.º da Lei n.º 14.133/2021; art. 10, inciso I, alínea "a", da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G2-013
  tema: MODELAGEM_ECONOMICA
  ids_origem:
  - E4-004
  - E1-010
  - E5-002
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: Atualidade da data-base (maio/2026) e dos estudos frente à sessão e à assinatura
  dispositivo_editalicio: Edital 12.2.1 e 12.3 (PDF p. 31), preâmbulo (data da sessão em branco) e cronograma (item 23, p. 52–53); P6 p. 36 (Ano 2 = 2028); capas de P1 e P4
  transcricao: 'Edital 12.3: ''Os valores apresentados na PROPOSTA ECONÔMICA devem considerar como data-base maio/2026'''
  comentario: 'A data da sessão não está definida e o P6 assume Ano 1 = 2027. Se a assinatura ocorrer em exercício diverso do da publicação do edital, a lei exige atualização prévia dos estudos e demonstrações dos incisos I a IV do art. 10, providência que o Edital não prevê. Os dados do diagnóstico vão até dez/2025 (SINISA 2024, Censo 2022) e as revisões de set/2026 não incorporam fatos posteriores (ex.: vencimento da LAI do Ecoparque em 08/10/2026). Em contrato de 30 anos, a defasagem afeta CAPEX, OPEX e WACC.'
  dispositivo_legal: art. 10, § 2.º, da Lei n.º 11.079/2004; art. 25, § 7.º, da Lei n.º 14.133/2021
  depende_de: Datas da publicação, da sessão pública e da assinatura prevista. O parâmetro interno de 6 meses de atualidade (origem TCE-SP) deve ser conferido perante o TCE-RO; não localizei fundamento normativo que fixe prazo máximo.
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G2-014
  tema: MODELAGEM_ECONOMICA
  ids_origem:
