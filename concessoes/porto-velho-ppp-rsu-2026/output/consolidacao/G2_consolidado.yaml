  - E4-058
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Recicláveis listados como receita acessória da SPE, mas revertidos integralmente às cooperativas
  dispositivo_editalicio: Contrato cl. 18.2, e, × 18.5.2 (PDF p. 42–43); P6 III.7 (p. 21) e V.5 (p. 48); Anexo III CS-01
  transcricao: 'Contrato 18.5.2: ''ressalvado que a receita de comercialização de recicláveis triados na UVR é integralmente revertida às cooperativas de catadores''; P6 p. 48: ''A comercialização de materiais recicláveis é a fonte de receita acessória de maior previsibilidade'''
  comentario: O rol de receitas acessórias inclui a comercialização de recicláveis, e o P6 a apresenta como a principal, admitindo na mesma seção que ela não transita integralmente pelo caixa da SPE. O Contrato reverte integralmente às cooperativas a receita dos recicláveis triados na UVR (operada pela concessionária, com triagem mecanizada) e a exclui da partilha. Fica indefinida a titularidade dos materiais e quem custeia a operação da UVR.
  dispositivo_legal: art. 11 da Lei n.º 8.987/1995; art. 18, § 1.º, inciso II, e art. 36, § 1.º, da Lei n.º 12.305/2010
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G2-105
