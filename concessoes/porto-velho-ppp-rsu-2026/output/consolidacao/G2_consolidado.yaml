  tipo_achado: IRREGULAR
  categoria: erro_material
  descricao_breve: 'IO5 (chorume): fórmula dá 1 com zero ocorrências e valores negativos com mais de uma (erro de parênteses)'
  dispositivo_editalicio: Anexo D V.1.2, IO5 (PDF p. 17) e Tabela 5 (p. 14)
  transcricao: 'Anexo D: ''IO5 = SA04 = 1 - [QODC / QRRM x 100]'''
  comentario: Com zero ocorrências o IO5 vale 1, e não 100 como exige a meta da Tabela 5; com 1 ocorrência em 100 rotas vale 0 e com 2 vale −1. A forma coerente com a meta seria (1 − QODC/QRRM) × 100. Também não se define a unidade "rota em rodovia ou rio".
  dispositivo_legal: art. 5.º, inciso VII, da Lei n.º 11.079/2004
