  - E3-054
  - E7-057
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Sem função de conversão do IQS em desconto nem parcela sujeita; teto de 10% "referencial"; remissão circular
  dispositivo_editalicio: Contrato cl. 15.5, 15.5.1 (PDF p. 37–38) e 10.2.33.1 (p. 26); Anexo D seção VI (p. 21); P7 III.6.2 (p. 32)
  transcricao: 'Contrato 15.5.1: ''O percentual máximo de desconto previsto no item 15.5 constitui parâmetro de referência, devendo o valor definitivo observar o disposto no Anexo D''; Anexo D VI: ''O resultado final do IQS deverá ser aplicado à parcela da remuneração definida no contrato como vinculada à qualidade ou ao desempenho dos serviços'''
  comentario: O Contrato remete o valor definitivo do desconto ao Anexo D; o Anexo D remete à "parcela definida no contrato". Nenhum dos dois define a curva ou as faixas que convertem a nota do IQS em desconto, nem se o desconto incide sobre a CME inteira ou só sobre a Parcela A ou a B (o P7 sugere aplicação diferenciada). O teto de 10% é declarado "parâmetro de referência", o que deixa indefinido o desconto máximo, e a cl. 10.2.33.1 soma ao mesmo teto os descontos das cláusulas sociais. O mecanismo de pagamento por desempenho fica inoperável.
  dispositivo_legal: art. 5.º, inciso VII, e art. 6.º, § 1.º, da Lei n.º 11.079/2004; art. 18, inciso VIII, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Sem regra de conversão, a aplicação de qualquer desconto é contestável, o que favorece a concessionária; a impugnação levaria à definição da regra.
  obs_consolidacao: 'Relacionados: E1-115 e E3-007 (G3, competência para apurar o IQD); E2-065 (G4, terminologia IQS/IQD).'
