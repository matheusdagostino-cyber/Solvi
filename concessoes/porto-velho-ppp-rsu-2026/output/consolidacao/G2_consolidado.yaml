  descricao_breve: Equity total de R$ 57,8 mi incompatível com 40% de capital próprio sobre o CAPEX
  dispositivo_editalicio: P6 Tabela 2 (PDF p. 16) × II.5 (p. 15) × IV.7 (p. 31)
  transcricao: 'P6 Tab. 2: ''Equity + Dívida inicial R$ 313,8 milhões ... Equity total R$ 57,8 milhões (2,5% do valor do contrato)'''
  comentario: Com 40% de capital próprio sobre CAPEX de R$ 298,3 mi (ou R$ 313,8 mi da Tabela 2), o equity seria ≈ R$ 119–126 mi, e não R$ 57,8 mi. A Tabela 2 mistura "Equity + Dívida inicial" (R$ 313,8 mi) com um CAPEX total que o próprio P6 informa ser R$ 298,3 mi, e sua fonte é "Adaptada, PMSB, 2022", documento que não trata de estrutura de capital.
  dispositivo_legal: art. 10, inciso I, alínea "a", da Lei n.º 11.079/2004
