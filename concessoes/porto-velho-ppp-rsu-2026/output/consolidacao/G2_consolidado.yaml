  comentario: No Caderno, no Anexo III e no P3, 83 + 94,98 + 24,50 = 202,48 km, e não 193 km. O P1 indica 73 km terrestres até a Foz do Jamari (total de 193 km, que fecha) e Abunã a 223 km; o Caderno indica 83 km e Abunã a 204 km. O texto do P3 dá 105 km entre a estação de transbordo e o aterro, e há referência à "BR 367". Como o Caderno prevalece sobre o EVTEA (Edital 2.11.2), a base de distâncias contratual pode não ser a modelada.
