  transcricao: 'Caderno Tab. 28: ''CTR/ETR | Pá carregadeira, retroescavadeira, balança, prensa, esteira, trituradores, contêineres e sistemas de drenagem''; P6 p. 47: ''CAPEX total de construção civil de R$ 39,6 milhões''; P6 p. 13: ''uso de separadores óticos para remoção de PVC e prensagem para otimizar o transporte até indústrias cimenteiras'''
  comentario: O objeto (Edital 3.1, viii) e o Caderno exigem triagem mecanizada, linha de CDR, autoclave, pátio de compostagem, balança, tratamento de lixiviado e drenagem/queima de gases. P2 e P6 orçam a CTR em uma linha de "construção" (R$ 55,0 mi no P2; R$ 39,6 mi no P6, descrita como "construção civil") mais frota de terraplenagem e aterro, sem itens para esteiras, separadores ópticos/magnéticos, prensas, trituração e separação de PVC do CDR, autoclave ou equipamentos de compostagem. O P6 descreve a linha de CDR, mas não estima produção (t/ano). O Edital (3.1) restringe as obrigações de investimento às especificadas e quantificadas nos anexos e no EVTEA.
