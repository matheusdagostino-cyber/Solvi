  descricao_breve: Parcela B "liquidada conforme medição dos volumes" sem preço unitário, volume-base ou fórmula; P6 a trata como fixa
  dispositivo_editalicio: Contrato cl. 15.5.2.2 e 15.6.3 (PDF p. 38) × P6 Tabela 14 (p. 46) × Matriz TO-01 (p. 3) e TO-06 (p. 7–8)
  transcricao: 'Contrato 15.5.2.2: ''com valor de referência em regime pleno estabelecido nos Anexos do Edital e do Contrato, a ser liquidado conforme a medição efetiva dos volumes de resíduos coletados e processados no período correspondente'''
  comentario: O Contrato vincula a Parcela B à medição de volumes, mas nenhum documento fixa preço por tonelada, volume de referência, faixas ou fórmula de liquidação. O P6 trata a Parcela B como valor mensal fixo (R$ 4.737.940,12) e a Matriz prevê reequilíbrio só fora de banda de ±10% por 6 meses. Sem a regra de conversão, a Contraprestação Mensal Efetiva fica indeterminada.
  dispositivo_legal: art. 5.º, inciso IV, e art. 6.º, § 1.º, da Lei n.º 11.079/2004; art. 92, incisos V e VI, da Lei n.º 14.133/2021; art. 23, inciso IV, da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004
  flag_tecnico: false
