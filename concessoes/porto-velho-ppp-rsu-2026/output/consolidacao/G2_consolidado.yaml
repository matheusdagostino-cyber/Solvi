  descricao_breve: Proposta em valor mensal único, sem regra de decomposição em Parcelas A/B nem de aplicação do ramp-up
  dispositivo_editalicio: Edital itens 12.2 a 12.2.3 (PDF p. 30–31); Anexo C, Carta de Proposta, itens 2–2.3 (p. 26); Contrato cl. 15.5.2, 15.6.1 a 15.6.5 (p. 38); P6 Tabela 14 (p. 46)
  transcricao: 'Edital 12.2.2: ''A PROPOSTA ECONÔMICA e os lances serão ofertados exclusivamente sobre o valor da CONTRAPRESTAÇÃO MENSAL''; Contrato 15.6.5: ''A redução de valor decorrente do escalonamento não enseja recomposição do equilíbrio econômico-financeiro, por integrar as premissas da Proposta Econômica'''
  comentario: 'O Contrato remunera por duas parcelas com regimes distintos: Parcela A (CAPEX) com ramp-up e Parcela B (OPEX) reduzida no 1.º ano e liquidada por volume, além do desconto por IQD. Edital e Carta de Proposta pedem um único valor mensal. A divisão A/B só existe para o teto (P6 Tabela 14). Não há critério (proporcional, fixo ou declarado pela licitante) para distribuir o deságio entre as parcelas, nem regra sobre os percentuais de ramp-up aplicáveis ao valor ofertado, embora o Contrato diga que o escalonamento integra as premissas da proposta.'
  dispositivo_legal: art. 5.º, inciso IV, da Lei n.º 11.079/2004; art. 18, inciso IX, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
