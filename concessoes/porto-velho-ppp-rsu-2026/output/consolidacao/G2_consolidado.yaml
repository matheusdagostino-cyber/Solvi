  descricao_breve: TRCF de 1,5% sobre receita bruta, repassada à contraprestação; faculdade legal de não incidência não utilizada
  dispositivo_editalicio: Contrato cl. 13.1.1 (PDF p. 34) × P6 p. 44 × P7 V.11 (p. 44) e XI.3.3 (p. 68)
  transcricao: 'Contrato 13.1.1: ''no montante de 1,5% (um e meio por cento) da receita operacional bruta''; P6 p. 44: ''integralmente repassável à contraprestação pública ... facultam que o contrato de parceria público-privada, na modalidade de concessão administrativa, preveja a não incidência da TRCF'' (art. 51, §§ 1.º e 2.º, da LC 1.013/2025)'
  comentario: 'A TRCF incide sobre a receita operacional bruta e, segundo o P6, é integralmente repassada à contraprestação: o Município paga, via PPP, a taxa que ele próprio arrecada. O P6 registra que a LC 1.013/2025 (art. 51, §§ 1.º e 2.º) permite ao contrato de PPP administrativa prever a não incidência; o Contrato cita o art. 53 e impõe a incidência, e o P7 não menciona a faculdade. A base de cálculo em receita bruta é questionável para taxa de poder de polícia.'
  dispositivo_legal: art. 145, inciso II e § 2.º, da Constituição Federal; art. 77, parágrafo único, da Lei n.º 5.172/1966 (CTN); arts. 51 e 53 da Lei Complementar Municipal n.º 1.013/2025
