  descricao_breve: 'Capital social e integralização da SPE: P7 (10%/65%) × Edital (1%; SPE 1,5%/50%) × P6 (1%/40%)'
  dispositivo_editalicio: P7 IX.2 (PDF p. 62) × Edital 13.17.2 (p. 35) e 20.1.2.1 (p. 48) × P6 Tabela 2 (p. 16)
  transcricao: 'Edital 20.1.2.1: ''Subscrição de, no mínimo, R$ 34.678.914,41 (...) e integralização de R$ 17.339.457,21''; P7: ''O dimensionamento do capital social em 10% do valor do Contrato ... a condicionalidade da integralização inicial mínima de 65% à assinatura do Contrato''; P6 Tab. 2: ''Capital social mínimo R$ 23,1 milhões (1% do valor do contrato) ... Integralização inicial 40% do capital social mínimo'''
  comentario: O Edital exige capital mínimo da licitante de 1% do Valor Estimado (R$ 23,1 mi) e, para a SPE, subscrição de R$ 34,7 mi (1,5%) com integralização de R$ 17,3 mi (50%) como condição de assinatura. O P6 modela capital social mínimo de 1% com 40% integralizados. O P7 afirma capital de 10% do valor do Contrato (≈ R$ 231 mi) com 65% integralizados "em linha com o P6". São três parâmetros para a mesma exigência, e o fluxo de equity do modelo não reflete a regra do Edital.
  dispositivo_legal: art. 9.º da Lei n.º 11.079/2004; art. 69, § 4.º, e art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
  obs_consolidacao: E4-044 e E7-061 absorvidos do G4 (HABILITACAO), conforme cluster atribuído ao G2; se o G4 os mantiver, consolidar lá e manter aqui só a referência.
