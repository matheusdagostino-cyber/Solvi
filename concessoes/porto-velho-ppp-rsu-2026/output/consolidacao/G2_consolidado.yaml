  - E4-055
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Base do compartilhamento inconsistente (ganho econômico × receita bruta × receita líquida no biogás); 5% sem justificativa
  dispositivo_editalicio: Contrato cl. 18.5, 18.5.1 (PDF p. 43) e 18.10.10 (p. 45); P6 V.5 (p. 48–49)
  transcricao: 'Contrato 18.5.1: ''5% (cinco por cento) da receita bruta obtida pela Concessionária''; 18.10.10: ''incidindo o compartilhamento sobre a receita líquida, assim entendida a receita bruta deduzida dos custos operacionais diretamente atribuíveis à usina e da parcela de amortização do investimento'''
  comentario: A regra geral (18.5) fala em compartilhar "ganhos econômicos"; o percentual (18.5.1) incide sobre receita bruta; para o biogás (18.10.10), sobre receita líquida, deduzidos custos e amortização apurados pela própria concessionária. O P6 deixa a proporção "a definir" e não justifica os 5%.
  dispositivo_legal: art. 11 da Lei n.º 8.987/1995; art. 10-A, inciso II, da Lei n.º 11.445/2007 (redação a verificar); art. 5.º, inciso IX, da Lei n.º 11.079/2004 (como referência de partilha de ganhos)
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: A base líquida do biogás e o percentual de 5% favorecem a concessionária.
  obs_consolidacao: A não reversibilidade da usina de biogás (E7-054) foi remetida ao G3 (duplica E3-081).
- id_tmp: G2-106
  tema: REMUNERACAO_REAJUSTE
  ids_origem:
  - E7-053
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Receitas acessórias em rol aberto, com autorização tácita por silêncio do Poder Concedente
  dispositivo_editalicio: Contrato cl. 18.2 e 18.3 a 18.3.3 (PDF p. 42–43) e 18.7; P7 III.7 (p. 34)
  transcricao: 'Contrato 18.3.2: ''A objeção poderá ser oferecida pelo Poder Concedente no prazo máximo de 20 (vinte) dias úteis ... sendo o silêncio interpretado corno autorizativo ao início da atividade pela Concessionária'''
  comentario: O rol da cl. 18.2 já é amplo (inclui energia térmica por incineração, resíduos Classe I e efluentes industriais), e a cl. 18.3 admite qualquer outra atividade mediante comunicação, com objeção limitada a impacto comprovado no serviço e silêncio de 20 dias úteis valendo como autorização. As fontes de receitas alternativas devem constar do edital e do contrato. Não localizei base legal para anuência tácita do Poder Concedente nessa hipótese.
  dispositivo_legal: art. 11 da Lei n.º 8.987/1995 e art. 18, inciso VI, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 10-A, inciso II, da Lei n.º 11.445/2007 (redação a verificar); não localizei fundamento normativo específico que autorize a anuência tácita
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Oportunidades de receita acessória não evidentes com baixo compartilhamento (5%).
  obs_consolidacao: 'Relacionado (G1): E3-080 (receitas com incineração, Classe I e efluentes em infraestrutura pública).'
