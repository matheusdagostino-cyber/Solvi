  dispositivo_editalicio: Anexo III item XI.1 (PDF p. 26) e Tabela 17, CS-01, CS-02 e CS-04 (p. 27–28); Contrato cl. 10.2.33.3 a 10.2.33.5 (p. 26–27); P4 V.4, VII.1 e IX (p. 24, 30, 36); P6 p. 48
  transcricao: 'Anexo III p. 26: ''O contrato deve prever pagamento pelo serviço de triagem como receita garantida, não dependente do preço de mercado dos recicláveis''; Tab. 17, CS-01: ''a calibrar após o Nível 1''; Contrato 10.2.33.4: ''os limites mínimo e máximo previstos no Anexo de Diretrizes Ambientais'''
  comentario: A CS-01 fixa percentual mínimo "a calibrar após o Nível 1"; a CS-02 exige volume mínimo por tonelada triada que garanta a sustentabilidade das cooperativas independentemente do mercado, sem valor; a CS-04 deixa metas para M24 e M60. O Contrato manda a ARDPV fixar o percentual definitivo entre limites mínimo e máximo do Anexo III, sem reequilíbrio (10.2.33.5), mas o Anexo III só tem piso. O P6 supõe que a cooperativa retém a receita dos recicláveis, sem custo de remuneração da triagem. As obrigações não podem ser precificadas na proposta.
  dispositivo_legal: art. 18, incisos I e II, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 36, § 1.º, da Lei n.º 12.305/2010; art. 10, inciso I, alínea "a", da Lei n.º 11.079/2004
