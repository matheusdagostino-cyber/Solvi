  descricao_breve: Ajuste de neutralidade competitiva abate tributos federais da despesa municipal e responde por 78% do VfM
  dispositivo_editalicio: P6 VI.4 (PDF p. 53) e Tabela 16 (p. 55)
  transcricao: 'P6 p. 53: ''mediante a dedução, do valor da contraprestação paga pelo Poder Concedente, dos tributos diretos e indiretos recolhidos pela Concessionária'''
  comentario: Do ponto de vista do Município, só o ISS (e a TRCF) retornam aos cofres municipais; PIS, COFINS, IRPJ e CSLL são receitas da União. O ajuste (R$ 96 mi) corresponde a 78% do VfM de R$ 123 mi. Sem ele, o PSC (R$ 647 mi) supera a PPP bruta (R$ 620 mi) em R$ 27 mi (≈ 4%).
  dispositivo_legal: art. 10, inciso I, alínea "a", da Lei n.º 11.079/2004
