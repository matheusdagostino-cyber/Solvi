  descricao_breve: 'Metas e massas de recuperação divergentes: P3/Caderno/Anexo D (Meta 6 ajustada) × P6 (Meta 6 × 70% + Meta 7)'
  dispositivo_editalicio: P3 IV.3 e Tabela 9 (PDF p. 19–20) e Tabela 10 (p. 21); Caderno Tabela 7 (p. 12); Anexo D V.1.3 (p. 17–18) e Tabela 5 (p. 14); P6 Tabelas 4 e 5 (p. 34–35); P4 VII.1 (p. 30); Matriz TO-01 (p. 3)
  transcricao: 'P3/Anexo D: ''META 6, ajustada = (META 6.1 x 0,60 + 10%) x META PLANARES''; P6 p. 34: ''O percentual denominado volume total a recuperar resulta, portanto, da seguinte composição: (Meta 6 × 70%) + Meta 7''; P6 Tab. 5 (2027): ''150.809 | 8.430 | 142.379'''
  comentario: 'O P3 (e o Anexo D) reduz o indicador PLANARES (5,2% em 2028) pelo fator (cobertura seletiva × 0,6 + 10%), obtendo 2,29%, e expressa a Meta 7 sobre a fração orgânica; o P6 aplica a projeção PLANARES diretamente (4,70% em 2027) × 70% e soma a Meta 7 sobre o RSU total (5,59% em 2027). Resultado: 4.193 t recuperadas e 146.617 t residuais em 2027 no P3/Caderno, contra 8.430 t e 142.379 t no P6 (2056: 20.208 × 26.507 t). O P3 define o indicador da Meta 6 como percentual da massa total, mas o texto fala em triagem mecanizada de "10% de todo resíduo" e a fórmula aplica 10% sobre a meta. O Anexo D publica a fórmula sem a coluna de projeção PLANARES e sem fórmula do indicador observado. A reciclável de 2027 também diverge (47.800 t no P4 × 45.895 t no P6). A divergência afeta aterro, OPEX de disposição, receitas acessórias e a linha de base da banda de ±10% (TO-01, referida à "projeção do P3").'
  dispositivo_legal: art. 10, inciso I, alínea "a", e art. 5.º, incisos III e VII, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: true
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
  obs_consolidacao: 'Correção: E2-055 afirmava que a fórmula da Meta 6 ajustada não reproduz a Tabela 5 do Anexo D (cálculo com META PLANARES = 2,29%). Com a projeção PLANARES da Tabela 9 do P3 (5,2% em 2028), (0,568 × 0,6 + 0,10) × 5,2% = 2,29%, e os valores coincidem; mantidas apenas a ausência dos insumos no Anexo D e as demais incoerências.'
