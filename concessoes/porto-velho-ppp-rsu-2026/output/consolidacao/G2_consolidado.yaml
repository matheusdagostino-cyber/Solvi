  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Contraprestação paga pelo cronograma original mesmo sem disponibilização do serviço por atraso do Poder Concedente
  dispositivo_editalicio: Contrato cl. 5.1.2 (PDF p. 14); P7 III.8 (p. 35); Matriz RJ-05
  transcricao: 'Contrato 5.1.2: ''O atraso ou a entrega de bens que sejam de responsabilidade do Poder Concedente em desconformidade com o Contrato isenta a responsabilidade da Concessionária no cumprimento dos prazos contratualmente estabelecidos, bem como não obstará o início da fluência e pagamento dos valores devidos de Contraprestação Pública Mensal em atenção ao cronograma originalmente proposto no Contrato'''
  comentario: A cláusula assegura o fluxo da contraprestação segundo o cronograma original mesmo que os serviços não possam ser prestados por atraso na entrega de bens pelo Poder Concedente; o P7 a descreve sem ressalvas. A contraprestação deve ser precedida da disponibilização do serviço (ou limitada à parcela fruível); a compensação de atraso imputável ao Poder Concedente seria matéria de reequilíbrio ou indenização.
  dispositivo_legal: art. 7.º, caput e § 1.º, da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Assimetria favorável à concessionária que a impugnação poderia eliminar.
- id_tmp: G2-078
  tema: REMUNERACAO_REAJUSTE
  ids_origem:
  - E3-034
  - E4-091
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Aporte público previsto no Contrato (excedente do rito GAC) e no VfM, sem autorização no Edital nem cronograma
  dispositivo_editalicio: Contrato cl. 8.6.1.2.2 (PDF p. 18–19); P6 VI.7 (p. 55–57), Equação PPPt e Figura 7; Edital (sem menção a aporte)
  transcricao: 'Contrato 8.6.1.2.2: ''constitui risco do Poder Concedente e enseja recomposição do equilíbrio econômico-financeiro, na forma da Cláusula 20ª, ou aporte público'''
  comentario: O Edital não menciona aporte de recursos (busca textual sem ocorrência). O Contrato admite "aporte público" para o excedente das medidas de intervenção do rito GAC, sem cronograma nem marcos de repasse, e o P6 analisa aportes de 0% a 60% do CAPEX de 5 anos e inclui o termo Apt no fluxo da PPP. O aporte em contrato de PPP depende de autorização no edital (contratos novos) e de cronograma e marcos contratuais, e destina-se a obras e aquisição de bens reversíveis; não está demonstrado que o custeio de remediação se enquadre nessa finalidade.
  dispositivo_legal: art. 6.º, § 2.º, art. 5.º, inciso XI, e art. 7.º, § 2.º, da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
  obs_consolidacao: O enquadramento da remediação ambiental como "obras e aquisição de bens reversíveis" é questão a examinar na Fase 2.
- id_tmp: G2-079
  tema: REMUNERACAO_REAJUSTE
