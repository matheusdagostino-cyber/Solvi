  comentario: Na Tabela 5 do P1, a rota de Calama via Humaitá soma 205 km terrestres e 63,70 km fluviais (~268,7 km), mas o total registrado é 137 km; as demais linhas fecham. O trecho fluvial de Nazaré é 28,84 milhas no texto e 24,84 milhas na tabela (esta coerente com o total de 113 km). O P4 dá DMT de 255–378 km para o Alto Madeira, sem origem para 378 km (máximo de 355 km no P1 e nas demais tabelas do P4); a Matriz reproduz 255–378 km.
