  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: P6 pressupõe reequilíbrio por variação de diesel e de premissas de custo que a Matriz aloca à concessionária
  dispositivo_editalicio: P6 III.11 (PDF p. 23), VII e Figura 8 (p. 61) × Matriz EF-01 (p. 29), EF-06 e EF-07 (p. 31); Contrato cl. 17.1 (p. 41)
  transcricao: 'P6 III.11: ''com variação associada à oscilação do preço dos combustíveis fósseis, mitigada por cláusulas contratuais de reequilíbrio''; P6 VII: ''incluir mecanismos de revisão ordinária
    periódica no contrato, garantindo o reequilíbrio econômico-financeiro diante de desvios relevantes em relação às premissas adotadas'''
  comentario: O P6 afirma que a variação do diesel é mitigada por reequilíbrio, mas a Matriz EF-01 (probabilidade 4, score 16) aloca o risco exclusivamente à concessionária, salvo álea extraordinária. O
    P6 mostra a TIR caindo para 8,71% com OPEX +5% e para 2,80% com OPEX +15% e recomenda revisão com reequilíbrio por desvios de premissas, enquanto a Matriz classifica a variação de CAPEX e OPEX como
    'Improvável (2)' e risco exclusivo da concessionária (EF-06, EF-07). A revisão ordinária do Contrato (17.1) não prevê esse reequilíbrio.
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Combinada com o caráter 'vinculante' atribuído aos estudos (Edital 2.11), a afirmação do P6 pode sustentar pleitos de reequilíbrio por variação de diesel e de custos; impugnar a contradição
    tende a fixar a alocação da Matriz e eliminar essa leitura.
