  categoria: omissao
  descricao_breve: Independência da ARDPV afirmada sem exame da LC 1.013/2025 (mandatos, autonomia financeira, funções de 'desenvolvimento')
  dispositivo_editalicio: P7 II.5 (PDF p. 17-18); P1 V.4 (p. 58-59)
  transcricao: 'P7: ''supre a necessidade institucional de uma instância reguladora dedicada e independente, separada do órgão gestor da política pública'''
  comentario: O P7 não transcreve nem analisa a LC 1.013/2025 quanto à natureza autárquica, mandato fixo e estabilidade dos dirigentes, autonomia orçamentária e financeira e transparência. A denominação
    'Agência Reguladora dos Serviços Públicos Delegados e de Desenvolvimento' sugere acumulação de funções de fomento com funções regulatórias, o que exige exame à luz da independência decisória.
  dispositivo_legal: art. 21 da Lei n.º 11.445/2007; NR n.º 7/2024 da ANA (Resolução ANA n.º 187/2024)
  depende_de: Texto integral da LC Municipal n.º 1.013/2025 e ato de instalação da ARDPV (diretoria, quadro, orçamento).
