  descricao_breve: Reequilíbrio por estiagem exige cota < 2 m por 45 dias + decreto; gatilhos distintos em TO-04, TO-16 e RJ-04; 'segurável' indefinido
  dispositivo_editalicio: Matriz TO-04 (p. 6), TO-16 (p. 14-15) e RJ-04 (p. 28); Contrato cl. 19.5 (PDF p. 46) e 34.4.1 (p. 72)
  transcricao: 'Matriz TO-04: ''inferior a 2,0 metros por mais de 45 dias consecutivos, acompanhada de decreto de calamidade pública''; Matriz TO-16: ''Se o evento for segurável, o risco é integralmente
    da contratada'''
  comentario: A TO-04 classifica a estiagem extrema como 'Muito provável (5)', registra cotas de 0,25 m (2024), 1,20 m (2023) e 1,88 m (2020) e afirma que a sazonalidade não é caso fortuito, mas condiciona
    o reequilíbrio, com invocação do art. 124, II, 'd', da Lei 14.133 (álea extraordinária), a cota < 2 m por mais de 45 dias cumulada com decreto de calamidade, ato discricionário do poder público. Para
    eventos que se sobrepõem, a TO-16 exige superar os 4 níveis do PCOS, decreto e ao menos 1 dia de paralisação, e a RJ-04 exige decreto e evento não segurável. O critério de 'segurável' (TO-16; Contrato
    19.5 e 34.4.1) não é definido (cobertura existente a qualquer custo ou em condições ordinárias de mercado), e a TO-16 usa 'contratada' em vez de 'concessionária'.
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 124, inciso II, alínea 'd', da Lei n.º 14.133/2021
