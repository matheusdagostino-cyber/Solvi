- id_tmp: G3-054
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E2-041
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Obrigações 'mínimas' do Caderno abertas a exigências da fiscalização × regra de investimentos fechados do Edital
  dispositivo_editalicio: Caderno item I, § 3.º (PDF p. 7), X.6.1 (p. 42) e X.6.12 (p. 50) × Edital 3.1.4 (p. 14) e Contrato cl. 4.2.1.1 (p. 13)
  transcricao: 'Caderno X.6.1: ''A ausência de detalhamento específico sobre uma situação operacional não dispensa a concessionária de adotar solução compatível com a boa técnica, com a legislação aplicável,
    com o contrato e com as determinações da fiscalização''; Edital/Contrato: ''Não é exigível da CONCESSIONÁRIA obrigação de investimento'''
  comentario: O Caderno qualifica todas as obrigações como mínimas, sujeitas a 'exigências adicionais' e 'atos da fiscalização', e trata como falha de gestão a omissão em propor revisões. O Edital (3.1.4)
    e o Contrato (4.2.1.1) dizem que investimento não previsto nos anexos não é exigível sem recomposição. As duas lógicas conflitam na alocação do risco de escopo.
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 10-A, inciso IV, da Lei n.º 11.445/2007
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Prevalecendo a regra do Edital 3.1.4, toda exigência adicional da fiscalização gera direito a reequilíbrio; impugnar a contradição pode levar à restrição dessa regra.
- id_tmp: G3-055
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E2-085
  - E6-051
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: Metas de recuperação e de triagem imputadas à concessionária, mas operação e receita são das cooperativas
  dispositivo_editalicio: Anexo III Tabela 16 (PDF p. 27); Anexo D IQ1 (p. 14 e 17), TO-10 e TO-11 (p. 9); P2 III.1 (p. 10) e V.6 (p. 40); P3 VII.1 (p. 51); P6 p. 48; Contrato cl. 10.8 e 18.5.2
  transcricao: 'P2: ''A operação da triagem e o beneficiamento de plásticos serão realizados por cooperativas de catadores credenciadas, garantindo-lhes autonomia na comercialização dos materiais e reversão
    integral da receita aos cooperados.'''
  comentario: A triagem na UVR e a venda dos recicláveis ficam com cooperativas autônomas, que retêm 100% da receita (Contrato 18.5.2), e o Anexo III aponta barreira logística de ~3.500 km até os compradores.
    O IQ1, a CS-01 e os indicadores de desvio e de paralisação da triagem recaem sobre a concessionária, que não controla a operação nem a remuneração das cooperativas. Não há modelagem do vínculo com as
    cooperativas nem do custo de apoio.
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 36, § 1.º, da Lei n.º 12.305/2010
  depende_de: Modelo de vínculo contratual com as cooperativas (contrato, metas, apoio) e capacidade operacional das cooperativas existentes.
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-056
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-070
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Três regras residuais distintas para riscos não previstos e força maior
  dispositivo_editalicio: Contrato cl. 19.1 (PDF p. 45), 19.5 (p. 46), 20.1.2, v e vii (p. 47) e 34.4.1 (p. 72)
  transcricao: 'Contrato 19.5: ''os eventos não passíveis de cobertura por seguro constituem risco do Poder Concedente''; Contrato 20.1.2, vii: ''nos demais casos não expressamente listados acima que venham
    a alterar o equilíbrio'''
  comentario: Riscos não previstos devem ser objeto de 'revisão do Contrato' para alocação (19.1); ao mesmo tempo, todo evento não segurável é do Poder Concedente (19.5, 34.4.1), e todo evento extraordinário
    não causado pela SPE gera revisão (20.1.2, vii). Para força maior, a cl. 20.1.2, v, dá revisão sem ressalva de segurabilidade, e a cl. 34.4.1 diz que os eventos não seguráveis 'poderão' gerar reequilíbrio.
    O critério de segurabilidade aparece só em linhas isoladas da Matriz.
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 10-A, inciso IV, da Lei n.º 11.445/2007
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: As regras residuais 'não segurável = PC' (19.5) e 'demais casos' (20.1.2, vii) favorecem a concessionária; impugnar a contradição tende a restringi-las.
- id_tmp: G3-057
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-071
  tipo_achado: IRREGULAR
  categoria: risco_economico
  descricao_breve: Reequilíbrio para interferências 'mesmo que previstas'
  dispositivo_editalicio: Contrato cl. 20.1.2, v (PDF p. 47)
  transcricao: 'Contrato 20.1.2, v: ''caso fortuito, força maior, fato do príncipe e interferências imprevistas - ou mesmo que previstas, não possam ser evitadas'''
  comentario: 'A inclusão de interferências ''mesmo que previstas'' estende ao Poder Concedente riscos previsíveis e precificáveis (ex.: geológicos, cheias do Rio Madeira tratadas no PCOS), além da hipótese
    legal de fatos imprevisíveis ou previsíveis de consequências incalculáveis.'
  dispositivo_legal: art. 124, inciso II, alínea 'd', da Lei n.º 14.133/2021; art. 5.º, inciso III, da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Cláusula pró-concessionária; impugná-la tende a eliminá-la.
- id_tmp: G3-058
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-037
  - E2-094
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Condicionantes ambientais supervenientes: risco da concessionária (8.1) × fato do príncipe (20.1.2, iii) × reequilíbrio ''quando cabível'''
  dispositivo_editalicio: Contrato cl. 8.1, I (PDF p. 17) × 20.1.2, iii (p. 47); Anexo III item XV (PDF p. 34); Contrato cl. 4.6 (p. 13)
  transcricao: 'Contrato 8.1, I: ''Atender às condicionantes que forem estabelecidas ao longo do processo de licenciamento ambiental''; Contrato 20.1.2, iii: ''incluindo determinações de autoridades ambientais
    que alterem os encargos da Concessão''; Anexo III XV: ''quando cabível e juridicamente demonstrado'''
  comentario: A cl. 8.1 atribui à concessionária, por sua conta, as condicionantes fixadas ao longo do licenciamento; a cl. 20.1.2, iii, qualifica como fato do príncipe as determinações de autoridades ambientais
    que alterem encargos, inclusive antecipação de metas. O Anexo III (XV) impõe a exigência mais restritiva superveniente e condiciona o reequilíbrio a juízo aberto ('quando cabível e juridicamente demonstrado').
    Não há critério para distinguir condicionante ordinária de determinação extraordinária.
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 124, inciso II, alínea 'd', da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: A leitura da cl. 20.1.2, iii, favorece a concessionária; impugnar a contradição pode levar a restringi-la.
- id_tmp: G3-059
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-021
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Risco regulatório: limiares restritivos do Contrato (''significativa'', ''impassível de amortização'') × Matriz RJ-03'
  dispositivo_editalicio: Contrato cl. 4.6 (PDF p. 13), 10.2.8.4 a 10.2.8.6 (p. 24) e 13.3 (p. 35) × Matriz RJ-03 (p. 27); Contrato 20.1.2, ii e iii (p. 46-47)
  transcricao: 'Contrato 4.6: ''que alterem de forma significativa os encargos''; Contrato 10.2.8.6: ''exigindo investimento impassível de amortização'''
  comentario: A Matriz (RJ-03) aloca ao Poder Concedente o impacto de ato normativo dos três entes. O Contrato exige alteração 'significativa' dos encargos para avaliar o pleito (4.6), só admite reequilíbrio
    por atualização tecnológica se o investimento for 'totalmente imprevisto' e 'impassível de amortização' no prazo remanescente (10.2.8.6) e dá à concessionária 10 dias úteis para cumprir novas determinações
    da ARDPV sem menção a reequilíbrio (13.3).
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 124, inciso II, alínea 'd', da Lei n.º 14.133/2021; art. 9.º, § 4.º, da Lei n.º 8.987/1995 (por analogia; não consta do rol do art.
    3.º da Lei n.º 11.079/2004)
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-060
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E4-081
  - E7-055
  tipo_achado: IRREGULAR
  categoria: risco_economico
  descricao_breve: Exclusão de reequilíbrio para exigências regulatórias ligadas a 'serviço adequado' (cl. 20.9; RJ-03), combinada com atualidade dinâmica
  dispositivo_editalicio: Contrato cl. 20.9 (PDF p. 48) e 10.2.8 (p. 24); Matriz RJ-03 (p. 27); P7 IV.4 (PDF p. 38) e II.7 (p. 19)
  transcricao: 'Contrato 20.9: ''Não enseja o reequilíbrio econômico-financeiro a exigência razoável feita pela Agência Reguladora de que a Concessionária preste serviço público adequado, nos termos do
    art. 6º, § 1o, da Lei nº 8.987/95.''; P7: ''As atualizações regulatórias destinadas exclusivamente a assegurar a prestação de serviço adequado'''
  comentario: A cl. 20.9 e a RJ-03 excluem do reequilíbrio a exigência 'razoável' da agência para manter serviço adequado, conceito aberto que abrange regularidade, continuidade, eficiência, segurança,
    atualidade e generalidade; combinada com a obrigação dinâmica de atualidade tecnológica (10.2.8), normas novas da ARDPV com custo podem ser enquadradas na exceção, o que reduz o alcance da alocação
    do fato do príncipe ao Poder Concedente. O fundamento citado (art. 6.º da Lei 8.987) não está entre os dispositivos aplicáveis à concessão administrativa pelo art. 3.º da Lei 11.079. A cl. 10.2.33.5
    também fixa a CS-01 pela ARDPV sem reequilíbrio.
  dispositivo_legal: art. 5.º, incisos III e V, e art. 3.º da Lei n.º 11.079/2004; arts. 124, inciso II, alínea 'd', e 130 da Lei n.º 14.133/2021; art. 10-A, inciso IV, da Lei n.º 11.445/2007
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-061
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-069
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Risco tributário: revisão facultativa (''poderá'') e, na reforma do consumo, condicionada a extrapolar a álea ordinária'
  dispositivo_editalicio: Contrato cl. 10.2.25.1 (PDF p. 25) × 20.1.2, ii (p. 46) e 20.10.2 (p. 49)
  transcricao: 'Contrato 10.2.25.1: ''poderá ensejar o reequilíbrio econômico-financeiro''; Contrato 20.10.2: ''o impacto extrapolar a álea ordinária contratual'''
  comentario: A cl. 20.1.2, ii, arrola a criação ou alteração de tributos após a proposta como causa de revisão, 'em conformidade com' o art. 9.º, § 3.º, da Lei 8.987, enquanto a cl. 10.2.25.1 diz que novo
    regime fiscal 'poderá' ensejar reequilíbrio. Para a reforma tributária do consumo (IBS/CBS), a cl. 20.10.2 exige, além da prova do nexo, que o impacto extrapole a álea ordinária e não esteja neutralizado
    por reajuste ou revisão. A lei prevê revisão sempre que comprovado o impacto, sem exigência de extrapolar a álea ordinária.
  dispositivo_legal: art. 134 da Lei n.º 14.133/2021 (aplicação subsidiária, art. 186); art. 9.º, § 3.º, da Lei n.º 8.987/1995 (aplicação à concessão administrativa a verificar, pois não consta do art.
    3.º da Lei n.º 11.079/2004); EC n.º 132/2023 e LC n.º 214/2025
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-062
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E4-037
  - E3-069
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Tributos sobre a renda: Matriz EF-05 inclui IRPJ/CSLL e só prevê reequilíbrio para aumento × Contrato restrito ao consumo e simétrico'
  dispositivo_editalicio: Matriz EF-05 (p. 31) × Contrato cl. 20.1.2, ii (PDF p. 46), 20.10.1 e 20.10.7 (p. 49)
  transcricao: 'Matriz EF-05: ''Eventual aumento da tributação efetiva pode ensejar REEQUILÍBRIO, para restaurar a equação econômico-financeira inicial do contrato.''; Contrato 20.10.7: ''caberá recomposição
    em favor do Poder Concedente'''
  comentario: A EF-05 lista IRPJ e CSLL entre as causas do risco tributário e prevê reequilíbrio apenas para aumento da tributação efetiva. O Contrato restringe o evento de reforma aos tributos sobre o
    consumo (20.10.1), prevê recomposição em favor do Poder Concedente quando a reforma reduzir custos (20.10.7) e, na regra geral (20.1.2, ii), remete ao art. 9.º, § 3.º, da Lei 8.987, que ressalva os
    impostos sobre a renda, sem reproduzir a ressalva. A divergência deixa aberta a tese de reequilíbrio unilateral por variação de IR/CSLL.
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 9.º, § 3.º, da Lei n.º 8.987/1995 (aplicação à concessão administrativa a verificar); art. 134 da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: A redação assimétrica da Matriz (só aumento; inclui IRPJ/CSLL) favorece a concessionária; questioná-la tende a eliminá-la.
- id_tmp: G3-063
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E7-056
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: Regime contratual da reforma tributária não confrontado com as regras de reequilíbrio da LC 214/2025
  dispositivo_editalicio: P7 II.14 (PDF p. 22-23); Contrato cl. 20.10 (PDF p. 48-49); Matriz EF-05 (p. 31)
  transcricao: 'P7: ''propõe um regime básico de transição sem antecipar cenários ainda em consolidação normativa nem criar direito a reequilíbrio automático'''
  comentario: O P7 remete os impactos do IBS/CBS à execução e ao reequilíbrio mediante prova de impacto, sem examinar se a LC 214/2025 traz regras próprias de reequilíbrio de contratos administrativos que
    se sobreponham à cl. 20.10 ou conflitem com a exigência de extrapolar a álea ordinária. Em contrato de 30 anos com transição iniciada em 2026, o ponto afeta a precificação; a EF-05 é classificada como
    risco de nível elevado. Sobre a modelagem de PIS/COFINS/ISS sem a transição, ver E4-036 (MODELAGEM_ECONOMICA).
  dispositivo_legal: EC n.º 132/2023; LC n.º 214/2025 (disposições sobre reequilíbrio de contratos administrativos — dispositivos a verificar); art. 124, inciso II, alínea 'd', da Lei n.º 14.133/2021
  depende_de: Teor da LC n.º 214/2025 sobre reequilíbrio de contratos administrativos e sua compatibilidade com a cl. 20.10 (verificar na Fase 2).
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-064
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E1-058
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Solidariedade das consorciadas limitada até a assinatura; Contrato não prevê responsabilidade dos acionistas
  dispositivo_editalicio: Edital item 8.5.2, e (PDF p. 20); Contrato (sem cláusula de solidariedade dos acionistas)
  transcricao: 'Edital 8.5.2, e: ''pelos atos praticados pelo CONSÓRCIO em virtude da LICITAÇÃO, até a assinatura do CONTRATO'''
  comentario: A Lei 14.133 prevê a responsabilidade solidária dos consorciados tanto na licitação quanto na execução do contrato. O Edital encerra a solidariedade na assinatura, e o Contrato não traz responsabilidade
    ou garantia dos acionistas da SPE. A Administração pode sustentar que, na PPP, quem executa é a SPE, pessoa jurídica distinta, e que a solidariedade pós-assinatura não se aplica.
  dispositivo_legal: art. 15, inciso V, e art. 186 da Lei n.º 14.133/2021; art. 9.º da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: A cláusula limita a exposição dos acionistas da futura concessionária; impugná-la pode estender a solidariedade à execução.
- id_tmp: G3-065
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-091
  tipo_achado: IRREGULAR
  categoria: erro_material
  descricao_breve: Contrato de concessão comina nulidade a contratos privados com fornecedores
  dispositivo_editalicio: Contrato cl. 12.4 (PDF p. 34)
  transcricao: 'Contrato 12.4: ''deverão conter, obrigatoriamente, sob pena de nulidade, cláusula de sub-rogação de direitos e obrigações em favor do Poder Concedente'''
  comentario: A consequência de nulidade de negócio entre a SPE e fornecedores, terceiros ao contrato de concessão, não pode ser instituída por este; o efeito útil (continuidade dos serviços na extinção
    antecipada) dependeria de obrigação da concessionária com sanção própria.
  dispositivo_legal: não localizei fundamento normativo específico
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-066
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E1-093
  - E3-094
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Base e reajuste da garantia de execução indefinidos ('valor anual do contrato'; 'Contraprestação Anual Máxima')
  dispositivo_editalicio: Edital item 20.1.4 (PDF p. 49) e 12.2.3 (p. 31); Contrato cl. 9.5, 9.6 (PDF p. 21), 22.1 e 22.1.1 (p. 51)
  transcricao: 'Contrato 22.1: ''correspondente a 10% (dez por cento) do valor anual do contrato''; Contrato 22.1.1: ''na mesma data dos reajustes da Contraprestação Anual Máxima'''
  comentario: 'O Edital só remete ao Contrato. O Contrato fixa 10% do ''valor anual do contrato'' sem defini-lo: com ramp-up, o valor anual varia nos Anos 1 a 3, e não se sabe se a base é a CMM × 12 da
    proposta (~R$ 7,81 mi de garantia no regime pleno), a média (Valor do Contrato/30) ou a CME. O reajuste remete à ''Contraprestação Anual Máxima'', termo não definido (22.1.1), enquanto a cl. 9.6 menciona
    a ''Contraprestação Mensal Efetiva''.'
  dispositivo_legal: art. 96, caput, art. 98, parágrafo único, e art. 92, inciso XII, da Lei n.º 14.133/2021; art. 5.º, inciso VIII, da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-067
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-095
  - E1-093
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Modalidades da garantia de execução divergentes: quatro (cl. 9.5, com título de capitalização) × três (cl. 22.2)'
  dispositivo_editalicio: Contrato cl. 9.5, a a d (PDF p. 21) × 22.2, i a iii (p. 51); P7 V.7 (PDF p. 42)
  transcricao: 'Contrato 9.5, d: ''título de capitalização custeado por pagamento único''; Contrato 22.2: ''nas seguintes modalidades: i. Caução, em dinheiro ou títulos da dívida pública federal; ii. Fiança
    bancária; ou iii. Seguro-garantia'''
  comentario: A cl. 9.5 admite as quatro modalidades do art. 96, § 1.º, da Lei 14.133, inclusive título de capitalização; a cl. 22.2 e o P7 admitem apenas três. A cl. 9.5 também restringe o seguro-garantia
    a seguradora com 'grau de investimento', requisito ausente da cl. 22.2. A escolha da modalidade cabe ao contratado.
  dispositivo_legal: art. 96, § 1.º, incisos I a IV, da Lei n.º 14.133/2021
