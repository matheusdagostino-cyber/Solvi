- id_tmp: G3-116
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-093
  - E7-028
  - E4-090
  - E3-114
  - E3-118
  tipo_achado: CONFORME
  categoria: omissao
  descricao_breve: 'Garantias: 10% de garantia de execução, Conta Garantia de 2 contraprestações, mora do PC e direitos emergentes'
  dispositivo_editalicio: Contrato cl. 9.3 e 9.5 (PDF p. 21), 15.8 a 15.8.4 (p. 39-40) e 22.1 (p. 51); Edital 6.3, iii (p. 16); P6 VI.10 (p. 60); P7 V.1 e V.7 (PDF p. 39 e 42)
  transcricao: 'Contrato 22.1: ''correspondente a 10% (dez por cento) do valor anual do contrato'''
  comentario: O percentual de 10% está no limite legal admitido mediante justificativa de complexidade e risco, apresentada no P7 (base indefinida tratada em G3-066). A Conta Garantia de 2 contraprestações
    (2 × R$ 6.505.697,97 = R$ 13.011.395,94) é dimensionada de forma coerente entre P6, Edital e Anexo VI (base e fonte tratadas em G3-007, G3-004 e G3-001). O regime de mora do Poder Concedente prevê atualização,
    juros e multa, e a garantia dos direitos emergentes aos financiadores depende de autorização do Poder Concedente.
