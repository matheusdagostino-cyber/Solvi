  descricao_breve: Alternativas de garantia (fundo garantidor, seguro, taxa de RSU) não avaliadas; garantia sem fonte setorial
  dispositivo_editalicio: P7 V.1 a V.4 (PDF p. 39-41); P0 Caderno 6, Etapa 4.2 (PDF p. 16) e Data Request jurídico (p. 25); Contrato cl. 23.1 a 23.5 (PDF p. 52-54); Edital 5.3 (p. 15)
  transcricao: 'P0: ''Garantias Públicas: avaliação e definição da estrutura de garantias a serem oferecidas pelo Município para o projeto (p.ex., Fundo Garantidor de PPPs - FGP, contragarantias, vinculação
    de receitas, etc.)'''
  comentario: O P0 previa avaliar fundo garantidor, contragarantias e vinculação de receitas e pediu os atos de criação de fundos de PPP ou de saneamento. O P7 não informa se existe fundo garantidor municipal
    (ou previsto na LC 592/2015), por que foi preterido em favor do FPM, nem analisa seguro-garantia ou garantia bancária. Também não examina a taxa de RSU (LC 878/2021, citada no P7) como fonte vinculável,
    alternativa sem a restrição do art. 167, IV, da CF (sobre a sustentabilidade por cobrança, ver E5-017 e E7-024, grupo MODELAGEM/REMUNERACAO).
