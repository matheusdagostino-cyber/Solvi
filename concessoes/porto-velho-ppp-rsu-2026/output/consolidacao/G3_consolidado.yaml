- id_tmp: G3-107
  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E3-148
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Concessionária qualificada só como operadora de dados, embora decida finalidades e meios em vários tratamentos
  dispositivo_editalicio: Anexo IV cl. 2.1, 3.6 e 10.1 (PDF p. 4-5 e 8); Contrato cl. 10.2.36 e 14.1.5
  transcricao: 'Anexo IV 2.1: ''figurando a CONCESSIONÁRIA como parte OPERADORA'''
  comentario: A concessionária decide sobre dados de empregados, cooperados, SAC, telemetria, câmeras e MTR em sua operação própria, atuando como controladora nesses tratamentos; o acordo a qualifica só
    como operadora e lhe veda atender titulares (10.1). A cl. 3.6 a torna 'única responsável' por dados anonimizados, que não são dados pessoais.
  dispositivo_legal: art. 5.º, incisos VI, VII e IX, art. 12, art. 18 e art. 39 da Lei n.º 13.709/2018
  flag_tecnico: false
  flag_reserva: false
