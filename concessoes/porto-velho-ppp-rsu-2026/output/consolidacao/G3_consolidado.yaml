- id_tmp: G3-070
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-117
  - E7-029
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Step-in dos financiadores por simples comunicação, sem autorização do PC nem regime de administração temporária
  dispositivo_editalicio: Contrato cl. 25.1 a 25.7 (PDF p. 54-55); P7 V.6 (PDF p. 41-42) e IX.4 (p. 63)
  transcricao: 'Contrato 25.3: ''os financiadores poderão assumir a Concessão, comunicando formalmente sua decisão ao Poder Concedente com antecedência prévia de 15 (quinze) dias'''
  comentario: A lei prevê que o Poder Concedente autorizará a assunção do controle ou a administração temporária pelos financiadores, nas condições do contrato. A cl. 25.3 substitui autorização por comunicação
    com 15 dias de antecedência, fala em 'assumir a Concessão' (e não o controle da SPE), exige apenas regularidade jurídica e fiscal e não regula a administração temporária, o empenho em nome dos financiadores
    nem sua legitimidade para receber indenizações. O P7 (V.6) descreve uma etapa de análise pelo Poder Concedente que não consta do Contrato.
  dispositivo_legal: art. 27-A da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004; art. 5.º, § 2.º, incisos I a III, e art. 5.º-A da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Cláusula favorável à bancabilidade e aos financiadores da concessionária; a impugnação poderia eliminá-la.
- id_tmp: G3-071
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E7-031
  - E3-116
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Transferência de controle intragrupo pré-autorizada, sem verificação de requisitos; só controle direto
  dispositivo_editalicio: Contrato cl. 24.1.1 e 24.2 (PDF p. 54) e 1.3.22 (definição de Controle); P7 IX.3 (PDF p. 63) e XI.3.6 (p. 69)
  transcricao: 'Contrato 24.2: ''Considera-se previamente autorizada pelo Poder Concedente a eventual transferência de controle da Concessionária para terceira sociedade que integre o grupo econômico de
    sócia original da SPE'''
  comentario: A transferência do controle da SPE depende de autorização expressa da Administração, com verificação de capacidade técnica, idoneidade financeira e regularidade jurídica e fiscal do pretendente.
    A pré-autorização contratual genérica dispensa essa verificação caso a caso, e a cl. 24.1.1 alcança apenas o controle direto, deixando sem controle as mudanças de controle indireto. O P7 qualifica a
    regra como 'exceção relevante' sem examinar sua compatibilidade legal.
  dispositivo_legal: art. 9.º, § 1.º, da Lei n.º 11.079/2004; art. 27, caput e § 1.º, incisos I e II, da Lei n.º 8.987/1995
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Flexibilidade societária que favorece grupos econômicos com várias sociedades; a impugnação poderia eliminá-la.
- id_tmp: G3-072
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-074
  - E7-030
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Ausência da cláusula obrigatória de compartilhamento dos ganhos da redução do risco de crédito (refinanciamento)
  dispositivo_editalicio: Contrato cl. 19.6 (PDF p. 46) e 18.5 (p. 43); P7 V.6 (PDF p. 41)
  transcricao: 'Contrato 19.6: ''A redução de custos da Concessionária decorrentes de incentivos oferecidos pelo Poder Concedente'' ... ''linhas de crédito especiais''; P7: ''A previsão observa o art. 5º,
    inciso IX, da Lei Federal nº 11.079/2004'''
  comentario: 'A cl. 19.6 cobre apenas incentivos oferecidos pelo Poder Concedente (inclusive linhas de crédito especiais), e a cl. 18.5 trata do compartilhamento de receitas acessórias. Não há cláusula
    de compartilhamento dos ganhos econômicos efetivos decorrentes da redução do risco de crédito dos financiamentos (ex.: refinanciamento após a fase de obras), exigida em todo contrato de PPP. O P7 cita
    o art. 5.º, IX, como fundamento dos step-in rights.'
  dispositivo_legal: art. 5.º, inciso IX, da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: A omissão permite à concessionária reter integralmente os ganhos de refinanciamento; a impugnação tende a introduzir a cláusula de compartilhamento.
- id_tmp: G3-073
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-121
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Indenização por força maior e por anulação sobre 'todos os investimentos realizados', sem dedução da amortização
  dispositivo_editalicio: Contrato cl. 34.7 (PDF p. 72) e 33.3, i (p. 71) × 28.7 e 28.7.13 (p. 64-65)
  transcricao: 'Contrato 34.7: ''será indenizada pelo que houver executado e por todos os investimentos realizados até a data em que este Contrato for extinto, sem exclusão de outros prejuízos regularmente
    comprovados'''
  comentario: 'A regra geral (28.7) indeniza a parcela não amortizada dos investimentos em bens reversíveis. A cl. 34.7 manda indenizar, na extinção por força maior, ''todos os investimentos realizados''
    e ''outros prejuízos'', e a anulação não imputável à concessionária remete a essa regra (33.3, i). Há risco de dupla remuneração: investimento já amortizado pela Parcela A e indenizado novamente.'
  dispositivo_legal: art. 36 da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004; art. 149 da Lei n.º 14.133/2021 (anulação)
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Regime indenizatório favorável à concessionária; a impugnação tende a reduzi-lo à parcela não amortizada.
- id_tmp: G3-074
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-122
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Encampação com lucros cessantes, em contradição com a regra geral de quitação
  dispositivo_editalicio: Contrato cl. 30.2, ii a iv, e 30.2.1 (PDF p. 66-67) × 28.7.14 (p. 65) e 32.11 (p. 70)
  transcricao: 'Contrato 30.2, ii: ''lucros cessantes, considerado percentual do montante relativo ao custo de oportunidade'''
  comentario: Pela lei, a encampação indeniza os investimentos não amortizados. O Contrato acrescenta lucros cessantes por fluxo de caixa descontado sem taxa definida, quitação de financiamentos e custos
    de rescisão com terceiros, enquanto a cl. 28.7.14 exclui lucros cessantes 'a qualquer título'. A rescisão por culpa do Poder Concedente (32.11) importa as mesmas condições.
  dispositivo_legal: arts. 36 e 37 da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Regime indenizatório ampliado favorece a concessionária; a impugnação tende a eliminá-lo.
- id_tmp: G3-075
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-124
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Rol de caducidade restrito a três hipóteses, omitindo as causas legais
  dispositivo_editalicio: Contrato cl. 31.1 e 31.2 (PDF p. 67) × 26.14 (p. 59), 22.7 (p. 52) e 35.3
  transcricao: 'Contrato 31.1: ''O Poder Concedente poderá declarar a caducidade da Concessão na ocorrência de qualquer dos seguintes eventos'''
  comentario: O rol limita-se a falência ou condenação por sonegação ou corrupção, falta de reposição da garantia de execução em 90 dias e falta de seguros. Omite serviço inadequado, descumprimento de cláusulas,
    paralisação, perda de condições técnicas ou econômicas e desatendimento de intimações; trata a falência, causa autônoma de extinção, como caducidade; e conflita com a cl. 26.14 (reincidência leva a
    caducidade). O prazo de 90 dias para repor a garantia difere dos 30 dias da cl. 22.7.
  dispositivo_legal: art. 38, § 1.º, e art. 35, inciso VI, da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: O rol restrito protege a concessionária; a impugnação tende a ampliá-lo às hipóteses legais.
- id_tmp: G3-076
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-126
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: Metodologia de indenização exclui juros de construção, margem e despesas pré-SPE
  dispositivo_editalicio: Contrato cl. 28.7.1 a 28.7.6 (PDF p. 64); P6 p. 47 (ativo financeiro, ICPC 01)
  transcricao: 'Contrato 28.7: ''Não serão considerados eventuais valores contabilizados a título de juros e outras despesas financeiras durante o período de construção'''
  comentario: A base de indenização exclui juros capitalizados, margem de construção, ágios e despesas anteriores à SPE e adota amortização linear pelo menor prazo entre o termo e a vida útil. Isso pode
    reduzir a indenização abaixo do saldo contábil do ativo financeiro (ICPC 01) que o P6 projeta, com efeito sobre a bancabilidade.
  dispositivo_legal: art. 36 da Lei n.º 8.987/1995; art. 10-A, inciso III, da Lei n.º 11.445/2007
  depende_de: Comparação entre a indenização calculada pela metodologia da cl. 28.7 e o saldo do ativo financeiro projetado no P6.
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-077
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-029
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Vedação de indenização de investimentos não amortizados no advento do termo, inclusive investimentos tardios exigidos
  dispositivo_editalicio: Contrato cl. 5.3 (PDF p. 15), 10.13.4 (p. 32) e 29.6 (p. 66); Caderno XI (reposição no Ano 25); Contrato 10.13.5.3
  transcricao: 'Contrato 5.3: ''a Concessionária deverá realizar sua amortização até o término da Concessão, não sendo devida qualquer indenização adicional'''
  comentario: A lei assegura, na reversão ao fim do prazo, indenização das parcelas não amortizadas de investimentos realizados para garantir a continuidade e a atualidade do serviço. O Contrato exige investimentos
    tardios (reposição no Ano 25 do Caderno XI; ampliação do aterro para manter 30 anos de vida útil remanescente, cl. 10.13.5.3) e veda a indenização, ressalvado o reequilíbrio (5.4).
  dispositivo_legal: art. 36 da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004; art. 10-A, inciso III, da Lei n.º 11.445/2007
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-078
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-128
  - E7-034
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Hipóteses amplas de interrupção dos serviços pela concessionária ('frustração de receita') antes de decisão final
  dispositivo_editalicio: Contrato cl. 15.8.8 (PDF p. 40), 32.10.2 (p. 70) e 32.12 (p. 70); P7 III.6.3 (PDF p. 33), V.5 (p. 41) e XI.3.4 (p. 69)
  transcricao: 'Contrato 32.12: ''Ressalvadas as hipóteses expressas neste Contrato permissivas da interrupção dos Serviços relativas às hipóteses de inadimplência pública ou qualquer outro evento que resulte
    em restrição de caixa ou frustração de receita à Concessionária'''
  comentario: A lei veda interromper ou paralisar os serviços até decisão judicial transitada em julgado na rescisão por iniciativa da concessionária. A cl. 15.8.8 admite pleito cautelar de suspensão integral
    dos serviços após 180 dias de inadimplência com a Conta Garantia abaixo de uma parcela, e a cl. 32.12 ressalva a interrupção diante de 'qualquer evento que resulte em restrição de caixa ou frustração
    de receita', o que alcança coleta de RSS e de RSU em áreas sem alternativa. O P7 (III.6.3) descreve a suspensão integral como faculdade direta da concessionária após 180 dias com a Conta Garantia abaixo
    de 2 CME, em desacordo com a própria cl. 15.8.8 e com o P7 V.5. As cl. 15.8.8 e 32.12 remetem a 'juízo arbitral', embora a arbitragem seja facultativa (ver G3-111).
  dispositivo_legal: art. 39, parágrafo único, da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004; art. 6.º, §§ 1.º e 3.º, da Lei n.º 8.987/1995 (por analogia; não consta do rol do art. 3.º da Lei
    n.º 11.079/2004)
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Proteção pró-concessionária contra inadimplência pública; a impugnação tende a eliminá-la.
- id_tmp: G3-079
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-129
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Silêncio de 180 dias do PC na rescisão amigável exonera a concessionária das obrigações
  dispositivo_editalicio: Contrato cl. 32.6 (PDF p. 69) e 32.3 a 32.5
  transcricao: 'Contrato 32.6: ''sob pena da Concessionária eximir-se das obrigações contratuais decorrentes'''
  comentario: A rescisão amigável pressupõe acordo. Atribuir ao silêncio do Poder Concedente por 180 dias o efeito de liberar a concessionária equivale a rescisão unilateral tácita de serviço essencial,
    sem decisão arbitral ou judicial e sem regra de transição.
  dispositivo_legal: art. 39, parágrafo único, da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004; art. 138, inciso II, da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Cláusula pró-concessionária; impugná-la tende a eliminá-la.
- id_tmp: G3-080
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E2-007
  - E2-008
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Relação de bens reversíveis e de bens municipais a ceder inexistente (remetida a termo de entrega futuro)
  dispositivo_editalicio: Caderno itens XI.1 e XI.2 (PDF p. 60-61) e XI.4 (p. 61-62); Contrato cl. 5.1.1 e 5.1.1.1 (PDF p. 14); Anexo III Tabela 3 (p. 9-10)
  transcricao: 'Caderno XI.1: ''A relação de bens reversíveis compreenderá, no mínimo, as estruturas operacionais, a frota, os equipamentos de apoio, os sistemas de controle e monitoramento'''
  comentario: Apesar do título, a seção 'Relação de Bens Reversíveis' traz só categorias genéricas, sem bens, quantidades, valores nem estado dos ativos existentes. Salvo o incinerador e a área do transbordo
    do Baixo Madeira, os bens municipais cedidos dependem de termo de entrega a ser lavrado depois (XI.4), e o Contrato (5.1.1) só obriga o Poder Concedente quanto aos bens 'expressamente relacionados nos
    Anexos', relação que não existe. Faltam inventário e estado de ecopontos, Centro de Triagem, ETR informal de São Carlos e contêineres.
  dispositivo_legal: art. 18, incisos X e XI, e art. 23, inciso X, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 5.º, inciso X, da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: O Caderno exonera a concessionária dos passivos e defeitos 'formalmente registrados no termo de entrega', lavrado após a assinatura, o que favorece quem registrar de forma ampla na vistoria;
    impugnar a omissão pode antecipar o inventário ao Edital.
- id_tmp: G3-081
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-028
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Definição de bens reversíveis inconsistente (todos os necessários × só os inventariados × 'reversão facultativa')
  dispositivo_editalicio: Contrato cl. 1.3.5 (PDF p. 7), 5.1.3, 5.1.5 e 5.1.8 (p. 14-15) e 28.3 a 28.4 (p. 63)
  transcricao: 'Contrato 28.3: ''(de reversão obrigatória e facultativa)'''
  comentario: 'A definição ampla (1.3.5: ativos necessários à continuidade operacional) convive com regra que condiciona a reversibilidade dos bens incorporados à prévia inclusão no Inventário (5.1.5) e
    com categoria de ''reversão facultativa'' não definida (28.3-28.4). A cl. 5.1.8 admite bens de terceiros, mas a cl. 5.1.3 exige que estejam livres para transferência, o que não ocorre com bens locados.
    Resulta risco de não reversão de ativos essenciais.'
  dispositivo_legal: art. 18, inciso X, e art. 23, inciso X, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 10-A, inciso III, da Lei n.º 11.445/2007
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-082
  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E2-090
  - E3-019
  - E7-035
  - E7-038
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Funções regulatórias exercidas pelo próprio Poder Concedente (CGP/PVH ou SEINFRA) enquanto a ARDPV não se instala, sem prazo final
  dispositivo_editalicio: Contrato cl. 4.7 a 4.7.3 (PDF p. 13-14); Anexo III Tabela 18 (PDF p. 28), Tabela 20 (p. 31-32) e item XIII (p. 31); P7 Sumário (PDF p. 9), II.1 (p. 14) e II.5 (p. 17-18)
  transcricao: 'Contrato 4.7.1: ''Enquanto não instalada a ARDPV, ou enquanto esta não dispuser de estrutura técnica para o exercício de determinada competência, esta será exercida pelo Conselho Gestor
    do Programa de Parcerias Público-Privadas de Porto Velho (CGP/PVH) ou pela SEINFRA''; P7 II.1: ''sob fiscalização e regulação do Poder Concedente'''
  comentario: As competências da Entidade Reguladora serão exercidas pela ARDPV 'a partir de sua efetiva instalação e operação' (4.7); até lá, e sem prazo final, cabem ao CGP/PVH ou à SEINFRA, órgãos do
    Poder Concedente sem independência decisória (4.7.1). O Anexo III já atribui ao CGP/PVH a aprovação de relatórios, do POF e do rito GAC. O P7 reconhece que a ARDPV, criada pela LC 1.013/2025, pode não
    estar instalada, e no capítulo II.1 atribui a regulação ao próprio Poder Concedente. O CGP/PVH também aprovou o procedimento de manifestação de interesse e os estudos, acumulando funções. A designação
    de entidade reguladora autárquica com independência decisória é condição de validade dos contratos de saneamento; o estágio de instalação da ARDPV não consta dos documentos.
  dispositivo_legal: art. 8.º, § 5.º, art. 11, inciso III, art. 21 e art. 23 da Lei n.º 11.445/2007; arts. 71, 76, 80 e 88 da NR n.º 7/2024 da ANA (Resolução ANA n.º 187/2024) — conferir
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-083
  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E2-043
  - E5-091
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Autoridade aprovadora indefinida entre documentos: ARDPV, CGP/PVH, SEINFRA, ''fiscalização'', VI e SEMA'
  dispositivo_editalicio: Anexo III itens X.1 (PDF p. 26), XIV.2 (p. 33) e Tabela 11, PA-10 (p. 20); Caderno X.6.1 (PDF p. 42); Contrato cl. 8.10 (p. 20) e 10.2.33.4 (p. 27); P4 V.3 (p. 23), Tab. 9 (p.
    26-27), Tab. 10 (p. 28), VII.2 (p. 31) e Tab. 13 (p. 33-34)
  transcricao: 'Anexo III XIV.2: ''POF aprovado pelo CGP/PVH antes do início da operação fluvial'''
  comentario: O Plano Operacional Fluvial é apresentado à ARDPV (Anexo III X.1), mas aprovado pelo CGP/PVH (XIV.2 e PA-10); os relatórios ambientais vão ao 'CGP/PVH e SEMA' (PA-02). O Caderno exige aprovação
    prévia da 'fiscalização' para soluções alternativas (X.6.1), enquanto o Contrato (8.10) exige autorização da Entidade Reguladora após parecer do VI. O P4 confere ao CGP/PVH a aprovação do POF/PCOS,
    o recebimento de relatórios e a vistoria da CS-03, prevê assento das cooperativas no CGP/PVH e não menciona a ARDPV, enquanto o Contrato atribui à Entidade Reguladora, por exemplo, a calibração da CS-01.
  dispositivo_legal: arts. 21, 22 e 23 da Lei n.º 11.445/2007; arts. 71, 76, 80 e 88 da NR n.º 7/2024 da ANA (Resolução ANA n.º 187/2024) — conferir; art. 5.º da Lei n.º 14.133/2021
