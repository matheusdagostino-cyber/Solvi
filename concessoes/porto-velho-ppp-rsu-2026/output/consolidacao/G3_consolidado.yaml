  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E3-151
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Vedação de compartilhamento de dados sem ressalva para VI, ARDPV, agente de pagamento e financiadores
  dispositivo_editalicio: Anexo IV cl. 5.1 e 6.1 (PDF p. 5-6) × Contrato cl. 41.8, iii, 41.16 e 23.4.1
