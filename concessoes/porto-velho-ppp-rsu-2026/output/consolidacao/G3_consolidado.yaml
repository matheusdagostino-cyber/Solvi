  descricao_breve: Adesão facultativa às normas de referência da ANA; normas de regulação locais para RSU não identificadas
  dispositivo_editalicio: Contrato cl. 4.5 e 4.6 (PDF p. 13); P7 II.5 (PDF p. 18), III.1.4 (p. 26) e V.6 (p. 41)
  transcricao: 'Contrato 4.5: ''poderá se valer, preferencialmente, das normas de referência editadas pela Agência Nacional de Águas e Saneamento Básico'''
  comentario: A redação facultativa não assegura aderência às normas de referência da ANA (inclusive a NR 7/2024 para RSU), cuja observância condiciona o acesso a recursos federais e a financiamentos com
    recursos da União; o P7 aponta BNDES e Caixa como financiadores. O P7 não identifica normas de regulação editadas pela ARDPV para RSU nem confronta Edital e Contrato com as normas de referência. A existência
    de normas de regulação é condição de validade do contrato.
  dispositivo_legal: art. 11, inciso III e § 2.º, art. 23 e art. 50 da Lei n.º 11.445/2007; art. 4.º-A da Lei n.º 9.984/2000
  depende_de: Adesão formal da ARDPV às normas de referência da ANA e existência de normas de regulação municipais para RSU.
