  transcricao: 'P4: ''RSS destinado a operador particular — custo elevado e sem controle municipal. Risco sanitário caso o contrato particular seja descontinuado.'''
  comentario: Até a unidade de tratamento de RSS entrar em operação, a concessionária deve assegurar a destinação por terceiros (10.3.10.1), mas os estudos não identificam as unidades licenciadas disponíveis
    na região, sua capacidade ou preço. A LAI do Ecoparque inclui autoclave, o que indica dependência do operador incumbente.
