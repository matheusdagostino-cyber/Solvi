  comentario: 'As cl. 19.2 a 19.4 não alocam riscos específicos e remetem à Matriz. No texto da Matriz não há ocorrência de ''câmbio'', ''juros'', ''inflação'', ''financiamento'', ''CDR'', ''carbono'',
