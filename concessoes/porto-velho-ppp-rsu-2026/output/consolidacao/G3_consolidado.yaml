  transcricao: 'Matriz TO-14 (leitura da tabela renderizada): ''obrigação da Concessionária de assegurar solução alternativa licenciada para tratamento e destinação dos RSS, às suas expensas, sem direito
    a reequilíbrio'''
  comentario: A TO-14 atribui à concessionária, sem reequilíbrio, o risco de inoperância do incinerador municipal, inoperante desde a anulação do contrato anterior e sem laudo de condição nos documentos,
    com CAPEX de R$ 1,8 mi no P6. O Caderno (XI.4) afasta a responsabilidade da concessionária por 'defeitos ocultos ou inadequações preexistentes' registrados no termo de entrega. O objeto também prevê
    autoclave na CTR (rota de RSS tratada em E4-020/E5-066, OBJETO_ESCOPO).
