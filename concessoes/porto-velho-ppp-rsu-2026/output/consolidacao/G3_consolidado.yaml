- id_tmp: G3-113
  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E3-136
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Dispute board definido como comitê permanente, regulado como Mesa ad hoc, sem previsão de custeio público
  dispositivo_editalicio: Contrato cl. 1.3.23 (PDF p. 8) × 39.1, 39.5 e 39.7 (p. 75-76)
  transcricao: 'Contrato 39.5: ''com o dever de arcar com todos os seus custos'''
  comentario: A definição (1.3.23) descreve comitê técnico independente e permanente, que acompanha a execução; a Cláusula 39 cria uma 'Mesa' constituída para cada controvérsia. Os custos são adiantados
    por quem instaura e pagos pelo vencido, sem previsão orçamentária para o Município.
  dispositivo_legal: arts. 151 e 154 da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
