- id_tmp: G3-114
  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E3-137
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Comitê de Interface (CIC) consultivo emite 'ata decisória'; 'Perícia Conjunta' citada e não regulada
  dispositivo_editalicio: Contrato cl. 36.4 a 36.4.5 (PDF p. 73), 37.3 e 37.4 (p. 74), 39.8 e 39.10
  transcricao: 'Contrato 36.4.2: ''O CIC tem caráter estritamente informativo e consultivo''; Contrato 37.3: ''para tentativa de composição e emissão de ata decisória de controvérsia'''
  comentario: O Comitê de Interface do Contrato é definido como estritamente informativo e consultivo, sem competência deliberativa (36.4.2), mas a cl. 37.3 lhe atribui a emissão de 'ata decisória de controvérsia'.
    A 'Perícia Conjunta' aparece em três cláusulas como mecanismo autônomo, sem rito, nomeação ou custeio.
  dispositivo_legal: art. 151 da Lei n.º 14.133/2021; art. 23, inciso XV, da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004 — conferir
