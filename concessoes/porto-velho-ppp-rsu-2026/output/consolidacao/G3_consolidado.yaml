  descricao_breve: Passivos preexistentes ao PC com regresso; teto da intervenção com excedente ao PC; escopo de investimentos fechado; sobreposição na transição
  dispositivo_editalicio: Contrato cl. 8.6.1 a 8.6.5 (PDF p. 18-19), 4.2.1.1 (p. 13) e 7.4 (p. 17); Edital 3.1 e 3.1.4 (PDF p. 13-14)
  transcricao: 'Contrato 8.6.1.2.2: ''constitui risco do Poder Concedente e enseja recomposição do equilíbrio econômico-financeiro''; Edital 3.1.4: ''Não é exigível da CONCESSIONÁRIA obrigação de investimento'''
  comentario: O Contrato atribui ao Poder Concedente os passivos com fato gerador anterior à Ordem de Início, com direito de regresso (8.6.4), e limita o encargo de intervenção na Vila Princesa ao valor
    modelado, alocando o excedente ao Poder Concedente. O Edital limita as obrigações de investimento às listadas nos anexos e assegura recomposição para exigências adicionais. A sobreposição operacional
    de 30 dias com o operador cessante foi incorporada (7.4). As ressalvas sobre teto (G3-026, G3-027), linha de corte (G3-030), execução do excedente (G3-029) e vigência do contrato do operador cessante
    (G3-025) estão nos pontos próprios.
