  categoria: risco_economico
  descricao_breve: Revisão ordinária autorizada a alterar a alocação de riscos, sem critérios
  dispositivo_editalicio: Contrato cl. 20.7 (PDF p. 48) × 17.1 e 17.2 (p. 41) e 19.1 (p. 45)
  transcricao: 'Contrato 20.7: ''não poderão alterar a alocação de riscos originalmente prevista neste Contrato, ressalvada a possibilidade de revisão ordinária após decorridos 5 (cinco) anos'''
  comentario: A ressalva permite reabrir a alocação de riscos na revisão ordinária quinquenal, sem critérios, limites ou procedimento. A cl. 17.1 descreve a revisão ordinária como avaliação de desempenho,
    metas e tecnologia, e a cl. 17.2 limita alterações da CMM ao reequilíbrio; a relação entre as três cláusulas não é definida.
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 124, inciso II, alínea 'd', da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
