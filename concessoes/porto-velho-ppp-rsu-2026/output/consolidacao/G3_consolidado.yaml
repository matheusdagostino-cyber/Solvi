  comentario: 'O escopo do tratamento é genérico: não há inventário de categorias de dados (inclusive sensíveis, como saúde em RSS e dados socioeconômicos de catadores), titulares, finalidades, hipóteses
    legais do tratamento pelo poder público nem prazos de retenção. Faltam as instruções que delimitam a atuação do operador.'
