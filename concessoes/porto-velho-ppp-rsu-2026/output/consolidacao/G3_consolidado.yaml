  tipo_achado: IRREGULAR
  categoria: risco_economico
  descricao_breve: Suspensão imediata de investimentos por redução do fluxo da garantia, sem atraso de pagamento
  dispositivo_editalicio: Contrato cl. 15.8.6, 15.8.7 (PDF p. 40) e 32.5.1 (p. 69)
  transcricao: 'Contrato 15.8.7: ''interrompido ou reduzido para volume insuficiente à quitação de uma Contraprestação Mensal Efetiva'' ... ''poderá suspender imediatamente os investimentos em curso'''
  comentario: A cl. 15.8.6 confere a faculdade de suspender investimentos e atividades não essenciais após atraso superior a 90 dias. A cl. 15.8.7 permite a suspensão imediata quando o fluxo de receitas
    da garantia for interrompido ou reduzido a volume inferior a uma CME, ainda que não haja atraso no pagamento, e a cl. 32.5.1 permite suspender investimentos 60 dias após notificação de descumprimento
    do Poder Concedente; nas hipóteses de suspensão ficam afastados os descontos de IQD. A regra legal de suspensão pelo contratado pressupõe atraso de pagamento superior a dois meses.
  dispositivo_legal: art. 137, § 2.º, inciso IV, e § 3.º, da Lei n.º 14.133/2021 (aplicação subsidiária, art. 186); art. 5.º, inciso VI, da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: 'Cláusula pró-concessionária: autoriza suspender investimentos sem inadimplemento efetivo e afasta descontos de desempenho. Impugná-la tende a eliminá-la.'
- id_tmp: G3-018
  tema: RISCOS_GARANTIAS
  ids_origem:
