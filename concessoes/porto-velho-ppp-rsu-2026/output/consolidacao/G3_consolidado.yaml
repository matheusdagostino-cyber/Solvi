- id_tmp: G3-115
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E4-087
  - E4-088
  tipo_achado: CONFORME
  categoria: omissao
  descricao_breve: Matriz de Riscos preenchida e coerente na pontuação; inadimplência, fato do príncipe (regra geral) e consulta prévia alocados ao PC
  dispositivo_editalicio: Matriz de Riscos (estrutura geral), EF-02 (p. 29-30), SA-06/SA-07 (p. 21-22), SA-10 (p. 24) e RJ-03 (p. 27)
  transcricao: 'Matriz: colunas ''Probabilidade'', ''Impacto'', ''Score (P×I)'', ''Alocação'', ''Justificativa'', ''Mitigação'', ''Indicadores'' e ''Consequências'' (cabeçalho da tabela)'
  comentario: 'A Matriz traz 45 riscos com causa, efeito, P×I, alocação, justificativa, mitigação, indicadores e consequência, com score aritmeticamente coerente (ex.: TO-04 = 5×4 = 20). Aloca ao Poder
    Concedente a inadimplência da contraprestação, o fato do príncipe normativo dos três entes (com a ressalva de G3-060) e embargos por falha de consulta prévia ou passivo preexistente, com gatilhos objetivos.'
  dispositivo_legal: art. 5.º, incisos III e VI, da Lei n.º 11.079/2004
