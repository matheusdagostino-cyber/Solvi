- id_tmp: G3-105
  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E3-101
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: Teto anual de multas de 50% da receita anual, cumulável com desconto de IQD e multas fora do teto
  dispositivo_editalicio: Contrato cl. 26.4 (PDF p. 57) e 15.5; P6 p. 6 (ICSD 1,30x)
  transcricao: 'Contrato 26.4: ''não poderá exceder 50% da Contraprestação Mensal Máxima multiplicada por doze'''
  comentario: O teto (~R$ 39 mi/ano) pode ser somado ao desconto de IQD (até 10%) e às multas fora do item 26.3. A proporcionalidade frente ao fluxo de caixa (ICSD mínimo de 1,30x no P6) não é demonstrada.
    Sobre a cumulação de desconto e multa pelo mesmo fato, ver E3-056 (REMUNERACAO_REAJUSTE).
  dispositivo_legal: art. 5.º, inciso II, da Lei n.º 11.079/2004; art. 156, § 1.º, da Lei n.º 14.133/2021
  depende_de: Demonstração da proporcionalidade do teto frente ao fluxo de caixa e ao serviço da dívida.
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-106
  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E3-085
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Períodos de cura divergentes para a mesma falha (30 dias corridos × 5 dias úteis)
  dispositivo_editalicio: Contrato cl. 13.4.1 (PDF p. 35), 13.5.10 (p. 36) e 26.29 (p. 61)
  transcricao: 'Contrato 13.4.1: ''nunca inferior a 30 (trinta) dias corridos''; Contrato 13.5.10: ''nunca inferior a 5 (cinco) dias úteis'''
  comentario: O Contrato fixa período de cura mínimo de 30 dias antes do auto de infração (13.4.1 e 26.29) e, no auto de infração, prazo mínimo de 5 dias úteis com isenção de sanção se houver regularização
    (13.5.10). A sequência e a relação entre os prazos não estão claras.
  dispositivo_legal: art. 5.º, inciso II, da Lei n.º 11.079/2004; art. 23, inciso VIII, da Lei n.º 8.987/1995
