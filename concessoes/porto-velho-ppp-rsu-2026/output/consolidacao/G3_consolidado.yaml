  dispositivo_editalicio: P7 II.2 (PDF p. 15); P0 Data Request jurídico (PDF p. 25)
  transcricao: 'P7: ''com destaque para a exigência de prestação regionalizada'''
  comentario: O P7 registra a exigência de prestação regionalizada, mas não verifica se o Estado de Rondônia instituiu microrregião ou unidade regional de RSU que inclua Porto Velho, se houve adesão do
    Município, nem se isso afeta a titularidade e a competência para licitar isoladamente. O P0 pediu convênios, consórcios e protocolos com Estado e municípios, sem resultado relatado. A estruturação regionalizada
    também condiciona o acesso a recursos federais.
