  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-098
  - E4-034
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Importâncias seguradas mínimas 'por ativo' inexistentes; P6 só traz prêmios patrimoniais, sem risco de engenharia e RC
  dispositivo_editalicio: Contrato cl. 21.1.6.1 e 21.1.7 (PDF p. 50); P6 Tabela 13 (PDF p. 45-46); Caderno XI.1
  transcricao: 'Contrato 21.1.7: ''A Concessionária manterá apólices de seguro com importâncias seguradas não inferiores aos valores anuais referenciais por ativo constantes dos Anexos do Contrato.'''
  comentario: 'Nenhum anexo traz importância segurada por ativo. O único quadro (P6 Tabela 13) lista custo anual de prêmio por ativo (total calculado de R$ 2,42 mi/ano, incluindo ''Ônibus Escolar''), sem
    prêmios de risco de engenharia e de responsabilidade civil exigidos pela cl. 21.1.6.1 e sem ativos como ETRs, ecopontos e incinerador. Se aplicada à Tabela 13, a cl. 21.1.7 tomaria prêmios como piso
    de importância segurada (ex.: R$ 633,6 mil para a CTR). O critério de segurabilidade para força maior (19.5, 34.4.1) depende dessas coberturas.'
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 23, inciso V, da Lei n.º 8.987/1995; art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-069
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-119
  tipo_achado: IRREGULAR
  categoria: risco_economico
  descricao_breve: Intervenção suspende integralmente a contraprestação enquanto os serviços continuam
  dispositivo_editalicio: Contrato cl. 27.1 (PDF p. 62), 27.2.3 (p. 62) e 27.4 (p. 63)
  transcricao: 'Contrato 27.4: ''Durante o período em que durar a intervenção, o Poder Concedente se desonera do pagamento da Contraprestação Mensal Efetiva devida à Concessionária'''
  comentario: Na intervenção os serviços continuam sendo prestados com os meios da concessionária, sob gestão do interventor (27.1); a suspensão total da CME a priva da única receita e compromete o serviço
    da dívida. A cl. 27.2.3 confunde intervenção com reversão ao exigir a disponibilização de 'todos os Bens Reversíveis'.
  dispositivo_legal: arts. 32 a 34 da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004; art. 7.º da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
