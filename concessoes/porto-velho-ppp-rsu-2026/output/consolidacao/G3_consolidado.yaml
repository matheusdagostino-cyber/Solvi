  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Riscos rotulados 'Compartilhado' sem regra de partilha ou com consequências integralmente na concessionária
  dispositivo_editalicio: Matriz TO-20 (p. 17), SA-08 (p. 23), RJ-01 (p. 26) e SA-13 (p. 25-26)
  transcricao: 'Matriz TO-20: ''pode ensejar REEQUILÍBRIO parcial dos custos de nova licença em outro lugar ou ampliação não inicialmente prevista'''
  comentario: A TO-20 (nova área de disposição antes de outubro/2028) é 'Compartilhado' com reequilíbrio 'parcial', sem definir a parcela de cada parte; o P6 prevê uso do Ecoparque até o Ano 4, além do
    vencimento da LAO. A SA-08 (descarte irregular e vetores, dependente de fiscalização pública), a RJ-01 (conformidade com PNRS e Marco do Saneamento) e a SA-13 (monitoramento pós-encerramento do Jirau
    por 20 anos) também são 'Compartilhado', mas as consequências preveem apenas sanção ou custo da concessionária, sem gatilho a seu favor. O P6 não tem custo de monitoramento do Jirau por 20 anos.
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004
