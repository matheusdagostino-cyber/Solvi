  tipo_achado: IRREGULAR
  categoria: risco_economico
  descricao_breve: 'Vila Princesa: só a Avaliação Preliminar foi feita; escopo da remediação desconhecido e teto cobre só a intervenção'
  dispositivo_editalicio: Anexo III item VII.2, § 3.º (PDF p. 17) e Tabela 10 (p. 18); Contrato cl. 8.6.1.2 a 8.6.1.2.4 (PDF p. 18-19) e 8.8, i (p. 19); P1 VII.2.7 (p. 93-95); P4 VI.2 (p. 27); Caderno Tabela
    24 (p. 31)
  transcricao: 'Anexo III VII.2: ''As etapas pendentes deverão constar como responsabilidade do novo concessionário, com cronograma, marcos verificáveis e penalidades em caso de atraso.''; P1: ''Diante
    da situação atual é necessário um novo levantamento no local para ratificação dessas ações, e identificação de novos passivos.'''
  comentario: Do rito GAC só a Avaliação Preliminar (E1, EcoRondônia/Neomax, 2024) foi concluída; investigação confirmatória, investigação detalhada e avaliação de risco ficam com a concessionária após
    a Ordem de Início (8.8, i), e o escopo da intervenção só será conhecido após a avaliação de risco (M12-M18). O teto (8.6.1.2) limita apenas as 'medidas de intervenção'; investigação, avaliação de risco,
    monitoramento de 10 anos, cercamento, comunicação e recuperação de APP ficam sem limite, e não está claro se a base do teto inclui as etapas de investigação. O excedente da intervenção, risco do Poder
    Concedente, não é quantificado como passivo fiscal.
  dispositivo_legal: art. 5.º, inciso III, e art. 10, inciso I, alínea 'b', da Lei n.º 11.079/2004; art. 14, § 1.º, da Lei n.º 6.938/1981; art. 29 da Lei n.º 12.305/2010; Resolução CONAMA n.º 420/2009
