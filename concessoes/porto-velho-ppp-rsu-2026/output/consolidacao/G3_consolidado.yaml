  - E6-027
  - E3-035
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: 'Jirau: titularidade, licença, disputa e capacidade indefinidas; disponibilização pelo PC sem prazo'
  dispositivo_editalicio: Contrato cl. 8.6.2 (PDF p. 19) e 5.1.2 (p. 14); P1 VII.2.1 (p. 71) e VII.2.4 (p. 87-88); P2 Tabela 15, item 4.2.1 (p. 44) e V.1 (p. 31); P6 p. 46-48; Matriz TO-02 (p. 3-4)
  transcricao: 'P1: ''Entretanto, em 2025, uma disputa administrativa envolvendo a Prefeitura, a antiga operadora e a concessionária atual, resultou na paralização da operação do aterro'''
  comentario: O Jirau foi implantado pela ESBR como compensação da UHE e entregue à Prefeitura para operar, adequar e licenciar; está paralisado desde 2025 por disputa cujas partes e objeto não são identificados.
    Não há volume remanescente, vida útil, licença ou projeto que sustente a recuperação de R$ 5,0 mi (P2) nem a operação a partir do Ano 3 (P6). O Contrato (8.6.2) põe a reativação e a regularização a
    cargo do Poder Concedente sem prazo; a Matriz TO-02 fala em Mês 24. Se o Jirau não for disponibilizado, o Alto Madeira seguiria à Sede (DMT 255-378 km), sem cenário de custo nos estudos.
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 18, inciso XII, da Lei n.º 8.987/1995
  depende_de: Titularidade e situação de licença do Jirau; objeto e partes da disputa de 2025; levantamento volumétrico; cronograma de disponibilização pelo Poder Concedente.
  flag_tecnico: true
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: A indisponibilidade do Jirau é risco do PC com efeitos de exoneração de prazos e reequilíbrio favoráveis à concessionária (Contrato 5.1.2 e 8.6.2); a impugnação deve evitar atingir essa
    alocação.
