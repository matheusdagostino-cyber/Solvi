  reserva_tipo: RESERVA
  nota_reserva: A proteção do Caderno XI.4 (defeitos registrados no termo de entrega, lavrado após a assinatura) favorece a concessionária; eventual impugnação deve mirar a TO-14 sem atingir o XI.4.
