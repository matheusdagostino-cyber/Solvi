  descricao_breve: Gatilhos do PCOS divergentes entre Anexo III, P4 e Caderno; cheia sem gatilho; estação única de referência
  dispositivo_editalicio: Anexo III item X e Tabela 14 (PDF p. 25-26); P4 VI.3 e Tabela 11 (p. 28-29); Caderno Tabela 32 (PDF p. 36-37); Contrato cl. 8.9 (PDF p. 20); Matriz TO-04 (p. 6)
  transcricao: 'Anexo III X: ''As cotas de acionamento adotadas correspondem às cotas oficiais da Defesa Civil Municipal: cota de alerta em 5,0 m, cota de emergência em 4,0 m e cota de calamidade pública
    em níveis inferiores a 2,0 m''; Anexo III/P4: ''aferida pela estação telemétrica da ANA/CPRM em Porto Velho (estação 15400000)'''
  comentario: O texto do Anexo III e do P4 diz adotar as cotas da Defesa Civil (alerta 5,0 m, emergência 4,0 m, calamidade abaixo de 2,0 m), mas as tabelas usam faixas acima de 10 m, 7-10 m, 4-7 m e abaixo
    de 4 m, só para estiagem. O Caderno (Tabela 32), que prevalece, define os níveis por critérios qualitativos e inclui a cheia. A cl. 8.9 do Contrato manda acionar o PCOS 'de forma automática conforme
    as cotas hidrométricas de referência', e a cobertura mínima exigida varia por nível (100/95/90/80%). Nenhum documento fixa gatilho numérico para cheia, e o P4 não demonstra a correlação entre a estação
    de Porto Velho e os pontos de atracação a até ~100 km a jusante e no Rio Ji-Paraná.
