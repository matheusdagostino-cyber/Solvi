- id_tmp: G3-111
  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E3-133
  - E7-064
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Arbitragem facultativa ('poderão') e sem câmara designada, embora outras cláusulas pressuponham o juízo arbitral
  dispositivo_editalicio: Contrato cl. 40.1 e 40.2 (PDF p. 77), 39.7.3 (p. 76), 15.8.8 (p. 40), 32.12 (p. 70) e 43; P7 VIII.9 e VIII.11 (PDF p. 59-60)
  transcricao: 'Contrato 40.1: ''poderão ser dirimidas por arbitragem''; Contrato 40.2: ''administrada por câmara de reconhecida idoneidade, com sede da arbitragem em Porto Velho/RO'''
  comentario: O verbo 'poderão' não estabelece cláusula compromissória cheia, e nenhuma câmara nem critério de escolha é indicado. A cl. 39.7.3 remete à 'instituição prevista para a arbitragem' a nomeação
    do presidente da Mesa de Resolução de Conflitos, e as cl. 15.8.8 e 32.12 pressupõem o juízo arbitral para a suspensão e a rescisão. A instauração pode exigir execução judicial da cláusula e gerar disputa
    de foro (cl. 43).
  dispositivo_legal: arts. 4.º, 5.º e 7.º da Lei n.º 9.307/1996; art. 11, inciso III, da Lei n.º 11.079/2004; arts. 151 e 154 da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
