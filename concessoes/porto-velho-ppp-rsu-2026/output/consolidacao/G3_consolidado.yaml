- id_tmp: G3-099
  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E2-102
  tipo_achado: DEPENDE_DE_FATO
  categoria: contradicao
  descricao_breve: VI com papel decisório (aprovação do excedente do GAC, pareceres-condição) e ARDPV tratada como meio do Poder Concedente
  dispositivo_editalicio: Anexo VII itens 13 e 14 (PDF p. 6); Contrato cl. 41.2 (p. 78), 8.6.1.2.2 (p. 18-19), 8.10 (p. 20), 10.9 e 10.13.2 (p. 30-31)
  transcricao: 'Anexo VII 13: ''O PODER CONCEDENTE, por intermédio da Agência Reguladora e de Desenvolvimento de Porto Velho – ARDPV, poderá concordar integralmente com a verificação'''
  comentario: O Contrato faz do parecer do VI requisito de decisões da Entidade Reguladora (8.10, 10.9, 10.13.2) e exige aprovação conjunta do órgão ambiental e do VI para apurar o excedente do GAC (8.6.1.2.2),
    o que dá ao VI papel decisório; a cl. 41.2 afirma que o VI não substitui o regulador. O Anexo VII qualifica a ARDPV como meio de atuação do Poder Concedente. Ambos tensionam a independência e as funções
    próprias do regulador.
  dispositivo_legal: arts. 21, 22 e 23 da Lei n.º 11.445/2007; NR n.º 7/2024 da ANA (Resolução ANA n.º 187/2024)
  depende_de: Rol de funções indelegáveis da entidade reguladora na NR ANA n.º 7/2024 (conferir na Fase 2).
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-100
  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E2-081
  - E3-096
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Multas sem valor ou base de cálculo, remetidas a regulamento ou à ARDPV após o contrato (incl. Cláusulas Sociais)
  dispositivo_editalicio: Anexo III Tabela 17, CS-01 a CS-04 (PDF p. 27-28); Contrato cl. 9.6 (PDF p. 21), 21.1.5 (p. 50), 26.3, caput (p. 56) e 26.4 (p. 57)
  transcricao: 'Contrato 21.1.5: ''o Poder Concedente aplicará multa, conforme regulamentação''; Contrato 26.3: ''Sem prejuízo das demais sanções de multa ou parâmetros estabelecidos em regulamento próprio
    pela Entidade Reguladora''; Anexo III Tabela 17 (célula de tabela): retenção ''a ser definida pela ARDPV'''
  comentario: As multas por falta de renovação da garantia e dos seguros não têm valor (9.6, 21.1.5), e a cl. 26.3 admite multas adicionais por regulamento da ARDPV, fora do teto do item 26.4. As quatro
    Cláusulas Sociais do Anexo III remetem à ARDPV a fixação posterior da penalidade (CS-01, CS-02), da retenção (CS-03) e do desconto na contraprestação (CS-04); o desconto da CS-04 pode sobrepor-se ao
    IQ4 do IQS. As penalidades, valores e bases de cálculo devem constar do contrato, de forma proporcional.
  dispositivo_legal: art. 92, inciso XIV, da Lei n.º 14.133/2021; art. 23, inciso VIII, da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004; art. 5.º, inciso II, da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-101
  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E3-099
  - E3-152
  - E7-063
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: 'Tipificação genérica: sem multa específica por atraso de implantação; violações de dados e ''Plano de Trabalho'' indefinido no tipo residual'
  dispositivo_editalicio: Contrato cl. 26.3, i a ix (PDF p. 56-57), 26.9 a 26.12 (p. 58-59) e Cláusula 7ª; Anexo IV cl. 12.1 a 12.3 (PDF p. 9); P7 VII.10 (PDF p. 53)
  transcricao: 'Contrato 26.3, i: ''Por violação ao estabelecido no Plano de Trabalho apresentado pela Concessionária''; Anexo IV 12.1: ''facultam ao PODER CONCEDENTE a aplicação de penalidades à CONCESSIONÁRIA,
    previstas no CONTRATO'''
  comentario: Não há penalidade específica para atraso nos marcos de implantação (CTR, aterro, incinerador, Jirau, remediação); o enquadramento cai no tipo residual (26.3, vi), com multa de 0,5% a 30% do
    valor anual. O tipo (i), com faixa de 1% a 20%, pune violação a 'Plano de Trabalho' que o Contrato não define nem exige. As violações do acordo de dados (Anexo IV) também não têm tipo próprio nem gradação
    por gravidade do incidente. A amplitude das faixas depende da dosimetria das cl. 26.9-26.12. A faixa da cl. 26.3, viii, entre colchetes é tratada em E3-077 (QUESTOES_FORMAIS).
  dispositivo_legal: art. 23, inciso VIII, da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004; art. 5.º, inciso II, da Lei n.º 11.079/2004; art. 92, inciso XIV, e art. 156, § 1.º, da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-102
  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E3-103
  - E7-063
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Sanções com terminologia e hipóteses da Lei 8.666 ('suspensão temporária') em vez da Lei 14.133
  dispositivo_editalicio: Contrato cl. 26.1, iii (PDF p. 55), 26.19 e 26.20 (p. 60); P7 VII.10 (PDF p. 53) e XI.3.7 (p. 70)
  transcricao: 'Contrato 26.1, iii: ''suspensão temporária de participação em licitação e impedimento de contratar com o Município'''
  comentario: A Lei 14.133 prevê impedimento de licitar e contratar (até 3 anos) e declaração de inidoneidade (3 a 6 anos), não 'suspensão temporária'. As hipóteses da cl. 26.19 (fraude fiscal, atos para
    frustrar a licitação) correspondem a infrações que a lei sanciona com inidoneidade, não com impedimento.
  dispositivo_legal: art. 155 e art. 156, incisos III e IV e §§ 4.º e 5.º, da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-103
  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E3-102
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Prazo de recurso de 10 dias corridos, remetido à LC 745/2018 e inferior ao da Lei 14.133
  dispositivo_editalicio: Contrato cl. 26.22, 26.25 e 26.27 (PDF p. 60-61) e 42.5
  transcricao: 'Contrato 26.27: ''caberá recurso, no prazo de 10 (dez) dias contados do recebimento da intimação'''
  comentario: O recurso contra sanção é de 10 dias corridos, enquanto a lei geral prevê 15 dias úteis para recurso (advertência, multa e impedimento) e 15 dias úteis para defesa. A Lei 14.133 aplica-se
    subsidiariamente às concessões e PPPs, e a LC municipal 745/2018 é anterior a ela.
  dispositivo_legal: arts. 157, 158, 166 e 186 da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
