- id_tmp: G3-025
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E5-012
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: Transição presume vigência do contrato emergencial da ECOPVH, sem data, prazo e valor informados
  dispositivo_editalicio: P1 p. 64 e 88 (Contrato 028/PGM/2025); P4 Tab. 7 (p. 21) e Tab. 13 (p. 34); Contrato cl. 7.4 (PDF p. 17); P7 p. 11
  transcricao: 'P1: ''relativas ao modus operandi atual, da empresa ECOPVH com contrato emergencial ativo'''
  comentario: O diagnóstico não informa data, prazo ou valor do Contrato 028/PGM/2025 (emergencial). O P4 e o Contrato (7.4) preveem sobreposição de 30 dias com o 'operador cessante (ECOPVH)', o que pressupõe
    vínculo vigente na Ordem de Início (2027), embora contratações emergenciais tenham prazo máximo legal e vedação de prorrogação. Sobre a extrapolação do prazo fixado pelo TCE-RO, ver E5-013/E7-072 (QUESTOES_FORMAIS).
  dispositivo_legal: art. 75, inciso VIII, da Lei n.º 14.133/2021; art. 5.º, inciso III, da Lei n.º 11.079/2004
  depende_de: Data de assinatura e prazo do Contrato 028/PGM/2025 e eventuais novas contratações até a Ordem de Início.
