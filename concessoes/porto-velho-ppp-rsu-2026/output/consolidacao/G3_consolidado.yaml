# Consolidador (C) — Fase 1 — Grupo G3 (RISCOS_GARANTIAS / REGULACAO_FISCALIZACAO) — PPP RSU Porto Velho/RO [USO INTERNO]
pontos:
- id_tmp: G3-001
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-106
  - E3-142
  - E4-017
  - E7-018
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Garantia pública lastreada em vinculação e cessão fiduciária de repasses do FPM
  dispositivo_editalicio: Contrato cl. 23.2, III, e 23.3 (PDF p. 53); Anexo VI considerandos (PDF p. 3), cl. 4.5 e 5.4 (p. 5-6); P6 VI.10 e Tabela 19 (p. 59-61); Matriz EF-02 (p. 29-30); P7 V.1 a V.3 (p.
    39-40)
  transcricao: 'Contrato 23.2, III: ''da utilização de numerário recebido por intermédio do Fundo de Participação dos Municípios (FPM) instrumento de repreenchimento da Conta Garantia''; Anexo VI: ''a cessão
    fiduciária dos direitos presentes e futuros relativos às receitas que lhe forem cabíveis por força de repasses do Fundo de Participação do Município (FPM), com fundamento na autorização outorgada pelo
    artigo 159, I, "b", da Constituição Federal'''
  comentario: 'A garantia da contraprestação (Conta Garantia e, segundo o P6, também a Conta Vinculada) tem como única fonte nomeada os repasses do FPM, receita de impostos repartida pelo art. 159, I, ''b'',
    da CF. O art. 167, IV, da CF veda a vinculação de receita de impostos a despesa, e o § 4.º só admite vincular as receitas do art. 159 para pagamento de débitos com a União e para prestar-lhe garantia
    ou contragarantia. O art. 8.º, I, da Lei 11.079 admite a vinculação de receitas ''observado o disposto no inciso IV do art. 167''. O Anexo VI invoca como fundamento o próprio art. 159, I, ''b'' (regra
    de repartição) e o art. 54, I, da LC municipal 592/2015, e o P7 não enfrenta a restrição constitucional. Há controvérsia sobre o alcance do art. 167, IV, em garantias de PPP (ex.: tese de que o FPM,
    após o repasse, integra a receita própria do Município), a ser desenvolvida na Fase 2.'
  dispositivo_legal: art. 167, inciso IV e § 4.º, da CF/1988 (redação dada pela EC n.º 132/2023 — conferir); art. 159, inciso I, alínea 'b', da CF/1988; art. 8.º, inciso I, da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-002
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E7-019
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: Lei autorizativa específica da vinculação do FPM não identificada
  dispositivo_editalicio: Contrato cl. 23.2, III (PDF p. 53); Anexo VI considerandos (PDF p. 3) e cl. 5.4 (p. 6); P7 V.2 e V.3 (PDF p. 40)
  transcricao: 'Contrato 23.2, III: ''promover a autorização, por intermédio do instrumento previsto no Anexo – Minuta de contrato de nomeação de agente de pagamento e administração de Conta Vinculada,
    da utilização de numerário recebido por intermédio do Fundo de Participação dos Municípios (FPM)''; P7: ''No plano municipal, a Lei Complementar nº 592/2015 disciplina, em seu Capítulo V (arts. 53 a
    58), as modalidades de garantia admissíveis'''
  comentario: O Contrato atribui ao Poder Concedente o dever de 'promover a autorização' do uso do FPM por meio do próprio Anexo VI, isto é, por instrumento contratual futuro. O Anexo VI cita o art. 54,
    I, da LC municipal 592/2015, e o P7 menciona genericamente os arts. 53 a 58 da mesma lei, sem transcrevê-los nem afirmar que autorizam a vinculação ou a cessão fiduciária do FPM. Nenhum documento identifica
    lei específica que autorize a vinculação desta receita a este contrato.
  dispositivo_legal: art. 8.º, inciso I, da Lei n.º 11.079/2004; art. 167, inciso IV, da CF/1988; arts. 53 a 58 da LC Municipal n.º 592/2015 (texto não disponível)
  depende_de: Texto dos arts. 53 a 58 da LC Municipal n.º 592/2015 e eventual lei específica de vinculação do FPM a esta PPP.
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-003
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E1-013
  - E3-141
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Garantia da contraprestação não especificada no Edital; Anexo VI 'exemplificativo' e livremente alterável
  dispositivo_editalicio: Edital itens 5.3 (PDF p. 15), 6.3, iii (p. 16), 1.1.14 e 1.1.19 (p. 7); Anexo VI nota preliminar (PDF p. 3) e cl. 2.2 (p. 4); Contrato cl. 10.2.31 (PDF p. 26) e 23.3 (p. 53)
  transcricao: 'Anexo VI: ''é meramente exemplificativa e poderá ser livre e inteiramente alterada pelo PODER CONCEDENTE, pela CONCESSIONÁRIA e/ou pela INSTITUIÇÃO FINANCEIRA''; Edital 6.3, iii: ''demonstração
    do fluxo de receitas dadas em garantia'''
  comentario: 'O Edital não identifica a garantia: remete à ''estrutura de garantias públicas prevista no Contrato e seus anexos'' e menciona ''recursos vinculados'' e ''fluxo de receitas dadas em garantia''
    sem nomear a receita; a cessão fiduciária do FPM só aparece no Contrato (cl. 23) e no Anexo VI. O Anexo VI, por sua vez, declara-se ''meramente exemplificativo'' e ''livre e inteiramente'' alterável,
    inclusive por uma só das partes (''e/ou''), sob a justificativa de que a instituição financeira não participou da licitação. Isso contradiz a cl. 23.3 do Contrato, que manda o Anexo VI reger a garantia,
    e a própria cl. 2.2 do Anexo VI, que exige instrumento assinado por todas as partes para alterar o mecanismo. O licitante não dispõe de garantia definida e vinculante para precificar o risco de crédito
    público.'
  dispositivo_legal: art. 11, parágrafo único, e art. 8.º da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-004
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-143
  - E4-018
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: 'Elementos essenciais da garantia em branco: agente, remuneração, data de pagamento e fonte do aporte inicial'
  dispositivo_editalicio: Anexo VI preâmbulo (PDF p. 3), cl. 1.1.8 (p. 4), 2.1 (p. 4), 4.1 (p. 5), 5.6 (p. 6), 6.1 (p. 7) e 15.1 (p. 9); P6 Tabela 19 (PDF p. 61); Edital 5.2 (p. 15) e 6.3, iii (p. 16)
  transcricao: 'Anexo VI 1.1.8: ''é o valor mensal de R$ [*]''; Anexo VI 4.1: ''Contrato de Gerenciamento da Conta Vinculada estabelecido com o [*]''; P6 Tabela 19: ''Aporte inicial do Município + recomposição
    automática após saque | A definir na estruturação contratual do Caderno 6'''
  comentario: A instituição financeira, sua remuneração mensal (paga pelo Poder Concedente), o VCM, a data de pagamento e os endereços estão em branco ('[*]') no Anexo VI. O P6 deixa a fonte do aporte inicial
    da Conta Garantia (~R$ 13 mi) 'a definir na estruturação contratual do Caderno 6', sendo o próprio P6 o Caderno 6, e o agente fiduciário 'a definir em processo seletivo'. O Edital condiciona a Ordem
    de Início à transferência de 2 contraprestações à Conta Garantia (6.3, iii), e a dotação orçamentária (5.2) está em branco. Também não se demonstra como o FPM seria capturado (domicílio bancário do
    repasse no mesmo agente ou ordem irrevogável de transferência).
  dispositivo_legal: art. 8.º, art. 10, incisos III e IV, e art. 11, parágrafo único, da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-005
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-144
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Conta Vinculada (escrow), canal primário de pagamento, sem instrumento, fonte nem regras
  dispositivo_editalicio: Contrato cl. 1.3.15 (PDF p. 8), 23.1 e 23.2, I (p. 52-53); Anexo VI título e cl. 4.1 (PDF p. 1-5); P6 Tabela 19 (p. 61)
  transcricao: 'Contrato 23.2: ''I – constituir e manter Conta Vinculada para realização dos pagamentos devidos à Concessionária''; P6 Tabela 19: ''Conta Vinculada (Escrow) | Canal primário de pagamento
    — segregação patrimonial da CP | 100% do valor mensal da CP'''
  comentario: O Contrato prevê uma Conta Vinculada para os pagamentos ordinários, e o P6 a descreve como canal primário com 100% da contraprestação mensal, alimentada pelo 'FPM e demais receitas vinculadas'.
    O Anexo VI, embora intitulado 'administração de Conta Vinculada', regula apenas a Conta Garantia e remete a um 'Contrato de Gerenciamento da Conta Vinculada' com instituição em branco, não juntado.
    Não há fonte, regra de aporte mensal, gatilhos nem relação definida entre as duas contas nos documentos contratuais. A nomenclatura do agente também varia ('Agente de Pagamento e Garantia', 'agente
    fiduciário', 'agente de garantia') — ver E1-116/E3-008 (QUESTOES_FORMAIS).
  dispositivo_legal: art. 8.º e art. 11, parágrafo único, da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-006
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E7-020
  - E3-142
  - E4-017
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Papel do FPM divergente: fonte do pagamento ordinário (P6) × só repreenchimento (Contrato/P7) × só inadimplemento (Anexo VI)'
  dispositivo_editalicio: P6 p. 6 e Tabela 19 (PDF p. 61); P7 III.3 (PDF p. 28) e V.3 (p. 40); Contrato cl. 6.2, III (p. 16) e 23.2, III (p. 53); Anexo VI cl. 3.2, 4.1 e 4.5 (PDF p. 5)
  transcricao: 'P6: ''lastreada nos repasses do FPM''; Anexo VI 4.1: ''exclusivamente quando configurado'' [o inadimplemento]; Contrato 23.2, III: ''instrumento de repreenchimento da Conta Garantia'''
  comentario: O P6 afirma que a Conta Vinculada, canal primário de pagamento, é lastreada nos repasses do FPM (~R$ 410,4 mi/ano). O Contrato e o P7 tratam o FPM apenas como fonte de repreenchimento da Conta
    Garantia. O Anexo VI diz que o FPM será usado exclusivamente quando configurado o inadimplemento (4.1), mas também prevê seu uso no depósito inicial (3.2) e na recomposição automática (4.5). As 'receitas
    vinculadas' que a Conta Vinculada canalizaria e o 'fluxo de receitas dadas em garantia' exigido para a Ordem de Início (Contrato 6.2, III) não são identificados.
  dispositivo_legal: art. 11, parágrafo único, e art. 8.º, inciso I, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-007
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E1-047
  - E3-109
  - E7-027
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Base do saldo mínimo da Conta Garantia indefinida (CME inexistente antes da OI, ramp-up, VCM em branco)
  dispositivo_editalicio: Edital 1.1.14 (PDF p. 7) e 6.3, iii (p. 16); Contrato cl. 1.3.14 (p. 8), 6.2, III (p. 16), 23.2, II, e 23.4.3 (p. 53); Anexo VI cl. 1.1.7 e 1.1.8 (PDF p. 4), 3.2 e 4.5 (p. 5);
    P6 VI.10 (p. 60); P7 III.3 e III.6.1 (PDF p. 28 e 32)
  transcricao: 'Contrato 23.2, II: ''o valor de 02 (duas) contraprestações mensais devidas à Concessionária''; Contrato 23.4.3: ''saldo mínimo correspondente a 2 (duas) Contraprestações Mensais Efetivas'';
    Anexo VI 1.1.7: ''2 (dois) meses de pagamento do VCM'''
  comentario: 'O saldo mínimo é definido por quatro bases diferentes: ''contraprestações mensais devidas'' (Contrato 23.2, II), ''Contraprestações Mensais Efetivas'' (23.4.3 e Edital 1.1.14), ''Contraprestações
    Públicas Mensais'', termo não definido (Edital 6.3, iii), e um VCM fixo de ''R$ [*]'' (Anexo VI 1.1.8). O depósito é exigido antes da Ordem de Início, quando ainda não há CME apurada, e nos primeiros
    anos a CME varia com o ramp-up da Parcela A (60/80/100%), a redução da Parcela B no 1.º ano e os descontos de IQD. O P6 estima ~R$ 13,0 mi, valor que corresponde à contraprestação plena (2 × R$ 6.505.697,97).
    O valor exigido para a Ordem de Início e o nível de proteção ao longo do contrato ficam indeterminados.'
  dispositivo_legal: art. 8.º e art. 11, parágrafo único, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-008
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-083
  - E7-025
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: TRCF deduzida automaticamente da Conta Garantia, cujo saldo mínimo não pode ter outra finalidade
  dispositivo_editalicio: Contrato cl. 13.1.1 (PDF p. 34-35) × cl. 23.4.4 e 23.4.5 (p. 53); Anexo VI cl. 5.1, 7.3 e 7.4 (PDF p. 5 e 7); P7 V.4 (p. 40) e V.11 (p. 44)
  transcricao: 'Contrato 13.1.1: ''O valor da taxa de fiscalização será automaticamente deduzido no montante correspondente à Contraprestação Mensal na Conta Garantia''; Contrato 23.4.5: ''O saldo mínimo
    contido na Conta Garantia não poderá ser utilizado para qualquer outra finalidade'''
  comentario: A cl. 13.1.1 manda deduzir mensalmente da Conta Garantia a TRCF (1,5% da receita operacional bruta), tributo devido pela Concessionária à ARDPV. A cl. 23.4.5 veda qualquer outra finalidade
    para o saldo mínimo, a cl. 23.4.4 veda movimentação direta pelo Poder Concedente, e o Anexo VI só admite instruções conjuntas e não prevê essa movimentação. A dedução reduz o saldo abaixo de 2 CME a
    cada mês e mistura a garantia pública com o recolhimento de tributo.
  dispositivo_legal: art. 8.º, inciso I, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-009
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-108
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: Saldo de 2 contraprestações (~R$ 13 mi) declarado apto a cobrir também indenizações e reequilíbrios
  dispositivo_editalicio: Contrato cl. 23.4.3 (PDF p. 53) e 23.5, III (p. 54); Anexo VI cl. 1.1.4 (PDF p. 4); P6 VI.10 (p. 60)
  transcricao: 'Contrato 23.5, III: ''indenizações líquidas, certas e exigíveis devidas à CONCESSIONÁRIA em razão deste Contrato, inclusive as decorrentes de recomposição do equilíbrio'''
  comentario: A Conta Garantia cobre contraprestações, encargos moratórios e indenizações, inclusive por investimentos não amortizados (Anexo VI 1.1.4) e por reequilíbrio (23.5, III), mas o saldo mínimo
    é de duas CMEs (~R$ 13 mi) frente a CAPEX de R$ 298,3 mi a R$ 313,8 mi. Não há garantia específica para indenização por extinção antecipada nem regra de prioridade entre as obrigações cobertas. Não
    localizei fundamento normativo que fixe dimensão mínima da garantia.
  dispositivo_legal: art. 8.º e art. 5.º, § 2.º, inciso III, da Lei n.º 11.079/2004
  depende_de: Estimativa do montante potencial de indenizações (extinção antecipada, reequilíbrios) frente ao saldo de ~R$ 13 mi, e regra de prioridade entre as obrigações cobertas.
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-010
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-110
  - E7-021
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Gatilho de execução da garantia descrito de formas incompatíveis (48 h automático × notificação após 5 dias úteis × relatório do VI)
  dispositivo_editalicio: Contrato cl. 15.8.5 (PDF p. 40), 23.4, 23.4.1 e 23.4.2 (p. 53); Anexo VI cl. 6.3 e 7.1 (PDF p. 7); P6 VI.10 (p. 60); P7 III.6.3, V.4 e V.5 (PDF p. 33, 40-41)
  transcricao: 'Contrato 23.4: ''no prazo de até 48 (quarenta e oito) horas e independentemente de qualquer solicitação das Partes''; Contrato 23.4.2: ''mediante relatório fundamentado do Verificador Independente'''
  comentario: O Contrato prevê (i) notificação da Concessionária ao agente após atraso superior a 5 dias úteis (15.8.5), (ii) transferência automática em 48 h sem solicitação (23.4; Anexo VI 6.3 e 7.1)
    e (iii) utilização dos valores 'mediante relatório fundamentado do Verificador Independente', que calcula o valor devido (23.4.1-23.4.2). O P6 descreve saque pela Concessionária após 'prazo de cura',
    e o P7 descreve ora a excussão automática, ora a notificação. O termo inicial, o legitimado e o procedimento de acionamento ficam indefinidos.
  dispositivo_legal: art. 5.º, inciso VI, e art. 8.º da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-011
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-097
  - E3-146
  - E3-057
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Retenções, deduções unilaterais e pagamento parcial previstos no Contrato não são instruções aceitas pelo agente (Anexo VI)
  dispositivo_editalicio: Anexo VI cl. 5.1 e 5.3, a (PDF p. 5-6), 6.3 e 7.1 (p. 7) × Contrato cl. 5.1.3.1, a (PDF p. 14), 9.6 (p. 21), 10.13.5.3 (p. 32), 12.5 (p. 34), 13.1.1 (p. 34-35), 13.5.7 (p. 36),
    15.7.5 e 15.7.7 (p. 39), 23.4.1 (p. 53) e 27.5, ii (p. 63)
  transcricao: 'Anexo VI 5.1: ''A INSTITUIÇÃO FINANCEIRA somente estará obrigada a cumprir qualquer instrução''; Contrato 15.7.7: ''o Agente de Pagamento e Garantia deverá realizar o pagamento da parcela
    incontroversa apenas'''
  comentario: O Contrato prevê retenções e deduções unilaterais do Poder Concedente (5.1.3.1, 9.6, 10.13.5.3, 12.5, 13.5.7, 27.5), dedução automática da TRCF (13.1.1), pagamento só da parcela incontroversa
    durante contestação de IQD (15.7.7) e cálculo do valor devido pelo VI (23.4.1). O Anexo VI só obriga o agente a cumprir instruções conjuntas, judiciais ou do mediador, não prevê pagamento parcial e
    determina pagamento ou execução da garantia em 48 h. Ou as retenções são inoperantes, ou o Poder Concedente as fará deixando de pagar, o que aciona a garantia. A cl. 5.3, a, do Anexo VI remete à cl.
    5.2 em vez da 5.1, e a cl. 12.5 do Contrato importa regra de dedicação exclusiva de mão de obra.
  dispositivo_legal: art. 5.º, incisos VI e X, e art. 8.º da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-012
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-111
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Recomposição do saldo sem fonte alternativa vinculada se o FPM falhar
  dispositivo_editalicio: Contrato cl. 23.5.1 (PDF p. 54) e 15.8.7 (p. 40); Anexo VI cl. 7.7.1 (PDF p. 7)
  transcricao: 'Contrato 23.5.1: ''Na eventualidade de ausência ou suspensão do repasse do FPM, a obrigação prevista nesta cláusula deverá ser providenciada pelo Poder Concedente'''
  comentario: Se o repasse do FPM faltar ou for suspenso, a recomposição do saldo mínimo passa a depender de ato do Poder Concedente, sem fonte substituta vinculada, prazo próprio ou consequência específica
    além da suspensão de investimentos (15.8.7) e das hipóteses de rescisão. A garantia deixa de ser autoexecutável no cenário de restrição fiscal, que o P6 descreve com CAPAG C.
  dispositivo_legal: art. 8.º da Lei n.º 11.079/2004
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G3-013
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-145
  - E3-113
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Titularidade dos recursos da Conta Garantia contraditória e impenhorabilidade afirmada só por contrato
  dispositivo_editalicio: Anexo VI cl. 3.1, 4.3 e 5.3, d (PDF p. 5-6) × Contrato cl. 1.3.14 (PDF p. 8) e 23.4.6 (p. 53); Anexo VI cl. 7.5 (p. 7)
  transcricao: 'Anexo VI 3.1: ''conta corrente vinculada e de movimentação restrita em nome do PODER CONCEDENTE''; Anexo VI 4.3: ''patrimônio de afetação''; Anexo VI 5.3, d: ''detendo apenas a posse'';
    Contrato 23.4.6: ''não podendo, portanto, ser objeto de penhora, arresto, sequestro, busca e apreensão'''
  comentario: A conta é aberta em nome do Município (Contrato 1.3.14; Anexo VI 3.1), mas os recursos seriam de propriedade da Concessionária até o valor inadimplido e 'patrimônio de afetação' (4.3), enquanto
    a instituição financeira deteria 'apenas a posse' (5.3, d). O Contrato declara o saldo impenhorável e incomunicável com o patrimônio municipal (23.4.6), mas cláusula contratual não vincula terceiros
    nem o Judiciário, e não se indica lei que institua a afetação. A indefinição repercute na oponibilidade a credores do Município (inclusive sequestro em precatórios) e na contabilização orçamentária.
  dispositivo_legal: art. 8.º, incisos I e VI, da Lei n.º 11.079/2004; arts. 100 e 167, inciso IV, da CF/1988
