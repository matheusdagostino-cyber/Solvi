  descricao_breve: Usina de biogás do aterro reversível excluída da reversão; aquisição pelo PC a valor de mercado
  dispositivo_editalicio: Contrato cl. 18.10, 18.10.2 e 18.10.4 a 18.10.6 (PDF p. 43-45); P7 XI.3.4 (PDF p. 69); P6 V.5
  transcricao: 'Contrato 18.10.2: ''não integram os Bens Reversíveis''; Contrato 18.10: ''considerado o valor justo de mercado'''
  comentario: O biogás é gerado em aterro reversível, implantado e amortizado com a contraprestação; a usina de aproveitamento é excluída dos bens reversíveis, e o Poder Concedente, se quiser mantê-la,
    paga valor justo de mercado por reequilíbrio, inclusive após o termo. A receita entra na base de compartilhamento de 5%. Não há regra sobre a destinação do biogás (queima obrigatória) após eventual
    remoção da usina, e o P7 não examina a apropriação privada de valor gerado por ativo público.
  dispositivo_legal: art. 36 e art. 11 da Lei n.º 8.987/1995; art. 10-A, incisos II e III, da Lei n.º 11.445/2007
  depende_de: Potencial de geração de biogás e regra de continuidade da destinação do gás após a remoção da usina.
  flag_tecnico: true
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Opção de receita acessória não evidente e de saída favorável à concessionária; impugnar tende a incluir a usina entre os bens reversíveis.
