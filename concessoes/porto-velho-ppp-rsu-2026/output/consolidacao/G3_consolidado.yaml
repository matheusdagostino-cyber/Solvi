  comentario: A meta de universalização até 31/12/2033 da Lei 11.445/2007 refere-se ao abastecimento de água potável e ao esgotamento sanitário. Não localizei fundamento normativo específico que fixe 2033
    para a coleta de RSU; além disso, a meta de 100% de coleta seletiva vai a 2040-2042 nos próprios estudos.
