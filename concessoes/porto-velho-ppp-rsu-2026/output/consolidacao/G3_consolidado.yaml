  transcricao: 'P7: ''A Conta Garantia é de titularidade do Município de Porto Velho e mantida em favor da Concessionária'''
  comentario: Sendo a Conta Garantia de titularidade municipal, as transferências automáticas pelo agente configuram execução de despesa pública. O P7 não examina a compatibilidade desse fluxo com o prévio
    empenho e a liquidação, nem com o regime de execução contra a Fazenda Pública. A exequibilidade da garantia depende do desenho orçamentário do depósito inicial e das recomposições.
