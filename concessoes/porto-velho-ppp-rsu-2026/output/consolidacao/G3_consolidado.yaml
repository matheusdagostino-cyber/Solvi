  dispositivo_editalicio: Contrato cl. 10.1.10 (PDF p. 22), 20.1.1 (p. 46) e 20.4 a 20.6 (p. 48) × 17.1 (p. 41) e 4.7.1 (p. 13-14)
  transcricao: 'Contrato 20.4: ''o Poder Concedente, com o apoio do Verificador Independente, examinará as informações fornecidas pela Concessionária e decidirá, no prazo de até 30 (trinta) dias''; Contrato
    20.6: ''deverá adotar, a seu exclusivo critério'''
  comentario: A ARDPV não participa do procedimento de reequilíbrio extraordinário, que é instruído e decidido pela parte contratante, com apoio do VI contratado pela concessionária, e cuja forma de recomposição
    é escolhida a critério exclusivo do Poder Concedente; a revisão ordinária, ao contrário, cabe à Entidade Reguladora (17.1). Revisões e seus procedimentos são matéria de regulação no saneamento. Sobre
    metodologia, taxa de desconto e prazos do reequilíbrio, ver E3-066, E3-067 e E3-068 (REMUNERACAO_REAJUSTE).
  dispositivo_legal: art. 22, inciso IV, art. 23, inciso IV, e art. 38 da Lei n.º 11.445/2007
