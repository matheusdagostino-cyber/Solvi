  descricao_breve: Escopo, produtos, SLAs, prazo e remuneração estimada do VI não definidos; TR remete a anexo que não os contém
  dispositivo_editalicio: Anexo VII itens 6.2 (PDF p. 4-5) e 12 (p. 6); Contrato cl. 41.1 a 41.14.1 (PDF p. 78-80)
  transcricao: 'Anexo VII 6.2: ''observados o escopo mínimo, prazos, produtos, SLAs e requisitos de integridade previstos no ANEXO III – INDICADORES DE DESEMPENHO E METAS DE ATENDIMENTO'''
  comentario: O TR remete escopo, produtos e SLAs a um anexo que não os contém (o Anexo III é de Diretrizes Ambientais e o Anexo D não trata do VI). Não fixa a duração do contrato do VI, a periodicidade
    de relatórios além do anual nem a remuneração estimada. As atribuições estão espalhadas no Contrato (cl. 41) e incluem aceite de obras, vida útil do aterro, excedente do GAC e reequilíbrio. Sobre o
    erro de remissão ao 'Anexo III', ver E2-096 (QUESTOES_FORMAIS).
