  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: O atraso na contratação do VI posterga os descontos de desempenho, o que favorece a concessionária.
- id_tmp: G3-095
  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E2-099
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: VI contratado e pago pela concessionária, que é a parte avaliada
  dispositivo_editalicio: Anexo VII itens 1, 5 e 7 a 11 (PDF p. 3-6); Contrato cl. 41.9 (p. 79) e 41.14.1, b e e (p. 80)
  transcricao: 'Anexo VII/Contrato 41.9: ''A remuneração do VERIFICADOR INDEPENDENTE será de responsabilidade da CONCESSIONÁRIA.'''
  comentario: 'A concessionária contrata e remunera o VI, que certifica seu desempenho e emite pareceres para o Poder Concedente em pleitos de reequilíbrio, aceite de obras e vida útil do aterro. Há salvaguardas:
    credenciamento prévio, vedações de vínculo (item 9), declarações (item 10), substituição pelo Poder Concedente (item 11) e anuência como interveniente (item 7). A suficiência dessas salvaguardas depende
    do instrumento de credenciamento ainda não editado. Não localizei fundamento normativo que vede a remuneração do VI pela concessionária. Sobre o custo do VI ausente do OPEX, ver E2-100/E4-032 (MODELAGEM_ECONOMICA).'
  dispositivo_legal: art. 21 da Lei n.º 11.445/2007 (independência na regulação — referência); art. 5.º, inciso VII, da Lei n.º 11.079/2004
  depende_de: Instrumento de credenciamento dos verificadores (requisitos de independência e regras de substituição).
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: A contratação e o pagamento do VI pela concessionária lhe são favoráveis; questionar a independência pode transferir a contratação ao PC.
