  - E7-032
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Remediação do passivo histórico: risco da concessionária até o teto (SA-01/SA-02) × responsabilidade pública com reequilíbrio integral (SA-05)'
  dispositivo_editalicio: Matriz SA-01 e SA-02 (p. 17-19) × SA-05 (p. 20-21); Contrato cl. 8.6.1 a 8.6.1.2.4 (PDF p. 18-19) e 22.8 (p. 52); P7 IV.4 (PDF p. 37) × V.7 (p. 43)
  transcricao: 'Matriz SA-05 (leitura da tabela renderizada): ''É de responsabilidade pública a remediação de passivos históricos anteriores à emissão da Ordem de Início'' ... ''Reequilíbrio integral dos
    custos de remediação''; P7 V.7: ''cuja responsabilidade financeira é exclusiva do Poder Concedente'''
  comentario: A SA-01 e a SA-02 atribuem à concessionária a execução do rito GAC e da intervenção sobre a contaminação preexistente, remuneradas na contraprestação até o limite do EVTEA, com excedente ao
    Poder Concedente; o Contrato (8.6.1) segue esse modelo. A SA-05 afirma que a remediação de passivos anteriores à Ordem de Início é de responsabilidade pública e que sua eventual cessão enseja reequilíbrio
    integral. O P7 descreve o modelo do teto em IV.4 e, em V.7, afirma que a responsabilidade financeira pelos passivos históricos é exclusiva do Poder Concedente, sem a ressalva dos incisos (i) e (ii)
    da cl. 8.8.
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021; art. 10-A, inciso IV, da Lei n.º 11.445/2007
  flag_tecnico: true
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: A SA-05 e o P7 V.7 sustentam leitura de reequilíbrio integral dos custos de remediação, favorável à concessionária; impugnar a contradição tende a fixar o modelo do teto (SA-01) e eliminar
    essa leitura.
- id_tmp: G3-029
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E2-075
  - E5-059
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Execução da intervenção: compartilhada com SEINFRA/SEMUSB (Anexo III, P4) × integral da concessionária, inclusive do excedente (Contrato)'
  dispositivo_editalicio: Anexo III Tabela 10, etapa E5 (PDF p. 18); P4 Tabela 10, etapa E6 (p. 28) × Contrato cl. 8.6.1.2.2 e 8.6.1.2.4 (PDF p. 18-19)
  transcricao: 'Contrato 8.6.1.2.4: ''A execução das medidas de intervenção compete integralmente à Concessionária, independentemente da repartição de custos deste item.''; Anexo III Tabela 10 (célula de
    tabela): responsável ''SEINFRA + Concessionária'''
  comentario: O Anexo III atribui a etapa de medidas de intervenção a 'SEINFRA + Concessionária' (E5, M18-M48) e o P4 a 'SEMUSB + Concessionária' (E6, M1-M36), sem dividir tarefas. O Contrato atribui a
    execução integral à concessionária, inclusive da parte que exceder o teto, cujo custo só é recomposto depois, via Cláusula 20 ou 'aporte público', após apuração com base em relatórios aprovados pelo
    órgão ambiental e pelo VI (8.6.1.2.2). A concessionária executa e financia o excedente antes de qualquer recomposição, sem prazo para a decisão. Sobre o 'aporte público' sem autorização no Edital, ver
    E3-034/E4-091 (REMUNERACAO_REAJUSTE).
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 9.º, § 4.º, da Lei n.º 8.987/1995 (por analogia; não consta do rol do art. 3.º da Lei n.º 11.079/2004)
