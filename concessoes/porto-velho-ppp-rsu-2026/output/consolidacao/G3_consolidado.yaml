  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: O caráter vinculante dos estudos (2.11) e o escopo 'integral' do EVTEA abrem leitura favorável à concessionária (pleitos por erro de premissa ou por investimento não listado). Impugnar a
    contradição pode eliminar esse fundamento.
