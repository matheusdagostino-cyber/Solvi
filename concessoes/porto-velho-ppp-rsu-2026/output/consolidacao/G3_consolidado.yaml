  tipo_achado: IRREGULAR
  categoria: risco_economico
  descricao_breve: Prazo de 30 anos corre da assinatura, mas a eficácia depende de condições a cargo do PC sem prazo
  dispositivo_editalicio: Edital itens 6.1 (PDF p. 15), 6.3 (p. 16) e def. 1.1.36 (p. 9); Contrato cl. 6.1, 6.2, I a VI, e 6.4 (PDF p. 16), 15.6.1 (p. 38) e 41.1 (p. 78); P7 III.3 (PDF p. 28-29); Matriz
    RJ-05 (p. 28)
  transcricao: 'Contrato 6.1: ''O prazo da Concessão será de 30 (trinta) anos, contados a partir da assinatura do contrato''; Edital 6.3: ''A emissão da Ordem de Início é condição de eficácia do Contrato'';
    Contrato 6.4: ''de comum acordo, rescindir'''
  comentario: O prazo flui desde a assinatura, mas obrigações e remuneração só começam após a Ordem de Início, que depende de condições quase todas a cargo do Poder Concedente (agente de garantia, depósito
    de 2 contraprestações na Conta Garantia, designação de áreas, LPs, manuais). Não há prazo máximo para essas condições, suspensão da contagem do prazo, consequência pelo atraso imputável ao Poder Concedente
    nem critério de ressarcimento dos custos pré-OI da SPE (garantia de execução, seguros, ressarcimento de R$ 3,14 mi dos estudos). A única saída prevista é o distrato consensual 'sem culpa' (6.4). O P7
    afirma que o desenho evita a fluência do prazo antes das condições de início, o que o texto da cl. 6.1 não reflete; o P6 pressupõe 357 meses de pagamento dentro dos 30 anos. A Matriz (RJ-05) cobre só
    parcialmente o atraso na cessão de áreas.
  dispositivo_legal: art. 5.º, incisos I e III, e art. 8.º da Lei n.º 11.079/2004; art. 23, inciso V, da Lei n.º 8.987/1995
