  dispositivo_editalicio: Contrato cl. 8.6.1.1, 8.6.1.2.3 e 8.6.3 (PDF p. 18-19); Matriz SA-01, SA-02, SA-05 e SA-13 (frase final)
  transcricao: 'Contrato 8.6.1.1: ''Entendem-se por passivos ambientais preexistentes aqueles cujo fato gerador seja anterior à emissão da Ordem de Início'''
  comentario: Pluma de contaminação, chorume, biogás e incêndios em massa de resíduos antiga continuam a ocorrer após a Ordem de Início. O critério do fato gerador (8.6.1.1, 8.6.1.2.3, 8.6.3) e a regra
    da Matriz de que eventos posteriores à Ordem de Início são risco da concessionária não distinguem a manifestação tardia de passivo antigo de dano novo causado pela operação, em áreas que a concessionária
    passa a operar e monitorar.
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; Resolução CONAMA n.º 420/2009
  depende_de: Linha de base ambiental (investigação confirmatória) nas áreas na data da Ordem de Início.
