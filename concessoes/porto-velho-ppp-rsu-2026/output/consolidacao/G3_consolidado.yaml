  comentario: A devolução a pedido do Poder Concedente a qualquer tempo e a vedação de cópias conflitam com a guarda obrigatória de registros trabalhistas, MTR e bases de IQD auditáveis (Contrato 41.16,
    10.2.36, 12.5) e com a exceção de cumprimento de obrigação legal prevista no próprio acordo (4.1).
