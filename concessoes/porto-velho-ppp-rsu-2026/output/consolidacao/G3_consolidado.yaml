  descricao_breve: Inventário de passivos 'antes do Dia 1' sem responsável, conteúdo ou efeito, e ausente dos documentos vinculantes
  dispositivo_editalicio: Anexo III Tabela 9 (PDF p. 16) e item XIV.2 (p. 33); P4 Tabela 7 (p. 21); Contrato cl. 8.6.1.1 e 8.6.4 (PDF p. 18-19); Caderno XI.4 (termo de entrega)
  transcricao: 'Anexo III XIV.2: ''Inventário de Passivos Ambientais entregue antes do Dia 1'''
  comentario: O Contrato separa passivos pelo fato gerador anterior à Ordem de Início (8.6.1.1), com base em 'diagnósticos socioambientais' que só contêm avaliações preliminares. O Anexo III e o P4 mencionam
    um Inventário de Passivos Ambientais 'antes do Dia 1', mas não dizem quem o elabora, com que escopo (Centro de Triagem, ETR informal de São Carlos, Jirau AS1-AS5, Ecoparque) nem com que efeito probatório;
    o Edital, o Contrato, o Caderno e a Matriz não incorporam essa obrigação. A linha de corte entre passivo do Poder Concedente e da concessionária fica indefinida.
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 14, § 1.º, da Lei n.º 6.938/1981
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: Se a concessionária elaborar o inventário (ou o termo de entrega), um registro amplo transfere passivos ao PC (Contrato 8.6.1 e 8.6.4). Impugnar a omissão pode levar o PC a elaborar ele
    próprio o inventário.
- id_tmp: G3-031
