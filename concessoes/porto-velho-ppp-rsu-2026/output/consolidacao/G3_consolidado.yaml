  categoria: contradicao
  descricao_breve: Competência para apurar e homologar o IQD/RAA atribuída de forma conflitante (ARDPV, VI e Poder Concedente)
  dispositivo_editalicio: Edital def. 1.1.2 (PDF p. 6) e 1.1.28 (p. 8); Contrato cl. 1.3.2, 1.3.27, 1.3.33 (PDF p. 6-9), 13.5.2 (p. 35), 15.4 (p. 37), 15.7.5 (p. 39) e 41.19-41.20 (p. 81); Anexo D item
    VI.1.2 (PDF p. 21); Anexo VII item 13 (p. 6); P7 p. 35
  transcricao: 'Edital 1.1.2: ''responsável pela fiscalização e regulação do Contrato e pela análise e mensuração dos Indicadores''; Edital 1.1.28: ''a serem apurados pelo Verificador Independente e homologados
    pela Agência Reguladora''; Anexo D: ''homologação do RAA pelo Poder Concedente'''
  comentario: O Edital e o Contrato definem a ARDPV ora como responsável pela 'análise e mensuração' dos IQD, ora pela 'homologação'; atribuem a apuração ao VI (1.3.33, 15.4) e a decisão final de contestação
    à ARDPV (15.7.5). O Anexo D atribui a homologação do RAA ao Poder Concedente, o Anexo VII trata a ARDPV como meio de atuação do Poder Concedente, e a cl. 41.20 permite ao Poder Concedente determinar
    auditoria ou perícia. A indefinição recai sobre o mecanismo que determina a parcela variável da contraprestação.
  dispositivo_legal: art. 21, inciso I, art. 22, incisos I e II, e art. 23, inciso I, da Lei n.º 11.445/2007; art. 5.º, inciso VII, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
