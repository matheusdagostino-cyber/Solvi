- id_tmp: G3-051
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E1-034
  - E4-085
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Estudos 'vinculantes' e EVTEA definidor do escopo × responsabilidade integral do licitante pelos dados; risco de erro dos estudos sem alocação
  dispositivo_editalicio: Edital itens 2.10 e 2.11 (PDF p. 11), 3.1 'Investimentos em Infraestrutura' (p. 13), 7.5 (p. 17) e 9.9.1 (p. 22); Anexo C Declaração 7 (p. 13-14); Contrato cl. 5.1.9 (p. 15); Matriz
    (silêncio)
  transcricao: 'Edital 2.11: ''têm caráter igualmente vinculante''; Edital 3.1: ''o qual integra o CONTRATO como parte indissociável e define o escopo integral das obrigações de investimento da CONCESSIONÁRIA'';
    Edital 9.9.1: ''não poderá, em hipótese alguma, alegar desconhecimento a respeito das condições de execução do CONTRATO'''
  comentario: O item 2.11 dá caráter vinculante aos estudos e informações do Poder Concedente, e o item 3.1 torna o EVTEA definidor do escopo integral de investimentos. Os itens 7.5 e 9.9.1 e a Declaração
    7 do Anexo C impõem ao licitante responsabilidade integral pela exatidão dos dados e renúncia a pleitos por insuficiência de informações. A Matriz não aloca o risco de erro ou omissão dos estudos referenciais;
    diante das omissões do P6 (autoclave, flare, terrenos, capacidade do aterro, galpão das cooperativas), não se sabe se esses itens seriam obrigação sem remuneração ou investimento fora do escopo, sujeito
    a reequilíbrio. Sobre o status do EVTEA, ver E1-033/E3-023/E7-085 (OBJETO_ESCOPO).
