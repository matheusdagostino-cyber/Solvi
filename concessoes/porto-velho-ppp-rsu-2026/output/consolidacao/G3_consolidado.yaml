  dispositivo_editalicio: Anexo VII item 6.1.2 (PDF p. 4); Contrato cl. 8.6.1.2.2, 8.10, 10.13.2 e 10.13.5.2
  transcricao: 'Anexo VII 6.1.2: ''Gerenciamento de projetos ... PMBok'' (requisitos de credenciamento)'
  comentario: Os requisitos de credenciamento pedem experiência em gerenciamento de projetos (PMBok), desenho de processos (BPMN), verificação de indicadores e segurança de TI. Não pedem engenharia sanitária
