  transcricao: 'Contrato 8.6.2: ''A reativação e a regularização fundiária, ambiental e administrativa do Aterro do Jirau ... constituem condição cuja viabilização é de responsabilidade do Poder Concedente'''
  comentario: A cl. 8.6.1 ressalva as obrigações da concessionária quanto à Vila Princesa e ao Jirau 'observado o limite do item 8.6.1.2', mas o 8.6.1.2 só limita as medidas de intervenção da Vila Princesa.
    O programa de recuperação e monitoramento pós-encerramento do Jirau (8.8, ii, prazo mínimo de 20 anos) não tem teto, embora o laudo preliminar indique cinco áreas suspeitas e não haja investigação confirmatória.
