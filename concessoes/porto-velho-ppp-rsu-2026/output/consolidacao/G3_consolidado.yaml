  - E2-098
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: Sem VI contratado não há desconto por IQD; credenciamento ainda inexistente e sem consequência para atraso
  dispositivo_editalicio: Contrato cl. 41.3 e 41.5 (PDF p. 78) e 15.4 (p. 37); Anexo VII itens 1 a 6 (PDF p. 3-5)
  transcricao: 'Contrato 41.3: ''O Verificador Independente constitui obrigação precedente para o início da apuração do IQD com efeitos econômico-financeiros'''
  comentario: O credenciamento de verificadores depende de edital próprio (41.5) e a contratação cabe à concessionária. Enquanto o VI não estiver operacional, a contraprestação é paga sem efeito de desempenho,
    e o Contrato não prevê consequência para atraso imputável à concessionária ou ao Poder Concedente.
  dispositivo_legal: art. 5.º, inciso VII, art. 6.º, § 1.º, e art. 7.º da Lei n.º 11.079/2004
