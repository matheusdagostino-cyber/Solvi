  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Área da CTR: estudos a localizam em área aparentemente municipal; Edital/Contrato põem a obtenção por conta e risco da concessionária; Matriz atribui ao PC'
  dispositivo_editalicio: Edital 6.3, iv, e 6.3.1 (PDF p. 16); Contrato cl. 5.1.1 e 5.1.1.1 (PDF p. 14); Matriz TO-05 (p. 7) e RJ-05 (p. 28-29); Caderno XI.4 (PDF p. 61-62); P2 V.5 (p. 36); Anexo III Tabela
    3 (p. 9); P1 p. 62 e 84
  transcricao: 'Edital 6.3.1: ''constitui responsabilidade exclusiva da CONCESSIONÁRIA'' ... ''e não condiciona a emissão da Ordem de Início nem enseja recomposição do equilíbrio econômico-financeiro'';
    Matriz TO-05 (leitura da tabela renderizada): ''Liberação de área, licenciamento e regularização institucional do CTR-PV são do Poder Concedente''; P2: ''será implantada em frente ao atual Central de
    Triagem de Recicláveis na Vila Princesa'''
  comentario: O Edital (6.3.1) e o Contrato (5.1.1.1) atribuem à concessionária, sem reequilíbrio, a obtenção das áreas que não sejam bens municipais ou 'expressamente previstos para desapropriação nos
    Anexos', mas nenhum anexo lista bens municipais a ceder (salvo incinerador e transbordo do Baixo Madeira) nem áreas para desapropriação. O P2 localiza a CTR com coordenadas em frente à Central de Triagem
    da Vila Princesa, o Anexo III a chama 'CTR-PV — Municipal — em implantação' e o P6 não orça terreno. A Matriz TO-05 atribui ao Poder Concedente a liberação de área e o licenciamento da CTR, e a RJ-05
    limita o reequilíbrio às áreas de titularidade do Poder Concedente na data do Edital. Os estudos não informam titularidade, matrícula, dimensão nem a natureza dos 'entraves institucionais e jurídicos'
    que impediram a implantação da CTR municipal (P1 p. 84). Sobre a falta de custo de terreno no P6, ver E4-025 (MODELAGEM_ECONOMICA); sobre a LP, E1-009/E3-031 (LICENCIAMENTO_AMBIENTAL).
  dispositivo_legal: art. 18, inciso XII, e art. 29, inciso VIII, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 5.º, inciso III, e art. 10, inciso VII, da Lei n.º 11.079/2004; art. 25,
    § 5.º, inciso II, da Lei n.º 14.133/2021; art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: DECISAO_COMERCIAL
  nota_reserva: A alocação integral do risco fundiário à concessionária favorece licitante que já detenha área ou aterro licenciado em Porto Velho (o único identificado nos estudos é o Ecoparque). Por outro
    lado, a alocação de atraso na entrega de bens ao PC com fluência de pagamentos (Contrato 5.1.2) é assimetria favorável à concessionária. Levantar ou não depende da posição fundiária do grupo.
- id_tmp: G3-020
  tema: RISCOS_GARANTIAS
  ids_origem:
  - E3-044
  - E6-029
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Aterro na Sede (cl. 10.13): risco integral da concessionária × Matriz TO-20/TO-05 (área alternativa e licença como responsabilidade pública)'
  dispositivo_editalicio: Contrato cl. 10.13, 10.13.1 e 10.13.1.1 (PDF p. 31), 8.12 (p. 20) e 26.30 (p. 62) × Matriz TO-05 (p. 7) e TO-20 (p. 17); P2 V.5 (p. 36) e III.2.3.1 (p. 13); P3 V (p. 38-39); P1
    p. 84-85
  transcricao: 'Contrato 10.13.1.1: ''A escolha da forma de disponibilização do aterro sanitário constitui risco integralmente alocado à Concessionária'' ... ''indisponibilidade de área, recusa de terceiros,
    indeferimento ou demora no licenciamento'''
  comentario: A cl. 10.13 obriga a concessionária a 'prover e disponibilizar' na Sede aterro licenciado, por qualquer forma (construção, compra de aterro existente, aquisição de participação societária),
    por sua conta e risco, sem reequilíbrio por indisponibilidade de área ou demora no licenciamento, e excepciona a regra geral de mora do licenciador (8.12, 26.30). A Matriz TO-20 classifica como 'Compartilhado'
    o risco de vida útil do Ecoparque, atribui ao poder público a definição de área alternativa e a licença e prevê reequilíbrio parcial; a TO-05 atribui ao Poder Concedente a área e o licenciamento da
    CTR. Os estudos (P2, P3) tratam o sítio da CTR como definido e municipal, e o P1 registra que a CTR municipal não foi implantada por entraves institucionais e jurídicos e aponta APP de igarapé adjacente
    (Anexo III p. 17). Sobre o efeito competitivo da obrigação, ver E3-043 (OBJETO_ESCOPO); sobre a exigência de propriedade plena, E3-045/E7-047.
  dispositivo_legal: art. 5.º, inciso III, e art. 10, inciso VII, da Lei n.º 11.079/2004; art. 92, inciso IX, e art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: true
  flag_reserva: true
  reserva_tipo: DECISAO_COMERCIAL
  nota_reserva: A opção de 'aquisição de aterro existente e licenciado' na Sede favorece quem detenha ou possa adquirir aterro licenciado local. O único identificado nos estudos é o Ecoparque (LAO em nome
    de CTR PORTO VELHO S/A; LAI da EcoRondônia Ambiental S/A, associada pelo P1 p. 88 a outro grupo). Para licitante sem aterro local o ponto é de impugnação; a decisão depende da posição comercial do grupo.
