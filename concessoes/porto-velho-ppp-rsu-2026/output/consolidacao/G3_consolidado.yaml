  dispositivo_editalicio: Contrato cl. 13.1.1 (PDF p. 34-35); P6 p. 44; P7 V.11 (PDF p. 44) e XI.3.3 (p. 68)
  transcricao: 'Contrato 13.1.1: ''no montante de 1,5% (um e meio por cento) da receita operacional bruta, equivalente ao valor da Contraprestação Mensal Efetiva e às receitas acessórias, nos termos do
    art. 53 da referida Lei Complementar''; P7: ''tendo base de cálculo, contribuinte e alíquota regularmente definidos por lei complementar'''
  comentario: A TRCF, taxa de poder de polícia, incide sobre a receita operacional bruta, base típica de imposto. O P6 informa que a LC 1.013/2025 (art. 51, §§ 1.º e 2.º) faculta a não incidência em concessão
    administrativa, mas mantém a taxa e a repassa integralmente à contraprestação (o Município paga a si mesmo via PPP, ~R$ 1,17 mi/ano); o Contrato e o P7 citam o art. 53 e não mencionam a faculdade. A
    dedução da TRCF na Conta Garantia é tratada em G3-008.
  dispositivo_legal: art. 145, inciso II e § 2.º, da CF/1988; art. 77, parágrafo único, da Lei n.º 5.172/1966 (CTN); arts. 51 e 53 da LC Municipal n.º 1.013/2025
  depende_de: Texto consolidado da LC Municipal n.º 1.013/2025 (arts. 51 e 53).
