  dispositivo_editalicio: Contrato cl. 15.5.2.2 (PDF p. 38) × Matriz TO-01 (p. 3) e TO-06 (p. 7-8)
  transcricao: 'Matriz TO-01: ''Concessionária absorve variações dentro de banda contratual (sugere-se ±10%); fora da banda, gatilho de reequilíbrio.'''
  comentario: Se a Parcela B é liquidada por volume medido, a variação de demanda já se transfere ao pagamento (risco do Poder Concedente); a Matriz trata a variação como risco da concessionária dentro
    de banda de ±10%, com reequilíbrio fora dela por 6 meses consecutivos, medida contra a projeção do P3. A justificativa mantém a linguagem de recomendação ('sugere-se'), a mitigação cita 'revisão tarifária'
    sem tarifa ao usuário, e não se define a métrica (t/mês coletada, processada ou residual) nem a base (P3 diverge do P6). O Contrato não reproduz a banda. Sobre a falta de preço unitário da Parcela B,
    ver E3-052/E4-010 (REMUNERACAO_REAJUSTE).
