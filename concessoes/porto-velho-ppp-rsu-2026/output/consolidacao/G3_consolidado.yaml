  dispositivo_editalicio: Anexo VII itens 2, 3 e 6 a 6.3 (PDF p. 3-5) × Contrato cl. 41.4 a 41.9 (PDF p. 78-79)
  transcricao: 'Anexo VII: ''o PODER CONCEDENTE indicará a empresa''; Contrato 41.4: ''O Verificador Independente será selecionado pela Concessionária dentre aqueles previamente credenciados'''
  comentario: O item 2 do Anexo VII dá ao Poder Concedente a indicação da empresa em 30 dias da Ordem de Início; os itens 6 a 6.3 e o Contrato (41.4-41.9) dão à concessionária a escolha por técnica e preço,
    com no mínimo três convidados de lista formada em credenciamento público regido por 'instrumento próprio', ainda não editado, e a remuneração pela concessionária.
  dispositivo_legal: art. 5.º, inciso VII, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: A escolha do VI pela concessionária é favorável a ela; impugnar a contradição pode levar à prevalência da indicação pelo PC.
