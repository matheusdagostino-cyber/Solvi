  - E4-076
  - E5-054
  - E3-033
  - E7-032
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Teto do encargo GAC da Vila Princesa indefinido (R$ 4,2 / 10,5 / 11,3 mi; Anos 1-3 × 2-4; sem data-base)
  dispositivo_editalicio: Contrato cl. 8.6.1.2 a 8.6.1.2.4 (PDF p. 18-19); P6 Tabela 7, item 7.1.1 e 7.2.1 (PDF p. 40) e texto (p. 35); P2 Tabela 15, itens 7.1.1 e 7.2.1 (PDF p. 45); Matriz SA-01 (p. 17-18);
    P7 IV.4 (p. 37)
  transcricao: 'Contrato 8.6.1.2: ''é limitado ao investimento previsto para o encerramento da antiga Lixeira de Vila Princesa na modelagem econômico-financeira integrante dos Anexos, inclusive o EVTEA'';
    P6 p. 35: ''no encerramento do Lixão da Vila Princesa (R$ 4,2 milhões)'''
  comentario: 'O teto não tem valor expresso no Contrato e remete ao ''investimento previsto para o encerramento'' na modelagem. Na modelagem há: (i) linha 7.1.1 ''Lixão Vila Princesa — Eliminação do Passivo''
    com R$ 1,05 + 4,2 + 5,25 mi = R$ 10,5 mi, nos Anos 1-3 (P6 Tabela 7) ou 2-4 (P2 Tabela 15); (ii) linha 7.2.1 ''Centro de Triagem'' de R$ 0,8 mi, que leva o grupo ''Passivo Ambiental'' a R$ 11,3 mi;
    (iii) o texto do P6 (p. 35), que cita R$ 4,2 mi no Ano 2 para o ''encerramento''. A leitura de R$ 5,25 mi feita por um dos extratores (E3-033) corresponde à última parcela anual, não a um total. A Lixeira
    já foi encerrada pela Portaria 109/SEMUSB/2023, e a cláusula fala em ''encerramento'' enquanto o modelo fala em ''eliminação do passivo'' e o teto em ''medidas de intervenção''. Não há data-base nem
    regra de atualização, e o P7 não quantifica o limite.'
  dispositivo_legal: art. 5.º, inciso III, e art. 10, § 4.º, da Lei n.º 11.079/2004; art. 92, inciso IX, da Lei n.º 14.133/2021
  flag_tecnico: true
  flag_reserva: true
  reserva_tipo: RESERVA
  nota_reserva: O teto com excedente alocado ao PC é cláusula pró-concessionária, e a ambiguidade do valor-base permite sustentar a leitura mais baixa (R$ 4,2 mi), ampliando o excedente a cargo do PC. Impugnar
    a indefinição pode levar à fixação de valor e eliminar essa margem; por outro lado, a leitura mais alta (R$ 11,3 mi) aumenta a exposição da concessionária. Decisão do advogado.
- id_tmp: G3-027
  tema: RISCOS_GARANTIAS
  ids_origem:
