  tema: REGULACAO_FISCALIZACAO
  ids_origem:
  - E3-135
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Escopo da Mesa de Resolução de Conflitos inclui e exclui o cálculo de penalidades
  dispositivo_editalicio: Contrato cl. 39.2, d, e 39.2.1, a (PDF p. 75) × 40.3.1 (p. 77)
  transcricao: 'Contrato 39.2, d: ''Penalidades contratuais e, se for o caso, seu cálculo''; Contrato 39.2.1, a: ''sanções administrativas tipicamente punitivas'''
  comentario: A mesma cláusula inclui as penalidades e seu cálculo na competência da Mesa e exclui a aplicação e a dosimetria das sanções; a arbitragem exclui o poder sancionatório em sentido estrito, mas
    admite seus reflexos patrimoniais (40.3.1).
  dispositivo_legal: art. 151, parágrafo único, da Lei n.º 14.133/2021; art. 1.º, § 1.º, da Lei n.º 9.307/1996
