  tipo_achado: IRREGULAR
  categoria: risco_economico
  descricao_breve: Aterro deve chegar à reversão com 30 anos de vida útil remanescente, sem indenização
  dispositivo_editalicio: Contrato cl. 10.13.4, 10.13.5 a 10.13.5.4 (PDF p. 32); P7 XI.3.3 (PDF p. 69), IV.4 (p. 37) e IV.6 (p. 38); Matriz TO-02 e TO-20
  transcricao: 'Contrato 10.13.5: ''capacidade e vida útil remanescentes não inferiores a 30 (trinta) anos, contados da referida data''; Contrato 10.13.4: ''não sendo devida qualquer indenização por ocasião
    da reversão'''
  comentario: A concessionária deve entregar o aterro com capacidade remanescente para 30 anos após a reversão, aferida pela ARDPV, sob pena de executar ampliações às suas expensas (10.13.5.3), e os investimentos
    devem ser integralmente amortizados no prazo, sem indenização (10.13.4). Isso implica precificar na contraprestação de 30 anos capacidade para cerca de 60 anos de rejeitos. O P7 descreve a obrigação
    sem examinar sua coerência com a alocação do Jirau ao Poder Concedente (TO-02) e da vida útil do Ecoparque como risco compartilhado (TO-20). Sobre a ausência de dimensionamento e custo no P6, ver E3-046/E4-026/E6-028
    (MODELAGEM_ECONOMICA).
  dispositivo_legal: art. 5.º, incisos I e III, da Lei n.º 11.079/2004; art. 36 da Lei n.º 8.987/1995; art. 10-A, incisos III e IV, da Lei n.º 11.445/2007
  flag_tecnico: true
  flag_reserva: true
  reserva_tipo: DECISAO_COMERCIAL
  nota_reserva: Titular de aterro com grande capacidade remanescente em Porto Velho tem vantagem no atendimento da exigência; a decisão de impugnar depende da posição do grupo.
