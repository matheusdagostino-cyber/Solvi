  transcricao: 'Anexo VII 9: ''O VERIFICADOR INDEPENDENTE, suas controladoras, controladas e coligadas não poderão'''
  comentario: A ARDPV é identificada como reguladora dos serviços de RSU, com autonomia declarada (independência efetiva tratada em G3-085). O TR do VI veda vínculo societário, contratual relevante e assessoria
    em reequilíbrio, exige declarações anuais e permite substituição pelo Poder Concedente. Os requisitos de reabilitação reproduzem a lei. O acordo de dados cita corretamente os conceitos legais, condiciona
    a transferência internacional às hipóteses legais e fixa comunicação de incidentes em 24 h ao controlador. A TRCF de 1,5% está modelada no P6 de forma coerente com o Contrato (base e circularidade tratadas
