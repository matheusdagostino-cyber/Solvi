  descricao_breve: 'Destinação transitória no Ecoparque: contrato sem preço e prazo, licenças vencendo e capacidade não informada'
  dispositivo_editalicio: Contrato considerando v (PDF p. 5-6); Anexo III Tabela 3 (p. 10); P1 VII.2.4 (p. 84-87); P4 Tab. 1 (p. 10); P6 Tab. 9 (p. 42-43)
  transcricao: 'P1: ''O contrato nº 042/PGM/2023 estabelece que a prestação dos serviços ocorre sob o regime de empreitada por preço unitário''; P1: ''válida até 08/10/2026'' [LAI] ... ''válida até 09/10/2028''
    [LAO]'
  comentario: Até o aterro da CTR operar, os rejeitos seguem ao aterro privado Ecoparque, nas condições do Contrato 042/PGM/2023 (considerando v do Contrato), e o P6 prevê esse uso nos Anos 1 a 4. Os estudos
    não informam preço unitário, data, prazo nem regime de prorrogação do Contrato 042 (regido pela Lei 8.666), nem quem será o contratante da destinação na transição. A LAO do Ecoparque vence em 09/10/2028
    (Ano 2) e a LAI das obras de ampliação em 08/10/2026; capacidade remanescente e vida útil não são informadas. O Caderno não disciplina alternativa licenciada. O custo orçado no P6 (~R$ 12/t) é tratado
    em E4-030/E6-054 (MODELAGEM_ECONOMICA).
  dispositivo_legal: art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 57, inciso II e § 4.º, da Lei n.º 8.666/1993 c/c art. 190 da Lei n.º 14.133/2021; art. 18 da Resolução CONAMA n.º 237/1997
  depende_de: Data, prazo, preço e vigência do Contrato 042/PGM/2023; capacidade e vida útil remanescentes do Ecoparque; situação dos pedidos de renovação da LAO/LAI; definição de quem contrata a destinação
    transitória.
  flag_tecnico: true
  flag_reserva: true
  reserva_tipo: DECISAO_COMERCIAL
  nota_reserva: A dependência do único aterro licenciado local, de titularidade de terceiro potencialmente concorrente, afeta de modo distinto os licitantes conforme sua relação com o Ecoparque; levantar
    o ponto depende da posição comercial do grupo.
