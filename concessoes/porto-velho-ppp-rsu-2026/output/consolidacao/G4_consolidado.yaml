  descricao_breve: 'Prescrição das sanções: regra de processo paralisado e referência à ''administração pública estadual'''
  dispositivo_editalicio: Contrato cl. 26.28 e 26.28.1, iv (PDF p. 61)
  transcricao: '26.28: ''Incide a prescrição no procedimento administrativo paralisado por mais de 5 (cinco) anos''; 26.28.1, iv: ''tentativa de solução conciliatória no âmbito interno da administração
    pública estadual'''
  comentario: O contratante é o Município; a referência à administração estadual indica cláusula trazida de outro contexto. A cl. 26.28 regula apenas a prescrição do processo paralisado, com causas de interrupção
    próprias, enquanto a Lei 14.133 fixa prescrição de 5 anos contados da ciência da infração, interrompida pela instauração do processo de responsabilização.
  dispositivo_legal: art. 158, § 4.º, da Lei n.º 14.133/2021
