  transcricao: 'Edital 15.15.2: ''que se encontrarem na faixa de até 10% (dez por cento) acima da melhor proposta ou do melhor lance serão consideradas empatadas com a primeira colocada''; P7 (p. 31): ''Trata-se
    de rotina automática do ambiente eletrônico, que se aplicaria ainda que o Edital silenciasse'''
  comentario: Os benefícios dos arts. 42 a 49 da LC 123/2006 não se aplicam quando o valor estimado, ou o valor anual em contratos de mais de 1 ano, supera a receita bruta máxima de EPP. O valor anual é
    de R$ 78 milhões e o VE, de R$ 2,3 bilhões. O próprio 15.15.5 afasta a exclusividade e a cota 'dada a natureza e a dimensão do OBJETO', mas mantém o empate ficto e o prazo de regularização fiscal (13.22.3);
    o P7 sustenta que o empate ficto se aplicaria automaticamente.
