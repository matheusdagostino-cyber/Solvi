    5) e cl. 10.7 (p. 30)
  transcricao: 'P0 (p. 4): ''No âmbito do Chamamento Público nº 005/2025''; Edital 21.1: ''Termo de Autorização de Manifestação de Interesse Privado nº 005/2025''; Contrato 10.7: ''Procedimento de Manifestação
    de Interesse (PMI) nº 005/2025'''
  comentario: Os documentos designam o mesmo procedimento de três formas. O P7 o trata como Manifestação de Interesse Privado por apresentação direta (art. 28 da LC 592/2015, com redação da LC 918/2022,
    segundo o P7). O P0 fala em Chamamento Público, que pressupõe procedimento aberto a outros interessados. A distinção repercute na isonomia da fase de estudos e no fundamento do ressarcimento.
  dispositivo_legal: art. 81 da Lei n.º 14.133/2021; art. 21 da Lei n.º 8.987/1995; art. 28 da Lei Complementar Municipal n.º 592/2015 (conforme citado no P7)
