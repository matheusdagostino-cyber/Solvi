  transcricao: '''1 Publicação do EDITAL [•] ... 8 DATA DE ENVIO DOS ENVELOPES Nº 1, Nº 2 e Nº 3 [•]'''
  comentario: Com o cronograma em branco, não é possível aferir o prazo mínimo legal. O critério 'menor valor da contraprestação' não coincide com 'menor preço' ou 'maior desconto', o que pode atrair o
    prazo residual de 35 dias úteis (alínea d); se o regime for de contratação integrada, 60 dias úteis (alínea c); o de 25 dias úteis (alínea b) pressupõe menor preço ou maior desconto.
