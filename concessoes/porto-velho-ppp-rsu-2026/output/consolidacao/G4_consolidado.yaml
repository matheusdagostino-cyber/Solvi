  dispositivo_editalicio: Edital 8.5.1 (PDF p. 20) × 13.17.2 (p. 35); 13.4 e 13.5 (p. 32-33)
  transcricao: '8.5.1: ''ressalvada a comprovação do patrimônio líquido mínimo ou do capital social mínimo, que poderá ser atendida pelo somatório dos valores de cada consorciada''; 13.17.2: ''possuía capital
    social mínimo correspondente a R$ 23.119.276,28'''
  comentario: O 8.5.1 menciona PL mínimo ou capital social mínimo, mas o 13.17.2 exige apenas capital social. Fundos de investimento e entidades de previdência complementar, admitidos como licitantes, não
    têm capital social, e o Edital não indica o parâmetro equivalente (PL) para eles.
