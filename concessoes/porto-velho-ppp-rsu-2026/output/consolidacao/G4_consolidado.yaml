  dispositivo_editalicio: P1 IV.1 (PDF p. 30), p. 33, 40-42, 51 e 71; P4 Sumário (p. 6), I.3 (p. 8), III.4 (p. 13), V.4 (p. 25), VIII.2 e Tabela 14 (p. 34-35)
  transcricao: 'P1 (p. 30): ''uma superfície de 9.234 m²''; P4 (p. 13): ''A consolidação do diagnóstico (TABELA 40)''; P4 (p. 25): ''contratação por dispensa de licitação (art. 75, j, da Lei nº 14.133/2021)'';
    P4 (p. 34): ''As Fases 1 e 2 são condições pré-operacionais — devem ser concluídas antes da publicação do edital'''
  comentario: 'P1: área da sede em m² (a Tabela 1 indica 9.234 km² e 44,70 hab./km²); remissões a figuras trocadas (Figura 16 por 19, 21 por 27, 26 por 28, 28 por 39) e frase truncada na p. 71. P4: remissão
    à inexistente ''Tabela 40'' (a matriz é a Tabela 4); estrutura do item I.3 diferente do sumário; sumário que diz fornecer insumos aos ''Cadernos 2 a 7'', embora o P4 seja posterior a eles; Fase 2 do
    PES (M0 a M+3, ''processo licitatório'') declarada condição a concluir antes da publicação do edital; citação do art. 75, ''j'', sem o inciso IV, associada a cadastramento e capacitação de catadores,
    atividades que não constam da hipótese legal (coleta, processamento e comercialização de recicláveis por associações ou cooperativas de catadores).'
