- id_tmp: G4-061
  tema: HABILITACAO
  ids_origem:
  - E1-051
  tipo_achado: DEPENDE_DE_FATO
  categoria: restricao_competitividade
  descricao_breve: Quarentena de 12 meses para ex-servidores de qualquer órgão municipal
  dispositivo_editalicio: Edital 8.2, d (PDF p. 18)
  transcricao: '8.2, d: ''Cujo(s) dirigente(s), gerente(s), sócio(s) ou responsável(is) técnico(s) seja(m) ou tenha(m) sido, nos últimos 12 (doze) meses [...] servidor(es) [...] da Administração Pública
    Municipal direta ou indireta'''
  comentario: A Lei 14.133 veda a participação de agente público do órgão licitante e de quem tenha vínculo com dirigentes ou agentes da licitação, e remete à legislação sobre conflito de interesses as
    situações posteriores ao exercício do cargo. O Edital cria quarentena de 12 meses para ex-servidores de qualquer órgão municipal, alcançando inclusive responsáveis técnicos, sem indicar a norma local
    que a fundamenta.
  dispositivo_legal: art. 9.º, § 1.º, e art. 14, inciso IV, da Lei n.º 14.133/2021; não localizei fundamento normativo específico para a quarentena na legislação federal
  depende_de: Verificar se a Lei Orgânica ou o estatuto dos servidores de Porto Velho preveem a quarentena.
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G4-062
  tema: HABILITACAO
  ids_origem:
  - E1-052
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Vedação aos autores dos estudos (8.2, l) e a seus vinculados nesta PPP (8.2, m)
  dispositivo_editalicio: Edital 8.2, alíneas l e m (PDF p. 19); Edital 2.1, e (p. 10); P7 X.1 (p. 66)
  transcricao: '8.2: ''l) Que tenham elaborado os estudos que serviram de base para a estruturação da presente PPP; ou m) Que possuam, com a pessoa jurídica a que se refere a alínea (l), acima, vínculo
    de natureza técnica, comercial, econômica, financeira ou trabalhista relacionado à avaliação da PPP e/ou à formulação de proposta nesta LICITAÇÃO.'''
  comentario: 'O art. 3.º da Lei 11.079 manda aplicar às concessões administrativas o art. 31 da Lei 9.074/1995, que admite a participação, direta ou indireta, dos autores ou responsáveis economicamente
    pelos projetos básico ou executivo na licitação. A alínea l veda a participação de quem elaborou os estudos que serviram de base à PPP. A alínea m estende a vedação a quem tenha com os autores vínculo
    técnico, comercial, econômico, financeiro ou trabalhista ''relacionado à avaliação da PPP e/ou à formulação de proposta nesta LICITAÇÃO'': o alcance fica restrito a vínculos ligados a esta PPP e a esta
    licitação, mas ''avaliação da PPP'' e ''formulação de proposta'' não são definidas. O Edital inclui a Lei 9.074 em sua base normativa (2.1, e), e o P7 invoca o art. 31 para justificar o ressarcimento.
    Contra-argumento provável: art. 14, incisos I e II, da Lei 14.133 (vedação aos autores de anteprojeto e projetos) e o princípio da moralidade.'
  dispositivo_legal: art. 3.º, caput, da Lei n.º 11.079/2004 c/c art. 31 da Lei n.º 9.074/1995; art. 14, incisos I e II, e art. 186 da Lei n.º 14.133/2021 (contraponto)
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: DECISAO_COMERCIAL
  nota_reserva: Depende de o grupo manter ou ter mantido vínculo com PEZCO, PSP Hub, Masterpro ou Apparecido & Carvalho Pinto Advogados alcançável pela alínea m, e do interesse em ampliar ou não o universo
    de licitantes.
