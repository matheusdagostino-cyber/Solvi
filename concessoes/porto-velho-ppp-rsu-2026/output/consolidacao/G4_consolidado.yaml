  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Plano de Trabalho (P0) sem o cronograma detalhado exigido e com inconsistências internas
  dispositivo_editalicio: P0 índice (PDF p. 2), I.2 (p. 4), I.4 (p. 6), IV.1 (p. 26-27), Quadro 2 (p. 28), IV.2.3 e Quadro 5 (p. 31)
  transcricao: 'P0 (p. 26): ''Fase 3 – Modelagens e Estudos Setoriais (até x dias)''; P0 (p. 31): ''cronograma estratégico de 90 dias corridos [...] QUADRO 5 - FLUXO DE ESTRUTURAÇÃO DO PROJETO Prazo (D+240)
    Produto Objetivo e atividade D0–DX X X X'''
  comentario: O Termo de Autorização exigia cronograma detalhado em 15 dias (compromisso ii, P0 p. 4). O P0 traz 'até x dias', marcos 'xxxx' e 'Cadernos x e x', Quadro 2 com kick-off 'TBD' e sem datas para
    as entregas, e Quadro 5 vazio. O item IV.2.3 fala em cronograma de 90 dias, contra 240 dias no restante; o índice e o item I.4 anunciam capítulos V e VI que não existem; o índice remete ao 'Quadro 7'
    na p. 20, que é o Quadro 6 na p. 33. O P0 não permite aferir marcos nem entregas intermediárias.
  dispositivo_legal: 'Termo de Autorização n.º 005/2025, compromisso (ii) (fato documental: P0, p. 4); não localizei fundamento normativo específico além do próprio Termo'
