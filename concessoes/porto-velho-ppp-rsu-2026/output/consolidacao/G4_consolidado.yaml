  categoria: ilegalidade
  descricao_breve: Cláusula de 'decadência' e de renúncia a reclamações posteriores
  dispositivo_editalicio: Edital 7.5 e 7.6 (PDF p. 17); Edital 2.12 (p. 12); Anexo C, Declaração 7 (p. 13-14)
  transcricao: 'Edital 7.6: ''Sob pena de decadência, eventual impugnação ao EDITAL deverá ser protocolada''; 7.5: ''não restando direito às LICITANTES para qualquer reclamação ulterior'''
  comentario: A Lei 14.133 fixa prazo para impugnar, mas não estabelece decadência do direito de questionar a legalidade do edital, e assegura a qualquer licitante representação aos órgãos de controle e
    ao tribunal de contas. A cláusula de renúncia (7.5) pode ser oposta a impugnações, representações ou pleitos posteriores.
  dispositivo_legal: art. 164 e art. 170, § 4.º, da Lei n.º 14.133/2021; art. 5.º, inciso XXXV, da Constituição Federal
