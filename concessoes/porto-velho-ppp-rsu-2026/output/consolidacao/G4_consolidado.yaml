  categoria: restricao_competitividade
  descricao_breve: Rating mínimo do banco fiador sem previsão legal e sem equivalente para seguradoras
  dispositivo_editalicio: Edital 11.13, b e c (PDF p. 28); P7 V.7 (p. 42)
  transcricao: '11.13, c: ''com classificação de força financeira em escala nacional superior ou igual a "Aa2.br", "brAA" ou "A(bra)"'''
  comentario: 'A lei exige apenas fiança emitida por banco ou instituição financeira autorizada a operar no País pelo Banco Central. O rating mínimo restringe as instituições aceitas e não tem equivalente
    para as seguradoras (11.13, b). Contra-argumento provável: o P7 (p. 42) invoca precedente do TCU — citação do próprio estudo, não verificada; busca jurisprudencial fica para a Fase 2 — para exigência análoga de grau de
    investimento das seguradoras na garantia de execução.'
  dispositivo_legal: art. 96, § 1.º, inciso III, da Lei n.º 14.133/2021; não localizei fundamento normativo específico para o rating
