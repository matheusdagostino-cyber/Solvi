  tipo_achado: IRREGULAR
  categoria: erro_material
  descricao_breve: 'Contrato: remissões internas quebradas (Cláusula 19ª, item 16.2, ''Anexo VII'', ''subitem II'')'
  dispositivo_editalicio: Contrato cl. 4.6 (PDF p. 13), 10.2.37.1 (p. 27), 15.8.1 (p. 39), 20.1 (p. 46) e 23.3 (p. 53)
  transcricao: '4.6: ''fato do príncipe, nos termos da Cláusula 19ª''; 10.2.37.1: ''nas hipóteses e nos limites previstos na Cláusula 19ª''; 15.8.1: ''Na hipótese de extinção do referido índice, aplicar-se-á
    o disposto no item 16.2''; 20.1: ''ANEXO VII – MATRIZ DE RISCOS''; 23.3: ''A estrutura de garantias vinculadas ao FPM estipulada no subitem II'''
  comentario: (i) A Cláusula 19ª só remete à Matriz; o fato do príncipe está na 20ª, e não há, na 19ª, hipóteses ou limites para suspender a medição do IQD e as penalidades em caso de greve, que ficam sem
    regra. (ii) O item 16.2 trata da relação entre reajuste e reequilíbrio; o Contrato não define índice substituto do IPCA (a pluralidade de índices fica em REMUNERACAO_REAJUSTE, E3-061). (iii) A Matriz
    de Riscos é o Anexo V; o Anexo VII é o TR do Verificador Independente. (iv) A vinculação do FPM está no inciso III do 23.2; o inciso II trata da constituição da Conta Garantia.
  dispositivo_legal: art. 92, incisos V, IX e XIV, da Lei n.º 14.133/2021; art. 8.º da Lei n.º 11.079/2004
