- id_tmp: G4-024
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E1-019
  - E3-006
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Regras de prevalência conflitantes: Edital prevalece (2.13.1) × Contrato prevalece (cl. 1.2)'
  dispositivo_editalicio: Edital 2.11.2, 2.13, 2.13.1 e 2.14 (PDF p. 12); Contrato cl. 1.2 (p. 6)
  transcricao: 'Edital 2.13.1: ''Nos casos de divergência entre as disposições do EDITAL e as disposições dos ANEXOS, prevalecerão as disposições do EDITAL''; Contrato 1.2: ''Nos casos de divergência entre
    as disposições do Contrato e as disposições dos Editais e seus Anexos, prevalecerão as disposições do Contrato e seus Anexos'''
  comentario: O Contrato é o Anexo B do Edital. O Edital manda prevalecer o Edital sobre os anexos (ressalvadas as matérias remetidas aos anexos); o Contrato manda prevalecer o Contrato sobre o Edital;
    o item 2.11.2 cria regra própria para o EVTEA; e o 2.13.1 resolve divergências entre anexos pela data. São ao menos três critérios incompatíveis, aplicáveis às divergências Edital × Contrato apontadas
    nos demais grupos (Ordem de Início, Licença Prévia, prorrogação, garantia de execução).
  dispositivo_legal: art. 5.º e art. 92, inciso II, da Lei n.º 14.133/2021; art. 18, inciso XIV, da Lei n.º 8.987/1995, c/c art. 11, caput, da Lei n.º 11.079/2004
