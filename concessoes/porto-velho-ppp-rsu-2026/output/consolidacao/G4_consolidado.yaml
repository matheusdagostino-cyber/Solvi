- id_tmp: G4-083
  tema: HABILITACAO
  ids_origem:
  - E1-101
  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Exigência de 12 meses de execução 'contínua e ininterrupta'
  dispositivo_editalicio: Edital 13.23.1.1 (PDF p. 37)
  transcricao: '13.23.1.1: ''Corresponder a, no mínimo, 12 (doze) meses de execução contínua e ininterrupta das atividades comprovadas'''
  comentario: Para serviços contínuos, a lei admite exigir prazo mínimo de experiência 'em períodos sucessivos ou não'. A exigência de execução contínua e ininterrupta afasta a soma de períodos. A regra
    também se aplica a todas as atividades, inclusive obras, que não são serviço contínuo.
  dispositivo_legal: art. 67, § 5.º, da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G4-084
  tema: HABILITACAO
  ids_origem:
  - E1-102
  - E7-059
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Somatório limitado a 2 atestados, contra a orientação do TCE-RO relatada no P7
  dispositivo_editalicio: Edital 13.23.2 (PDF p. 37) × P7 III.4.6 (p. 31)
  transcricao: 'Edital 13.23.2: ''É permitido o somatório de até 02 (dois) atestados da LICITANTE ou das CONSORCIADAS para fins de comprovação do quantitativo mínimo''; P7 (p. 31): ''Em atenção à orientação
    do Tribunal de Contas do Estado de Rondônia, externada no curso do processo de anulação do certame anterior, o Edital admite expressamente o somatório de atestados, inclusive os relativos a contratos
    executados de forma concomitante'''
  comentario: O P7 afirma que o Edital admite o somatório de atestados, inclusive de contratos concomitantes, por orientação do TCE-RO no processo de anulação. O Edital limita o somatório a dois atestados,
    sem justificativa, e não menciona contratos concomitantes. A orientação do TCE-RO é referida como fato documental (P7, p. 31); seu teor exato depende dos acórdãos.
  dispositivo_legal: 'art. 9.º, inciso I, alínea a, art. 15, inciso III, e art. 67, inciso II e § 1.º, da Lei n.º 14.133/2021; art. 37, inciso XXI, da Constituição Federal; orientação do TCE-RO no Processo
    00421/2022 (fato documental: P7, p. 31)'
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: DECISAO_COMERCIAL
  nota_reserva: O limite favorece quem tem poucos atestados de grande porte; levantar ou não depende do acervo do grupo e dos concorrentes.
- id_tmp: G4-085
  tema: HABILITACAO
  ids_origem:
  - E1-103
  tipo_achado: IRREGULAR
  categoria: restricao_competitividade
  descricao_breve: Participação mínima de 25% no consórcio para o consorciado que apresenta os atestados
  dispositivo_editalicio: Edital 13.23.2.1 (PDF p. 37)
  transcricao: '13.23.2.1: ''o CONSORCIADO responsável pela apresentação dos atestados deverá possuir, no mínimo, 25% (vinte e cinco por cento) de participação no CONSÓRCIO'''
  comentario: A lei admite o somatório dos quantitativos de cada consorciado para a habilitação técnica, sem participação mínima. O Edital não justifica o piso de 25%, que impede o operador técnico de entrar
    com participação minoritária e afeta consórcios com investidores financeiros.
  dispositivo_legal: art. 15, inciso III, da Lei n.º 14.133/2021; não localizei fundamento normativo específico para o piso
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: DECISAO_COMERCIAL
  nota_reserva: O efeito depende de o grupo pretender liderar o consórcio ou entrar como operador minoritário.
- id_tmp: G4-086
  tema: HABILITACAO
  ids_origem:
  - E1-104
  tipo_achado: IRREGULAR
  categoria: restricao_competitividade
  descricao_breve: Atestado de empresa do grupo reduzido pela proporção da participação societária
  dispositivo_editalicio: Edital 13.25 e 13.25.2 (PDF p. 37)
  transcricao: '13.25.2: ''será observada a proporção de participação da LICITANTE, CONSORCIADA ou CONTROLADORA dessas na entidade titular do atestado, aplicando-se essa proporção ao quantitativo total
    indicado no atestado'''
  comentario: 'O Edital admite atestados de controladas e controladoras, mas reduz o quantitativo pela proporção societária: a controladora com 51% de uma controlada aproveita só 51% da experiência dela.
    A lei prevê proporcionalidade apenas para atestado de consórcio homogêneo que não identifique as atividades de cada consorciado.'
  dispositivo_legal: art. 67, § 10, da Lei n.º 14.133/2021 (por contraste); não localizei fundamento normativo específico
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: DECISAO_COMERCIAL
  nota_reserva: O efeito depende da estrutura societária das empresas do grupo titulares dos atestados.
- id_tmp: G4-087
  tema: HABILITACAO
  ids_origem:
  - E1-105
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Capacidade técnico-profissional substitui integralmente a técnico-operacional (13.30)
  dispositivo_editalicio: Edital 13.30 (PDF p. 39) e 20.1.9-20.1.10 (p. 49)
  transcricao: '13.30: ''Alternativamente à comprovação aludida no item 13.23, a LICITANTE individual ou ao menos uma das CONSORCIADAS poderão demonstrar [...] que possuem em seu quadro permanente profissional(is)
    com expertise''; alínea d: ''Por meio de intenção ou contrato de prestação de serviços [...] em caso de êxito da LICITANTE'''
  comentario: O 13.30 permite trocar toda a comprovação técnico-operacional (13.23) por atestados de profissionais, sem quantitativos, sem registro em conselho e com remissão errada às alíneas (a) a (h)
    do 13.27. O item fala em 'quadro permanente', mas a alínea d aceita profissional contratado só em caso de êxito. Quem usa a alternativa fica dispensado dos 12 meses, do somatório e dos 25% dos itens
    13.23.1 a 13.23.2.1. Em obras e serviços de engenharia, o profissional deve ser registrado no conselho e deter atestado de responsabilidade técnica.
  dispositivo_legal: art. 67, incisos I e II, e §§ 1.º e 3.º, e art. 5.º da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: DECISAO_COMERCIAL
  nota_reserva: A alternativa amplia a competição; impugná-la pode eliminar concorrentes sem acervo operacional, mas expõe o grupo ao argumento de restrição.
- id_tmp: G4-088
  tema: HABILITACAO
  ids_origem:
  - E1-094
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Habilitação sem registro no CREA/CAU nem atestado com CAT, apesar das obras de engenharia
  dispositivo_editalicio: Edital 13.23-13.30 (PDF p. 36-39) × 20.1.7 (p. 49)
  transcricao: '20.1.7: ''pela Certidão de Registro do LICITANTE no CREA/CAU, desde que nesta Certidão conste o nome do(s) profissional(is), na condição de responsável(is) técnico(s)'''
  comentario: O objeto inclui obras e serviços de engenharia (CTR, aterro, ETRs, remediação, recuperação do Jirau). A habilitação técnica não exige registro da empresa no conselho profissional, atestados
    registrados no conselho nem profissional com CAT; o vínculo com profissional registrado só é cobrado como condição para assinar o contrato (20.1.7).
  dispositivo_legal: art. 67, incisos I, II e V, e § 3.º, da Lei n.º 14.133/2021; art. 59 da Lei n.º 5.194/1966
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: DECISAO_COMERCIAL
  nota_reserva: Pedir exigências mais rígidas pode eliminar concorrentes sem acervo de engenharia registrado; depende da posição do grupo.
- id_tmp: G4-089
  tema: HABILITACAO
  ids_origem:
  - E1-095
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Condição precedente menciona 'empresa subcontratada' que a habilitação não prevê
  dispositivo_editalicio: Edital 20.1.9 e 20.1.10 (PDF p. 49) × 13.30 (p. 39)
  transcricao: '20.1.9: ''sua relação jurídica com o(s) profissional(is) e/ou com a empresa subcontratada anteriormente indicados nas atestações apresentadas no âmbito daqueles itens'''
  comentario: Os itens 20.1.9 e 20.1.10 tratam de atestados de 'empresa subcontratada' indicados no âmbito do item 13.30, que só admite profissionais. A qualificação por atestados de potencial subcontratado
    depende de previsão expressa no edital e é limitada a 25% do objeto.
  dispositivo_legal: art. 67, § 9.º, da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G4-090
  tema: HABILITACAO
  ids_origem:
  - E1-108
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Regra de cálculo de 'indicadores' para consórcio sem índices definidos no Edital
  dispositivo_editalicio: Edital 13.18.1 (PDF p. 35)
  transcricao: '13.18.1: ''é permitido que o cálculo dos indicadores seja realizado a partir do somatório dos valores constantes das contas contábeis de cada consorciado, mas não é permitido o somatório
    de índices'''
  comentario: O Edital não exige índices contábeis (liquidez, endividamento, solvência), mas o 13.18.1 regula seu cálculo para consórcios. A regra pode servir de base para exigências não previstas ou indicar
    índices suprimidos de versão anterior. A ausência de índices, em si, não é irregular, pois a lei remete aos índices previstos no edital.
  dispositivo_legal: art. 69, caput, inciso I, e § 5.º, da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
