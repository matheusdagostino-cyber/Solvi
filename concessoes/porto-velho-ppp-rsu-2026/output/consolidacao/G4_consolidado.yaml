  descricao_breve: 'Edital: numeração duplicada, remissões erradas e texto legal transposto sem adaptação'
  dispositivo_editalicio: Edital 1.1.29 (PDF p. 8), 3.1-3.2 (p. 12-14), 6.3, v (p. 16), 8.1.1 (p. 17-18), 8.4 (p. 19), 13.17.2 (p. 35), 13.23.1.3, 13.25.1 (p. 37), 13.30 (p. 39), 18.9-18.10 (p. 47), 19.5,
    d (p. 48), 20.1.1 e 20.1.3 (p. 48-49), 22.2.4 (p. 51), 22.4, e, e 22.5 (p. 52)
  transcricao: '8.1.1 (p. 17): ''A participação depende de credenciamento prévio''; 8.1.1 (p. 18): ''As licitantes estrangeiras deverão, como condição de participação''; 22.4, e: ''quanto ao cumprimento
    dos requisitos definidos neste artigo''; 13.30: ''indicadas nas alíneas (a) a (h) do item 13.27'''
  comentario: '(i) Numeração: 3.2 antes de 3.1.3 e 3.2.1 depois de 3.1.5; dois itens 8.1.1, o segundo repetido no 8.4; capital social mínimo numerado como 13.17.2 dentro do item sobre SPED; 18.10 repete
    18.9; 20.1.3 repete 20.1.1. (ii) Remissões: o 6.3, v, remete à ''alínea (d)'' em lista numerada em romanos; o 13.25.1 remete a 13.23 ao tratar de atestados de controladas (13.25); o 13.30 remete às
    alíneas (a) a (h) do 13.27 como atividades técnicas, mas elas listam informações do atestado; o 13.23.1.3 remete à ''Cláusula 1''. (iii) Redação: 22.4, e, e 22.5 reproduzem o art. 163 da Lei 14.133
    com ''neste artigo'' e ''desta Lei''; 19.5, d, e 22.2.4 terminam em vírgula; 1.1.29 e 3.1 trazem ''proposta de menor valor da contraprestação para a proposta para a execução''. A remissão do 13.30 tem
    efeito sobre a habilitação técnica (G4-087).'
  dispositivo_legal: não localizei fundamento normativo específico; repercute no art. 5.º da Lei n.º 14.133/2021 (vinculação ao edital e julgamento objetivo)
