  descricao_breve: 'Balanço de abertura: ''menos de 1 ano'' (13.16.4) × ''constituída no exercício'' (13.16)'
  dispositivo_editalicio: Edital 13.16 (PDF p. 34) × 13.16.4 (p. 35)
  transcricao: '13.16.4: ''Em se tratando de LICITANTE constituída há menos de 01 (um) ano, deverá ser apresentado, em substituição ao balanço patrimonial, o balanço de abertura.'''
  comentario: O 13.16, conforme a lei, admite o balanço de abertura para empresas constituídas no mesmo exercício da licitação e o último exercício para as constituídas há menos de 2 anos. O 13.16.4 usa
    o critério de 'menos de 1 ano', que diverge quando a empresa foi constituída no exercício anterior e já tem balanço encerrado.
  dispositivo_legal: art. 65, § 1.º, e art. 69, § 6.º, da Lei n.º 14.133/2021
