- id_tmp: G4-037
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E1-088
  - E1-089
  tipo_achado: IRREGULAR
  categoria: risco_economico
  descricao_breve: Multas da licitação sobre o VE nominal de 30 anos; piso de R$ 11,56 mi para infração formal
  dispositivo_editalicio: Edital 19.5, b (PDF p. 47-48), 22.2.2 e 22.2.2.1 (p. 51)
  transcricao: '19.5, b: ''Multa de, no mínimo, 0,5% (meio por cento) e, no máximo, 30% (trinta por cento) do VALOR ESTIMADO DO CONTRATO, assim entendido o somatório das Contraprestações Mensais Máximas
    ao longo de todo o prazo da Concessão''; 22.2.2.1: ''de 0,5% (meio por cento) a 15% (quinze por cento) para as infrações de caráter formal ou procedimental, praticadas no curso da LICITAÇÃO'''
  comentario: 'Os percentuais estão na faixa legal de 0,5% a 30% do valor do contrato licitado. A base adotada é o VE nominal de 30 anos (R$ 2.311.927.627,53), o que resulta em multas de R$ 11,56 milhões
    a R$ 693,58 milhões por condutas da fase licitatória e em faixa de R$ 11,56 milhões a R$ 346,79 milhões para infrações ''formais ou procedimentais'' (por exemplo, deixar de entregar documento exigido).
    A garantia de proposta que cobre essas condutas é de R$ 23,1 milhões. O VE adotado diverge da definição do próprio Edital (E1-078 e E4-005, MODELAGEM_ECONOMICA). Contra-argumento provável: a lei autoriza
    a base ''valor do contrato licitado'' e o Edital gradua a multa pela natureza da infração.'
  dispositivo_legal: art. 155, inciso IV, e art. 156, §§ 1.º e 3.º, da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
