  descricao_breve: 'Garantia de proposta: exclusão de títulos da dívida pública e de título de capitalização'
  dispositivo_editalicio: Edital 11.13, a a c (PDF p. 28); Contrato cl. 9.5 (p. 21) e 22.2 (p. 51)
  transcricao: '11.13: ''A GARANTIA DE PROPOSTA deverá ser apresentada em uma das seguintes modalidades: a) Caução em dinheiro [...] b) Seguro-garantia [...] c) Fiança bancária'''
  comentario: A garantia de proposta pode ser prestada nas modalidades do art. 96, § 1.º, e a escolha cabe ao particular. O Edital exclui a caução em títulos da dívida pública e o título de capitalização
    (inciso IV, incluído pela Lei 14.770/2023). O próprio Contrato admite títulos e título de capitalização para a garantia de execução (cl. 9.5).
  dispositivo_legal: art. 58, § 4.º, c/c art. 96, § 1.º, incisos I e IV, da Lei n.º 14.133/2021
