  descricao_breve: Recusa de responder pedidos formulados fora do modelo ou do formato '.doc'
  dispositivo_editalicio: Edital 7.1, 7.1.1 e 7.2 (PDF p. 16); Anexo C, Modelo B (p. 4)
  transcricao: 'Edital 7.2: ''O PODER CONCEDENTE não responderá a questões que tenham sido formuladas em desconformidade com o disposto neste EDITAL''; 7.1: ''por qualquer outro meio ou formato que não
    o'''
  comentario: A lei confere a qualquer pessoa legitimidade para impugnar o edital ou pedir esclarecimento, sem condicionar o pedido a modelo ou formato de arquivo. O Edital exige o Modelo B, arquivo editável
    '.doc' e identificação completa, afasta 'qualquer outro meio ou formato' e, no 7.1.1, isenta a Comissão de falhas no envio ou recebimento dos pedidos.
  dispositivo_legal: art. 164, caput e parágrafo único, da Lei n.º 14.133/2021
