  transcricao: 'P0 (p. 3): ''A autorização fixou o prazo de 240 (duzentos e quarenta) dias corridos para a entrega integral dos estudos''; P0 (p. 26): ''contados a partir da publicação do Termo de Autorização
    em 25 de setembro de 2025'''
  comentario: Contados de 25/09/2025, os 240 dias terminaram em 23/05/2026. O P6 tem 1.ª versão de 26/05/2026; P1 a P4 e os anexos têm revisões de agosto e setembro de 2026; o P7 e o Edital são de setembro
