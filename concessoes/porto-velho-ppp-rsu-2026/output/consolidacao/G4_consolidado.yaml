  descricao_breve: Compromisso de consórcio chamado de compromisso de SPE; modelo do Anexo C incompleto
  dispositivo_editalicio: Edital 8.5.2 (PDF p. 20), 11.2, c, e 11.2.1 (p. 27); Anexo C, Declarações 11 e 12 (p. 17-19)
  transcricao: '8.5.2: ''Deverá ser apresentado, no ENVELOPE Nº 1, o termo de compromisso de constituição de SPE, conforme modelo constante do ANEXO C [...] contendo, no mínimo: a) Denominação do CONSÓRCIO;
    b) Composição do CONSÓRCIO'''
  comentario: O Edital chama de 'termo de compromisso de constituição de SPE' o instrumento cujo conteúdo é o compromisso de consórcio (denominação, composição, percentuais, líder, solidariedade). Os modelos
    11 e 12 do Anexo C são declarações unilaterais de constituir SPE, assinadas por 'LICITANTE ou CONSORCIADA', sem nenhum desses elementos nem a outorga de poderes à líder prevista no 11.2.1.
  dispositivo_legal: art. 15, incisos I e II, da Lei n.º 14.133/2021; art. 9.º da Lei n.º 11.079/2004
