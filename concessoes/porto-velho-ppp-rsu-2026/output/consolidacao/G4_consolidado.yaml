  dispositivo_editalicio: 'Capas: Edital, Contrato, Anexo V e Anexo VI (2.ª versão, 08/09/2026); Anexo A (1.ª revisão, 11/09/2026); Anexo C (2.ª versão, 11/09/2026); Anexo III (1.ª revisão, 10/09/2026);
    Anexo D (1.ª versão, 01/09/2026); Anexos IV e VII (2.ª versão, 21/08/2026); P2 (p. 1); P6 (1.ª versão, 26/05/2026); P7 (2.ª versão, 11/09/2026); P7 XII.4 (p. 72); Anexo V, EF-02 e EF-03 (p. 29-30)'
  transcricao: 'P2 (p. 1): ''1ª VERSÃO: SÃO PAULO, 30 DE MARÇO DE 2026 / 1ª REVISÃO: SÃO PAULO, 02 DE MARÇO DE 2026 [...] 3ª REVISÃO, SÃO PAULO, 01 DE SETEMRBO DE 2026''; Anexo V (p. 29): ''[página 50 do
    P6]'''
  comentario: O Caderno de Encargos, o Anexo C e o Anexo III têm revisões posteriores à 2.ª versão do Edital. O P7, que fundamenta juridicamente as minutas, é posterior a elas e registra pendências que,
    segundo ele, devem ser resolvidas antes da publicação (datas da consulta e da audiência, dotação, Convenção 169). No P2, a 1.ª revisão (02/03/2026) é anterior à 1.ª versão (30/03/2026). O P6 permanece
    na 1.ª versão de 26/05/2026, anterior às revisões de P1 a P4 e dos anexos (a desatualização da modelagem fica em MODELAGEM_ECONOMICA, E4-001). A Matriz remete à 'página 50 do P6' para a CAPAG, que está
    nas p. 58-59 da versão juntada, e à 'página 22' para combustíveis, que estão na p. 23. O pacote não indica qual versão de cada documento foi submetida à consulta pública nem qual será publicada.
  dispositivo_legal: art. 5.º e art. 55, § 1.º, da Lei n.º 14.133/2021; art. 10, inciso VI, da Lei n.º 11.079/2004
