- id_tmp: G4-080
  tema: HABILITACAO
  ids_origem:
  - E1-098
  tipo_achado: IRREGULAR
  categoria: restricao_competitividade
  descricao_breve: Atestado exigido sobre o objeto integral, 'precedido de obra pública'
  dispositivo_editalicio: Edital 13.23 (PDF p. 36)
  transcricao: '13.23: ''sua expertise [...] na PRESTAÇÃO DOS SERVIÇOS PÚBLICOS DE COLETA, MANEJO, TRANSPORTE E DESTINAÇÃO FINAL DE RESÍDUOS SÓLIDOS URBANOS, PRECEDIDOS DE OBRA PÚBLICA'''
  comentario: A redação exige experiência no objeto integral, inclusive como serviço 'precedido de obra pública'. Lida literalmente, só aceita quem já executou concessão ou contrato integrado de RSU com
    obra, o que contraria a restrição dos atestados às parcelas de maior relevância, invocada pelo próprio 13.23.1.2.
  dispositivo_legal: art. 67, § 1.º, e art. 9.º, inciso I, alínea a, da Lei n.º 14.133/2021; art. 37, inciso XXI, da Constituição Federal
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: DECISAO_COMERCIAL
  nota_reserva: A leitura literal favorece quem já detém atestados de concessão de RSU com obra; levantar ou não depende dos atestados do grupo e dos concorrentes.
- id_tmp: G4-081
  tema: HABILITACAO
  ids_origem:
  - E1-099
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Parcelas de maior relevância e quantitativos mínimos não definidos em nenhum anexo
  dispositivo_editalicio: Edital 13.23.1.2 (PDF p. 37); Anexos A, B, D, III, V e VII e estudos P2, P3, P6 e P7 (sem definição)
  transcricao: '13.23.1.2: ''restrita às parcelas de maior relevância do objeto, nos quantitativos mínimos previstos nos Anexos do Edital'''
  comentario: O Edital remete aos 'quantitativos mínimos previstos nos Anexos', mas nem o Edital nem os anexos ou estudos definem as parcelas de maior relevância (valor individual de pelo menos 4% do total)
    ou quantitativos, como toneladas coletadas por mês, toneladas por dia em aterro ou capacidade de triagem (busca por 'maior relevância' sem resultado fora do Edital). Sem esse parâmetro, o julgamento
    da habilitação técnica não é objetivo. Para referência, 4% do VE equivalem a R$ 92,48 milhões, e os quantitativos não podem exceder 50% das parcelas.
  dispositivo_legal: art. 67, §§ 1.º e 2.º, da Lei n.º 14.133/2021; art. 18, inciso V, da Lei n.º 8.987/1995, c/c art. 11, caput, da Lei n.º 11.079/2004
  flag_tecnico: true
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G4-082
  tema: HABILITACAO
  ids_origem:
