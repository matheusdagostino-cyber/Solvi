  categoria: contradicao
  descricao_breve: Dupla numeração de anexos (A-D do Edital e I-VII do Contrato), circular e incompleta
  dispositivo_editalicio: Edital 2.8 e 2.9 (PDF p. 11), 2.14 (p. 12) e 15.8.3.4 (p. 41); Contrato cl. 2.1 (p. 11)
  transcricao: 'Edital 2.8/2.9: ''Anexo A Caderno de encargos / Anexo B Contrato e anexos / Anexo C [...] / Anexo D [...] — Anexo I Edital, anexos e esclarecimentos [...] Anexo VII Termo de referência para
    a contratação do verificador independente'''
  comentario: O Edital tem os Anexos A a D, e o Contrato (Anexo B) tem os Anexos I a VII. O Anexo I do Contrato é o próprio Edital, o que torna a remissão circular. Caderno de Encargos e Indicadores (Anexos
    A e D) só integram o Contrato por meio do Anexo I, e os Anexos III a VII só integram o Edital dentro de 'Contrato e anexos'. O texto alterna numerações ('ANEXO V – Matriz de riscos', 'Anexo de Diretrizes
    Ambientais'), o que se soma às remissões erradas do Contrato (G4-042) e do TR do Verificador (G4-040).
