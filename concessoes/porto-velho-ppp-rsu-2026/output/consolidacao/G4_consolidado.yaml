  descricao_breve: 'Prazo para assinatura: 45 dias no cronograma × 30 dias no item 19.2'
  dispositivo_editalicio: Edital 19.2 e 19.3 (PDF p. 47) × 23.1, evento 18 (p. 53)
  transcricao: '19.2: ''no prazo de até 30 (trinta) dias corridos, contados da publicação da convocação''; 23.1, evento 18: ''Convocação pelo PODER CONCEDENTE para assinatura do CONTRATO — 45 (quarenta
    e cinco) dias corridos, prorrogáveis por 30 (trinta) dias'''
  comentario: O item 19.2 fixa até 30 dias corridos, prorrogáveis por 30, para a adjudicatária apresentar os documentos de assinatura; o cronograma fixa 45 dias corridos, prorrogáveis por 30. O prazo condiciona
    a constituição da SPE, a subscrição e integralização do capital, a garantia de execução, os seguros e o ressarcimento dos estudos (item 20). Com seguro-garantia, a lei exige prazo mínimo de 1 mês entre
    a homologação e a assinatura para a prestação da garantia.
  dispositivo_legal: art. 90, caput e § 1.º, e art. 96, § 3.º, da Lei n.º 14.133/2021
