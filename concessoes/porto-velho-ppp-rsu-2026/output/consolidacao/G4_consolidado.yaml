- id_tmp: G4-091
  tema: HABILITACAO
  ids_origem:
  - E1-109
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Certidão negativa de recuperação judicial exigida, embora o Edital admita empresas em recuperação
  dispositivo_editalicio: Edital 13.10 (PDF p. 33) × 13.13 (p. 34) e 8.2, g (p. 18)
  transcricao: '13.10: ''deverá ser apresentada certidão negativa de pedido de falência e recuperação judicial''; 13.13: ''Será permitida a participação de empresas em recuperação judicial e extrajudicial
    se comprovada, respectivamente, a aprovação ou a homologação do plano'''
  comentario: A lei exige só certidão negativa de falência. O 13.10 pede também certidão negativa de recuperação judicial, enquanto o 13.13 e o 8.2, g, admitem empresas em recuperação com plano aprovado
    ou homologado, que não conseguem apresentar a certidão negativa exigida.
  dispositivo_legal: art. 69, inciso II, da Lei n.º 14.133/2021
