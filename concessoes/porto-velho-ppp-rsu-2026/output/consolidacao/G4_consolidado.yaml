  dispositivo_editalicio: Edital 15.20 (PDF p. 44) × 16.1 (p. 44-45) e 18.2.2 (p. 46)
  transcricao: '15.20: ''Julgados os recursos, ou decorrido o prazo para a sua interposição, a COMISSÃO encaminhará o Relatório de Julgamento ao PODER CONCEDENTE, para as providências de homologação e adjudicação
    previstas no EDITAL.'''
  comentario: O item 15.20, no capítulo da sessão de propostas, manda encaminhar o relatório para homologação e adjudicação após os recursos contra a classificação, antes da abertura do Envelope 3 (item
    16). O 18.2.2 prevê fase recursal única após a habilitação. A sequência fica indefinida e admite leitura de homologação sem habilitação.
  dispositivo_legal: art. 17, incisos V a VII, art. 71 e art. 165, § 1.º, inciso II, da Lei n.º 14.133/2021; art. 13, incisos I a IV, da Lei n.º 11.079/2004
