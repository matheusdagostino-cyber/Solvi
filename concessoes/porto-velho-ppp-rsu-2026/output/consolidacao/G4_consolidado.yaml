  descricao_breve: 'Via da rescisão por iniciativa da Concessionária: arbitral × judicial × administrativa'
  dispositivo_editalicio: Contrato cl. 15.8.6 (PDF p. 40), 32.1 e 32.2 (p. 68), 32.7 (p. 69) e 40.1 (p. 77)
  transcricao: '32.1: ''por iniciativa da Concessionária mediante procedimento arbitral movido especialmente para esse fim''; 15.8.6: ''sem prejuízo do direito à rescisão judicial do Contrato''; 32.7: ''mediante
    procedimento arbitral ou ação judicial'''
  comentario: A cl. 32.1 define a arbitragem como via da rescisão por iniciativa da Concessionária; a 15.8.6 menciona rescisão judicial; a 32.2 fala em processo administrativo, mecanismos de resolução de
    conflitos ou ação; a 32.7, em arbitragem ou ação judicial; e a 40.1 torna a arbitragem facultativa ('poderão'). A indefinição repercute na regra legal de continuidade dos serviços até a decisão final.
  dispositivo_legal: art. 39, caput e parágrafo único, e art. 23-A da Lei n.º 8.987/1995, c/c art. 3.º, caput, e art. 11, inciso III, da Lei n.º 11.079/2004
  flag_tecnico: false
