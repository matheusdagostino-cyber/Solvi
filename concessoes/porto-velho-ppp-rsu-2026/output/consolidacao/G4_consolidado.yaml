- id_tmp: G4-029
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E1-020
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Esclarecimentos, impugnações e visitas por conta Gmail, embora a plataforma concentre 'todos os atos'
  dispositivo_editalicio: Edital, preâmbulo (PDF p. 5); 1.1.39 (p. 9); 2.4 e 2.5 (p. 10); 7.1 e 7.6.1 (p. 16-17); 9.4 (p. 21); 10.3 (p. 23)
  transcricao: 'Edital (p. 5): ''O endereço eletrônico de email para comunicações é o seguinte: comissaosmcl@gmail.com''; 1.1.39: ''por meio do qual serão praticados todos os atos da Licitação'''
  comentario: A definição de PLATAFORMA ELETRÔNICA diz que todos os atos da licitação serão nela praticados, e o 10.3 veda o protocolo de documentos por correio eletrônico. Ainda assim, esclarecimentos,
    impugnações e agendamento de visitas vão a um 'ENDEREÇO ELETRÔNICO' não definido, identificado no preâmbulo como conta de provedor privado. O item 2.4 remete ao 'SÍTIO ELETRÔNICO' e o 2.5 a portovelho.ro.gov.br
    e ao PNCP. Não localizei norma que vede expressamente e-mail de provedor privado; o ponto está na incoerência interna e na rastreabilidade do protocolo.
  dispositivo_legal: art. 12, inciso VI, art. 17, § 2.º, art. 54 e art. 164 da Lei n.º 14.133/2021
  flag_tecnico: false
