  comentario: Os anexos têm datas próprias, de 21/08/2026 a 11/09/2026, e versões sucessivas. Pelo critério, o Anexo IV e o Anexo VII (21/08/2026) cederiam ao Contrato (08/09/2026), e este ao Caderno de
