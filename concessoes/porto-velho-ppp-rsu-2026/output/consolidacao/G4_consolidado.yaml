  descricao_breve: 'Contrato: SPE distinta da Concessionária (5.1.1) e inciso truncado (32.3, vi)'
  dispositivo_editalicio: Contrato cl. 1.3.13 (PDF p. 7), 5.1.1 (p. 14), 32.3, v e vi, 32.4 e 32.8 (p. 69-70)
  transcricao: '5.1.1: ''serão cedidos à Sociedade de Propósito Específico constituída pela Concessionária''; 32.3, vi: ''ao escopo inicial do Contrato, que sejam determinados unilateralmente pelo Poder
    Concedente'''
  comentario: Pela cl. 1.3.13, a Concessionária é a própria SPE constituída pela Adjudicatária; a cl. 5.1.1 inverte os papéis. Na cl. 32.3, o inciso vi começa no meio de uma frase e o inciso v não tem pontuação;
    a hipótese de rescisão amigável não pode ser aplicada como redigida, e as cl. 32.4 e 32.8 remetem a esses incisos.
  dispositivo_legal: art. 9.º, caput, da Lei n.º 11.079/2004; não localizei fundamento normativo específico para o truncamento
