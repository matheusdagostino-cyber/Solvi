    nº 14.026, de 15 de julho de 2020'''
  comentario: 'Edital: a LC 136/2001 aparece entre leis federais sem indicação do ente; não constam a LC 101/2000, a NR ANA n.º 7 (Resolução ANA 187/2024), o PMGIRS e o Decreto Municipal 15.603/2018 (grandes
