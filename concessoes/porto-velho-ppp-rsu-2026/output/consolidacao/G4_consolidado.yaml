  comentario: Edital e Anexo C citam a 'Circular SUSEP nº 622/2022'. Busca na web (fontes secundárias, sem acesso ao texto oficial) indica que a norma do seguro-garantia é a Circular SUSEP n.º 662, de 11/04/2022.
