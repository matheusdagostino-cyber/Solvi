  descricao_breve: Capital da SPE remetido ao Contrato, que não o regula; saldo sem cronograma
  dispositivo_editalicio: Edital 8.5.5 (PDF p. 20) e 20.1.2.1 (p. 48); Contrato (sem cláusula de capital)
  transcricao: 'Edital 8.5.5: ''observando, na composição de seu capital social, o estabelecido no CONTRATO''; 20.1.2.1: ''Subscrição de, no mínimo, R$ 34.678.914,41 [...] e integralização de R$ 17.339.457,21'''
  comentario: O item 8.5.5 manda observar 'o estabelecido no CONTRATO' na composição do capital da SPE, mas o Contrato não contém cláusula sobre capital social (busca textual sem resultado). O Edital fixa
    subscrição de 1,5% do VE e integralização de 50% na assinatura, sem prazo ou marcos para integralizar o saldo de R$ 17,34 milhões e sem regra de manutenção ou redução do capital.
  dispositivo_legal: art. 9.º da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021
