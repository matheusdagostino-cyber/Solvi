  transcricao: 'P6 (p. 9): ''Resolução ANA nº 187, de 25 de março de 2024. Aprova a Norma de Referência nº 8, que estabelece diretrizes sobre indenização de investimentos realizados e não amortizados ou
    depreciados dos serviços públicos de abastecimento de água e de esgotamento sanitário'''
  comentario: (i) A nota 5 descreve a Resolução ANA 187/2024 como aprovação da NR 8 de água e esgoto, enquanto o texto trata da NR 7 de RSU. (ii) A nota 8 apresenta como PERS a Lei estadual 4.437/2018,
    cuja ementa é de 'Política Estadual de Governança Climática e Serviços Ambientais'. (iii) O P6 afirma que a escolha entre AGERO e regulador municipal 'deve ser formalizada antes da estruturação do edital',
    embora a ARDPV (LC 1.013/2025) exista e seja citada na p. 44. (iv) Tabela 1 com fonte 'Planares' e Tabela 2 com fonte 'PMSB'. (v) A nota 56 cita IFRS 12. (vi) As hipóteses de não incidência da TRCF
    são atribuídas ao art. 51 da LC 1.013/2025; o Contrato (13.1.1) e o P7 citam o art. 53.
  dispositivo_legal: não localizei fundamento normativo específico (erro material do estudo)
