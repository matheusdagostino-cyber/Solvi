  descricao_breve: TR do Verificador remete a 'Anexo III – Indicadores' e usa termos não definidos
  dispositivo_editalicio: Anexo VII, capa e itens 1, 5-V, 6.2 e 12.1 (PDF p. 1-6); Anexo D, I.3 e VI (p. 6 e 21); Contrato cl. 1.3.33 (p. 9); Edital 2.8 e 2.9 (p. 11)
  transcricao: 'Anexo VII (p. 3): ''nos termos do ANEXO III – INDICADORES DE DESEMPENHO E METAS DE ATENDIMENTO e do CONTRATO''; Anexo VII (p. 6): ''certificando indicadores, Nota Global, Fator de Desempenho'''
  comentario: 'No rol de anexos, o Anexo III é o de Diretrizes Ambientais, e os indicadores estão no Anexo D do Edital. O Anexo VII (TR do Verificador Independente) remete três vezes a um ''Anexo III –
    Indicadores'' e usa ''Nota Global'' e ''Fator de Desempenho'', conceitos não definidos no Anexo D, que usa IQS; o Contrato usa IQD e equipara os termos (1.3.33). A capa do Anexo VII o intitula ''P6:
    ANEXO VII (CONTRATO)''. A falta de uniformidade dificulta identificar o objeto da certificação pelo Verificador.'
  dispositivo_legal: art. 5.º da Lei n.º 14.133/2021 (vinculação e segurança jurídica)
