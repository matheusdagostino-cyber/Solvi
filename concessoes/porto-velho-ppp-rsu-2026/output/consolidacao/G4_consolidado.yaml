# Consolidador (C) — Fase 1 — G4 (HABILITACAO, JULGAMENTO_PROPOSTA, QUESTOES_FORMAIS) — PPP RSU Porto Velho/RO [USO INTERNO]
pontos:
- id_tmp: G4-001
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E1-002
  - E7-001
  - E7-003
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: Autorização da autoridade competente e estudo técnico do art. 10, I, não identificados
  dispositivo_editalicio: Edital, preâmbulo, 2.º parágrafo (PDF p. 4); P7 I.3 e II.4 (p. 12 e 16-17); P7 V.10 (p. 44)
  transcricao: 'Edital (p. 4): ''A justificativa para a realização da presente contratação [...] foram publicadas no Diário Oficial dos Municípios do Estado de Rondônia – DOM em [ • ] de 202[ • ]''; P7
    (p. 44): ''Esses requisitos devem ser atendidos pelo Município antes da publicação do Edital [...] Recomenda-se que a documentação de instrução processual do certame consolide essa estimativa.'''
  comentario: 'O pacote não contém o ato da autoridade competente que autoriza a abertura da licitação nem o estudo técnico que demonstre: (a) a conveniência e a oportunidade da opção pela PPP; (b) que
    as despesas criadas não afetarão as metas de resultados fiscais, com compensação dos efeitos financeiros nos períodos seguintes; (c) a observância dos limites e condições da LRF; tudo com premissas
    e metodologia de cálculo (§ 1.º). O Edital menciona apenas a publicação da justificativa no DOM, com data em branco. O P7 descreve o Termo de Autorização do MIP 005/2025, que autorizou a elaboração
    dos estudos e não a licitação, e no item V.10 trata a demonstração fiscal como providência a consolidar na instrução processual. Também não consta a deliberação do CGP/PVH que aprove os estudos e as
    minutas.'
  dispositivo_legal: art. 10, inciso I, alíneas a, b e c, e § 1.º, da Lei n.º 11.079/2004; arts. 16 e 17 da Lei Complementar n.º 101/2000; art. 18, inciso I, e arts. 22 a 27 da Lei Complementar Municipal
    n.º 592/2015 (conforme citados no P7, p. 17 e 44)
  depende_de: 'Processo administrativo: ato de autorização da licitação; estudo técnico com as demonstrações das alíneas a a c (premissas e metodologia); deliberação do CGP/PVH aprovando os estudos e as
    minutas.'
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G4-002
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E1-003
  - E7-004
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: Estimativa de impacto orçamentário-financeiro e de fluxo de recursos por exercício não apresentada
  dispositivo_editalicio: Edital 5.1 a 5.3 (PDF p. 15); P7 III.5 (p. 31) e V.10 (p. 44); P6 VI.9 e Tabela 18 (p. 58-59)
  transcricao: 'Edital 5.3: ''Os recursos para o pagamento da Contraprestação [...] advirão de dotações orçamentárias específicas, a serem incluídas nos orçamentos municipais dos exercícios seguintes'';
    P7 (p. 44): ''A modelagem dimensiona a contraprestação anual em 3,18% da RCL (P6), abaixo do limite'''
  comentario: A lei exige, antes da abertura da licitação, estimativa do impacto orçamentário-financeiro em cada exercício de vigência do contrato e estimativa do fluxo de recursos públicos suficientes
    por exercício. O Edital não as menciona. O P6 e o P7 apresentam apenas a relação entre a contraprestação anual em regime pleno e a RCL de um único exercício, sem série anual que considere o ramp-up
    da Parcela A, o reajuste pelo IPCA, a recomposição da Conta Garantia ou eventual aporte. O próprio P7 recomenda que a estimativa seja consolidada na instrução processual. A verificação do limite de
    5% da RCL (art. 28) fica em MODELAGEM_ECONOMICA; a identificação das fontes de recursos da contraprestação, em RISCOS_GARANTIAS (E7-006).
  dispositivo_legal: art. 10, incisos II e IV, da Lei n.º 11.079/2004; art. 16, inciso I, da Lei Complementar n.º 101/2000
  depende_de: Documento de estimativa de impacto e de fluxo de recursos por exercício no processo administrativo; se inexistente, o ponto passa a IRREGULAR.
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G4-003
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E1-004
  - E1-005
  - E3-002
  - E7-007
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Dotação, LDO e PPA em branco no Edital e no Contrato; pendência reconhecida no P7
  dispositivo_editalicio: Edital 5.2 (PDF p. 15); Contrato cl. 15.1.1 (p. 37); P7 X.2.2 (p. 66) e XII.4 (p. 72)
  transcricao: 'Edital 5.2: ''dotação orçamentária prevista na Lei de Diretrizes Orçamentárias e no Plano Plurianual do Município de Porto Velho: AÇÃO PROGRAMÁTICA [ • ]; ELEMENTO DE DESPESA [ • ]; FONTE
    [ • ]''; Contrato 15.1.1: ''previstos na Lei de diretrizes orçamentarias para o ano [ • ] e no plano Plurianual [ • ]''; P7 (p. 66): ''A definição da Ação Programática, do Elemento de Despesa e da Fonte
    de Recursos [...] é elemento essencial à publicação do Edital.'''
  comentario: Ação programática, elemento de despesa, fonte, exercício da LDO e PPA estão em branco no Edital e no Contrato. O P7 (2.ª versão, 11/09/2026, posterior ao Edital de 08/09/2026) inclui a 'formalização
    da dotação orçamentária na LDO e no PPA' entre as providências ainda pendentes. O Edital situa a dotação na LDO e no PPA; a lei exige compatibilidade com a LDO, previsão na LOA (declaração do ordenador,
    G4-004) e previsão do objeto no PPA em vigor. A indicação do crédito pelo qual corre a despesa é cláusula necessária do contrato.
  dispositivo_legal: art. 10, incisos III e V, da Lei n.º 11.079/2004; art. 92, inciso VIII, da Lei n.º 14.133/2021; art. 167, incisos I e II, e § 1.º, da Constituição Federal
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G4-004
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E7-008
  - E1-004
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: Declaração do ordenador de despesa (art. 10, III) não mencionada
  dispositivo_editalicio: Edital 5.2 (PDF p. 15); P7 V.10 (p. 44) e X.2.2 (p. 66)
  transcricao: 'P7 (p. 66): ''O CGP/PVH e a Secretaria de Fazenda devem articular essa formalização no prazo compatível.'''
  comentario: Nem o Edital nem o P7 mencionam a declaração do ordenador de despesa de que as obrigações do contrato são compatíveis com a LDO e estão previstas na LOA. É ato do processo administrativo e
    pode existir fora do pacote. Com a dotação ainda em branco (G4-003), não há elemento documental que indique sua emissão.
  dispositivo_legal: art. 10, inciso III, da Lei n.º 11.079/2004; art. 16, inciso II, da Lei Complementar n.º 101/2000
  depende_de: Cópia da declaração do ordenador de despesa nos autos do processo administrativo.
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G4-005
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E1-006
  - E7-009
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Consulta pública dada como realizada, sem datas; P7 a trata como pendente
  dispositivo_editalicio: Edital, preâmbulo, 5.º parágrafo (PDF p. 5); P7 X.2.1 (p. 66) e XII.4 (p. 72)
  transcricao: 'Edital (p. 5): ''Foi realizada também Consulta Pública [...] em observância ao estabelecido pelo art. 10, inciso VI [...] Tal Consulta Pública teve início em, [datas a inserir]''; P7 (p.
    66): ''As datas específicas dessas etapas devem ser definidas pelo Município em coerência com o calendário de instrução administrativa.'''
  comentario: O Edital declara, no passado, que a consulta pública foi realizada, mas deixa as datas em branco. O P7, de 11/09/2026 (posterior ao Edital), afirma que as datas 'devem ser definidas' e inclui
    a consulta entre os pontos prévios ao Edital ainda pendentes (XII.4). A lei exige publicação na imprensa oficial, em jornais de grande circulação e por meio eletrônico, com justificativa, objeto, prazo
    e valor estimado, prazo mínimo de 30 dias para sugestões e término ao menos 7 dias antes da publicação do edital. Em saneamento, a consulta e a audiência prévias sobre o edital e a minuta do contrato
    são condição de validade do contrato. Se a consulta ocorreu, faltam no pacote os avisos, o prazo efetivo, o relatório de contribuições e as respostas.
  dispositivo_legal: art. 10, inciso VI, da Lei n.º 11.079/2004; art. 11, inciso IV, da Lei n.º 11.445/2007
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G4-006
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E1-007
  - E7-062
  tipo_achado: IRREGULAR
  categoria: erro_material
  descricao_breve: Audiência pública com fundamento legal errado (arts. 173 e 14, VI) e sem data
  dispositivo_editalicio: Edital, preâmbulo, 4.º parágrafo (PDF p. 5); P7 X.2.1 (p. 66)
  transcricao: 'Edital (p. 5): ''em atendimento ao disposto no artigo 173 da Lei Federal nº 14.133/2021, realizou Audiência Pública em, [data a inserir]''; P7 (p. 66): ''e ao art. 14, inciso VI, da Lei
    Federal nº 14.133/2021'''
  comentario: O art. 173 da Lei 14.133 trata da capacitação promovida pelos tribunais de contas, e o art. 14, dos impedimentos de participação; a audiência pública está no art. 21. A data da audiência está
    em branco. O P7 não menciona o art. 11, IV, da Lei 11.445, que torna a audiência e a consulta prévias condição de validade do contrato.
  dispositivo_legal: art. 21, caput, da Lei n.º 14.133/2021; art. 11, inciso IV, da Lei n.º 11.445/2007
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G4-007
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E2-086
  - E5-075
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: Condições pré-edital fixadas pelos próprios estudos (consultas locais, TCE-RO, MP-RO, FUNAI/INCRA) sem comprovação
  dispositivo_editalicio: Anexo III, item XIV.1 (PDF p. 33) e Tabela 19, Fase 1 (p. 30); P4 VIII.2 e Tabela 14 (p. 34-35); Edital, preâmbulo (p. 5)
  transcricao: 'P4 (p. 34): ''As Fases 1 e 2 são condições pré-operacionais — devem ser concluídas antes da publicação do edital de licitação''; Anexo III (p. 33): ''Audiência pública fluvial presencial
    em Calama e São Carlos, com versão simplificada do EVTEA em linguagem acessível.'''
  comentario: 'O Anexo III e o P4 definem como condições anteriores à publicação do Edital: consulta comunitária no entorno da Lixeira de Vila Princesa; audiências presenciais em Calama e São Carlos (Baixo
    Madeira); reuniões com TCE-RO, MP-RO e órgão ambiental; consulta (data request) à FUNAI e ao INCRA; cadastro georreferenciado de catadores. O pacote não traz atas ou registros dessas providências, e
    o preâmbulo do Edital só menciona audiência no auditório da sede e consulta pública, ambas sem data. A consulta prévia da Convenção 169 da OIT fica em LICENCIAMENTO_AMBIENTAL (E1-014, E7-080).'
  dispositivo_legal: art. 10, inciso VI, da Lei n.º 11.079/2004; art. 11, inciso IV, da Lei n.º 11.445/2007; art. 21 da Lei n.º 14.133/2021
  depende_de: Atas e registros das consultas, audiências e reuniões; respostas da FUNAI e do INCRA; cadastro de catadores.
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G4-008
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E7-014
  - E1-010
  tipo_achado: DEPENDE_DE_FATO
  categoria: risco_economico
  descricao_breve: Atualização dos estudos se a assinatura ocorrer em outro exercício (art. 10, § 2.º) não prevista
  dispositivo_editalicio: Edital 12.3 (PDF p. 31) e 23.1 (p. 52-53); P7 X.2 e XII.4 (p. 66 e 72)
  transcricao: 'Edital 12.3: ''Os valores apresentados na PROPOSTA ECONÔMICA devem considerar como data-base maio/2026''; P7 (p. 72): ''Subsistem pontos institucionais que demandam validação pelo Município
    antes da publicação do Edital.'''
  comentario: O P6 adota 2027 como Ano 1; o Edital está em 2.ª versão de setembro de 2026, com cronograma em branco; e o P7 lista pendências prévias à publicação. Se a assinatura ocorrer em exercício diverso
    do da publicação do edital, a lei exige atualização prévia dos estudos e demonstrações dos incisos I a IV do art. 10. Nem o Edital nem o P7 preveem essa providência.
  dispositivo_legal: art. 10, § 2.º, da Lei n.º 11.079/2004
  depende_de: Datas efetivas de publicação do edital e de assinatura do contrato.
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G4-009
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E7-011
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: 'Autorização legislativa: P7 apoia-se na LC 592/2015 sem examinar a Lei Orgânica'
  dispositivo_editalicio: P7 II.3, II.4 e II.12 (PDF p. 16-17 e 22); Contrato cl. 3.2, xi (p. 11)
  transcricao: 'P7: ''A Concessão é estruturada na modalidade administrativa autorizada pela LC 592/2015'''
  comentario: O P7 não identifica lei municipal específica que autorize esta concessão e se apoia na LC 592/2015, lei do programa municipal de PPP. A Lei 11.079 exige lei autorizativa específica apenas
    para concessão patrocinada com mais de 70% de remuneração pública. A Lei 9.074 dispensa lei autorizativa para saneamento básico e limpeza urbana, ressalvados os casos referidos nas Leis Orgânicas. O
    P7 cita a Lei Orgânica de Porto Velho (27/03/1990) como incidente, mas não examina se ela exige autorização legislativa para concessões ou PPPs.
  dispositivo_legal: art. 10, § 3.º, da Lei n.º 11.079/2004; art. 2.º da Lei n.º 9.074/1995; Lei Orgânica do Município de Porto Velho (27/03/1990)
  depende_de: Texto da Lei Orgânica de Porto Velho sobre concessões e PPPs; eventual lei específica.
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G4-010
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E7-017
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: Envio prévio de informações ao Senado e à STN (art. 28, § 1.º) não abordado
  dispositivo_editalicio: P7 V.10 (PDF p. 44); Anexo V (Matriz de Riscos)
  transcricao: 'P7 (p. 44): ''A arquitetura de garantias examinada observa, em sua integralidade, os limites e exigências de responsabilidade fiscal aplicáveis.'''
  comentario: O P7 não menciona a obrigação de encaminhar ao Senado Federal e à STN, antes da contratação, as informações necessárias à verificação dos limites do art. 28. Também não examina o registro
    da PPP segundo as normas gerais de consolidação das contas públicas a que remete o art. 10, § 1.º, à luz dos riscos alocados ao Poder Concedente na Matriz.
  dispositivo_legal: art. 28, § 1.º, e art. 10, § 1.º, da Lei n.º 11.079/2004
  depende_de: Comprovante de envio das informações ao Senado Federal e à STN antes da assinatura.
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G4-011
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E1-015
  - E3-004
  - E5-062
  - E6-065
  - E7-070
  - E4-065
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: Determinações dos Acórdãos APL-TC 00068/24 e 00105/24 não descritas; saneamento não verificável
  dispositivo_editalicio: Edital, preâmbulo, 3.º parágrafo (PDF p. 4); Contrato, considerandos ii e iii (p. 5); P7 Sumário (p. 9), I.2 (p. 11-12), II.13 (p. 22), III.2.2 (p. 27), III.4.6 (p. 31) e XII.3
    (p. 71-72); P0 III.2 (p. 25); P1, P2, P3, P4 e P6 (sem tratamento do tema)
  transcricao: 'Edital (p. 4): ''Para sanar aquelas irregularidades houve a estruturação da presente Parceria Público-Privada, regida por este edital.''; Contrato, considerando iii (p. 5): ''em estrito
    cumprimento às determinações proferidas pelo Tribunal de Contas do Estado de Rondônia (TCE-RO) nos autos do Processo nº 00421/2022'''
  comentario: 'O Edital e o Contrato afirmam que a nova PPP sana as irregularidades julgadas pelo TCE-RO, mas nenhum documento transcreve as irregularidades ou determinações dos acórdãos. O P7 é o único
    que descreve o que teria sido considerado: quatro ''decisões centrais'' (menor contraprestação em vez de técnica e preço; ordem de fases da Lei 14.133; supressão da proposta técnica pontuada; substituição
    da Lei 8.666) e duas ''orientações'' (utilidades às expensas da concessionária, p. 27; somatório de atestados inclusive concomitantes, p. 31). P1, P2, P3, P4 e P6 não tratam do tema; o P0 pediu cópia
    integral do processo no data request. O P7 menciona ''expectativa de manifestação prévia do Tribunal'', sem registro de que tenha ocorrido. O Edital ainda remete à Lei 8.666 (G4-046) e limita o somatório
    de atestados (G4-084). O considerando ii do Contrato nomeia a antiga concessionária e sua controladora, com grafia ''SI A''. Os acórdãos são referidos como fato documental.'
  dispositivo_legal: 'art. 71, inciso IX, c/c art. 75 da Constituição Federal; Acórdãos APL-TC 00068/24 e APL-TC 00105/24, Processo TCE-RO 00421/2022 (fato documental: Edital p. 4; Contrato p. 5; P7 p.
    9, 11 e 22)'
  depende_de: Inteiro teor dos Acórdãos APL-TC 00068/24 e 00105/24 e da Decisão 001/2025/GAB-PREF/PMPV, para cotejo de cada determinação com o Edital, o Contrato e a modelagem.
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
  nota_reserva: ''
- id_tmp: G4-012
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E1-016
  - E5-013
  - E7-072
  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: Prazo de 180 dias para concluir a nova licitação aparentemente excedido; emergencial em curso
  dispositivo_editalicio: P7 I.2 (PDF p. 11); P1 p. 64 e 88; P0 p. 3 e 26; Edital, preâmbulo (p. 4) e capa (2.ª versão, 08/09/2026)
  transcricao: 'P7 (p. 11): ''O Acórdão APL-TC 00105/24 e a Decisão nº 001/2025/GAB-PREF/PMPV determinaram a manutenção dos serviços e admitiram a realização de contratação emergencial pelo prazo de até
    180 (cento e oitenta) dias, período no qual deveria ser concluído o novo procedimento licitatório da Parceria Público-Privada, sob pena das sanções fixadas pelo Tribunal.''; P1 (p. 64): ''da empresa
    ECOPVH com contrato emergencial ativo'''
  comentario: Segundo o P7, a nova licitação deveria ser concluída em até 180 dias. O Termo de Autorização dos estudos é de 25/09/2025 (prazo de 240 dias), o P6 é de 26/05/2026 e o Edital está em 2.ª versão
    de 08/09/2026, com cronograma em branco. O P1 registra contrato emergencial ativo da ECOPVH (Contrato 028/PGM/2025). Nenhum documento informa a data da Decisão 001/2025, prorrogação do prazo pelo TCE-RO
    ou a sucessão de contratações emergenciais. A Lei 14.133 limita a contratação emergencial a 1 ano e veda prorrogação e recontratação da mesma empresa. A transição com o operador emergencial fica em
    RISCOS_GARANTIAS (E5-012).
  dispositivo_legal: 'art. 75, inciso VIII e § 6.º, da Lei n.º 14.133/2021; art. 71, inciso IX, c/c art. 75 da Constituição Federal; determinação do Acórdão APL-TC 00105/24 (fato documental: P7, p. 11)'
  depende_de: Data da Decisão 001/2025; datas, prazos e aditivos dos contratos emergenciais; eventual decisão do TCE-RO que prorrogue o prazo.
  flag_tecnico: false
  flag_reserva: true
  reserva_tipo: DECISAO_COMERCIAL
  nota_reserva: Levantar o ponto depende da posição do grupo em relação ao prestador emergencial atual e ao contrato emergencial em curso.
- id_tmp: G4-013
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E3-092
  - E7-076
  - E1-096
  - E4-033
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Ressarcimento dos estudos: valor fixo, teto ou corrigido pelo IPCA; pagador e forma divergentes'
  dispositivo_editalicio: Edital 20.1.8 (PDF p. 49), 21.1, 21.1.1 e 21.1.2 (p. 50); Contrato cl. 10.7 e 10.7.1 (p. 30); P7 I.3 (p. 12) e X.1 (p. 65-66)
  transcricao: 'Edital 21.1.1: ''Como condição para assinatura do CONTRATO, realizar o pagamento do valor R$ 3.142.250,00 [...] como ressarcimento pelos estudos realizados''; Edital 20.1.8: ''devidamente
    corrigidos pelo Índice Nacional de Preços ao Consumidor Amplo – IPCA a partir da data-base do orçamento estimado''; Contrato 10.7.1: ''O valor máximo para ressarcimento será de R$ 3.142.250,00'''
  comentario: O Edital 21.1.1 fixa o valor de R$ 3.142.250,00; o 20.1.8 manda corrigi-lo pelo IPCA desde a data-base e pagá-lo por boleto ao consórcio; o 21.1.2 admite pagamento direto às empresas do consórcio;
    o Contrato 10.7.1 trata o valor como 'máximo'; o P7 o chama de 'fixado' (p. 65) e de 'teto' (p. 12). O Edital atribui o pagamento à ADJUDICATÁRIA (21.1), e o Contrato, à Concessionária (10.7), que é
    a SPE constituída após a adjudicação; a lei atribui o ressarcimento ao vencedor da licitação. Ficam indefinidos o valor exato, quem paga e a quem, embora o pagamento seja condição para a assinatura.
  dispositivo_legal: art. 21 da Lei n.º 8.987/1995, c/c art. 3.º, caput, e art. 11, caput, da Lei n.º 11.079/2004; art. 81 da Lei n.º 14.133/2021; art. 28, § 2.º, da Lei Complementar Municipal n.º 592/2015
    (conforme citado no Edital e no Contrato)
