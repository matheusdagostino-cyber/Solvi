  dispositivo_editalicio: Edital 11.14, e, 11.14.1 e 11.14.2 (PDF p. 29) × 12.3.2 (p. 31)
  transcricao: '11.14.2: ''a fim de que possa promover a renovação de sua GARANTIA DE PROPOSTA no prazo máximo de 15 (quinze) dias corridos''; 12.3.2: ''no prazo de 10 (dez) dias antes do vencimento, sob
    pena de inabilitação e consequente desclassificação'''
  comentario: O 11.14.2 obriga a Comissão a notificar o licitante e conceder 15 dias para renovar a garantia antes de excluí-lo. O 12.3.2 impõe ao licitante prorrogar garantia e proposta 10 dias antes do
    vencimento, sem notificação, sob pena de 'inabilitação e consequente desclassificação', misturando as consequências.
  dispositivo_legal: art. 5.º e art. 90, § 3.º, da Lei n.º 14.133/2021
