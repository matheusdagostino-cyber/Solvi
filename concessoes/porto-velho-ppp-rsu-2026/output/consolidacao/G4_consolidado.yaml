  - E7-076
  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Dispêndios do ressarcimento não especificados; base de 2,5% não indicada; ausente do P6
  dispositivo_editalicio: Edital 21.1.1 (PDF p. 50); Contrato cl. 10.7.1 (p. 30); P7 X.1 (p. 65-66); P6 (sem rubrica)
  transcricao: 'Contrato 10.7.1: ''limitado a 2,5% (dois e meio por cento) do valor total estimado dos investimentos necessários à implementação da parceria público-privada, conforme § 2º do art. 28 da
    Lei Complementar nº 592/2015'''
  comentario: A lei exige que os dispêndios a ressarcir sejam especificados no edital; nenhum documento discrimina os custos dos estudos. R$ 3.142.250,00 corresponde exatamente a 2,5% de R$ 125,69 milhões,
    valor que não coincide com os investimentos do P2 e do P6 (R$ 298,3 milhões a R$ 313,8 milhões) nem é indicado como base em outro documento. Sobre o CAPEX do P6, o valor equivale a cerca de 1% e fica
    abaixo do teto municipal (G4-100). Com a correção pelo IPCA do Edital 20.1.8, o valor pago pode superar o fixado. Não localizei no texto do P6 rubrica do ressarcimento (busca por 'ressarc', '3.142',
    'PMI' e 'MIP'), e a planilha do modelo não integra o pacote; a omissão de custos pré-operacionais no P2 fica em MODELAGEM_ECONOMICA (E6-039).
  dispositivo_legal: art. 21 da Lei n.º 8.987/1995, c/c art. 3.º, caput, da Lei n.º 11.079/2004; art. 28, § 2.º, da Lei Complementar Municipal n.º 592/2015 (conforme citado no Contrato)
