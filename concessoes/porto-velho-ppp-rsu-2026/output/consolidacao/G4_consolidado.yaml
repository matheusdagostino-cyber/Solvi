  tipo_achado: DEPENDE_DE_FATO
  categoria: omissao
  descricao_breve: Atividades técnicas a comprovar não incluem CDR, compostagem, autoclave, logística fluvial, remediação e obras
  dispositivo_editalicio: Edital 13.23.1.3 (PDF p. 37), 1.1.7-1.1.9 e 1.1.33-1.1.35 (p. 6-8) e 3.1, i a xi (p. 12-13)
  transcricao: '13.23.1.3: ''as definições de Coleta e Transporte de Resíduos Sólidos Domiciliares e Comerciais; Coleta e Transporte de Resíduos Sólidos Recicláveis; Coleta, Transporte, Tratamento e Disposição
    Final de RSS; Operação de Central de Tratamento de Resíduos / aterro sanitário; Operação e Manutenção de Ecopontos; Operação e Manutenção de Estação de Transbordo'''
  comentario: O 13.23.1.3 lista seis atividades para os atestados, sem incluir processamento de CDR, compostagem, autoclave, logística fluvial no Baixo Madeira, remediação pelo rito GAC e obras civis da
    CTR, que integram o objeto. Não fica claro se as atividades listadas são cumulativas. Saber quais parcelas atingem 4% do valor depende da decomposição do CAPEX e do OPEX por atividade.
  dispositivo_legal: art. 67, inciso II e § 1.º, da Lei n.º 14.133/2021
  depende_de: Decomposição de CAPEX/OPEX por atividade (P2/P6) para identificar as parcelas de maior relevância; validação de engenharia.
