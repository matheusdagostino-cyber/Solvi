  tema: HABILITACAO
  ids_origem:
  - E4-044
  - E7-061
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Capital e integralização da SPE divergentes entre P7 (10%/65%), Edital (1,5%/50%) e P6 (1%/40%)
  dispositivo_editalicio: P7 IX.2 (PDF p. 62); Edital 13.17.2 (p. 35) e 20.1.2.1 (p. 48); P6 Tabela 2 (p. 16)
  transcricao: 'P7 (p. 62): ''O dimensionamento do capital social em 10% do valor do Contrato é tecnicamente importante [...] a condicionalidade da integralização inicial mínima de 65% à assinatura do Contrato'';
    P6 (p. 16): ''Capital social mínimo R$ 23,1 milhões (1% do valor do contrato) Equity total R$ 57,8 milhões (2,5% do valor do contrato) Integralização inicial 40% do capital social mínimo'''
  comentario: O P7 afirma, 'em coerência com a modelagem do Produto 6', capital social de 10% do valor do Contrato (cerca de R$ 231 milhões) com 65% integralizados na assinatura. O Edital exige capital
    mínimo da licitante de R$ 23,1 milhões (1%) e, para a SPE, subscrição de R$ 34,7 milhões (1,5%) e integralização de R$ 17,3 milhões (50%). O P6 modela capital mínimo de 1%, equity total de 2,5% e integralização
    inicial de 40%. São três parâmetros incompatíveis para a mesma exigência, e o fluxo de equity do modelo não reflete a exigência editalícia.
  dispositivo_legal: art. 69, § 4.º, e art. 5.º da Lei n.º 14.133/2021; art. 9.º da Lei n.º 11.079/2004
