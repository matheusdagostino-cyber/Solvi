  descricao_breve: Estudos-base de passivos elaborados pela antiga concessionária; disponibilização aos licitantes não verificada
  dispositivo_editalicio: P2 VIII (PDF p. 49); P3 IX (p. 54-55); P1 p. 85 e 88; P4 p. 9
  transcricao: 'P2/P3 (referências): ''Avaliação Preliminar de Passivo Ambiental Aterro do Jirau. Porto Velho: Prefeitura Municipal de Porto Velho, 2024. Elaborado por EcoRondônia Ambiental S/A. [...] Relatório
    de Ratificação do Licenciamento Ambiental da Central de Tratamento e Destinação de Resíduos Sólidos de Porto Velho. 2024.'''
  comentario: As Avaliações Preliminares de Passivo da Vila Princesa e do Jirau, base dos valores de remediação e do teto contratual, foram elaboradas pela EcoRondônia Ambiental S/A, identificada no P1
    como do Grupo Marquise, contratada do Contrato 019/PGM/2024 anulado e titular da LAI do Ecoparque. Os estudos citam também o Relatório de Ratificação do Licenciamento da CTR (SEMPOG, 2024). Não se verificou
    se esses documentos estão à disposição dos interessados; se não estiverem, há assimetria de informação entre a antiga concessionária e os demais licitantes.
  dispositivo_legal: art. 21 da Lei n.º 8.987/1995, c/c art. 11, caput, da Lei n.º 11.079/2004; art. 9.º, inciso I, alínea a, da Lei n.º 14.133/2021
