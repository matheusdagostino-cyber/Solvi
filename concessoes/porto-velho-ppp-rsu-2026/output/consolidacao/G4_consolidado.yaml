  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Prorrogação da convocação 'por determinação do PODER CONCEDENTE', sem limite
  dispositivo_editalicio: Edital 19.3 e 19.4 (PDF p. 47)
  transcricao: '19.3: ''poderá excepcionalmente ser prorrogado em até 30 (trinta) dias [...] sendo admitida, ainda, a prorrogação por determinação do PODER CONCEDENTE'''
  comentario: A lei admite prorrogar o prazo de convocação uma vez, por igual período, a pedido justificado do convocado aceito pela Administração. O 19.3 acrescenta prorrogação por determinação do Poder
    Concedente, sem limite de vezes ou de prazo. Na convocação de remanescentes (19.4), o Edital não prevê a faculdade de negociação e de contratação nas condições dos remanescentes do § 4.º.
  dispositivo_legal: art. 90, §§ 1.º, 2.º e 4.º, da Lei n.º 14.133/2021
