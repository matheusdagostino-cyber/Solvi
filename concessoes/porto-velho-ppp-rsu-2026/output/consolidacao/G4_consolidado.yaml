  comentario: Estão em branco o número da concorrência e do processo administrativo, a plataforma eletrônica e seu endereço, a data e a hora de entrega dos envelopes, as datas do aviso, o período de visitas
    técnicas, todo o cronograma (eventos 1 a 11), os dados do DAM da caução e a secretaria signatária. No Contrato e nos Anexos IV, V, VI, VII e C faltam o número do certame e do processo, com três padrões
    distintos de lacuna ([*], [ • ], XXX). O número do processo é menção obrigatória do contrato. Pode tratar-se de minuta anterior à publicação; é preciso verificar se a versão publicada preencheu os campos.
  dispositivo_legal: art. 25, caput, e art. 89, § 1.º, da Lei n.º 14.133/2021; art. 18, inciso III, da Lei n.º 8.987/1995, c/c art. 11, caput, da Lei n.º 11.079/2004
  flag_tecnico: false
