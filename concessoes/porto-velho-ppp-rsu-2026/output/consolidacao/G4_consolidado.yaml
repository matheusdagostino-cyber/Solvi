- id_tmp: G4-060
  tema: HABILITACAO
  ids_origem:
  - E1-050
  tipo_achado: IRREGULAR
  categoria: restricao_competitividade
  descricao_breve: Impedimento de licitar estendido a toda a Administração (8.2, b), não só ao Município
  dispositivo_editalicio: Edital 8.2, b (PDF p. 18), 19.5, c (p. 48) e 22.2.3 (p. 51); Anexo C, Declaração 3, iii (p. 9)
  transcricao: 'Edital 8.2, b: ''estejam suspensas ou impedidas de licitar e contratar com a Administração Pública''; Anexo C, Decl. 3, iii: ''não está impedida de participar de processos de contratação
    com a Administração direta e indireta do Município de Porto Velho'''
  comentario: O impedimento de licitar e contratar alcança apenas a Administração do ente federativo que aplicou a sanção. O item 8.2, b, exclui quem esteja impedido perante 'a Administração Pública', sem
    esse limite. A Declaração 3 do Anexo C e o próprio Edital (19.5, c, e 22.2.3) limitam corretamente o impedimento ao Município, o que cria contradição interna.
  dispositivo_legal: art. 14, inciso III, e art. 156, §§ 4.º e 5.º, da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
