  descricao_breve: Termo de confidencialidade da visita e Declaração 9 sem previsão no Edital
  dispositivo_editalicio: Anexo C, Declaração 10 (PDF p. 16-17) e Declaração 9 (p. 15); Edital item 9 (p. 21-22)
  transcricao: 'Anexo C, Decl. 10: ''não copiar, fotografar, gravar, imprimir, divulgar a terceiros, revelar, reproduzir ou, ainda, de qualquer modo'''
  comentario: O item 9 do Edital não condiciona a visita a termo de confidencialidade, mas o Anexo C traz um, com responsabilidade civil e criminal e indenização, que restringe o registro e a divulgação
    de informações sobre bens e áreas públicas e pode inibir o uso, em impugnações e representações, do que foi observado na visita. A Declaração 9 (compromisso de manter responsável técnico durante toda
    a concessão) também não é exigida por nenhum item do Edital.
  dispositivo_legal: art. 5.º (publicidade) e art. 63, § 2.º, da Lei n.º 14.133/2021; não localizei fundamento normativo específico para condicionar a vistoria a termo de sigilo
