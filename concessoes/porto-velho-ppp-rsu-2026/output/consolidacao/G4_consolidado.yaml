  descricao_breve: 'Tradução de documentos estrangeiros: livre até a assinatura × juramentada já na habilitação'
  dispositivo_editalicio: Edital 8.4.1 (PDF p. 20), 10.13 e 10.13.1 (p. 25) × 13.29 (p. 39)
  transcricao: '8.4.1: ''devem vir acompanhados de tradução livre, devendo os pertinentes à habilitação ser apresentados em tradução juramentada previamente à assinatura do CONTRATO''; 13.29: ''Serão aceitos
    atestados ou outros documentos hábeis emitidos por entidades estrangeiras quando traduzidos para a língua portuguesa por tradutor juramentado'''
  comentario: Os itens 8.4.1 e 10.13 admitem tradução livre na licitação e exigem tradução juramentada só antes da assinatura. O 13.29 exige tradução juramentada dos atestados estrangeiros já na habilitação,
    e o 10.13 exige certificação notarial no país de origem. A lei exige apenas tradução para o português dos atestados estrangeiros.
  dispositivo_legal: art. 67, § 4.º, e art. 70, parágrafo único, da Lei n.º 14.133/2021; Decreto n.º 8.660/2016
