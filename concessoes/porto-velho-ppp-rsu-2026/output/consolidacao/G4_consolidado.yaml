  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Mesa de Resolução: inclui penalidades e seu cálculo, mas exclui a dosimetria'
  dispositivo_editalicio: Contrato cl. 39.2, d, 39.2.1, a (PDF p. 75) e 40.3.1 (p. 77)
  transcricao: '39.2, d: ''Penalidades contratuais e, se for o caso, seu cálculo''; 39.2.1, a: ''sanções administrativas tipicamente punitivas (aplicação, dosimetria e declaração)'''
  comentario: A mesma cláusula inclui as penalidades e seu cálculo na competência da Mesa e exclui a aplicação e a dosimetria das sanções; a cláusula de arbitragem exclui o poder sancionatório em sentido
    estrito, mas admite seus reflexos patrimoniais. A fronteira entre o que a Mesa e o tribunal arbitral podem rever fica indefinida.
  dispositivo_legal: art. 151, parágrafo único, da Lei n.º 14.133/2021; art. 1.º, § 1.º, da Lei n.º 9.307/1996
