- id_tmp: G4-054
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E3-136
  - E3-137
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Dispute board, Mesa, CIC e Perícia Conjunta com definições incompatíveis ou sem regulação
  dispositivo_editalicio: Contrato cl. 1.3.23 (PDF p. 8), 36.4.2 (p. 73), 37.3 e 37.4 (p. 74), 39.1, 39.5, 39.7, 39.8 e 39.10 (p. 75-77)
  transcricao: '1.3.23: ''comitê técnico independente [...] responsável por acompanhar sua execução''; 39.5: ''restando a Parte vencida no procedimento com o dever de arcar com todos os seus custos''; 37.3:
    ''emissão de ata decisória de controvérsia, de caráter não vinculante''; 36.4.2: ''não possuindo competência deliberativa, vinculativa, recomendatória ou decisória'''
  comentario: A definição 1.3.23 descreve comitê permanente de acompanhamento, mas a Cláusula 39 cria Mesa ad hoc por controvérsia, com custos adiantados por quem instaura e pagos pelo vencido, sem previsão
    orçamentária para o Município. O Comitê de Interface, sem competência decisória (36.4.2), emite 'ata decisória' (37.3). A 'Perícia Conjunta' aparece nas cl. 37.4, 39.8 e 39.10 como mecanismo autônomo,
    sem rito, nomeação ou custeio.
  dispositivo_legal: arts. 151 e 154 da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
