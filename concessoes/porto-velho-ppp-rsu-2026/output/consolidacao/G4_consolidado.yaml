- id_tmp: G4-039
  tema: QUESTOES_FORMAIS
  ids_origem:
  - E1-026
  - E3-008
  - E3-132
  tipo_achado: IRREGULAR
  categoria: erro_material
  descricao_breve: Termos usados como definidos sem definição e nomenclatura instável no Edital e no Contrato
  dispositivo_editalicio: Edital 1.1 (PDF p. 6-9), 6.3, iii (p. 16), 7.1 (p. 16), 12.3.3 (p. 31), 13.1, j (p. 32), 13.16 (p. 34) e 15.16 (p. 43); Anexo C, Carta de Proposta 3.3 (p. 26); Contrato cl. 1.3,
    5.1.2, 10.4, 13.5.7, 13.6, 15.8.5, 15.8.7, 15.8.8, 22.1.1, 34.1 (p. 71) e 41.1.1; Anexo VI 1.1.4
  transcricao: 'Edital 12.3.3: ''A PROPOSTA ECONÔMICA deverá abranger todos os INVESTIMENTOS OBRIGATÓRIOS, SERVIÇOS OBRIGATÓRIOS''; Contrato 34.1: ''força maior ou caso fortuito superveniente à Data de
    Eficácia'''
  comentario: 'O Edital usa como definidos, sem constarem do item 1.1, termos como DATA DE ENTREGA DOS ENVELOPES, ENDEREÇO ELETRÔNICO, EVTEA, INVESTIMENTOS OBRIGATÓRIOS, SERVIÇOS OBRIGATÓRIOS, ÁREA DA PRESTAÇÃO
    DOS SERVIÇOS CONCEDIDOS, LEI DE LICITAÇÕES, PROPONENTES, CONTRAPRESTAÇÃO MENSAL/ANUAL e ''Contraprestações Públicas Mensais''. O Contrato define apenas CME e CMM e usa ao menos oito outros termos para
    remuneração, garantia e agente (Contraprestação Pública Mensal, Contraprestação Pública Efetiva, Contraprestação Anual Máxima, Garantia Pública, Agente de Garantia, Agente de Pagamento e Garantia, VALOR
    DE PAGAMENTO MENSAL, Data de Eficácia). Alguns têm efeito operativo: a Carta de Proposta compromete o licitante com ''INVESTIMENTOS OBRIGATÓRIOS'' não definidos; no Contrato, esses termos servem de
    base ao reajuste da garantia de execução, à dedução de glosas, ao acionamento da garantia e ao termo inicial da força maior, deixando sem enquadramento claro os eventos entre a assinatura e a Ordem
    de Início.'
  dispositivo_legal: art. 5.º e art. 92, inciso V, da Lei n.º 14.133/2021; art. 23, inciso IV, da Lei n.º 8.987/1995
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
