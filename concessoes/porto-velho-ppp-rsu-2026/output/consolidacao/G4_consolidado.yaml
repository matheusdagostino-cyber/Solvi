  descricao_breve: Caderno 5 (indenização ao operador anterior) ausente; P3 o confunde com a modelagem
  dispositivo_editalicio: P0 III.1, Caderno 5 (PDF p. 11-14), EAP (p. 18) e IV.1 (p. 26); P3 (p. 5, 6 e 52); P7 I.4 (p. 12-13)
  transcricao: 'P0: ''Caderno 5 – Avaliação Econômico-financeira da Indenização [...] considerando investimentos realizados, ativos incorporados e contraprestações públicas recebidas durante o período de
    operação, conforme decisão judicial.''; P3: ''servindo de insumo direto para a Modelagem Econômico-Financeira (Caderno 5)'''
  comentario: O P0 prevê oito cadernos, entre eles o Caderno 5, sobre a indenização ao operador do contrato anulado. O pacote não contém esse caderno; o P7 não o menciona ao articular os produtos; e o P3
    chama de 'Caderno 5' a modelagem econômico-financeira, que é o Caderno 6. Eventual indenização ao operador anterior é obrigação do Município, com efeito sobre a estimativa de impacto orçamentário e
    sobre a transição, e os estudos postos à disposição dos interessados ficam incompletos em relação ao plano de trabalho.
  dispositivo_legal: art. 21 da Lei n.º 8.987/1995, c/c art. 11, caput, da Lei n.º 11.079/2004 (estudos à disposição dos interessados); art. 10, incisos II e IV, da Lei n.º 11.079/2004
  depende_de: Caderno 5 ou registro de sua dispensa pelo CGP/PVH; a decisão judicial a que se refere; valor apurado.
