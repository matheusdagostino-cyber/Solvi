    causa dentro de 30 (trinta) dias'''
  comentario: Para os mesmos descumprimentos do Poder Concedente, o Contrato fixa prazo de cura de até 60 dias (32.5), de 30 dias (32.7) e 'não inferior a 30 dias' (32.10.1).
  dispositivo_legal: art. 39 da Lei n.º 8.987/1995, c/c art. 3.º, caput, da Lei n.º 11.079/2004
