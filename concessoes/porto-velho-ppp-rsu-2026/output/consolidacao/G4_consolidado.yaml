  tipo_achado: IRREGULAR
  categoria: omissao
  descricao_breve: Cláusula arbitral facultativa e sem câmara designada; autoridade nomeadora da Mesa remete a ela
  dispositivo_editalicio: Contrato cl. 39.7.3 (PDF p. 76), 40.1 e 40.2 (p. 77) e 43 (p. 83); P7 VIII.9 e VIII.11 (p. 59-60)
  transcricao: 'Contrato 40.1: ''As controvérsias patrimoniais disponíveis decorrentes deste Contrato poderão ser dirimidas por arbitragem''; 40.2: ''administrada por câmara de reconhecida idoneidade, com
    sede da arbitragem em Porto Velho/RO''; P7 (p. 59): ''a autoridade nomeadora será a mesma instituição prevista para a arbitragem (Cláusula 39.7.3)'''
  comentario: O verbo 'poderão' não estabelece cláusula compromissória cheia, e nenhuma câmara é indicada, nem critério para escolhê-la. A cl. 39.7.3 e o P7 atribuem à 'instituição prevista para a arbitragem'
    a nomeação do presidente da Mesa de Resolução de Conflitos, que fica sem autoridade nomeadora identificável. A instauração da arbitragem pode exigir execução judicial da cláusula e gerar disputa com
    o foro da cl. 43.
  dispositivo_legal: arts. 4.º, 5.º e 7.º da Lei n.º 9.307/1996; art. 11, inciso III, da Lei n.º 11.079/2004; art. 154 da Lei n.º 14.133/2021
  flag_tecnico: false
