  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: Recurso contra rejeição da garantia de proposta só é apreciado após a habilitação
  dispositivo_editalicio: Edital 14.3 e 14.3.1 (PDF p. 39); 18.1, a, 18.2 e 18.2.2 (p. 45-46)
  transcricao: '18.2.2: ''O recurso contra as decisões previstas nas alíneas “a”, “b” e “c” deverá ser interposto e apreciado em fase recursal única. O prazo para apresentação do recurso é de 3 (três) dias
    úteis contados da publicação da decisão relativa à análise dos DOCUMENTOS DE HABILITAÇÃO'''
  comentario: A decisão sobre aceitação ou rejeição das garantias é divulgada antes da sessão (14.3), mas a intenção de recorrer conta da classificação final (18.2), e o recurso só é apreciado na fase única
    após a habilitação (18.2.2). O licitante cuja garantia foi rejeitada fica fora da sessão de lances com o Envelope 2 fechado; se o recurso for provido depois, a sessão terá de ser refeita.
  dispositivo_legal: art. 58, caput, e art. 165, inciso I e § 1.º, incisos I e II, da Lei n.º 14.133/2021
