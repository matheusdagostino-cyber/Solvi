  descricao_breve: Envelope 2 deve ser anônimo, mas rótulo e modelo de proposta exigem identificação
  dispositivo_editalicio: Edital 10.1 e 10.1.1 (PDF p. 22), rótulo do Envelope 2 (p. 23), 10.9 (p. 24), 12.1 (p. 30) e 15.8.4 (p. 41); Anexo C, Carta de Apresentação da Proposta Econômica (p. 25-26)
  transcricao: 'Edital 10.1.1 (p. 22): ''não poderá conter, no nome do arquivo ou em seu conteúdo, a razão social da LICITANTE, a denominação do CONSÓRCIO''; Anexo C (p. 25): ''[RAZÃO SOCIAL DA LICITANTE],
    inscrita no CNPJ/MF sob o nº [ • ], com sede em [ • ]'''
  comentario: Os itens 10.1.1 e 15.8.4 desclassificam a proposta que identifique o licitante. Ainda assim, o rótulo do Envelope 2 traz razão social e líder; o 12.1 exige assinatura pelos representantes
    credenciados; o 10.9 exige assinatura ICP-Brasil, que identifica o signatário; e o modelo obrigatório da Carta de Proposta pede razão social, CNPJ, sede e representantes. Cumprir o modelo leva à desclassificação,
    e cumprir a vedação contraria o modelo.
