- id_tmp: G4-073
  tema: HABILITACAO
  ids_origem:
  - E1-068
  tipo_achado: IRREGULAR
  categoria: contradicao
  descricao_breve: 'Saneamento: proibição absoluta de documento ausente (10.23) × admissão de documento ausente (17.1.1)'
  dispositivo_editalicio: Edital 10.23 (PDF p. 26) × 17.1.1 (p. 45)
  transcricao: '10.23: ''vedada, em qualquer hipótese, a inclusão de documento obrigatório originalmente ausente''; 17.1.1: ''não se aplica à hipótese de documento ausente que apenas comprova condição pré-existente
    já atendida pelo licitante'''
  comentario: O 10.23 veda em qualquer hipótese a juntada de documento obrigatório ausente; o 17.1.1 admite a juntada de documento ausente que comprove condição preexistente. Os dois critérios são incompatíveis
    e dão margem a tratamento desigual na diligência.
  dispositivo_legal: art. 64, caput e incisos I e II, da Lei n.º 14.133/2021; art. 12, inciso IV, da Lei n.º 11.079/2004
  flag_tecnico: false
