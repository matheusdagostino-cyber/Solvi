  tipo_achado: IRREGULAR
  categoria: ilegalidade
  descricao_breve: Declaração falsa punida com impedimento (19.7), quando a lei prevê inidoneidade
  dispositivo_editalicio: Edital 19.5, c e d, 19.5.1 e 19.7 (PDF p. 47-48)
  transcricao: '19.7: ''As sanções de que tratam as alíneas (b) e (c) do subitem 19.5 também poderão ser aplicadas àqueles que fizerem ou apresentarem declaração falsa ou documento falso e àqueles que não
    mantiverem a PROPOSTA ECONÔMICA.'''
  comentario: A apresentação de declaração ou documento falso (art. 155, VIII) atrai a declaração de inidoneidade (art. 156, § 5.º); o impedimento (§ 4.º) é previsto para as infrações dos incisos II a VII.
    O item 19.7 aplica a essa conduta a multa (alínea b, cabível para qualquer infração) e o impedimento (alínea c), e não a inidoneidade (alínea d), embora o 19.5.1 trate da reabilitação por declaração
    falsa com referência às alíneas c e d.
  dispositivo_legal: art. 155, inciso VIII, e art. 156, §§ 3.º, 4.º e 5.º, da Lei n.º 14.133/2021
  flag_tecnico: false
  flag_reserva: false
  reserva_tipo: null
