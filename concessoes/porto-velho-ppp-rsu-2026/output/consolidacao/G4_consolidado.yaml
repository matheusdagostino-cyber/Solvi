  categoria: erro_material
  descricao_breve: Consequência da falta de garantia redigida como faculdade ('poderão') e misturando inabilitação e exclusão
  dispositivo_editalicio: Edital 11.11 (PDF p. 28)
  transcricao: '11.11: ''As LICITANTES que não apresentarem a GARANTIA DE PROPOSTA nas condições estabelecidas neste EDITAL poderão ser inabilitadas, estarão impedidas de prosseguir na LICITAÇÃO'''
  comentario: A garantia funciona como requisito prévio à abertura das propostas, mas o item diz que os licitantes 'poderão ser inabilitadas' e, ao mesmo tempo, 'estarão impedidas de prosseguir'. A redação
    facultativa abre espaço a tratamento não isonômico.
