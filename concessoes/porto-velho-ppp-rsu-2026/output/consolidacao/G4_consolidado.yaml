  dispositivo_editalicio: Anexo C, Modelo 1 – Carta de Fiança (PDF p. 22-23) e Modelo 2 – Seguro-Garantia, item 2.1 (p. 24) × Edital 10.6.1, 10.16 (p. 24-25) e 11.14, d (p. 29)
  transcricao: 'Anexo C, Modelo 1 (p. 23): ''[Assinatura do(s) representante(s) legal(is), com firma(s) reconhecida(s)] Testemunhas''; Modelo 2 (p. 24): ''com sede na Av. 7 de setembro com Av. Farquar,
    Centro, Porto Velho – RO'''
  comentario: O modelo de fiança exige firma reconhecida e testemunhas; o Edital dispensa reconhecimento de firma (10.16) e exige instrumentos eletrônicos com assinatura digital (10.6.1). O modelo de seguro
    qualifica o segurado com endereço diferente do indicado no preâmbulo do Edital (SEINFRA), e o 11.14, d, exige a qualificação indicada no preâmbulo.
