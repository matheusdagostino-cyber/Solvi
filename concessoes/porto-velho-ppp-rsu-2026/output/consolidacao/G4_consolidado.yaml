  dispositivo_editalicio: Edital 13.1, a (PDF p. 31); Anexo C, Declaração 11, a (p. 18); Contrato (sem exigência)
  transcricao: 'Edital 13.1, a: ''a ser estruturada sob a forma de sociedade por ações''; Anexo C, Decl. 11, a: ''com sede e administração no Brasil, no Município de Porto Velho, Estado de Rondônia'''
  comentario: O Edital exige forma de sociedade por ações, que a Declaração 11 não menciona; a Declaração 11 exige sede no Município de Porto Velho, requisito ausente do Edital. Nenhum dos dois aparece
    no Contrato. Não localizei norma que imponha a forma de S.A.; a lei apenas faculta que a SPE seja companhia aberta.
