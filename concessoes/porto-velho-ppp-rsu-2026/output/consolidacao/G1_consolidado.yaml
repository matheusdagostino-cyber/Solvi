  - id_tmp: G1-012
    tema: OBJETO_ESCOPO
    ids_origem: [E1-041, E2-010, E3-038, E4-020, E5-066, E6-022]
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Rota de tratamento de RSS indefinida: autoclave na CTR x reativação do incinerador municipal"
