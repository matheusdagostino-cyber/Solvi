    dispositivo_editalicio: "Edital 3.1, viii (PDF p. 13) e 6.3, iv (p. 16); Anexo III I (p. 6) e VII.1 (p. 17); P1 VII.2.4 (p. 84) e Referências (p. 109); P4 II.1 (p. 9) e Tabela 1 (p. 10); P0 I.2, limitação vii (p. 5); P7 (sem exame do art. 10, VII)"
