    dispositivo_editalicio: "Contrato cl. 10.13.1, inciso v, e 10.13.3 a 10.13.8 (PDF p. 31-33); P7 XI.3.3 (p. 68-69)"
    transcricao: "Contrato 10.13.1, v: 'qualquer outro negócio jurídico apto a transferir à Concessionária a propriedade plena do bem' x P7 XI.3.3: 'A obrigação pode ser cumprida por qualquer forma jurídica lícita — implantação própria, aquisição, arrendamento ou contratação de terceiro'"
    comentario: "O Contrato só admite formas que transfiram a propriedade plena do aterro (construção, compra, aquisição societária, permuta etc.) e o inclui entre os bens reversíveis, com requisitos dos itens 10.13.3 a 10.13.8. O P7 descreve a obrigação como cumprível por arrendamento ou contratação de terceiro, hipóteses incompatíveis com a reversão. A divergência afeta a formação do preço da solução de disposição final."
    dispositivo_legal: "art. 5.º da Lei n.º 14.133/2021; art. 18, incisos X e XI, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004"
