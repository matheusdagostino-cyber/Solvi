    comentario: "A central objeto da PPP chama-se 'CTR Porto Velho', mesma denominação da titular da LAO do aterro privado Ecoparque ('CTR PORTO VELHO S/A'). O Caderno usa 'Aterro Sanitário CTR Porto Velho' como destino nas rotas de referência. O Contrato (10.13 e 10.13.1) permite cumprir a obrigação de aterro por aquisição de aterro existente ou de participação societária. A homonímia deixa ambíguas cláusulas de destinação, transição e bens reversíveis, inclusive quanto a se o objeto exige construir o aterro de rejeitos ou admite usar ou adquirir o aterro privado."
    dispositivo_legal: "art. 18, incisos I e XV, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021"
