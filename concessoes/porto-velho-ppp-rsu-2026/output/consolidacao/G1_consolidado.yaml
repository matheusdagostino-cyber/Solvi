  - id_tmp: G1-005
    tema: OBJETO_ESCOPO
    ids_origem: [E6-021]
    tipo_achado: IRREGULAR
    categoria: omissao
    descricao_breve: "Ausência de avaliação comparativa de rotas tecnológicas (alternativas, custos e critérios)"
    dispositivo_editalicio: "P2 Cap. V (PDF p. 29-40); P3 IV.3 (p. 19); P0 (escopo do Caderno 2, p. 10)"
    transcricao: "P3, p. 19: 'a viabilidade econômica de usinas de tratamento térmico com recuperação energética (Waste-to-Energy - WTE) no Brasil exige um fluxo mínimo de 300 a 350 toneladas de RSU por dia [...] essa tecnologia não integrará o escopo de metas obrigatórias deste projeto'"
    comentario: "O capítulo de 'avaliação de rotas tecnológicas' do P2 descreve rotas regionais, mas não compara alternativas (TMB, biodigestão, CDR, tratamento térmico, aterro) com custos, massas e critérios de escolha. O P3 descarta o tratamento térmico citando limiar de 300-350 t/dia, embora a geração projetada no próprio estudo (150.809 t/ano em 2027 a 172.796 t/ano em 2056, cerca de 413 a 473 t/dia — cálculo) supere esse limiar, sem outra fundamentação. O P0 previa 'avaliação comparativa de soluções tecnológicas e logísticas' para o Caderno 2."
    dispositivo_legal: "art. 18, § 1.º, inciso V, da Lei n.º 14.133/2021 c/c art. 186 da mesma Lei; art. 9.º, caput e § 1.º, da Lei n.º 12.305/2010; art. 10, inciso I, alínea 'a', da Lei n.º 11.079/2004"
    depende_de: ""
    flag_tecnico: true
    flag_reserva: false
    reserva_tipo: null
    nota_reserva: ""

  - id_tmp: G1-006
    tema: OBJETO_ESCOPO
    ids_origem: [E6-049]
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "UVR: triagem de todo o RSU x unidade voltada a centros comerciais; sem capacidade nominal"
    dispositivo_editalicio: "P2 III.1 (PDF p. 10) x V.6 (p. 40); P3 p. 19-20 e 50; Contrato cl. 10.3.2 (p. 28); Caderno Tabela 23 (p. 26)"
    transcricao: "P2, p. 10: 'O futuro CTR tambem deverá realizar triagem mecanizada dos resíduos sólidos urbanos coletados' x P2, p. 40: 'dimensionou-se uma Unidade de Valorização de Resíduos Sólidos provenientes da coleta urbana, direcionada prioritariamente aos setores que atendam aos centros comerciais'"
    comentario: "O P2 ora prevê triagem mecanizada de todo o RSU coletado, ora uma UVR dirigida prioritariamente aos setores comerciais. A capacidade 'nominal' não é informada (t/dia, turnos, taxa de recuperação); o único parâmetro é a velocidade de esteira de 12 m/min, que o Contrato (10.3.2) torna vinculante. O P3 assume parcela de recuperação por triagem mecanizada sem dimensionar a unidade. O escopo físico da UVR, parte do objeto (Edital 3.1, viii), fica indeterminado."
    dispositivo_legal: "art. 18, incisos I e XV, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004"
    depende_de: ""
    flag_tecnico: true
    flag_reserva: false
    reserva_tipo: null
    nota_reserva: ""

  - id_tmp: G1-007
    tema: OBJETO_ESCOPO
    ids_origem: [E2-044, E5-037, E6-048]
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Capacidade de compostagem divergente entre Anexo III, P2, P3/P6 e Meta 7"
    dispositivo_editalicio: "Anexo III IX.6 (PDF p. 24); P4 VII.1 (p. 31); P2 V.5.1 (p. 37), Figura 18 (p. 38) e V.5.2 (p. 39); P3 Tabela 10 (p. 21); P6 III.8 (p. 22) e Tabela 4 (p. 34); Anexo D Tabela 1, Meta 7 (p. 8)"
    transcricao: "Anexo III IX.6: 'Unidade Central na CTR-PV, com capacidade inicial de 30 t/dia e evolução para 80 a 120 t/dia em M60' x P2, p. 37: '108,4 ton serão encaminhados à compostagem' x P6, p. 22: 'compostagem da fração orgânica de feiras e mercados'"
    comentario: "O Anexo III (que prevalece sobre o EVTEA, Edital 2.11.2) e o P4 recomendam unidade central de 30 t/dia evoluindo para 80-120 t/dia em M60, além de unidades comunitárias. O texto do P2 afirma que 108,4 t/dia seriam encaminhadas à compostagem, mas o valor provém de figura ilustrativa ('exemplo de fluxo de massa', Figura 18), na qual 108,4 t/dia consta da coluna 'evaporação'. O P3 (Tabela 10) projeta recuperação orgânica de 1.783 t/ano em 2027 (cerca de 5 t/dia — cálculo), e o P6 prevê apenas compostagem de resíduos de feiras e mercados, sem linha de CAPEX específica. O termo 'recomenda-se' deixa incerto se a capacidade do Anexo III é obrigatória."
    dispositivo_legal: "art. 36, inciso V, e art. 9.º da Lei n.º 12.305/2010; art. 18, inciso XV, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021"
    depende_de: ""
    flag_tecnico: true
    flag_reserva: true
    reserva_tipo: RESERVA
    nota_reserva: "O 'recomenda-se' permite sustentar que só a Meta 7 é exigível; se a fiscalização exigir 80-120 t/dia, abre-se pleito de reequilíbrio (Edital 3.1.4). A impugnação pode fixar capacidade exigível sem recomposição."
    cruzamentos: ["G2 E6-012 e E6-013 (leitura e premissas do balanço de massa do P2)", "G2 E2-017 (pátio de compostagem fora do CAPEX)"]

  - id_tmp: G1-008
    tema: OBJETO_ESCOPO
    ids_origem: [E2-045]
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
    descricao_breve: "Fração orgânica de 51% com meta de tratamento biológico de 3% a 7,5% e sem indicador no IQS"
    dispositivo_editalicio: "Caderno Tabela 5 (PDF p. 11) e Tabela 8, Meta 7 (p. 13); Anexo D Tabela 1 (p. 8) e Tabela 5 (p. 14); Anexo III III (p. 7) e IX.6 (p. 24)"
    transcricao: "Anexo D, Tabela 1: 'AUMENTO DA RECICLAGEM DA FRAÇÃO ORGÂNICA | Percentual da massa total para tratamento biológico | 3% | 4,50% | 6% | 7,50%'"
    comentario: "Cerca de 51% da massa é orgânica, mas a Meta 7 fixa tratamento biológico entre 3% (2028) e 7,5% (2040) da massa total, o que destina a maior parte da fração orgânica ao aterro. A Meta 7 consta da Tabela 1 do Anexo D, mas não tem indicador na Tabela 5 (IQS), que só mede a Meta 6 (IQ1). O Anexo III qualifica a compostagem como diretriz prioritária. Não se verificou se o PMSB/PMGIRS vigente fixa meta superior para orgânicos."
    dispositivo_legal: "art. 9.º e art. 36, inciso V, da Lei n.º 12.305/2010; art. 19, inciso XIV, da Lei n.º 12.305/2010; não localizei fundamento normativo que fixe percentual mínimo de tratamento biológico"
    depende_de: "Metas do PMSB/PMGIRS (LC Municipal n.º 972/2023) para a fração orgânica; texto do plano não integra o pacote."
    flag_tecnico: true
    flag_reserva: false
    reserva_tipo: null
    nota_reserva: ""
    cruzamentos: ["G2 E2-061 (encargos sem indicador no IQS)"]

  - id_tmp: G1-009
    tema: OBJETO_ESCOPO
    ids_origem: [E2-019, E6-024]
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "CDR obrigatório no Edital e no Contrato, condicional no Caderno e no Anexo III"
    dispositivo_editalicio: "Edital 3.1, viii (PDF p. 13); Contrato cl. 4.1, viii (p. 12) e 10.3.9 (p. 28); Caderno Tabela 2 (p. 9), Tabela 23 (p. 26), V.3 e Tabela 24 (p. 27); Anexo III IX.5 (p. 24); P3 p. 19"
    transcricao: "Contrato 10.3.9: 'A rota tecnológica de tratamento adotará a triagem mecanizada dos recicláveis na UVR e o aproveitamento da fração de rejeitos com conteúdo energético para produção de Combustível Derivado de Resíduos (CDR)' x Caderno, Tabela 2: 'Combustível Derivado de Resíduos, quando tecnicamente viável' x Caderno V.3 e Anexo III IX.5: 'quando adotada'"
    comentario: "Edital e Contrato (4.1, viii, e 10.3.9) incluem o processamento de CDR como estrutura e rota obrigatória da CTR. O Caderno o condiciona ('quando tecnicamente viável', 'quando viável e aprovado', 'quando adotada'; Tabela 24: 'Depende de viabilidade, licenciamento e mercado consumidor'), e o Anexo III repete 'quando adotada'. O P3 exclui rotas térmicas das metas obrigatórias, e o P2 descreve a linha de CDR sem capacidade, massa ou custo. Não está definido se a linha de CDR é obrigação certa, se sua falta afeta a remuneração, nem quem decide sobre a 'viabilidade'."
    dispositivo_legal: "art. 18, inciso I, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021"
    depende_de: ""
    flag_tecnico: true
    flag_reserva: false
    reserva_tipo: null
    nota_reserva: ""
    cruzamentos: ["G3 E3-082 (CDR obrigatório sem risco de mercado alocado)", "G2 E4-056 (linha de CDR sem CAPEX)"]

  - id_tmp: G1-010
    tema: OBJETO_ESCOPO
    ids_origem: [E2-020, E5-039, E6-024]
    tipo_achado: IRREGULAR
    categoria: omissao
    descricao_breve: "CDR sem demonstração de viabilidade técnica e ambiental, especificação ou mercado consumidor"
    dispositivo_editalicio: "Caderno Tabela 24 (PDF p. 27); P2 V.6 (p. 40); P6 II.2 (p. 13); P1 VIII.1 (p. 96) e IX (p. 106); P4 (ausência de análise de CDR)"
    transcricao: "P6, p. 13: 'prensagem para otimizar o transporte até indústrias cimenteiras para coprocessamento [...] gera receita pela venda do CDR às cimenteiras' x Caderno, Tabela 24: 'Depende de viabilidade, licenciamento e mercado consumidor.'"
    comentario: "P2 e P6 indicam coprocessamento em cimenteiras, com receita de venda, mas nenhum documento identifica planta receptora, distância, especificação exigida (PCI, umidade, teor de cloro), produção estimada ou manifestação de interesse de comprador. P1 recomenda 'valorização energética' e P4 não avalia emissões nem monitoramento dessa rota. A PNRS condiciona a recuperação energética à comprovação de viabilidade técnica e ambiental e à implantação de programa de monitoramento de emissão de gases aprovado pelo órgão ambiental."
    dispositivo_legal: "art. 9.º, § 1.º, da Lei n.º 12.305/2010; Resolução CONAMA n.º 499/2020 (coprocessamento em fornos de clínquer — conferir aplicabilidade); NR n.º 7/2024 da ANA (Resolução ANA n.º 187/2024) — dispositivos a conferir"
    depende_de: ""
    flag_tecnico: true
    flag_reserva: false
    reserva_tipo: null
    nota_reserva: ""
    cruzamentos: ["G3 E3-082", "G2 E4-056, E6-060"]

  - id_tmp: G1-011
    tema: OBJETO_ESCOPO
