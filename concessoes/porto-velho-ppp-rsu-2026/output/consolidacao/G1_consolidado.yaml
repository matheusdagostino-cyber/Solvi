    dispositivo_editalicio: "Contrato considerando i (PDF p. 5), cl. 1.3.49 (p. 10) e 4.1 (p. 12); Edital 3.1 (p. 12-13); P7 II.8 (p. 20), III.2 (p. 26) e III.2.4 (p. 28); P6 II.2 (p. 11-12) e Tabela 8 (p. 42); P0 II.2 (p. 8)"
    transcricao: "Contrato 4.1: 'serviços públicos de implantação, operação, manutenção, limpeza urbana, coleta, reciclagem e disposição final dos resíduos sólidos' x P7 II.8: 'A delimitação do objeto ao manejo de RSU, com exclusão da limpeza urbana, é, portanto, integral.' x P6, p. 12: 'A varrição é integralmente remunerada pela Contraprestação Pública e não gera receitas acessórias.'"
    comentario: "O Contrato inclui 'limpeza urbana' no objeto (4.1), na definição de Serviços (1.3.49: 'limpeza urbana e manejo de resíduos sólidos') e no considerando i, enquanto Edital (3.1), Caderno e Anexo III não preveem varrição, capina ou atividades congêneres e o P7 afirma a exclusão integral da limpeza urbana. O P6 (p. 11-12) descreve a varrição como serviço da concessão remunerado pela contraprestação, mas sua Tabela 8 (custos de pessoal) não contém equipes de varrição; o P0 incluía a varrição no escopo dos estudos. A divergência permite exigir serviço não precificado ou, inversamente, sustentar custo de varrição embutido na contraprestação sem obrigação correspondente."
    dispositivo_legal: "art. 3.º, inciso I, alínea 'c', e art. 7.º da Lei n.º 11.445/2007; art. 23, inciso I, da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021"
    depende_de: ""
    flag_tecnico: false
    flag_reserva: true
    reserva_tipo: RESERVA
    nota_reserva: "Hipótese do extrator E7: se a CP precifica varrição não exigida pelo Caderno, há erro favorável à concessionária. A Tabela 8 do P6 não traz equipes de varrição, o que não confirma essa hipótese; a ambiguidade tem também efeito adverso (exigência de varrição sem remuneração). Decisão do advogado."

  - id_tmp: G1-023
    tema: OBJETO_ESCOPO
    ids_origem: [E2-040, E5-015]
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    descricao_breve: "Resíduos de limpeza urbana (RLU) no balanço de massa sem regra de recebimento, transporte e medição"
    dispositivo_editalicio: "Caderno Tabela 2, termo RLU (PDF p. 8), e Tabela 7 (p. 12); P6 Tabela 3 e p. 33; P1 VII (p. 61)"
    transcricao: "Caderno, Tabela 2: 'RLU | Resíduos de limpeza urbana, quando integrados ao fluxo de manejo previsto no contrato.' / P1, p. 61: 'MB Limpeza Urbana o Varrição e poda; e transporte até o aterro Ecoparque.'"
    comentario: "A Tabela 7 do Caderno inclui 16.086 t/ano de RLU (2027) na massa bruta, e o P6 considera o RLU da varrição no fluxo de destinação. Varrição e poda são executadas hoje por terceiro (MB Limpeza Urbana), cujo contrato não é descrito, e não integram o objeto do Edital. Não está definido se a concessionária deve receber e dispor o RLU municipal, quem o transporta à CTR, como a massa é medida nem se ela integra a base de remuneração variável."
    dispositivo_legal: "art. 3.º-C, inciso III, da Lei n.º 11.445/2007; art. 18, inciso I, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004"
    depende_de: "Contrato vigente de varrição/poda (MB Limpeza Urbana) e cláusula de destinação; confirmação de que a massa de RLU integra a base de destinação final e da Parcela B."
    flag_tecnico: false
    flag_reserva: false
    reserva_tipo: null
    nota_reserva: ""

  - id_tmp: G1-024
    tema: OBJETO_ESCOPO
    ids_origem: [E7-044]
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    descricao_breve: "Suposta vedação legal à concessão da limpeza pública afirmada sem fonte normativa"
    dispositivo_editalicio: "P7 III.2.4 (PDF p. 28)"
    transcricao: "P7 III.2.4: 'que veda a concessão das atividades de limpeza pública (varrição de vias, lavagem, raspagem de sarjetas, roçagem de margens de córregos e poda de árvores), as quais devem ser executadas por servidores públicos municipais'"
    comentario: "O P7 fundamenta o recorte do objeto em vedação à concessão da limpeza pública e em dever de execução por servidores, sem citar a norma. A legislação federal refere a limpeza urbana entre os serviços passíveis de concessão sem lei autorizativa específica. Se a vedação decorrer de norma municipal, ela deve ser identificada; se não existir, a premissa do recorte do objeto não tem base indicada."
    dispositivo_legal: "não localizei fundamento normativo específico para a vedação afirmada; art. 2.º da Lei n.º 9.074/1995 (conferir redação vigente)"
    depende_de: "Identificação da norma (municipal ou outra) invocada pelo P7."
