  - id_tmp: G1-028
    tema: OBJETO_ESCOPO
    ids_origem: [E5-082, E7-041]
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    descricao_breve: "Grandes geradores: universo excluído da coleta pública indefinido e não quantificado"
    dispositivo_editalicio: "P7 II.10 (PDF p. 21); P1 V.3 (p. 58) e VI (p. 59 e 61); Contrato cl. 18.2, i (p. 42); Edital 3.1.1 (p. 13)"
    transcricao: "P7 II.10: 'com geração de resíduos sólidos em volume superior a 100 litros/dia. O art. 3º veda a coleta pública de resíduos aos empreendimentos que gerem quantidade superior a 200 litros/dia'"
    comentario: "Segundo o P7, o Decreto Municipal n.º 15.603/2018 define grandes geradores a partir de 100 L/dia e veda a coleta pública acima de 200 L/dia; o P7 afirma que grandes geradores estão fora do escopo sem tratar da faixa entre 100 e 200 L/dia, e informa que o decreto regulamentava a LC n.º 199/2004, substituída pela LC n.º 878/2021, sem verificar sua vigência. O P1 afirma, em capítulo conceitual (p. 59), caber ao Poder Concedente a gestão de 'todos esses resíduos' e, na p. 61, atribui ao gerador os grandes geradores. Os estudos não quantificam os grandes geradores nem dizem se a massa hoje destinada ao Ecoparque os inclui; o Contrato (18.2, i) trata seu atendimento como receita acessória."
    dispositivo_legal: "art. 20, inciso II, alínea 'b', e art. 27 da Lei n.º 12.305/2010; art. 3.º-C, inciso II, da Lei n.º 11.445/2007"
    depende_de: "Vigência do Decreto Municipal n.º 15.603/2018 após a LC Municipal n.º 878/2021; cadastro e quantificação de grandes geradores; composição da massa pesada no Ecoparque."
    flag_tecnico: false
    flag_reserva: true
    reserva_tipo: RESERVA
    nota_reserva: "Grandes geradores formam mercado de receita acessória não dimensionado nos estudos; a assimetria informacional favorece quem já conhece a demanda local."
    cruzamentos: ["G2 E7-040 (preço público de grandes geradores convertido em receita da concessionária)", "G2 E6-062"]

