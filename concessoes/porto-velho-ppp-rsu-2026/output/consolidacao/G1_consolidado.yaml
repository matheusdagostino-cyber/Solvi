  - id_tmp: G1-027
    tema: OBJETO_ESCOPO
    ids_origem: [E2-033, E4-092]
    tipo_achado: IRREGULAR
    categoria: omissao
    descricao_breve: "Ecopontos e PEVs sem número, localização e cronograma; função divergente entre documentos"
    dispositivo_editalicio: "Edital 3.1, ix (PDF p. 13); Caderno IV.3 e Tabela 14 (p. 18-19), X.6.5 (p. 44-45); Anexo III Tabela 3 (p. 10); P6 III.5 (p. 20) e Tabela 7, item 1.4.1 (p. 37); Contrato cl. 10.3.11 (p. 29)"
    transcricao: "Caderno, Tabela 14: 'PEVs/Ecopontos | Manter pontos limpos, sinalizados, seguros, acessíveis e com retirada regular.' / Anexo III, Tabela 3: '10 unidades restritas à Sede Administrativa [...] Ausência total de PEVs nos 14 distritos.'"
    comentario: "A operação e manutenção de ecopontos integra o objeto (Edital 3.1, ix), mas nenhum anexo fixa quantos ecopontos e PEVs implantar, onde e quando. O Anexo III registra 10 ecopontos na Sede e nenhum nos distritos; o P6 descreve 'uma rede de dez Ecopontos [...] para entrega voluntária de recicláveis' e orça 'aquisição' de R$ 300 mil (Ano 1) e R$ 450 mil em ciclos posteriores, sem quantidade; o Contrato os destina a volumosos, RCC e poda. A obrigação fica indeterminada para fins de proposta e de fiscalização."
    dispositivo_legal: "art. 18, incisos I e II, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 10-A, inciso I, da Lei n.º 11.445/2007"
