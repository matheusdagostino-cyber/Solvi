  - id_tmp: G1-062
    tema: LICENCIAMENTO_AMBIENTAL
    ids_origem: [E2-071, E6-032, E5-042]
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
    descricao_breve: "Prazo de licenciamento (LP, LI, LO e possível EIA/RIMA do aterro) não compatibilizado com cronograma e metas do Ano 2"
    dispositivo_editalicio: "Anexo III VII.1, § 2.º (PDF p. 17); Anexo D Tabela 3 (p. 10) e Tabela 5, IE1, IE3 e IE4 (p. 14); P2 Tabela 15 (p. 43-45) e Tabela 16, item 4.5 (p. 46); P6 p. 46 e 50; Contrato cl. 8.7 (p. 19), 8.12 (p. 20), 10.13.1.1 (p. 31), 26.30 (p. 62); P4 Cap. III a VI (p. 10-29)"
    transcricao: "Anexo III VII.1: 'Nenhuma instalação nova, ampliada, reativada ou modificada poderá iniciar operação sem a regularidade ambiental necessária e sem a comprovação de atendimento às condicionantes pré-operacionais.'"
    comentario: "O Anexo D exige CTR 50% implantada e Jirau e incinerador reativados no Ano 2, e o P2 reduz a disposição no Ecoparque a partir do Ano 3, o que pressupõe LP, LI e LO de aterro novo em 12 a 24 meses. Não há cronograma de licenciamento nem de projetos; a Resolução CONAMA n.º 01/1986 lista aterros sanitários entre as atividades sujeitas a EIA/RIMA, e o P4 não trata desse estudo, de seu prazo ou custo (o termo EIA/RIMA só aparece no pedido de dados do P0). O Contrato isenta de penalidades os atrasos não imputáveis (8.7) e os que superem prazos legais por mora do órgão (8.12, 26.30), mas exclui o aterro do reequilíbrio por demora no licenciamento (10.13.1.1)."
    dispositivo_legal: "art. 2.º, inciso X, da Resolução CONAMA n.º 01/1986; art. 14 da Resolução CONAMA n.º 237/1997; art. 225, § 1.º, inciso IV, da CF/1988; art. 5.º, inciso III, da Lei n.º 11.079/2004"
    depende_de: "Enquadramento do aterro da CTR quanto à exigência de EIA/RIMA pelo órgão licenciador; prazo efetivo de tramitação; estado do licenciamento da área ('Relatório de Ratificação', 2024)."
    flag_tecnico: true
