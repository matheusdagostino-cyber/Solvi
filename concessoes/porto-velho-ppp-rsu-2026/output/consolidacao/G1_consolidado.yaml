  - id_tmp: G1-031
    tema: OBJETO_ESCOPO
    ids_origem: [E3-076, E4-073]
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Recebimento compulsório de resíduos fora do escopo por ordem da ARDPV x direito de recusa e desobrigação"
    dispositivo_editalicio: "Edital 3.1.1.1 (PDF p. 13), 3.1.2.1 e 3.1.2.2.1 (p. 14); Contrato cl. 10.5 (p. 29), 10.13.5.4 (p. 32), 18.2.2 e 18.2.2.1 (p. 42), 26.3, viii (p. 56-57); Matriz TO-12 (p. 11-12)"
    transcricao: "Edital 3.1.1.1: 'A Concessionária poderá recusar [...] o recebimento dos resíduos de que trata o item 3.1.1' x Edital 3.1.2.1: 'A recusa de recebimento em desacordo com ordem escrita da ARDPV sujeitará a Concessionária a sanção' x Contrato 10.5: 'A Concessionária não será obrigada a prestar serviços que não constem neste Contrato'"
    comentario: "O Edital (3.1.1.1) autoriza a recusa de resíduos fora do objeto (Classe I não RSS, RCC, industriais) e de cargas que comprometam licenciamento ou vida útil; o Edital (3.1.2.1), o Contrato (18.2.2.1 e 26.3, viii — multa entre '[0,5% e 30%]' do valor anual, com colchetes no original) e a Matriz (TO-12) sancionam a recusa contrária a ordem escrita da ARDPV, com 'tarifa especial' ou reequilíbrio a definir. O Contrato 10.5 desobriga a concessionária de serviços não previstos. Não há critério que concilie as regras, limite o consumo de vida útil do aterro (o 10.13.5.4 veda comprometê-la) ou trate do recebimento de Classe I em unidades não licenciadas para esses resíduos."
    dispositivo_legal: "arts. 20 e 27 da Lei n.º 12.305/2010; art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021"
    depende_de: ""
    flag_tecnico: true
    flag_reserva: false
    reserva_tipo: null
    nota_reserva: "[VALIDAÇÃO TÉCNICA: ponto depende de confirmação de engenharia — compatibilidade das licenças da CTR com resíduos Classe I]"

  - id_tmp: G1-032
