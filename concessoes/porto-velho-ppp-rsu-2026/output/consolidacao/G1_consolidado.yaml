    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    descricao_breve: "Universo de RSS custeado pela contraprestação indefinido; RSS privado de recebimento compulsório"
    dispositivo_editalicio: "Edital 1.1.9 (PDF p. 7), 3.1, iii (p. 12), 3.1.2 e 3.1.2.2 (p. 13-14); Caderno Tabela 2, termo RSS (p. 8); Contrato cl. 18.2, i, e 18.2.2 (p. 42); P7 II.9 e II.10 (p. 20-21); P1 VI (p. 59)"
    transcricao: "Edital 3.1.2: 'Os resíduos de serviços de saúde (RSS) de geradores eventualmente não abrangidos pela coleta pública não integram o objeto [...] a Concessionária não poderá recusar o recebimento e o tratamento desses RSS' x Caderno, Tabela 2: 'destinação específica definida para unidades municipais atendidas'"
    comentario: "O Edital exclui do objeto os RSS de geradores 'não abrangidos pela coleta pública', sem dizer quais geradores estão abrangidos; o Caderno limita o RSS do objeto às 'unidades municipais atendidas', e o P1 (p. 59) se refere aos RSS 'gerados pelas unidades da prefeitura'. Não há cadastro ou quantitativo das unidades geradoras abrangidas. O Edital (3.1.2) obriga a concessionária a receber e tratar RSS de geradores privados, invocando 'monopólio dos serviços públicos de tratamento térmico de RSS', mediante tarifa especial fixada pela ARDPV como receita acessória (Contrato 18.2.2), sem dimensionamento da capacidade de tratamento para essa demanda. A legislação atribui ao gerador o gerenciamento dos seus RSS."
    dispositivo_legal: "art. 20, inciso I, e art. 27 da Lei n.º 12.305/2010; art. 3.º-C da Lei n.º 11.445/2007; Resolução CONAMA n.º 358/2005; art. 18, inciso I, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004"
    depende_de: "Cadastro das unidades geradoras públicas abrangidas e massa de RSS considerada no P3/P6; existência de alternativa privada de tratamento (o P1, p. 88, refere incinerador particular em uso)."
    flag_tecnico: true
    flag_reserva: true
    reserva_tipo: RESERVA
    nota_reserva: "A obrigação de receber RSS de geradores privados, com tarifa especial e exclusividade de fato, cria receita acessória cativa e pouco evidente para quem tiver capacidade de tratamento. Suscitar a delimitação pode eliminar essa receita."
    cruzamentos: ["G2 E1-038 (receita acessória cativa de RSS privado)", "G2 E3-075 (erário custeando RSS privado via reequilíbrio)", "G2 E4-055"]

