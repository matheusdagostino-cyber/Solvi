# [USO INTERNO] Consolidador C — Fase 1 — PPP RSU Porto Velho/RO — Grupo G1 (OBJETO_ESCOPO e LICENCIAMENTO_AMBIENTAL)
# Páginas = página do PDF (marcadores '===== [PDF p. N] =====' dos .txt). Transcrições conferidas por grep nos textos-fonte.
# Campo extra 'cruzamentos': pontos correlatos em outros grupos (G2/G3/G4), para deduplicação final.
pontos:

# ============================== OBJETO_ESCOPO ==============================

  - id_tmp: G1-001
    tema: OBJETO_ESCOPO
    ids_origem: [E1-033, E3-023, E7-085]
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "EVTEA vinculante e definidor do escopo de investimentos, mas sem definição e fora do rol de anexos"
    dispositivo_editalicio: "Edital 1.1 (sem definição de EVTEA), 2.8 e 2.9 (PDF p. 11), 2.11, 2.11.1 e 2.11.2 (p. 11-12), 3.1 'Investimentos em Infraestrutura' (p. 13), 3.1.4 (p. 14); Contrato considerando iv (p. 5), cl. 4.2, 4.2.1 e 4.2.1.1 (p. 13), 7.1 (p. 17); P0 I.3, objetivo (ix) (p. 5) e Fase 5 (p. 26-27); P7 III.2.2 (p. 27) e XI.4 (p. 70-71)"
    transcricao: "Edital 3.1: 'incluindo o EVTEA, o qual integra o CONTRATO como parte indissociável e define o escopo integral das obrigações de investimento da CONCESSIONÁRIA' x Edital 2.11.2: 'Em caso de divergência entre o EVTEA e os ANEXOS do EDITAL ou do CONTRATO, prevalecerão estes últimos'"
    comentario: "O Edital (3.1) e o Contrato (4.2) tratam o EVTEA como parte indissociável do Contrato e como delimitador do escopo integral dos investimentos; o Contrato remete a ele dezenas de vezes ('inclusive o EVTEA'). O EVTEA, porém, não é definido no item 1.1, não consta dos róis de anexos (Edital 2.8 e 2.9) e é subordinado aos anexos em caso de divergência (2.11.2). O item 2.11.1 o identifica com três estudos (técnico, econômico-financeiro e jurídico-institucional), o P0 previa um relatório consolidado (Fase 5) que não integra o pacote, e o Caderno 5 (indenização) previsto no P0 também não foi disponibilizado. Combinado com Edital 3.1.4 e Contrato 4.2.1.1, investimento não listado nos anexos 'ou no EVTEA' só é exigível mediante reequilíbrio, o que torna indeterminado o instrumento que fixa o escopo de investimento."
    dispositivo_legal: "art. 18, inciso IV, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 10, § 4.º, da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021"
    depende_de: ""
    flag_tecnico: false
    flag_reserva: true
    reserva_tipo: RESERVA
    nota_reserva: "A limitação do escopo de investimento ao que estiver listado nos anexos/EVTEA (Edital 3.1.4; Contrato 4.2.1.1) favorece a concessionária: todo investimento não listado gera pleito de reequilíbrio. Impugnar a indefinição pode levar à fixação de escopo mais amplo e exigível sem recomposição."
    cruzamentos: ["G3 E4-085 (risco de erro/omissão do EVTEA sem alocação)", "G2 E7-074 (Produto 5 ausente)"]

  - id_tmp: G1-002
    tema: OBJETO_ESCOPO
    ids_origem: [E2-003, E1-011, E2-016]
    tipo_achado: IRREGULAR
    categoria: omissao
    descricao_breve: "Obras da CTR sem especificação, quantificação, capacidades ou elementos de projeto básico"
    dispositivo_editalicio: "Edital 3.1 'Investimentos em Infraestrutura' (PDF p. 13) e 3.1.4 (p. 14); Contrato cl. 4.2 e 4.2.1 (p. 13), 10.3.8 (p. 28), 10.13.5 (p. 32); Caderno I (p. 7), Tabelas 23 e 24 (p. 26-27), XI.4 (p. 62)"
    transcricao: "Edital 3.1: 'são exclusivamente aqueles relacionados, especificados, quantificados, localizados e cronogramados no Caderno de Encargos' x Caderno I: 'O Caderno não tem por objetivo substituir estudos de viabilidade, plano de negócios, matriz de riscos, anexos de indicadores, mapas executivos completos ou projeto executivo das obras.'"
    comentario: "O Edital afirma que os investimentos estão especificados, quantificados, localizados e cronogramados no Caderno, mas o Caderno traz apenas encargos qualitativos para a CTR (UVR com triagem mecanizada, pátio de compostagem, linha de CDR, autoclave e aterro de rejeitos): não há capacidade nominal (t/dia), área, volume, vida útil do aterro nem especificações mínimas. O Contrato (10.3.8) remete as instalações mínimas aos Anexos, e o Caderno (XI.4) transfere à concessionária a apresentação do 'projeto básico ou executivo das unidades'. O Contrato (10.13.5) exige que o aterro chegue à reversão com vida útil remanescente mínima de 30 anos, sem premissa de volume nos anexos. Não se identificam, no pacote, os elementos de anteprojeto que embasaram o valor dos investimentos."
    dispositivo_legal: "art. 18, inciso XV, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 10, § 4.º, da Lei n.º 11.079/2004; art. 6.º, inciso XXV, da Lei n.º 14.133/2021 c/c art. 186 da mesma Lei"
    depende_de: ""
    flag_tecnico: true
    flag_reserva: true
    reserva_tipo: RESERVA
    nota_reserva: "A indefinição permite pleitear reequilíbrio sobre componentes não quantificados (UVR mecanizada, CDR, autoclave, compostagem, dimensão do aterro), pela combinação Edital 3.1.4 / Contrato 4.2.1.1. A impugnação pode eliminar essa margem. [VALIDAÇÃO TÉCNICA: ponto depende de confirmação de engenharia — dimensionamento de volume e área do aterro para 30 anos de operação mais 30 anos remanescentes]"
    cruzamentos: ["G2 E6-028, E3-046, E4-026 (aterro: capacidade e 30 anos remanescentes)", "G2 E6-031 (CAPEX da CTR em verba única)", "G2 E2-017 (equipamentos de UVR/CDR/autoclave/compostagem fora do CAPEX)"]

  - id_tmp: G1-003
    tema: OBJETO_ESCOPO
    ids_origem: [E2-004, E3-017]
    tipo_achado: IRREGULAR
    categoria: omissao
    descricao_breve: "Cronograma físico-financeiro e 'Cronograma de Execução (Anexo)' inexistentes; elaboração transferida à concessionária"
    dispositivo_editalicio: "Contrato cl. 7.1 e 7.3 (PDF p. 17), 10.13.1.2 (p. 31); Edital 2.8 e 2.9 (p. 11); Caderno XI.5 (p. 62-63)"
    transcricao: "Contrato 7.1: 'mediante a observância do cronograma físico-financeiro constante dos Anexos do Edital e do Contrato, inclusive o EVTEA' / 7.3: 'detalhadas no Cronograma de Execução (Anexo)' x Caderno XI.5: 'A concessionária deverá elaborar e manter atualizado o cronograma físico-financeiro da concessão'"
    comentario: "O Contrato remete a um cronograma físico-financeiro 'constante dos Anexos' e a um 'Cronograma de Execução (Anexo)', que não constam dos róis de anexos do Edital (2.8 e 2.9). O Caderno (XI.5) transfere à concessionária a elaboração do cronograma. Os únicos marcos estão dispersos no Anexo D (Tabela 3), no Anexo III (Tabelas 10 e 11) e no P6, e divergem entre si (ver G1-076). Sem cronograma vinculante, ficam sem referência o ramp-up da Parcela A, as sanções por atraso e o próprio Contrato 10.13.1.2, que exige cumprimento dos 'prazos do Cronograma de Execução'."
    dispositivo_legal: "art. 23, parágrafo único, inciso I, da Lei n.º 8.987/1995 c/c art. 3.º da Lei n.º 11.079/2004; art. 18, inciso XV, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004"
