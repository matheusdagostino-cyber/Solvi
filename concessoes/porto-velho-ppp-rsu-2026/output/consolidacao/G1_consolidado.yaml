  - id_tmp: G1-004
    tema: OBJETO_ESCOPO
    ids_origem: [E2-009, E6-025]
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Rotas tecnológicas de referência omitem UVR mecanizada, compostagem, CDR e autoclave"
    dispositivo_editalicio: "Caderno V.3.1, Figuras 8, 9 e 10 (PDF p. 28-29); P2 Figuras 12, 13, 15, 16 e 17 (p. 32-36); Edital 3.1, viii (p. 13); Caderno Tabela 23 (p. 26)"
    transcricao: "Caderno, Figura 9: 'Coleta RDO → Transporte → Aterro Sanitário CTR Porto Velho → Materiais Recicláveis / Rejeito → Disposição Final CTR Porto Velho; RSS → Unidade de Tratamento dos Resíduos de Saúde (furgão) → Resíduo Tratado Inertizado'"
    comentario: "Os fluxogramas de rota tecnológica do Caderno (reprodução das figuras do P2) levam o RDO diretamente ao aterro, com saída apenas de recicláveis para cooperativas. Não aparecem UVR com triagem mecanizada, pátio de compostagem, linha de CDR nem autoclave, que integram o objeto (Edital 3.1, viii) e a Tabela 23 do próprio Caderno. Como o Caderno prevalece sobre o EVTEA (Edital 2.11.2), a 'rota referencial' vinculante diverge do objeto licitado e da ordem de prioridade da PNRS."
    dispositivo_legal: "art. 9.º, caput, da Lei n.º 12.305/2010; art. 18, inciso I, da Lei n.º 8.987/1995 c/c art. 11 da Lei n.º 11.079/2004; art. 5.º da Lei n.º 14.133/2021"
