  - id_tmp: G1-025
    tema: OBJETO_ESCOPO
    ids_origem: [E1-036, E2-034, E6-047, E4-092]
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "RCC excluído do objeto, mas ecopontos destinados a receber RCC (Contrato 10.3.11 e P2)"
    dispositivo_editalicio: "Edital 3.1.1 e 3.1.1.1 (PDF p. 13); Contrato cl. 10.3.11 (p. 29) e 18.2, f (p. 42); Caderno Tabela 2, termo PEV/Ecoponto (p. 8); P2 Sumário (p. 5) e Tabela 15 itens 1.4.1-1.4.2 (p. 43); P6 III.5 (p. 20)"
    transcricao: "Edital 3.1.1: 'Não integram o objeto da Concessão, nem compõem a base de cálculo da contraprestação [...] os resíduos da construção civil (RCC)' x Contrato 10.3.11: 'rede de Ecopontos destinada à entrega voluntária de resíduos volumosos e de resíduos de construção civil (RCC)'"
    comentario: "O Edital exclui o RCC do objeto e da base de cálculo da contraprestação e permite recusá-lo (3.1.1.1). O Contrato (10.3.11) e o P2 (p. 5) concebem a rede de ecopontos para entrega voluntária de volumosos e RCC; o Contrato também lista o RCC como receita acessória (18.2, f). O Caderno remete as frações aceitas a 'demais frações permitidas', e o P6 descreve os ecopontos como pontos de entrega de recicláveis. Ficam indefinidos o recebimento de RCC de pequenos geradores nos ecopontos, sua destinação (não há aterro de inertes ou área de transbordo e triagem orçados) e seu custeio."
    dispositivo_legal: "art. 13, inciso I, alínea 'h', e art. 20, inciso III, da Lei n.º 12.305/2010; Resolução CONAMA n.º 307/2002; art. 5.º da Lei n.º 14.133/2021"
    depende_de: ""
