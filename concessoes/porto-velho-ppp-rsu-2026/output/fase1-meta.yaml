ajustes:
  DD-01:
    ids_origem: [E3-043, DD-ext]
pontos_extras:
  - id_tmp: DD-01
    tema: RISCOS_GARANTIAS
    ids_origem: [DD-ext]
    tipo_achado: IRREGULAR
    categoria: restricao_competitividade
    descricao_breve: "Aterro próprio e Ecoparque: único aterro licenciado da Sede é controlado por potencial licitante"
    dispositivo_editalicio: "Contrato cl. 10.9 (PDF p. 30), 10.13 a 10.13.5 (p. 31–32); considerando v (p. 5–6); Matriz TO-20 (p. 17); P1 p. 85"
    transcricao: "Contrato 10.13: 'Constitui obrigação da Concessionária, às suas expensas e por sua conta e risco, prover e disponibilizar, na Sede Administrativa, aterro sanitário devidamente licenciado [...]'; 10.13.1.1: risco 'integralmente alocado à Concessionária [...] não ensejando pleito de recomposição [...] em razão de [...] indisponibilidade de área, recusa de terceiros, indeferimento ou demora no licenciamento'."
    comentario: "O Contrato exige aterro próprio na Sede, em propriedade plena, com 30 anos de vida útil remanescente na reversão e risco integral de área e licenciamento. Na transição, a destinação depende do Ecoparque, e a cl. 10.9 ainda põe na concessionária a LAO desse aterro por todo o prazo. Pelos estudos, o Ecoparque é o único aterro licenciado da Sede (Anexo III V.1), com LAO em nome da CTR Porto Velho S/A até 09/10/2028. Pelas demonstrações da própria Orizon, a CTR Porto Velho S.A. é controlada pela Orizon (51%) desde jan/2023. Quem não detém o ativo precisa licenciar um aterro novo a tempo ou negociar com o detentor, enquanto o detentor dispensa as duas coisas."
    dispositivo_legal: "art. 9.º, inciso I, alínea 'a', da Lei n.º 14.133/2021; art. 37, inciso XXI, da CF/1988; art. 5.º, inciso III, da Lei n.º 11.079/2004"
    flag_tecnico: false
    flag_reserva: true
    reserva_tipo: DECISAO_COMERCIAL
    nota_reserva: "Se o grupo não tiver relação com a Orizon ou a Ecofort, o ponto é núcleo de impugnação (e possivelmente de representação). Se tiver ou puder negociar acesso ao Ecoparque, é assimetria favorável a reservar. Decisão do advogado."
    fonte_externa: true
  - id_tmp: DD-02
    tema: QUESTOES_FORMAIS
    ids_origem: [DD-ext]
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    descricao_breve: "Litígio sobre a anulação do contrato anterior não informado no Edital"
    dispositivo_editalicio: "Edital, preâmbulo (PDF p. 4); Contrato, considerandos ii–iii e vi (p. 5–6); P6 p. 59"
    transcricao: "Edital: 'o Município de Porto Velho, no exercício da autotutela administrativa, promoveu a anulação integral daquele certame e contrato pela Decisão nº 001/2025/GAB-PREF/PMPV'."
    comentario: "O Edital e o P6 tratam o Contrato 019/PGM/2024 como extinto e usam sua despesa (4,46% da RCL) como margem fiscal. Pelas fontes externas, a anulação segue em litígio: houve mandado de segurança que restabeleceu o contrato (03/10/2025), depois suspenso (29/10/2025); há medida cautelar do TCE-RO mantida em 25/09/2026 e ação civil pública em curso. Isso afeta a segurança jurídica do objeto, a margem fiscal e a eventual indenização ao operador anterior, cujo estudo (P5) não consta do pacote."
    dispositivo_legal: "art. 5.º da Lei n.º 14.133/2021; art. 10, inciso I, alíneas 'a' e 'b', da Lei n.º 11.079/2004"
    depende_de: "Certidão de objeto e pé do mandado de segurança e da ação civil pública (TJRO) e situação do processo no TCE-RO; P5 (avaliação da indenização)."
    flag_tecnico: false
    flag_reserva: false
    fonte_externa: true
  - id_tmp: DD-03
    tema: MODELAGEM_ECONOMICA
    ids_origem: [DD-ext]
    tipo_achado: DEPENDE_DE_FATO
    categoria: risco_economico
    descricao_breve: "Custo de transição no Ecoparque (≈ R$ 12/t no P6) sem lastro no contrato vigente"
    dispositivo_editalicio: "P6 Tab. 9 (PDF p. 42–43); P2 item 4.5; Contrato, considerando v"
    transcricao: "P6 Tab. 9: 'Aterro Ecoparque (Anos 1–4 — transição até CTR) 1.760 / 1.760 / 704 / 704' (R$ mil)."
    comentario: "A modelagem prevê R$ 4,93 mi em 4 anos para dispor no Ecoparque cerca de 140 mil t/ano, o que dá ≈ R$ 12/t. O Contrato 042/PGM/2023 com a CTR Porto Velho S.A. é de R$ 19,38 mi [fonte externa]. Nenhum documento do pacote informa o preço por tonelada nem diz quem paga a disposição na transição. Se a concessionária pagar a preço de mercado, o OPEX dos anos 1–4 está subestimado."
    dispositivo_legal: "art. 10, inciso I, alínea 'a', e § 4.º, da Lei n.º 11.079/2004"
    depende_de: "Contrato 042/PGM/2023 (preço unitário, prazo, aditivos) e definição de quem contrata e paga a destinação na transição."
    flag_tecnico: true
    flag_reserva: false
    fonte_externa: true
  - id_tmp: DD-04
    tema: LICENCIAMENTO_AMBIENTAL
    ids_origem: [DD-ext]
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    descricao_breve: "Licença estadual do Ecoparque (2026) não considerada nos estudos"
    dispositivo_editalicio: "P1 p. 85; Anexo III Tab. 3 (p. 9); Contrato cl. 10.9 (p. 30)"
    transcricao: "P1: 'Licença Ambiental de Operação (LAO) nº 016.00130.006/2024-SUL, emitida em nome de CTR PORTO VELHO S/A, válida até 09/10/2028'."
    comentario: "Os estudos e o Contrato tratam a LAO municipal de 2024 (até 09/10/2028) como a licença do Ecoparque. Em 01/07/2026 foi publicada a LO 159654/COLMAM/SEDAM em nome da CTR Porto Velho S/A [fonte externa]. O prazo, as condicionantes e a capacidade licenciada são o que a cl. 10.9 manda a concessionária manter, e o que define o horizonte da transição."
    dispositivo_legal: "art. 10, inciso VII, da Lei n.º 11.079/2004; Resolução CONAMA n.º 237/1997"
    depende_de: "Cópia da LO 159654/COLMAM/SEDAM e da LAO municipal, com prazos e capacidade."
    flag_tecnico: false
    flag_reserva: false
    fonte_externa: true
  - id_tmp: DD-05
    tema: RISCOS_GARANTIAS
    ids_origem: [DD-ext]
    tipo_achado: DEPENDE_DE_FATO
    categoria: contradicao
    descricao_breve: "Área do Ecoparque arrendada × exigência de propriedade plena do aterro (cl. 10.13.1)"
    dispositivo_editalicio: "Contrato cl. 10.13.1 e 10.13.3 (PDF p. 31–32)"
    transcricao: "Contrato 10.13.1, (v): 'qualquer outro negócio jurídico apto a transferir à Concessionária a propriedade plena do bem'."
    comentario: "O Contrato só admite cumprir a obrigação de aterro com a propriedade plena do imóvel. Pelo Fato Relevante da Orizon de 23/01/2023, há 'contrato de arrendamento da área do aterro sanitário entre CTR PV e Ecofort' [fonte externa]. Se a área é da Ecofort, comprar a participação na CTR PV não transfere a propriedade do imóvel, e a única via de aproveitamento do Ecoparque fica condicionada a negócio com o titular da área."
    dispositivo_legal: "art. 5.º da Lei n.º 14.133/2021; art. 9.º, inciso I, alínea 'a', da Lei n.º 14.133/2021"
    depende_de: "Matrícula do imóvel do Ecoparque e contrato de arrendamento CTR PV × Ecofort."
    flag_tecnico: false
    flag_reserva: true
    reserva_tipo: DECISAO_COMERCIAL
    nota_reserva: "Depende da posição do grupo em relação à Orizon e à Ecofort."
    fonte_externa: true
