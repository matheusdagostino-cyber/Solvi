      - { dispositivo: "Item 4.4, subitem 4.2.2, alíneas 'a' e 'b'", documento_fonte: "Anexo II (Termo de Referência)" }
      - { dispositivo: "Cláusula 22.1 c/c definição", documento_fonte: "Anexo III (Minuta do Contrato)" }
    transcricoes:
      - "é a garantia anual avos sobre o valor anual contratual [definição ininteligível] (Edital)"
      - "5% [...] equivalente a R$ 356.680,00 [...] calculado sobre o montante anual estimado de R$ 7.133.600,00 [× R$ 7.113.600,00 do item 4.1] (TR, 4.2.2)"
      - "prestou a GARANTIA DE EXECUÇÃO DO CONTRATO [...] na forma de carta fiança, prevista no artigo 97 (Contrato, 22.1)"
    descricao_breve: "Garantia de execução com definição ininteligível, valores divergentes dentro do próprio TR, modalidade reduzida a 'carta fiança' na minuta (suprimindo a opção legal do contratado) e garantia de proposta fundada no dispositivo errado (art. 96, § 1.º, em vez do art. 58)"
    comentario: >-
      A definição editalícia da garantia de execução ("garantia anual avos") é
      incompreensível e os valores do TR não fecham com sua própria base (5% de R$
      7.113.600 = R$ 355.680, não R$ 356.680 sobre base de R$ 7.133.600); a minuta
      restringe a garantia à "carta fiança", suprimindo a escolha entre caução,
      seguro-garantia e fiança que o art. 96 assegura ao contratado, com remissão legal
      imprecisa (art. 97). A garantia de proposta é fundada no art. 96, § 1.º (garantias
      contratuais), e não no art. 58, com montante remetido ao TR — o cotejo com o
      limite legal de 1% fica prejudicado. A eventual insuficiência da base anual da
      garantia (≈0,17% do valor da contratação) é tratada em separado (C-039).
    dispositivo_legal: "art. 58, caput e § 1.º, art. 96, caput e § 1.º, e art. 98 da Lei n.º 14.133/2021; art. 5.º, § 2.º, da Lei n.º 11.079/2004"
