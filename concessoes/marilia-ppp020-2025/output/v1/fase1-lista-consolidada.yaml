      comercial com RSU no Brasil — a ponto de declarar impossível estimar a vida útil
      do empreendimento (e, na mesma tabela, afirmar vida útil de 20 anos). Ou a regra
      de admissibilidade exclui a rota nomeada no objeto, ou é inaplicável; a tese é a
