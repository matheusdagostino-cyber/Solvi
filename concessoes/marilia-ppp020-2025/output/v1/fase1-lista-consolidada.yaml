      - { dispositivo: "Item 4.4, subitem 4.2.3", documento_fonte: "Anexo II (Termo de Referência)" }
      - { dispositivo: "Cláusulas 21.1, 21.1.1, 21.1.1.1, 21.1.1.2 e 21.2", documento_fonte: "Anexo III (Minuta do Contrato)" }
    transcricoes:
      - "Fundo Garantidor das Parcerias Público-Privadas – FGP a ser criado e regido por lei municipal específica (Edital, item 41)"
      - "I – Vinculação ou cessão fiduciária de quotas do FPM; II – [...] quota-parte municipal do ICMS; V – Vinculação de receitas oriundas da COSIP (TR, 4.2.3)"
      - "A realização dos investimentos previstos está condicionada a efetiva constituição e funcionamento do FUNDO GARANTIDOR (Contrato, 21.1.1.2)"
    descricao_breve: "Garantia pública da PPP não constituída: rol alternativo de nove instrumentos sem eleger nenhum, FGP dependente de lei futura (alternativa satisfeita por mero encaminhamento de PL), vinculação de FPM/ICMS/COSIP com óbice constitucional, piso de apenas 3 contraprestações e investimentos condicionados ao fundo inexistente"
    comentario: >-
      Em concessão administrativa toda a remuneração vem do erário, e o núcleo da
      bancabilidade — a garantia de pagamento — permanece indefinido: o edital alterna
      entre cessão de recebíveis não especificados e FGP "a ser criado por lei", o TR
      abre rol de nove instrumentos que inclui vinculação de quotas do FPM e do ICMS
      (receitas de impostos — art. 167, IV, da CF) e da COSIP (destinação própria — art.
      149-A), e a minuta se satisfaz com o encaminhamento de Projeto de Lei, fixando
      piso de apenas 3 contraprestações mensais sem demonstração de suficiência. A
      cláusula 21.1.1.2 condiciona os investimentos à efetiva constituição do fundo
      inexistente — colidindo com o cronograma de implantação e criando risco de
      paralisia contratual. O TR ainda exige garantias "integralmente constituídas antes
      da assinatura", em contradição com o regime da minuta.
    dispositivo_legal: "art. 8.º da Lei n.º 11.079/2004; art. 167, inciso IV, e art. 149-A da CF/1988; art. 23, incisos II e III, da Lei n.º 8.987/1995"
