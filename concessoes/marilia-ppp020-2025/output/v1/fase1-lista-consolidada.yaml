      disposição de resíduos, aterro ou empreendimento rural" e que a LP tenha sido
      efetivamente emitida para rota que o próprio Caderno I admite não ter planta
      comercial no país (ver C-009). O item 8.5 traz alíneas 'd' duplicadas e remissão a
