    transcricoes:
      - "1% do resultado contábil líquido [...] revertida [...] em favor da modicidade [...] poderá ser revisto caso ocasione desequilíbrio (Contrato, 14.2.1)"
      - "O reajuste devidamente calculado poderá ser imediatamente faturado [...] independentemente de homologação (19.3); considerará tal proposta aceita [silêncio de 30 dias] (20.10)"
      - "Gatilho 1 – DSCR inferior a 1,20x por dois exercícios consecutivos [reequilíbrio] (Caderno II, 15.6.1)"
    descricao_breve: "[RESERVA] Conjunto de assimetrias que beneficiam a futura concessionária: garantia de execução sobre base anual (≈0,17% do valor da contratação), compartilhamento de receitas acessórias de apenas 1% do resultado líquido e revisível, multas nominais baixas com juros de mora de 0,001%/dia, aceitação tácita de reajuste e revisão por silêncio da Administração, e gatilhos de reequilíbrio por DSCR/custo de capital que protegem a dívida do privado"
    comentario: >-
      Pontos identificados como potencial vantagem competitiva/contratual do grupo — não
      levantar publicamente sem decisão expressa do advogado: (i) garantia de execução
      de 5% sobre o valor ANUAL (≈R$ 356 mil para contrato de R$ 213,4 mi); (ii)
      partilha de receitas acessórias limitada a 1% do resultado líquido, ainda
      revisível se causar desequilíbrio; (iii) multas de R$ 500 a R$ 50.000 com juros de
      0,001%/dia sobre multas não pagas, contra 1%/mês para a mora do concedente; (iv)
      faturamento imediato do reajuste sem homologação e aceitação tácita da proposta de
      revisão por silêncio de 30 dias; (v) gatilhos de reequilíbrio por DSCR < 1,20x e
      variação do custo de capital, contradizendo a alocação declarada do risco de
