      - { dispositivo: "Considerações preliminares e item 4", documento_fonte: "Caderno III (Modelagem Jurídica)" }
      - { dispositivo: "Considerações preliminares", documento_fonte: "Caderno II (Modelagem Econômico-Financeira)" }
    transcricoes:
      - "as PROPOSTAS DE PREÇO classificadas em ordem decrescente de valor, isto é, a LICITANTE que apresentar o menor valor (Edital, 18.1)"
      - "(A+B)/5.200 [...] (A+B+C/5200) [...] [(A+B)+(C)]/5.200 [...] A + B / 5.200 (Anexo IV, formas da fórmula)"
      - "O resultado terá caráter exclusivamente informativo [...] não devendo ser considerado pela Licitante na composição do preço (Anexo IV, 8.7, sobre o componente C)"
    descricao_breve: "Fórmula de julgamento grafada de pelo menos quatro formas matematicamente distintas, componente (C) ora classificatório ora 'exclusivamente informativo', lance do Comprasnet diverso da grandeza que classifica, e modo de disputa aberto fundamentado no inciso do modo fechado"
    comentario: >-
      O critério aparece como menor preço/t "em cada lote", menor soma (a)+(b)+(c) da
      Planilha Sintética e menor valor da Proposta Comercial — documentos distintos —,
      com classificação "em ordem decrescente" para eleger o menor valor; no Anexo IV a
      fórmula é escrita de quatro formas não equivalentes (inclusive "A + B / 5.200",
      que pela precedência aritmética dá resultado diverso), o valor lançado no
      Comprasnet é só (A+B)/5.200 e o papel do componente C é contraditório (integra a
      soma classificatória e é declarado meramente informativo). O modo de disputa
      ABERTO é fundamentado no art. 56, II (modo fechado), com justificativa de "sigilo
      das estratégias de precificação" típica do fechado. A grandeza que decide o
      certame e a dinâmica de lances ficam indeterminadas.
    dispositivo_legal: "art. 5.º, art. 33, art. 56, incisos I e II, e art. 59 da Lei n.º 14.133/2021; art. 12, inciso II, da Lei n.º 11.079/2004; art. 37, inciso XXI, da CF/1988"
