      (fev/2025, Focus de 17/02/2025) já excede em muito o parâmetro de 6 meses do
      TCE-SP frente à sessão de 16/09/2026, e a data-base efetiva das abas é fev/2023,
      com OPEX de set/2022 e preços de recicláveis de out/2020, além de células com
      fonte "Modelagem Econ-Finan CONVALE" — reaproveitamento não atualizado de modelo
      de outro município. Em concessão de 30 anos a defasagem não se sana por índice de
      correção; exige revisão de CAPEX, OPEX, demanda, financiamento, WACC e TIR.
