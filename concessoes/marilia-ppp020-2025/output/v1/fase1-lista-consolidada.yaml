    categoria: contradicao
    dispositivos:
      - { dispositivo: "Definição CONSÓRCIO, item 11.3.c e itens 27 e 28.2.1", documento_fonte: "Edital (versão assinada)" }
      - { dispositivo: "Definição CONSÓRCIO OU CONCESSIONÁRIA e Cláusulas 9.1 a 9.3", documento_fonte: "Anexo III (Minuta do Contrato)" }
    transcricoes:
      - "CONSÓRCIO: Pessoa jurídica de direito privado a ser constituída pela LICITANTE VENCEDORA [...] que será a parceira privada (Edital, definição)"
      - "3. A SPE deverá ser subsidiária integral da LICITANTE VENCEDORA. 3.1. No caso de a LICITANTE VENCEDORA ser consórcio, a SPE deverá ter como sócias as empresas integrantes (Edital, item 27)"
    descricao_breve: "Termo 'CONSÓRCIO' definido como a própria SPE/parceira privada e usado também para o consórcio de licitantes; SPE exigida como 'subsidiária integral' (acionista único) e, simultaneamente, com sócias plurais no caso de consórcio — modelos societários incompatíveis que afetam estrutura, tributação e garantias"
    comentario: >-
      Consórcio não é pessoa jurídica e não pode ser o parceiro privado (art. 9.º da Lei
      11.079/2004 exige SPE), mas o glossário o define como tal e o termo é usado nessa
      função em todo o edital e na minuta ("CONSÓRCIO ou CONCESSIONÁRIO"); o item 11.3.c
      admite constituir "o Consórcio ou a SPE" antes do contrato, enquanto os itens 27 e
      28.2.1 exigem SPE. A exigência de subsidiária integral (art. 251 da Lei
      6.404/1976 — acionista único) é logicamente incompatível com a SPE de sócias
      plurais do item 27.3.1 — a estrutura societária, com reflexos em tributação e
      garantias, precisa ser conhecida antes da proposta.
    dispositivo_legal: "art. 9.º, caput, da Lei n.º 11.079/2004; art. 20 da Lei n.º 8.987/1995; art. 251 da Lei n.º 6.404/1976; art. 15 da Lei n.º 14.133/2021"
    flag_tecnico: false
    flag_reserva: false
    probabilidade_advogado: null

