      fundamenta a equação econômico-financeira e a precificação. A alocação à
      concessionária do erro nos elementos de projeto básico elaborados pela
      Administração, com vedação de reequilíbrio, e do risco de "manipulação dos
      indicadores praticada pela Agência Reguladora ou Concedente" é logicamente
