    descricao_breve: "Objeto indeterminado: rota 'soluções alternativas' aberta à escolha do proponente sem especificação mínima, e obrigatoriedade das rotas seca/úmida oscilando entre 'e' e 'e/ou' nos documentos"
    comentario: >-
      O objeto ora exige as duas rotas (frações seca E úmida), ora as trata como
      alternativas ("e/ou"), inclusive dentro do próprio TR (itens 2, 4 e 9.2), e a
      quarta rota — "soluções alternativas" — é definida apenas por exclusão, sem
