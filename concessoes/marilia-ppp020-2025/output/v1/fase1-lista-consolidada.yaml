      - { dispositivo: "Cláusulas 8.2, 37.2 e 37.3 e definição VALOR DE BENS REVERSÍVEIS", documento_fonte: "Anexo III (Minuta do Contrato)" }
      - { dispositivo: "Itens 1 a 10", documento_fonte: "Anexo III.1 (Lista de Bens Reversíveis)" }
    transcricoes:
      - "Referido valor remunera os investimentos em bens reversíveis ao longo do tempo, evitando uma grande indenização no final (Edital/Contrato, definição)"
      - "reverterão ao Município [...] sem qualquer ônus adicional (8.2) × englobará os investimentos [...] que ainda não tenham sido depreciados e amortizados (37.2)"
      - "incluindo, mas não se restringindo a [...] quando aplicável (Anexo III.1)"
    descricao_breve: "Parcela mensal autônoma que amortiza os bens reversíveis por 30 anos cumulada com indenização de investimentos não amortizados na extinção, sem mecanismo de abatimento, sobre lista de bens genérica e sem valores, com critério de avaliação e método de valoração ausentes"
    comentario: >-
      O erário paga parcela específica que "remunera os investimentos em bens
      reversíveis ao longo do tempo" e, na extinção, indeniza os investimentos não
      depreciados/amortizados — sem qualquer mecanismo de controle da amortização já
      paga: risco concreto de dupla remuneração do mesmo investimento, agravado pela
      contradição entre a reversão "sem qualquer ônus adicional" (cláusula 8.2) e a
      indenização das cláusulas 37.2/37.3. A lista de bens reversíveis é aberta e
      condicional, sem individualização, quantitativos ou valores, o componente (B) da
      proposta não tem método de valoração, taxa ou prazo, e o critério de avaliação
      para fins de indenização não é definido — o que impede dimensionar componente que
      integra a soma classificatória do julgamento.
    dispositivo_legal: "art. 6.º e art. 7.º da Lei n.º 11.079/2004; art. 35, §§ 1.º a 3.º, art. 36 e art. 23, inciso X, da Lei n.º 8.987/1995; art. 6.º, inciso XXV, da Lei n.º 14.133/2021"
