    transcricoes:
      - "V. Aplicação do fator de desempenho sobre a contraprestação [sem fórmula de conversão da nota em glosa] (Anexo II.6)"
      - "eficiência mínima de 70% na segregação [TR] × ≥85%/≥80% [Anexo II.3] × faixas com plenitude a partir de 90%/95% [Anexo II.6]"
      - "não estando automaticamente vinculada aos indicadores de desempenho [...] Vinculado ao cumprimento de metas de eficiência (Caderno II, 8.1)"
    descricao_breve: "Núcleo do pagamento por desempenho indefinido: nota mensal prevista sem fórmula de conversão em glosa, contrato paga integralmente por tonelada medida, os mesmos KPIs têm três réguas divergentes (TR × II.3 × II.6), 30% da nota mede serviços alheios ao objeto e a medição tem dois regimes sobrepostos"
    comentario: >-
      A vinculação da remuneração ao desempenho — requisito estrutural de PPP (art. 6.º,
      § 1.º, da Lei 11.079/2004) — é anunciada mas não implementada: o Anexo II.6 prevê
      nota de 0 a 100 e "aplicação do fator de desempenho sobre a contraprestação" sem
      fórmula, faixas ou procedimento, e a minuta paga o preço/t integral sem parcela
      variável; o Caderno II afirma, no mesmo item, que a contraprestação não é e é
      vinculada ao desempenho. Os indicadores têm três réguas incompatíveis para
      segregação, disponibilidade e conversão energética (com intervalos não cobertos
      nas faixas), o Anexo II.3 declara seus parâmetros "não vinculantes" enquanto o TR
      os qualifica "mandatários", 30% da nota mede reclamações/atendimento/satisfação de
      serviços que permanecem municipais, e a Seção 18 do TR sobrepõe dois regimes de
