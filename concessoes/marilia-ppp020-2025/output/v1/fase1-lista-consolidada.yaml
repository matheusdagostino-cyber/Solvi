      minuta do contrato e a modelagem jurídica pressupõem concessionária única, sem
      qualquer menção a lotes. O Anexo IV admite propostas para um ou mais lotes e
      adjudicação isolada ou combinada "a exclusivo critério" do Poder Concedente, sem
      regra de comparação entre a solução integrada e a soma de lotes parciais, e a
      infraestrutura comum (galpão + segregação, ~R$ 18 mi) pode ser "compartilhada"
