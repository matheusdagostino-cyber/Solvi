    descricao_breve: "Gravimetria, umidade e PCI dos resíduos de Marília não são fornecidos — todo o dimensionamento usa média nacional ABRELPE 2020 e a caracterização real é remetida à concessionária após a contratação — descumprimento da determinação 2 do TCE-SP"
