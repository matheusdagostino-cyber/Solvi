    transcricoes:
      - "redução de até 50% da massa total de resíduos encaminhada ao aterro (TR, 9.5.3)"
      - "meta de destinação inferior a 20% dos resíduos gerados para aterros (Anexo II.7, item 6)"
      - "Desempenho: ≥ meta contratual = 20 [meta que nenhum documento fixa] (Anexo II.6, 5.2)"
      - "A fração orgânica cairá em caçambas e seguirá para o aterro (Caderno I, 6.3.1)"
    descricao_breve: "Meta central de desvio de aterro com quatro referências conflitantes (até 50% / <20% de aterramento / 'meta contratual' indefinida / 84% implícito) sobre balanço de massa internamente contraditório que, sem desidratação do digestato, aumenta a massa aterrada"
    comentario: >-
      A meta que estrutura a concessão tem quatro valores incompatíveis, e o indicador
      do Anexo II.6 pontua contra "meta contratual" que nenhum documento fixa —
      referência circular. O balanço de referência é internamente contraditório (fração
      úmida 90 vs 100 t/dia; digestato 54 vs 109,6 m³/dia; biometano declarado 4 a 7
      vezes acima do calculável pela produção específica do próprio anexo; caldeira de
      16–25 t/h para 68 t/dia de CDR) e não contabiliza o destino do digestato sem
      desidratação nem das cinzas; o texto do Caderno I e a aba OPERACIONAL do modelo
