    comentario: >-
      O detalhamento de custos determinado pelo TCE-SP em 2019 para o mesmo objeto segue
      ausente: o CAPEX é apresentado em macrovalores "definitivos" sem memória de
      cálculo, o modelo o reduz a uma linha única por lote (com licenciamento e
      pré-operacionais idênticos para os três lotes), e o CAPEX do cenário térmico
      isolado (R$ 55 mi) exclui galpão (R$ 5 mi) e trituração/segregação (R$ 13 mi) que
      o próprio caderno declara indispensáveis ao CDR. A receita de energia adota R$
      682/MWh por 30 anos sem fonte nem cotejo com os leilões A-4/A-5 que o próprio
      caderno indica como via de comercialização; e o balanço energético apresenta
      apenas geração bruta (com confusão MW/MWh e eficiências de 14%–45%), sem descontar
      consumo parasita nem a energia de secagem do CDR — a receita projetada não tem
      geração líquida demonstrada (determinação 7). A aferição de exequibilidade do teto
      e o controle de economicidade ficam inviabilizados.
