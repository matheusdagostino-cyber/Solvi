  # ======================= REGULACAO_FISCALIZACAO =======================

  - id_consolidado: C-029
    ids_origem: [E1.edital-assinado-013, E2.termo-referencia-010, E3.minuta-contrato-004, E3.minuta-contrato-005, E3.matriz-riscos-004]
    titulo: "Entidade reguladora ausente"
    tema: REGULACAO_FISCALIZACAO
    tema_descritivo: "Agência Reguladora"
    tipo_achado: IRREGULAR
    categoria: ilegalidade
    categorias_secundarias: [contradicao]
    dispositivos:
      - { dispositivo: "Item 31 (Da Regulação e Fiscalização) e definições FISCALIZAÇÃO/ÓRGÃO FISCALIZADOR", documento_fonte: "Edital (versão assinada)" }
      - { dispositivo: "Seção 16", documento_fonte: "Anexo II (Termo de Referência)" }
      - { dispositivo: "Cláusulas 3.1.b, 8.10, 12.9, 20.7, 23.1.a e 29.1", documento_fonte: "Anexo III (Minuta do Contrato)" }
      - { dispositivo: "Itens III.2, IV.1, IV.2, V.2, VI.1 e 7", documento_fonte: "Anexo III.2 (Matriz de Riscos do Contrato)" }
    transcricoes:
      - "O CONTRATO será regulado e fiscalizado pelo PODER CONCEDENTE (Edital, item 31)"
      - "as normas do CONTRATO, seguidas das normas expedidas pela REGULADORA [termo sem definição] [...] nos termos definidos no CONVÊNIO DE COOPERAÇÃO [inexistente] [...] Lei Complementar Estadual n. 1.025/2007 [ARSESP] (Contrato)"
      - "Desempenho é fiscalizado pela Agência Reguladora (Matriz de Riscos)"
    descricao_breve: "Regulação e fiscalização atribuídas ao próprio poder concedente, sem designação de entidade reguladora com independência decisória — condição de validade dos contratos de saneamento —, enquanto contrato e matriz de riscos remetem a 'REGULADORA', 'convênio de cooperação' e à lei da ARSESP sem qualquer ato correspondente"
    comentario: >-
      A designação de entidade de regulação e fiscalização com autonomia é condição de
      validade dos contratos de manejo de RSU (arts. 11, III, e 21 da Lei 11.445/2007),
      e a NR 7/2024 da ANA atribui à entidade funções indelegáveis — nenhuma contemplada:
      edital, TR e minuta concentram tudo no poder concedente, chegando o contrato a
      grafar "por PODER CONCEDENTE e PODER CONCEDENTE". Em paralelo, cláusulas esparsas
      remetem a uma "REGULADORA" não definida, a um "CONVÊNIO DE COOPERAÇÃO" não
      celebrado e à LC estadual 1.025/2007 (ARSESP), e a matriz de riscos atribui a uma
      "Agência Reguladora" inexistente a fiscalização de desempenho, o reajuste e a
      revisão da própria matriz — indefinição da autoridade competente para regulação,
      revisão tarifária e sanção ao longo de 30 anos.
    dispositivo_legal: "art. 11, inciso III, e arts. 21 e 22 da Lei n.º 11.445/2007 (redação da Lei n.º 14.026/2020); NR n.º 7/2024 da ANA (Resolução ANA 187/2024 — atribuições de artigo a confirmar no texto oficial); art. 23, inciso VII, da Lei n.º 8.987/1995"
    flag_tecnico: false
    flag_reserva: false
    probabilidade_advogado: null

  # ======================= LICENCIAMENTO_AMBIENTAL =======================

  - id_consolidado: C-030
