    descricao_breve: "O modelo financeiro publicado teve removidas as abas nucleares (MF, Controle, Output 2), deixando #REF! em fluxo de caixa, WACC, taxas de desconto e sensibilidade; a data-base declarada é fev/2025 (19 meses antes da sessão) e as camadas efetivas do modelo datam de 2020–2023, herdadas de modelagem de outro projeto (CONVALE)"
    comentario: >-
      O próprio Índice da planilha aponta para abas que não existem no arquivo publicado
