      - { dispositivo: "Itens 1 e 12", documento_fonte: "Anexo II.7 (Diretrizes Ambientais Básicas)" }
      - { dispositivo: "Seção 13, item 1, e Seção 21", documento_fonte: "Anexo II (Termo de Referência)" }
      - { dispositivo: "Itens II.4 (FG 3) × III.1 (FG 1)", documento_fonte: "Anexo III.2 (Matriz de Riscos do Contrato)" }
    transcricoes:
      - "os itens aqui relacionados constituem referências legais [...] sem que isso represente qualquer antecipação de exigências (Anexo II.7, item 1)"
      - "Gaseificação/Pirólise: até 30 meses contados da emissão da Licença de Instalação [sem prazo-limite para a própria LI] (TR, Seção 21)"
    descricao_breve: "Edital não especifica quais licenças existem e quais faltam; o Anexo II.7, apontado como cumprimento do art. 10, VII, declara expressamente não antecipar exigências e remete o enquadramento (EAS × EIA/RIMA) à CETESB; cronograma sem prazo para obtenção das licenças e risco de atraso alocado de forma divergente — determinação 4 do TCE-SP atendida só em parte"
    comentario: >-
      A abertura de PPP exige licença prévia ou diretrizes para o licenciamento (art.
      10, VII, da Lei 11.079/2004); o documento apresentado como diretriz nega ser
      aquilo que o edital diz que ele é — lista genericamente LP/LI/LO e cinco estudos
      possíveis, abstendo-se de definir o enquadramento aplicável — e todo o
      licenciamento é transferido à SPE, sem nem a LP obtida. O cronograma conta os
      marcos de implantação da emissão da LI, cuja data é indeterminada, sem data-limite
      de início da operação, e a matriz de riscos aloca o atraso de licenciamento ora
      como compartilhado, ora como integral da concessionária. A incerteza impede
      precificar prazo e risco de licenciamento — ponto objeto de determinação expressa
      do TCE-SP em 2019 (determinação 4).
    dispositivo_legal: "TC-001718.989.19-7, TCE-SP, Pleno, 13/03/2019 (determinação 4); art. 10, inciso VII, da Lei n.º 11.079/2004; arts. 2.º, 3.º e 8.º da Resolução CONAMA n.º 237/1997; art. 6.º, inciso XXIII, alínea 'a', da Lei n.º 14.133/2021"
    flag_tecnico: false
