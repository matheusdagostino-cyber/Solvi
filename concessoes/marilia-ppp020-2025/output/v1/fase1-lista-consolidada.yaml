      - { dispositivo: "Resumo Executivo item 4.3 e item 8.1.1", documento_fonte: "Caderno I (Modelagem Técnico-Operacional)" }
      - { dispositivo: "Item 3.1", documento_fonte: "Caderno III (Modelagem Jurídica)" }
    transcricoes:
      - "CAPEX (VPL) Elevado / Otimizado; Custo Total Ajustado ao Risco (VPL) Maior / Menor (Caderno II, tabela PSC×PPP)"
      - "Concessão: #REF! [toda a série da aba VfM do modelo publicado]"
      - "Economia anual total gerada [...] R$ 5.548.608,00/ano [custo bruto de aterro evitado, sem abater a contraprestação] (Caderno I, 8.1.1)"
    descricao_breve: "Comparação PSC × PPP puramente adjetivada (sem VPL, taxa de desconto ou memória), com a única versão quantitativa (aba VfM do modelo) integralmente quebrada em #REF!, e 'economia' apurada como custo de aterro evitado sem abater a contraprestação — a massa desviada muda de credor, não de custo"
    comentario: >-
      A vantajosidade da concessão administrativa não é demonstrada quantitativamente em
      nenhum documento: a tabela PSC×PPP do Caderno II compara por adjetivos e declara
      caráter "meramente indicativo"; a aba VfM do modelo publicado — única sede da
      comparação numérica — está com toda a série da Concessão em #REF!; e a "economia
      municipal" do Caderno I subtrai do custo atual de aterro apenas o custo de aterro
      remanescente, sem abater a contraprestação devida às concessionárias, cujo teto (R$
      114/t) é exatamente o valor hoje pago. A análise de sensibilidade anunciada como
      "abrangente" traz somente qualificadores verbais, e a modelagem jurídica declara
      "comprovada" viabilidade que os documentos econômicos do mesmo conjunto desmentem.
    dispositivo_legal: "art. 10, inciso I, alíneas 'a' e 'b', da Lei n.º 11.079/2004; art. 18, § 1.º, da Lei n.º 14.133/2021; TC-001718.989.19-7, TCE-SP, Pleno, 13/03/2019 (determinação 1)"
    flag_tecnico: false
