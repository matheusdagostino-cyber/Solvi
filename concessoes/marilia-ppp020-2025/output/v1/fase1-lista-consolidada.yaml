      - "WACC 10,00% | VPL 62.373.296,7 | TIR projeto 5,70% [TIR < WACC com VPL positivo] (Caderno II, Hip. 3)"
      - "CO₂ Purificado: ~1,5 milhões ton/ano [Resumo Executivo] × CO₂ do Biogás: 5 t/d [balanço] (Caderno I)"
    descricao_breve: "Modelo de referência com vícios aritméticos e de premissas em série: EBIT que ignora o OPEX (superestimação de R$ 90–333 mi), VPL positivo com TIR abaixo do WACC, dois VPLs por lote, CAPEX divergente entre texto e DREs, receitas de CO₂/CBIOs copiadas para rota que não as gera, três camadas de OPEX inconciliáveis, tributação em regime contraditório, contraprestação implícita de R$ 108/t contra R$ 114/t declarados e cronologias impossíveis"
    comentario: >-
      A planilha-fonte confirma que o EBIT das três DREs não deduz os custos
      operacionais — o resultado de referência está superestimado em dezenas a centenas
      de milhões — e os indicadores publicados são matematicamente incompatíveis (TIR
      5,70% < WACC 10% com VPL positivo de R$ 62,4 mi; TIR de 12% e payback de 6,7 anos
      para o mesmo cenário na planilha). Somam-se: contraprestação das DREs de R$ 108/t
      contra R$ 114/t do texto; CAPEX das DREs 7–15% diverso do declarado, sem
      reinvestimento em 30 anos (CAPEX de manutenção em #REF!); receitas de CO₂ e CBIOs
      replicadas na rota térmica pura, que não as gera; OPEX de R$ 10,4 mi, R$ 171,6 mi
      e R$ 5,2 mi/ano em três abas; tributação por lucro presumido no modelo contra
      lucro real declarado no caderno; alavancagem 80/20 declarada e zerada na planilha;
      horizonte de 35 anos para concessão de 30; investimento integral em 2025 com
      operação plena em 2027, antes dos próprios prazos de licenciamento e implantação;
      e erros de grafia com efeito econômico (CAPEX "R$ 101.5000,00"; CO₂ com três
      ordens de grandeza de diferença; suprimento de água de 480 m³/dia por
      caminhão-pipa). O conjunto compromete a fidedignidade de toda a referência
      econômica do certame.
