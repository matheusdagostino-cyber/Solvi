    comentario: >-
      A minuta compartilha o risco de demanda (revisão extraordinária por variação
      superior a ±10%), a matriz de riscos o aloca integralmente à concessionária e o
      Caderno II o trata de três formas adicionais, prometendo "garantia de fornecimento
      mínimo" com indenização sem definir volumes nem mecanismo. A base física é
      igualmente instável: o contrato vigente indica 72.000 t/ano, a modelagem adota
      62.400 t/ano sem memória da "atualização", a geração projetada cresce a 261 t/dia
      em 2059 enquanto as DREs congelam 200 t/dia, a recepção é dimensionada para 257
      t/dia e o Anexo II.4 exige capacidade para a "totalidade dos RSD ao longo da
      concessão". O licitante não consegue precificar o risco central do contrato.
    dispositivo_legal: "art. 4.º, inciso VI, e art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 103 da Lei n.º 14.133/2021; art. 6.º, inciso XXIII, alínea 'a', da Lei n.º 14.133/2021"
