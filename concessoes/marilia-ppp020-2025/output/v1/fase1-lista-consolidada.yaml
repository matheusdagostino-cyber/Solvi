  # ========================= MODELAGEM_ECONOMICA =========================

  - id_consolidado: C-013
    ids_origem: [E1.edital-assinado-005, E1.edital-assinado-006, E2.termo-referencia-003, E4.proposta-criterios-julgamento-002, E4.proposta-criterios-julgamento-003, E4.modelagem-economico-financeira-003]
    titulo: "Teto circular de R$ 114/t e base de cálculo única"
    tema: MODELAGEM_ECONOMICA
    tema_descritivo: "Modelagem jurídica, técnica e econômico-financeira"
    tipo_achado: IRREGULAR
    categoria: risco_economico
    categorias_secundarias: [contradicao]
    dispositivos:
      - { dispositivo: "Item 4 (Valor Estimado), itens 17.4 e 17.5 e definição VALOR DO ATUAL CONTRATO", documento_fonte: "Edital (versão assinada)" }
      - { dispositivo: "Item 4.1", documento_fonte: "Anexo II (Termo de Referência)" }
      - { dispositivo: "Itens 1, 8 e 8.7 (Planilha Sintética)", documento_fonte: "Anexo IV (Proposta e Critérios de Julgamento)" }
      - { dispositivo: "Itens 8.1 e 12", documento_fonte: "Caderno II (Modelagem Econômico-Financeira)" }
    transcricoes:
      - "R$ 114,00 [...] por tonelada [...] equivalente ao custo atualmente suportado pelo Município para disposição final dos resíduos em aterro sanitário (TR, 4.1)"
      - "LOTE 1 [...] LOTE 2 [...] LOTE 3 [...] LOTE 4 — VOLUME MENSAL ESTIMADO 5.200 [t/mês em todos] (Anexo IV, Planilha Sintética)"
      - "não se constituindo em valor máximo, mínimo ou vinculante (Caderno II, item 12)"
    descricao_breve: "Preço máximo da PPP fixado no próprio custo atual de aterro (R$ 114/t), que ainda reentra na conta pelo componente (C), sem memória de cálculo, sobre denominador único de 5.200 t/mês que mede coisas diferentes em cada lote"
    comentario: >-
      O parâmetro de vantajosidade é o próprio custo que a PPP deveria superar: o teto
      de R$ 114/t reproduz o contrato atual de aterro, sem memória de cálculo adequada a
      objeto com CAPEX de URE de até R$ 101,5 mi, e o mesmo valor multiplica os rejeitos
      no componente (C) — circularidade dupla; o Caderno II ainda declara que o valor
      "não é máximo, mínimo ou vinculante", em contradição com o limite de
      aceitabilidade do edital, e o teto global de R$ 213,4 mi não inclui o componente
      de bens reversíveis que integra a proposta. A Planilha Sintética divide todos os
      lotes pelas mesmas 5.200 t/mês, embora o Lote 1 trate só a fração úmida (~45%) e o
      Lote 2 só a seca (~34%) — o R$/t resultante não é comparável entre lotes. Elemento
      fático de referência: PPP análoga de concessão administrativa de RSU no mesmo
      estado (CP 001/2021 do CIVAP) foi homologada a R$ 85,00/t em 30/03/2022 — 25%
      abaixo do teto de Marília (benchmark fático, não fundamento normativo).
    dispositivo_legal: "art. 10, inciso I, alínea 'a', e art. 4.º, inciso VII, da Lei n.º 11.079/2004; art. 23 e art. 6.º, inciso XXIII, alínea 'i', da Lei n.º 14.133/2021; art. 15, § 1.º, da Lei n.º 8.987/1995"
    flag_tecnico: false
    flag_reserva: false
    probabilidade_advogado: null

