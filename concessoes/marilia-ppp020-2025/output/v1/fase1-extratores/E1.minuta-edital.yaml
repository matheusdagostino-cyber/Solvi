manifesto_cobertura:
  documento: "CADERNO III - ANEXO I - MINUTA DE EDITAL.pdf (36 p.) — texto extraído em docs/extraido/"
  execucao: "bloco único; leitura integral seguida de diff palavra a palavra contra o texto do edital assinado (cabeçalhos e rodapés normalizados)"
  faixas_percorridas:
    - "pp. 1–36: documento integral — mesma estrutura do edital assinado (folha de rosto, aviso, definições, itens 1–46, relação de anexos A-1 a A-18, bloco de assinatura em branco)"
  trechos_ilegiveis: []
  metodo_comparacao: >-
    Normalização dos dois textos (remoção de cabeçalhos/rodapés e marcas d'água de
    assinatura) e comparação por sequência de palavras. Falso positivo inicial (trecho do
    aviso contendo 'pela Prefeitura de Marília' removido pelo filtro de cabeçalho) foi
    identificado e corrigido; confirmada a identidade do trecho nas duas versões.
  resultado: >-
    Divergências substantivas: apenas as remissões do preâmbulo (ponto 001). Divergências
    formais: preenchimento de placeholders (C01). Nenhuma cláusula acrescida, suprimida
    ou alterada entre a minuta submetida à consulta pública e a versão assinada.
  observacoes:
    - "A identidade integral entre minuta e versão assinada implica que o edital publicado não incorporou ajuste algum decorrente da consulta pública (23/10/2025–02/03/2026) e da audiência pública (29/01/2026) — dado fático a explorar pelo AN na Fase 2 em conjunto com o Caderno III – Modelagem Jurídica (E4), se este documentar contribuições recebidas."
