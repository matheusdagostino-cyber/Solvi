    dispositivo_editalicio: "Anexo III.2 — duplicidade tabela × narrativa em todos os blocos (ex.: III.1 com 5 fatos geradores na tabela e 4 na narrativa; III.3, fato gerador 4, 'CONCESSIONÁRIA/CONCEDENTE' na tabela vs. 'Concedente' na narrativa)"
    transcricao: "Tabela III.3: '4. Dever de atualidade tecnológica — 4. CONCESSIONÁRIA / CONCEDENTE'. Narrativa III.3: 'Fato Gerador 4: Dever de atualidade tecnológica. Alocação: Concedente.'"
