    dispositivo_legal: "art. 5.º, inciso III, da Lei n.º 11.079/2004; art. 92, inciso IX, da Lei n.º 14.133/2021 (matriz de riscos clara)"
    relacao_outros_documentos: ""
    flag_tecnico: false
    flag_reserva: false

  - id: E3.matriz-riscos-003
    documento_fonte: "Anexo III.2 (Matriz de Riscos do Contrato)"
    dispositivo_editalicio: "Item III.6 (Demanda) do Anexo III.2"
    transcricao: "1. Variação da demanda — 1. CONCESSIONÁRIA — 1. Concessionária assume o risco de variação da demanda real verificada nos serviços objeto da CONCESSÃO."
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Risco de demanda alocado integralmente à concessionária, em contradição com a Cláusula 34.2 da minuta (variação superior a ±10% em 12 meses gera revisão extraordinária — risco compartilhado) e com a Cláusula 34.4 (metas de redução de massa compartilhadas)"
    dispositivo_legal: "art. 4.º, inciso VI, e art. 5.º, inciso III, da Lei n.º 11.079/2004"
    relacao_outros_documentos: "Minuta do Contrato, Cláusulas 34.1 a 34.4 (ver E3.minuta-contrato-026)"
    flag_tecnico: false
    flag_reserva: false

