pontos:

  - id: E3.matriz-riscos-001
    documento_fonte: "Anexo III.2 (Matriz de Riscos do Contrato)"
    dispositivo_editalicio: "Item III.1, fato gerador 5 (tabela, p. 8) vs. item III.1, fato gerador 4 (versão narrativa, p. 10) do Anexo III.2"
    transcricao: "Tabela: '5. Vícios ocultos nos bens vinculados a CONCESSÃO, já existentes ou originados em data anterior à assunção dos serviços — 5. CONCEDENTE [...] CONCEDENTE responde pelos vícios oriundos de fatos anteriores à assunção dos serviços pela CONCESSIONÁRIA.' Narrativa: 'Fato Gerador 4: Vícios ocultos [...] anteriores à assunção dos serviços. Alocação: Concessionária.'"
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Vícios ocultos pré-existentes alocados ao CONCEDENTE na tabela e à CONCESSIONÁRIA na versão narrativa do mesmo anexo — a narrativa contradiz também as Cláusulas 23.2 e 45.5 da minuta (concedente responde por fatos anteriores à assunção)"
    dispositivo_legal: "art. 4.º, inciso VI, e art. 5.º, inciso III, da Lei n.º 11.079/2004 (repartição objetiva de riscos)"
    relacao_outros_documentos: "Minuta do Contrato, Cláusulas 23.2 e 45.5"
    flag_tecnico: false
    flag_reserva: false

  - id: E3.matriz-riscos-002
