    documento_fonte: "Anexo III.2 (Matriz de Riscos do Contrato)"
    dispositivo_editalicio: "Itens III.2 (mitigação 1), IV.1 (mitigação 5), IV.2 (mitigação 2), V.2 (mitigação do FG 3), VI.1 (mitigação 3) e item 7 (Observação Final) do Anexo III.2"
    transcricao: "1. Desempenho é fiscalizado pela Agência Reguladora, por meio da avaliação da qualidade da prestação dos serviços. [...] 5. Fórmula de reajuste, regras de cálculo e periodicidade previamente determinadas no contrato e realizadas pela Agência Reguladora [...] A presente matriz [...] poderá ser revisada e atualizada periodicamente pela Agência Reguladora"
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Matriz atribui funções centrais (fiscalização de desempenho, aplicação do reajuste, acompanhamento financeiro, auditorias e revisão da própria matriz) a 'Agência Reguladora' inexistente na modelagem — a minuta atribui regulação e fiscalização ao próprio poder concedente e o reajuste é faturado pelo concessionário sem homologação (Cláusula 19.3)"
    dispositivo_legal: "art. 21 e art. 11, inciso III, da Lei n.º 11.445/2007; art. 5.º, inciso III, da Lei n.º 11.079/2004"
    relacao_outros_documentos: "Minuta do Contrato, Cláusulas 12.9, 19.3 e 29 (ver E3.minuta-contrato-004 e 005)"
    flag_tecnico: false
    flag_reserva: false

