# Documento: CADERNO III - ANEXO II.7 – DAS DIRETRIZES AMBIENTAIS BÁSICAS (15 p.)
# Prazos (triagem): esclarecimento e impugnação até 11/09/2026 — 19 dias úteis em 16/08/2026
