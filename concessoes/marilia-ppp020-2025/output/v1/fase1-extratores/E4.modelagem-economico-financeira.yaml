    dispositivo_editalicio: "Itens 13.1 a 13.3 do Caderno II (linhas EBIT das DREs; conferidas no PDF nativo, p. 52–57)"
    transcricao: "OPEX 90.213.924,6 [sinal positivo] (-) Custos com operacionais 89.727.204,6 [...] (=) EBIT [Hip. 2, 2027] 9.444.307,486 [= 19.032.155,7 − 5.527.848,3 − 4.060.000,0, sem dedução do OPEX]"
    tipo_achado: IRREGULAR
    categoria: erro_material
    descricao_breve: "O EBIT das três DREs não deduz os custos operacionais: verifica-se aritmeticamente que EBIT = Receita − Impostos − Depreciação (ex.: Hip. 2/2027: 19.032.155,7 − 5.527.848,3 − 4.060.000,0 = 9.444.307,4, exatamente o EBIT publicado), com o OPEX lançado com sinal positivo e ignorado — o resultado operacional de referência está superestimado em R$ 90 a 333 milhões no horizonte, viciando toda a análise de viabilidade"
    dispositivo_legal: "art. 6.º, XXIII, 'i', da Lei n.º 14.133/2021; art. 10, I, da Lei n.º 11.079/2004; TC-001718.989.19-7, TCE-SP, Pleno, 13/03/2019 (determinação 1)"
