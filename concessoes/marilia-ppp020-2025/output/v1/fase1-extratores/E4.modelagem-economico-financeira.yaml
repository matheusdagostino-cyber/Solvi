    dispositivo_editalicio: "Item 9 c/c itens 8.1, 15.6 e 15.7 do Caderno II"
    transcricao: "Garantia de Fornecimento Mínimo: O poder público se compromete a entregar um volume mínimo e máximo de resíduos [...] Abaixo do mínimo, mecanismos de indenização à concessionária são acionados [...] [15.7:] risco de demanda [...] compartilhado [...] [8.1:] O risco de volume e qualidade do resíduo é geralmente compartilhado ou assumido pela concessionária [...] [15.6:] Volume de resíduos: Risco operacional do privado"
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "O risco de demanda/volume recebe quatro tratamentos incompatíveis no mesmo caderno: indenização pública abaixo do mínimo (item 9), risco 'compartilhado' (15.7), 'compartilhado ou assumido pela concessionária' (8.1) e 'risco operacional do privado' (15.6) — sem definição dos volumes mínimo e máximo nem do mecanismo de indenização"
    dispositivo_legal: "art. 4.º, VI, e art. 5.º, III, da Lei n.º 11.079/2004; art. 103 da Lei n.º 14.133/2021"
    relacao_outros_documentos: "Cruzar com a matriz de riscos (Anexo III.2) e com o contrato"
    flag_tecnico: false
    flag_reserva: false

  - id: E4.modelagem-economico-financeira-019
    documento_fonte: "Caderno II — Modelagem Econômico-Financeira"
    dispositivo_editalicio: "Item 8.1 do Caderno II (bullets sobre natureza da contraprestação)"
    transcricao: "A contraprestação pública possui natureza de remuneração pela disponibilidade [...] não estando automaticamente vinculada aos indicadores de desempenho [...] [três parágrafos depois:] Vinculado ao cumprimento de metas de eficiência (redução de massa destinada a aterro)."
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "O mesmo item 8.1 afirma que a contraprestação NÃO é vinculada aos indicadores de desempenho e, logo adiante, que é 'vinculada ao cumprimento de metas de eficiência' — indefinição sobre o vínculo remuneração × desempenho, que é requisito estrutural de PPP"
    dispositivo_legal: "art. 6.º, § 1.º, da Lei n.º 11.079/2004 (remuneração variável vinculada ao desempenho); art. 5.º, 'caput', da mesma lei"
    relacao_outros_documentos: "Cruzar com o mecanismo de pagamento do contrato e com o Anexo II.6 (indicadores)"
    flag_tecnico: false
    flag_reserva: false

  - id: E4.modelagem-economico-financeira-020
    documento_fonte: "Caderno II — Modelagem Econômico-Financeira"
    dispositivo_editalicio: "Item 12 c/c item 8.1 do Caderno II"
    transcricao: "[item 12:] composição do valor da proposta a partir dos seguintes elementos: (a) preço unitário por tonelada de resíduos tratados; (b) valor associado aos bens reversíveis; (c) custo de transporte e disposição final dos rejeitos [...] [item 8.1:] estruturada a partir da soma dos seguintes componentes: (i) preço unitário por tonelada; (ii) remuneração dos investimentos em bens reversíveis"
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Composição da proposta comercial divergente dentro do próprio caderno: dois componentes no item 8.1 e três no item 12 (o custo de transporte/disposição de rejeitos aparece e desaparece) — e o Caderno I atribui a disposição de rejeitos a 'empresa contratada pela Administração', triplicando a incerteza sobre quem precifica os rejeitos"
    dispositivo_legal: "art. 6.º, XXIII, da Lei n.º 14.133/2021; art. 11 da Lei n.º 11.079/2004"
    relacao_outros_documentos: "Cruzar com a composição da Planilha Sintética do Anexo IV (documento deste extrator) e com o TR"
    flag_tecnico: false
    flag_reserva: false

  - id: E4.modelagem-economico-financeira-021
    documento_fonte: "Caderno II — Modelagem Econômico-Financeira"
    dispositivo_editalicio: "Item 16 do Caderno II (Ressarcimento dos custos dos estudos)"
    transcricao: "deverão ser ressarcidos pelo ganhador da Licitação no valor de R$ 1.200.000,000 (UM MILHÃO E DUZENTOS MIL REAIS)"
    tipo_achado: IRREGULAR
    categoria: erro_material
    descricao_breve: "Valor do ressarcimento dos estudos grafado com numeral ambíguo ('R$ 1.200.000,000' — três casas decimais, lendo-se 1,2 bilhão ou 1,2 milhão) em cláusula de pagamento obrigatório antes da assinatura do contrato; rateio por caderno (40/30/30) sem memória dos custos efetivos dos estudos"
    dispositivo_legal: "art. 21 da Lei n.º 8.987/1995; art. 6.º, XXIII, da Lei n.º 14.133/2021"
    relacao_outros_documentos: "Cruzar com a previsão de ressarcimento no Edital e na minuta de contrato"
    flag_tecnico: false
    flag_reserva: false

  - id: E4.modelagem-economico-financeira-022
    documento_fonte: "Caderno II — Modelagem Econômico-Financeira"
    dispositivo_editalicio: "Considerações preliminares do Caderno II"
    transcricao: "CONSIDERANDO que a presente licitação será processada sob o modo de disputa ABERTO, nos termos do artigo 56, inciso II, da Lei nº 14.133/2021 [...] CONSIDERANDO que este Caderno III deve destacar que a modelagem jurídica..."
    tipo_achado: IRREGULAR
    categoria: erro_material
    descricao_breve: "Modo de disputa 'aberto' fundamentado no art. 56, inciso II, da Lei 14.133/2021 — dispositivo que trata do modo de disputa FECHADO (o aberto é o inciso I): fundamentação legal trocada em elemento que define a dinâmica de lances; o considerando seguinte se refere a 'este Caderno III' dentro do Caderno II (cópia sem revisão)"
    dispositivo_legal: "art. 56, I e II, da Lei n.º 14.133/2021"
    relacao_outros_documentos: "Cruzar com o modo de disputa definido no Edital e no Anexo IV"
    flag_tecnico: false
    flag_reserva: false

  - id: E4.modelagem-economico-financeira-023
    documento_fonte: "Caderno II — Modelagem Econômico-Financeira"
    dispositivo_editalicio: "Itens 2.6 e 13.1–13.3 do Caderno II (Receita Reciclável)"
    transcricao: "[item 2.6:] Metais Vidros 3.154 t/ano [...] [DREs:] (+) Receita Reciclável 4.710,4 [2025] / 5.396,6 [2026, Hip. 1]"
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Receita de recicláveis de ~R$ 5 mil/ano para 3.154 t/ano de metais e vidros projetados (≈ R$ 1,50/t) — ordem de grandeza incompatível com a própria projeção de materiais segregados do item 2.6, sem qualquer memória de preço"
    dispositivo_legal: "TC-001718.989.19-7, TCE-SP, Pleno, 13/03/2019 (determinação 3); art. 6.º, XXIII, 'i', da Lei n.º 14.133/2021"
    relacao_outros_documentos: "Conferir premissa de preço de recicláveis na aba Receita Acessórias do xlsx"
