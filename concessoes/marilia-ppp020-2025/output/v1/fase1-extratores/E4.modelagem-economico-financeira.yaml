  - id: E4.modelagem-economico-financeira-003
    documento_fonte: "Caderno II — Modelagem Econômico-Financeira"
    dispositivo_editalicio: "Item 8.1 c/c item 12 do Caderno II"
    transcricao: "foi definida uma contraprestação de R$ 114,00 (cento e quatorze reais) e por tonelada [...] a receita anual garantida com a contraprestação pública é de R$ 7.113.600,00 [...] [item 12:] custo atualmente suportado pelo Município [...] estimado em R$ 592.800,00 mensais, tendo a premissa de 5.200 toneladas mensais x R$ 114,00 por toneladas [...] não se constituindo em valor máximo, mínimo ou vinculante"
    tipo_achado: IRREGULAR
    categoria: risco_economico
    descricao_breve: "Circularidade: a contraprestação de referência da PPP (R$ 114/t) é idêntica ao custo atual de disposição em aterro usado como cenário 'Status Quo' — o parâmetro de vantajosidade é o próprio custo que a PPP deveria superar, e nenhuma economia líquida é demonstrada; ao mesmo tempo o caderno declara que o valor não é teto nem piso, deixando o certame sem valor máximo fundamentado e sem memória de cálculo da contraprestação"
    dispositivo_legal: "art. 10, I, 'a', da Lei n.º 11.079/2004; art. 6.º, XXIII, 'i', e art. 23 da Lei n.º 14.133/2021; TC-001718.989.19-7, TCE-SP, Pleno, 13/03/2019 (determinação 1)"
    relacao_outros_documentos: "Cruzar com teto/critério de aceitabilidade de preços do Edital e do Anexo IV; e com a aba VfM do xlsx"
    flag_tecnico: false
    flag_reserva: false

