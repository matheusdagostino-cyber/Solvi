    flag_reserva: false

  - id: E4.modelagem-economico-financeira-024
    documento_fonte: "Caderno II — Modelagem Econômico-Financeira"
    dispositivo_editalicio: "Itens 13.1 a 13.3 do Caderno II (cronologia das DREs)"
    transcricao: "CAPEX -116.512.428,3 [integral em 2025] [...] (+) Receita Contraprestação fixa 7.437.015,3 [já em 2026]; Receita Energia Elétrica 12.411.331,5 [já em 2027]"
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Cronologia das DREs incompatível com os prazos do próprio estudo: investimento integral no ano 1 (2025 — anterior à própria sessão de setembro/2026) e operação plena com receitas de contraprestação e energia nos anos 2 e 3, quando o Caderno I declara 12–36 meses de licenciamento mais 24–48 meses de implantação conforme a rota"
    dispositivo_legal: "art. 6.º, XXIII, da Lei n.º 14.133/2021; art. 10, VII, da Lei n.º 11.079/2004"
    relacao_outros_documentos: "Cruzar com cronograma do Caderno I (item 7) e metas do Anexo II.6"
    flag_tecnico: true
    flag_reserva: false

