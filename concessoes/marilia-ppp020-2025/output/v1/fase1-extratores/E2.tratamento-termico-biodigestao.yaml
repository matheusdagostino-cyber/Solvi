pontos:
  - id: E2.tratamento-termico-biodigestao-001
    documento_fonte: "Anexo II.3 (Diretrizes Tratamento Térmico e Biodigestão)"
    dispositivo_editalicio: "Item 11.3 (Etapa 3) e Especificações Técnicas do Processo de Tratamento Térmico do Anexo II.3"
    transcricao: "Sistema: Unidade de conversão térmica para queima controlada de CDR em caldeira de grelha móvel ou leito fluidizado; Faixa de Temperatura de Operação: 850–1.050°C na zona primária; até 1.100°C na zona secundária ...; Tempo de Residência dos Gases: ≥ 2 segundos a ≥ 850°C ... Durante o processo, o CDR é submetido à combustão controlada ..."
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Contradição interna do edital: o processo de referência da Etapa 3 (combustão controlada de CDR em caldeira de grelha/leito fluidizado, 850–1.050°C, residência de gases ≥2s, geração de vapor para turbina) configura tratamento térmico por incineração nos termos da Resolução CONAMA 316/2002, tecnologia expressamente vedada pelo Anexo II.2, item 2.f"
    dispositivo_legal: "Resolução CONAMA n.º 316/2002; art. 5.º da Lei n.º 14.133/2021 (vinculação ao instrumento convocatório)"
    relacao_outros_documentos: "Anexo II.2, item 2.f (vedação); Anexo II.4, item 8.2 (admite incineração); Anexo II.7, itens 18.6–18.7 (aplica a CONAMA 316 ao empreendimento); Resolução SIMA 47/2020 (recuperação energética com CDR)"
    flag_tecnico: true
    flag_reserva: false

  - id: E2.tratamento-termico-biodigestao-002
