    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Anexo estrutura a reversibilidade por LOTES (1-biodigestão, 2-tratamento térmico, 3-solução integrada) com 'respectiva CONCESSIONÁRIA' por lote e vedação de compartilhamento, enquanto a Minuta do Contrato pressupõe concessionário único e contrato único, sem qualquer menção a lotes — estrutura de lotes indefinida, e o Lote 3 (integrada) sobrepõe integralmente os Lotes 1 e 2"
    dispositivo_legal: "art. 5.º, caput, da Lei n.º 14.133/2021 (vinculação e coerência do instrumento convocatório); art. 47, § 1.º, da Lei n.º 14.133/2021 (parcelamento justificado)"
    relacao_outros_documentos: "Minuta do Contrato (Anexo III) não menciona lotes; DRE do Caderno II tem abas LOTE 1/2/3; tema central da matriz de 2026 (pontos 1–4: divisão em lotes indefinida) — E1/E4 verificam a face editalícia"
