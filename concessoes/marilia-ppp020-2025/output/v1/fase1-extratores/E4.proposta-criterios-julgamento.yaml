    dispositivo_editalicio: "Item 1 (objeto) e item 8.7 do Anexo IV"
    transcricao: "os rejeitos deverão ser disponibilizados para carregamento, transporte e destinação para o Aterro Sanitário contratado pela Administração, os quais continuarão sob responsabilidade dos prestadores de serviços de coleta e transporte atualmente contratados pela PREFEITURA [...] [8.7:] o custo referente à disposição final dos rejeitos permanecerá sob responsabilidade da Prefeitura"
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Alocação dos rejeitos contraditória entre documentos: o Anexo IV mantém transporte e disposição dos rejeitos com a Administração e seus contratos 'atualmente' vigentes (por 30 anos?), enquanto o Caderno II (item 12) inclui 'custo de transporte e disposição final dos rejeitos' na composição da proposta e o Caderno I ora manda cinzas para 'aterro anexo ao empreendimento', ora para aterro de terceiro — três versões sobre quem paga e executa a disposição dos rejeitos"
    dispositivo_legal: "art. 6.º, XXIII, da Lei n.º 14.133/2021; art. 4.º, VI, da Lei n.º 11.079/2004"
    relacao_outros_documentos: "Cruzar com item 12 do Caderno II, itens 6.3.1/8 do Caderno I, TR e matriz de riscos"
