  - id: E4.proposta-criterios-julgamento-009
    documento_fonte: "Anexo IV — Proposta, DRE, Planilha Sintética e Critérios de Julgamento"
    dispositivo_editalicio: "Item 4 do Anexo IV (critério de desempate)"
    transcricao: "Em caso de empate entre propostas classificadas, terá preferência a LICITANTE que apresentar o maior percentual de redução do envio de resíduos ao aterro sanitário [...] O percentual informado deverá ser comprovado operacionalmente"
    tipo_achado: IRREGULAR
    categoria: omissao
    descricao_breve: "Critério de desempate único e sem procedimento: não há regra para empate persistente (segundo critério), não se indica como o 'percentual de redução' será verificado no julgamento (a comprovação é remetida à operação futura), e o critério não é cotejado com a ordem legal de desempate do art. 60 da Lei 14.133/2021, de aplicação subsidiária"
    dispositivo_legal: "art. 60 da Lei n.º 14.133/2021; art. 12 da Lei n.º 11.079/2004"
