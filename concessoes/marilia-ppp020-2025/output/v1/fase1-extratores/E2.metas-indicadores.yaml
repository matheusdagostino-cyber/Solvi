    descricao_breve: "Mecanismo de remuneração por desempenho incompleto: o anexo prevê nota mensal de 0 a 100 e 'aplicação do fator de desempenho sobre a contraprestação', mas não traz a fórmula de conversão da nota em redução/glosa da contraprestação, nem faixas, limites ou procedimento — o núcleo do pagamento por desempenho fica indefinido"
    dispositivo_legal: "art. 6.º, § 1.º, e art. 7.º da Lei n.º 11.079/2004; art. 6.º, inciso XXIII, alínea 'j', da Lei n.º 14.133/2021"
