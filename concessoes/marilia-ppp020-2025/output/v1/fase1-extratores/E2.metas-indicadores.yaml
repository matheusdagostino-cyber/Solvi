    transcricao: "REDUÇÃO DE ENVIO AO ATERRO (20 PONTOS) ... Fórmula: 1 – (resíduos enviados ao aterro / resíduos recebidos). Desempenho: ≥ meta contratual = 20; até 10% abaixo = 10; > 10% abaixo = 0"
