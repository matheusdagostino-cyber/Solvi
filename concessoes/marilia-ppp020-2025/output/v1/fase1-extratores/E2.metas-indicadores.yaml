  - id: E2.metas-indicadores-004
    documento_fonte: "Anexo II.6 (Metas e Indicadores de Desempenho)"
    dispositivo_editalicio: "Seção 6 do Anexo II.6 (Indicadores de Serviço — 30 pontos)"
    transcricao: "6.1. RECLAMAÇÕES DE USUÁRIOS (10 PONTOS) — Índice de Reclamação por mil habitantes (IRU). 6.2. ATENDIMENTO (10 PONTOS) — percentual de solicitações atendidas dentro do prazo. 6.3. SATISFAÇÃO DO USUÁRIO (10 PONTOS) — pesquisa semestral"
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "30% da nota de desempenho baseia-se em indicadores de interface com usuários (reclamações por mil habitantes, atendimento de solicitações, satisfação), mas o objeto não inclui coleta nem atendimento direto à população — a percepção do munícipe reflete serviços que permanecem municipais, avaliando a concessionária por desempenho alheio"
    dispositivo_legal: "art. 6.º, § 1.º, da Lei n.º 11.079/2004 (critérios objetivos vinculados ao serviço concedido); art. 6.º, inciso XXIII, alínea 'e', da Lei n.º 14.133/2021"
    relacao_outros_documentos: "TR item 4 (objeto restrito ao tratamento; coleta e disposição final permanecem com o Município)"
    flag_tecnico: false
    flag_reserva: false

