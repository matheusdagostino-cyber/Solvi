    transcricao: "5.4. QUALIDADE DOS SUBPRODUTOS (15 PONTOS) — Mede a conformidade técnica dos produtos gerados (biogás, biometano, CDR, energia). Desempenho: Conforme especificações = 15; Parcialmente conforme = 8; Não conforme = 0"
