    categoria: omissao
    descricao_breve: "O indicador central da concessão pontua contra uma 'meta contratual' que nenhum documento fixa: o TR fala em 'redução de até 50%', o Anexo II.7 em destinação inferior a 20% ao aterro e o balanço do Anexo II.3 implica 84% de desvio — referência circular que inviabiliza a aferição objetiva"
    dispositivo_legal: "art. 6.º, § 1.º, da Lei n.º 11.079/2004; art. 6.º, inciso XXIII, alínea 'e', da Lei n.º 14.133/2021"
    relacao_outros_documentos: "TR item 9.5.3; Anexo II.7, item 6; Anexo II.3, Etapa 3, item 5; minuta do contrato (E3) — verificar se fixa a meta"
    flag_tecnico: false
    flag_reserva: false

