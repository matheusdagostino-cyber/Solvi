    dispositivo_editalicio: "Itens 2, 4 (inciso V) e 5–6 do Anexo II.6"
    transcricao: "vincular a remuneração da CONCESSIONÁRIA ao desempenho efetivo ... V. Aplicação do fator de desempenho sobre a contraprestação."
    tipo_achado: IRREGULAR
