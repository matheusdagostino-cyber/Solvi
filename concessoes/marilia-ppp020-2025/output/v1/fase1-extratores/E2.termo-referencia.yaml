  - id: E2.termo-referencia-019
    documento_fonte: "Anexo II (Termo de Referência)"
    dispositivo_editalicio: "Item 4 (objeto), item 9.3 e item 10.27 do TR"
    transcricao: "Os serviços compreendem o recebimento dos resíduos sólidos domiciliares na área de transbordo, segregação mecânica e trituração ... Os rejeitos gerados ... deverão ser disponibilizados pela CONCESSIONÁRIA em local apropriado para carregamento, permanecendo o transporte e a disposição final sob responsabilidade exclusiva da Administração Municipal ... Os rejeitos não aproveitados ... destinados ao aterro sanitário licenciado, aproveitando-se os contratos celebrado com a PREFEITURA DE MARÍLIA."
    tipo_achado: IRREGULAR
    categoria: omissao
    descricao_breve: "Cadeia de responsabilidades da coleta à destinação final definida de forma incompleta: não se define a localização/operação da 'área de transbordo', quem transporta da coleta à planta, a interface com a coleta seletiva municipal (o Anexo II.3 supõe FORSU 'de coleta seletiva'), nem a responsabilidade por cinzas classe II (não cobertas pelo contrato municipal de aterro sanitário) — descumprimento parcial da determinação 5 do TCE-SP"
    dispositivo_legal: "TC-001718.989.19-7, TCE-SP, Pleno, 13/03/2019 (determinação 5); art. 6.º, inciso XXIII, alínea 'a', da Lei n.º 14.133/2021"
    relacao_outros_documentos: "Anexo II.3, Etapa 2 item 1 e Etapa 3 item 4; verificar Caderno I (E4) quanto ao transbordo"
    flag_tecnico: false
    flag_reserva: false

  - id: E2.termo-referencia-020
    documento_fonte: "Anexo II (Termo de Referência)"
    dispositivo_editalicio: "Seção 13, item 1, e Seção 21 do TR"
    transcricao: "Em até 30 (trinta) dias após a adjudicação da licitação, a licitante vencedora deverá apresentar ... os planos de trabalho ... Gaseificação/Pirólise: até 30 (trinta) meses contados da emissão da Licença de Instalação; Biodigestão: até 16 (dezesseis) meses contados da emissão da Licença de Instalação."
    tipo_achado: IRREGULAR
    categoria: omissao
    descricao_breve: "Cronograma sem prazo-limite para obtenção das licenças ambientais (marcos contados apenas da LI, cuja data é indeterminada), sem data-limite de início da operação, sem prazo para a rota 'solução alternativa', e com plano de trabalho exigido 30 dias após a adjudicação — antes da assinatura do contrato e da constituição da SPE"
    dispositivo_legal: "art. 6.º, inciso XXIII, alíneas 'a' e 'e', e art. 25 da Lei n.º 14.133/2021; art. 5.º, inciso I, da Lei n.º 11.079/2004"
    relacao_outros_documentos: "Cotejar com cronograma da minuta do contrato (E3) e do Caderno I (E4)"
    flag_tecnico: false
    flag_reserva: false

