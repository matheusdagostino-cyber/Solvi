    documento_fonte: "Anexo II (Termo de Referência)"
    dispositivo_editalicio: "Seção 2 e item 10.19 do TR"
    transcricao: "Plano Municipal de Gestão Integrada de Resíduos Sólidos Lei 9.278, de 26 de junho de 2025 [...] com previsão de ampliação para atender a demanda do município estimada no Plano Municipal de Gestão Integrada de Resíduos Sólidos revisado e aprovado pela Lei 9.278/2025."
    tipo_achado: DEPENDE_DE_FATO
    categoria: omissao
    fato_faltante: "Texto do PMGIRS de Marília (Lei municipal 9.278/2025) — necessário para verificar se o plano contempla as rotas de gaseificação/pirólise e biodigestão e as metas assumidas no TR; o plano não integra os documentos disponibilizados"
    descricao_breve: "TR declara alinhamento integral ao PMGIRS, mas o plano não é disponibilizado com o edital e sua compatibilidade com a rota tecnológica não é demonstrada (Anexo II.6 ainda cita 'Lei 9.278/2021', diploma diverso)"
    dispositivo_legal: "art. 19 da Lei n.º 12.305/2010; art. 10, inciso I, da Lei n.º 11.079/2004"
    relacao_outros_documentos: "Anexo II.6 (caput — 'Lei 9.278/2021'); CLAUDE.md do projeto: PMGIRS '[não levantado]'"
