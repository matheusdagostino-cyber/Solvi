  - id: E3.minuta-contrato-025
    documento_fonte: "Anexo III (Minuta do Contrato)"
    dispositivo_editalicio: "Cláusulas 32.2, caput e alínea a, 32.2.1, 32.3 e 32.7 da Minuta do Contrato"
    transcricao: "32.2. Até que se estabeleça diretrizes específicas para a aplicação de penalidades pelo PODER CONCEDENTE [...] a) por violação [...] que importe em não atendimento das metas de universalização [...] 32.2.1. [...] o CONSÓRCIO ou CONCESSIONÁRIO sujeita-se as sanções previstas nos normativos próprios do PODER CONCEDENTE, na falta de previsão expressa do ilícito administrativo no CONTRATO."
    tipo_achado: IRREGULAR
    categoria: omissao
    descricao_breve: "Regime sancionatório provisório e remetido a 'normativos próprios' e 'deliberações' futuras do poder concedente, com tipos infracionais estranhos ao objeto ('metas de universalização') — tipificação e dosimetria não definidas no contrato"
