    descricao_breve: "Remissões internas quebradas com impacto normativo: Cláusula 46 inexistente (numeração salta de 45 para 47); 52.1 remete a arbitragem à Cláusula 48 (comunicações); 36.2 fundamenta a indenização de todas as hipóteses de extinção nos critérios da encampação (cláusula 38, d — lucros cessantes)"
