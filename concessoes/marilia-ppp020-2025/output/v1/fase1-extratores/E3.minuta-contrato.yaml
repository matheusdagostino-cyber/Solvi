    dispositivo_editalicio: "Cláusula 32.4 da Minuta do Contrato"
    transcricao: "32.4. O não pagamento de qualquer multa [...] além de implicar a incidência de correção monetária, e juros de 0,001% por dia de atraso, até o limite máximo admitido em lei."
