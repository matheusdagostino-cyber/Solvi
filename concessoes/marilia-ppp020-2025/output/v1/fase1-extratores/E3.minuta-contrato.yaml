    transcricao: "a) [...] multa de R$ 5.000,00 (cinco mil reais) até R$ 10.000,00 (dez mil reais); [...] c) por ato ou omissão que importe em risco ao meio ambiente, à saúde pública ou ao erário público [...] multa de R$ 5.000,00 (cinco mil reais) até R$ 50.000,00 (cinquenta mil reais)"
