    transcricao: "45.5. O PODER CONCEDENTE será o único responsável pelo passivo ambiental [...] a) [...] vale lembrar que referida ÁREA está impactada por atividade de disposição de resíduos, portanto, provavelmente contaminada, independentemente de o passivo ambiental ser verificado anteriormente ou após a assunção dos SERVIÇOS"
