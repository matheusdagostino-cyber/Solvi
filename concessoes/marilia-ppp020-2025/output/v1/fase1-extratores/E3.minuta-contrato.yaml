    dispositivo_editalicio: "Cláusula 34.2 da Minuta do Contrato vs. Anexo III.2, item III.6"
    transcricao: "34.2. Caso as variações dos quantitativos previstos no item 34.1, no período de 12 (doze) meses ininterruptos [...] sofram variação superior a 10% (dez por cento), para mais ou para menos, que acarrete desequilíbrio econômico-financeiro do CONTRATO [...] as PARTES promoverão a competente REVISÃO EXTRAORDINÁRIA."
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Risco de demanda disciplinado de forma conflitante: banda de ±10% com revisão extraordinária na minuta (risco compartilhado) vs. alocação integral à concessionária na Matriz de Riscos (Anexo III.2, item III.6)"
    dispositivo_legal: "art. 4.º, inciso VI, e art. 5.º, inciso III, da Lei n.º 11.079/2004"
    relacao_outros_documentos: "Anexo III.2 — Matriz de Riscos do Contrato, item III.6 (Demanda)"
    flag_tecnico: false
    flag_reserva: false

