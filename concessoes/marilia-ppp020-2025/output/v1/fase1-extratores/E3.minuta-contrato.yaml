    transcricao: "t) empregar, no início da execução dos SERVIÇOS, veículos com no máximo 05 (cinco) anos de uso; u) renovar a frota de veículos e equipamentos, ao longo do CONTRATO, pelo menos, 01 vez"
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Obrigação de renovação da frota apenas uma vez em 30 anos, partindo de veículos com até 5 anos de uso — incompatível com o requisito de atualidade do serviço adequado (Cláusula 12.4, d) e com a vida útil dos equipamentos"
    dispositivo_legal: "art. 6.º, § 2.º, da Lei n.º 8.987/1995"
    relacao_outros_documentos: "conferir especificação de frota e idade máxima no Termo de Referência (E2)"
