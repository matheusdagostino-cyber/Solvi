    transcricao: "17.1. As despesas decorrentes da execução deste CONTRATO correrão por conta da dotação orçamentária n° XXXXXX, no exercício vigente. 17.2. Os recursos [...] advirão de dotações orçamentárias específicas, a serem incluídas nos orçamentos municipais dos exercícios seguintes e de outras receitas da PREFEITURA."
