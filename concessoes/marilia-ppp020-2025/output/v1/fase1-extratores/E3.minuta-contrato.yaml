    dispositivo_legal: "Lei Estadual n.º 13.577/2009 (SP); art. 10, inciso VII, da Lei n.º 11.079/2004"
    relacao_outros_documentos: "Anexo II.5 (Programa de Monitoramento Ambiental de Águas Subterrâneas e Ar do Solo — E2); Anexo II.7 (Diretrizes Ambientais — E2)"
