    dispositivo_editalicio: "Cláusulas 36.2, 45.6/47 (salto da Cláusula 46) e 52.1 da Minuta do Contrato"
    transcricao: "36.2. [...] pagando-se ao CONSÓRCIO ou CONCESSIONÁRIO a respectiva e justa indenização com base na cláusula 38, (d) e 38.3., de acordo com a hipótese de extinção [...] 52.1. As PARTES elegem o foro de Marília (SP) [...] e para conhecer de ações que garantam a completa realização do procedimento arbitral nos moldes estabelecidos na Cláusula 48."
    tipo_achado: IRREGULAR
