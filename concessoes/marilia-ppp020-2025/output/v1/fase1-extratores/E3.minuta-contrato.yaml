    relacao_outros_documentos: ""
    flag_tecnico: false
    flag_reserva: false

  - id: E3.minuta-contrato-028
    documento_fonte: "Anexo III (Minuta do Contrato)"
    dispositivo_editalicio: "Definição de CONSÓRCIO OU CONCESSIONÁRIA e Cláusulas 9.1 a 9.3 da Minuta do Contrato"
    transcricao: "9.3. Fica certo que o CONSÓRCIO ou CONCESSIONÁRIO deverá ser mantida como subsidiária integral da LICITANTE VENCEDORA, ou sociedade anônima de capital fechado."
    tipo_achado: IRREGULAR
    categoria: contradicao
    descricao_breve: "Modelagem societária da parceira privada confusa: minuta não exige expressamente SPE constituída antes da celebração; exige manutenção como 'subsidiária integral da LICITANTE VENCEDORA' — estrutura impossível quando a vencedora for consórcio (pluralidade de sócios) — e denomina a contratada ora 'CONSÓRCIO' ora 'CONCESSIONÁRIO'"
    dispositivo_legal: "art. 9.º, caput, da Lei n.º 11.079/2004; art. 20 da Lei n.º 8.987/1995"
    relacao_outros_documentos: "regras de consórcio e de constituição da SPE no Edital (E1) — padrão Marília ponto 23 (confusão consórcio-licitante vs. parceiro privado)"
    flag_tecnico: false
    flag_reserva: false

